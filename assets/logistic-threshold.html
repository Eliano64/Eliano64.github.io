<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阈值移动：混淆矩阵、精确率、召回率与 ROC 点</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --line: #cbd5e1; --text: #0f172a; --muted: #475569;
    --tp: #16a34a; --fp: #f59e0b; --fn: #be123c; --tn: #64748b; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020; --panel: #111827; --line: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --tp: #4ade80; --fp: #fbbf24; --fn: #fb7185; --tn: #94a3b8; --accent: #60a5fa;
    }
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Arial, "Microsoft YaHei", sans-serif; }
  .wrap { padding: 12px 14px; }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .metrics { font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.8; }
  .metrics b { color: var(--text); }
  table { border-collapse: collapse; font-size: 12px; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; }
  th { color: var(--muted); font-weight: 500; }
  .cell-tp { background: rgba(22,163,74,0.16); } .cell-fp { background: rgba(245,158,11,0.16); }
  .cell-fn { background: rgba(190,18,60,0.16); } .cell-tn { background: rgba(100,116,139,0.14); }
  .bar { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  input[type=range] { width: 220px; accent-color: var(--accent); }
  button { font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    width: 100%; max-width: 380px; height: auto; }
  .mono { font-family: Consolas, monospace; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>阈值移动：同一个模型，换阈值就换一组指标</h1>
  <p class="hint">拖动滑块或按左右方向键改变决策阈值。混淆矩阵、精确率、召回率与 ROC 上的点同时更新，数值由当前阈值下的真实计数算出。</p>
  <div class="row">
    <div class="card">
      <table id="cm" aria-label="混淆矩阵"></table>
      <div class="metrics" id="metrics" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <svg id="roc" viewBox="0 0 360 300" role="img" aria-label="ROC 曲线与当前阈值对应的点"></svg>
      <div class="metrics" id="rocinfo" style="margin-top:6px"></div>
    </div>
  </div>
  <div class="bar">
    <label for="th" class="hint" style="margin:0">决策阈值</label>
    <input id="th" type="range" min="0.05" max="0.95" step="0.05" value="0.5">
    <span class="mono" id="thlabel">0.50</span>
    <button id="prev">上一步</button>
    <button id="next">下一步</button>
  </div>
  <p class="hint">正类是少数但更值得抓住的那一类。阈值调低，召回率上升、精确率下降；这条曲线上的每个点都是一组阈值。</p>
</div>
<script>
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";

  // 60 个样本的分数，用固定种子的线性同余生成，保证每次打开数字一致
  function makeSamples() {
    let seed = 20261026;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const norm = () => {
      const u = Math.max(rnd(), 1e-9), v = rnd();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };
    const out = [];
    for (let i = 0; i < 30; i++) out.push({ score: Math.min(0.99, Math.max(0.01, 0.72 + 0.13 * norm())), y: 1 });
    for (let i = 0; i < 30; i++) out.push({ score: Math.min(0.99, Math.max(0.01, 0.34 + 0.15 * norm())), y: 0 });
    return out;
  }

  const samples = makeSamples();
  const P = samples.filter(s => s.y === 1).length;   // 30
  const N = samples.length - P;                      // 30

  function confusion(th) {
    let tp = 0, fp = 0, fn = 0, tn = 0;
    samples.forEach(s => {
      const pred = s.score >= th ? 1 : 0;
      if (s.y === 1 && pred === 1) tp++;
      else if (s.y === 1 && pred === 0) fn++;
      else if (s.y === 0 && pred === 1) fp++;
      else tn++;
    });
    const precision = tp + fp > 0 ? tp / (tp + fp) : 0;
    const recall = tp + fn > 0 ? tp / (tp + fn) : 0;
    const f1 = precision + recall > 0 ? 2 * precision * recall / (precision + recall) : 0;
    const tpr = tp / P, fpr = fp / N;
    return { tp, fp, fn, tn, precision, recall, f1, tpr, fpr };
  }

  const thresholds = [];
  for (let t = 0.05; t <= 0.951; t += 0.05) thresholds.push(+t.toFixed(2));

  // ROC 全部点，AUC 用梯形法
  const rocPoints = thresholds.slice().sort((a, b) => a - b).map(t => confusion(t));
  rocPoints.sort((a, b) => a.fpr - b.fpr);
  let auc = 0;
  for (let i = 1; i < rocPoints.length; i++) {
    const a = rocPoints[i - 1], b = rocPoints[i];
    auc += (b.fpr - a.fpr) * (a.tpr + b.tpr) / 2;
  }

  const cm = document.getElementById("cm");
  const metrics = document.getElementById("metrics");
  const roc = document.getElementById("roc");
  const rocinfo = document.getElementById("rocinfo");
  const th = document.getElementById("th");
  const thlabel = document.getElementById("thlabel");

  function cell(label, value, cls) {
    return `<td class="${cls}"><span class="mono">${value}</span><br><span style="color:var(--muted)">${label}</span></td>`;
  }

  function render() {
    const t = +th.value;
    thlabel.textContent = t.toFixed(2);
    const m = confusion(t);

    cm.innerHTML =
      `<tr><th></th><th>预测为正</th><th>预测为负</th></tr>` +
      `<tr><th>实际为正</th>${cell("TP", m.tp, "cell-tp")}${cell("FN", m.fn, "cell-fn")}</tr>` +
      `<tr><th>实际为负</th>${cell("FP", m.fp, "cell-fp")}${cell("TN", m.tn, "cell-tn")}</tr>`;

    metrics.innerHTML =
      `精确率 = ${(m.precision * 100).toFixed(1)}%<br>` +
      `召回率 = ${(m.recall * 100).toFixed(1)}%<br>` +
      `F1 = ${m.f1.toFixed(3)}<br>` +
      `准确率 = ${(((m.tp + m.tn) / samples.length) * 100).toFixed(1)}%`;

    // ROC 图
    roc.textContent = "";
    const W = 360, H = 300, pad = 42;
    const X = v => pad + v * (W - pad - 12);
    const Y = v => H - pad - v * (H - pad - 12);
    for (let g = 0; g <= 4; g++) {
      const v = g / 4;
      const ln1 = document.createElementNS(NS, "line");
      ln1.setAttribute("x1", X(0)); ln1.setAttribute("x2", X(1));
      ln1.setAttribute("y1", Y(v)); ln1.setAttribute("y2", Y(v));
      ln1.setAttribute("stroke", "var(--line)"); ln1.setAttribute("stroke-width", 0.8);
      roc.appendChild(ln1);
      const ln2 = document.createElementNS(NS, "line");
      ln2.setAttribute("y1", Y(0)); ln2.setAttribute("y2", Y(1));
      ln2.setAttribute("x1", X(v)); ln2.setAttribute("x2", X(v));
      ln2.setAttribute("stroke", "var(--line)"); ln2.setAttribute("stroke-width", 0.8);
      roc.appendChild(ln2);
    }
    const axis = document.createElementNS(NS, "path");
    axis.setAttribute("d", `M ${X(0)} ${Y(0)} L ${X(1)} ${Y(0)} M ${X(0)} ${Y(0)} L ${X(0)} ${Y(1)}`);
    axis.setAttribute("stroke", "var(--muted)"); axis.setAttribute("fill", "none");
    roc.appendChild(axis);

    const diag = document.createElementNS(NS, "path");
    diag.setAttribute("d", `M ${X(0)} ${Y(0)} L ${X(1)} ${Y(1)}`);
    diag.setAttribute("stroke", "var(--tn)"); diag.setAttribute("stroke-dasharray", "4 4");
    diag.setAttribute("fill", "none");
    roc.appendChild(diag);

    const curve = rocPoints.map(p => `${X(p.fpr)} ${Y(p.tpr)}`).join(" L ");
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", `M ${X(0)} ${Y(0)} L ${curve}`);
    path.setAttribute("stroke", "var(--accent)");
    path.setAttribute("stroke-width", 2);
    path.setAttribute("fill", "none");
    roc.appendChild(path);

    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", X(m.fpr)); dot.setAttribute("cy", Y(m.tpr)); dot.setAttribute("r", 4.5);
    dot.setAttribute("fill", "var(--fn)");
    roc.appendChild(dot);

    const label = document.createElementNS(NS, "text");
    label.setAttribute("x", X(m.fpr) + 8); label.setAttribute("y", Y(m.tpr) - 8);
    label.setAttribute("fill", "var(--text)"); label.setAttribute("font-size", 11);
    label.textContent = `阈值 ${t.toFixed(2)}`;
    roc.appendChild(label);

    const xl = document.createElementNS(NS, "text");
    xl.setAttribute("x", (X(0) + X(1)) / 2); xl.setAttribute("y", H - 12);
    xl.setAttribute("text-anchor", "middle"); xl.setAttribute("fill", "var(--muted)");
    xl.setAttribute("font-size", 11); xl.textContent = "假正率 FPR";
    roc.appendChild(xl);

    const yl = document.createElementNS(NS, "text");
    yl.setAttribute("x", 14); yl.setAttribute("y", (Y(0) + Y(1)) / 2);
    yl.setAttribute("text-anchor", "middle"); yl.setAttribute("fill", "var(--muted)");
    yl.setAttribute("font-size", 11);
    yl.setAttribute("transform", `rotate(-90 14 ${(Y(0) + Y(1)) / 2})`);
    yl.textContent = "真正率 TPR";
    roc.appendChild(yl);

    rocinfo.innerHTML = `当前点：(FPR ${m.fpr.toFixed(2)}, TPR ${m.tpr.toFixed(2)})<br>` +
                        `AUC = ${auc.toFixed(3)}，与阈值无关`;
  }

  function step(delta) {
    const v = Math.min(0.95, Math.max(0.05, +th.value + delta * 0.05));
    th.value = v.toFixed(2);
    render();
  }

  th.addEventListener("input", render);
  document.getElementById("prev").addEventListener("click", () => step(-1));
  document.getElementById("next").addEventListener("click", () => step(1));
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
    if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  });

  render();
})();
</script>
</body>
</html>
