<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="tdt ddt">
  <title id="tdt">一次分裂：两个候选特征的熵与基尼系数对照</title>
  <desc id="ddt">根节点 10 个样本、两类各 5 个。候选 A 分成 6 与 4，候选 B 分成 5 与 5。按熵算出的增益是 0.610 与 0.029，按基尼系数算出的增益是 0.333 与 0.020，两个指标都选 A。</desc>
  <style>
    .bg { fill: #f8fafc; }
    @media (prefers-color-scheme: dark) { .bg { fill: #0b1020; } }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    @media (prefers-color-scheme: dark) { .panel { fill: #111827; stroke: #334155; } }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) { .grid { stroke: #24334a; } }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .tick { stroke: #94a3b8; stroke-width: 1; }
    .ref { stroke: #be123c; stroke-width: 1.3; stroke-dasharray: 6 5; fill: none; }
    .text { fill: #0f172a; font-family: Arial, "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) { .text { fill: #e2e8f0; } }
    .muted { fill: #475569; font-family: Arial, "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) { .muted { fill: #94a3b8; } }
    .mono { fill: #0f172a; font-family: Consolas, "Courier New", monospace; }
    @media (prefers-color-scheme: dark) { .mono { fill: #e2e8f0; } }
    .em { fill: #15803d; font-family: Arial, "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) { .em { fill: #4ade80; } }
    .c1 { fill: none; stroke: #2563eb; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c2 { fill: none; stroke: #be123c; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c3 { fill: none; stroke: #16a34a; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c4 { fill: none; stroke: #b45309; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c5 { fill: none; stroke: #7c3aed; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .c1 { stroke: #60a5fa; } .c2 { stroke: #fb7185; } .c3 { stroke: #4ade80; }
      .c4 { stroke: #fbbf24; } .c5 { stroke: #c4b5fd; }
    }
    .dot1 { fill: #2563eb; } .dot2 { fill: #be123c; } .dot3 { fill: #16a34a; }
    .dot4 { fill: #b45309; } .dot5 { fill: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .dot1 { fill: #60a5fa; } .dot2 { fill: #fb7185; } .dot3 { fill: #4ade80; }
      .dot4 { fill: #fbbf24; } .dot5 { fill: #c4b5fd; }
    }
    .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    .card-em { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.8; }
    .group { fill: none; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .group-em { fill: rgba(22,163,74,0.05); stroke: #16a34a; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1e293b; stroke: #334155; }
      .card-em { fill: #052e1b; stroke: #4ade80; }
      .group { stroke: #334155; }
      .group-em { fill: rgba(74,222,128,0.06); stroke: #4ade80; }
    }
    .shade { fill: #f1f5f9; }
    @media (prefers-color-scheme: dark) { .shade { fill: #1e293b; } }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="570" rx="10"/>
  <rect class="panel" x="14" y="12" width="872" height="546" rx="8"/>
  <text class="text" x="30.0" y="38.0" font-size="13" text-anchor="start" font-weight="600">根节点：10 个样本，去打球 5 个，不去 5 个</text>
  <rect class="card" x="30.0" y="54.0" width="250.0" height="100.0" rx="7"/>
  <text class="text" x="42.0" y="75.0" font-size="12.5" text-anchor="start" font-weight="600">根节点 D</text>
  <text class="muted" x="42.0" y="94.0" font-size="11" text-anchor="start" font-weight="400">熵 H = 1.000 比特</text>
  <text class="muted" x="42.0" y="110.0" font-size="11" text-anchor="start" font-weight="400">基尼系数 = 0.500</text>
  <text class="muted" x="42.0" y="126.0" font-size="11" text-anchor="start" font-weight="400">两类各半，是最混乱的状态</text>
  <text class="muted" x="30.0" y="178.0" font-size="10.5" text-anchor="start" font-weight="400">父节点越混乱，一次好的分裂能削掉的量越大。</text>
  <text class="muted" x="30.0" y="200.0" font-size="10.5" text-anchor="start" font-weight="400">两类问题里这两个指标的上限就是根节点这一行的值：</text>
  <text class="muted" x="30.0" y="218.0" font-size="10.5" text-anchor="start" font-weight="400">熵 1.000 比特，基尼系数 0.500。</text>
  <text class="muted" x="30.0" y="250.0" font-size="10.5" text-anchor="start" font-weight="400">候选 A 的两个子节点更纯，熵与基尼都判它更好；</text>
  <text class="muted" x="30.0" y="268.0" font-size="10.5" text-anchor="start" font-weight="400">候选 B 把两类均匀地各切一刀，几乎没减少混乱。</text>
  <text class="text" x="300.0" y="38.0" font-size="13" text-anchor="start" font-weight="600">两个候选划分：同样 10 个样本的不同切法</text>
  <rect class="group-em" x="292" y="54" width="576" height="238" rx="8"/>
  <text class="text" x="304.0" y="76.0" font-size="12.5" text-anchor="start" font-weight="600">候选 A：天气是晴天吗</text>
  <text class="em" x="852.0" y="76.0" font-size="11.5" text-anchor="end" font-weight="600">增益更大，选它</text>
  <rect class="card-em" x="304.0" y="88.0" width="262.0" height="82.0" rx="7"/>
  <text class="text" x="316.0" y="109.0" font-size="12.5" text-anchor="start" font-weight="600">晴天：6 个样本</text>
  <text class="muted" x="316.0" y="128.0" font-size="11" text-anchor="start" font-weight="400">去打球 5 / 不去 1</text>
  <text class="muted" x="316.0" y="144.0" font-size="11" text-anchor="start" font-weight="400">熵 0.650 比特，基尼 0.278</text>
  <rect class="card-em" x="586.0" y="88.0" width="262.0" height="82.0" rx="7"/>
  <text class="text" x="598.0" y="109.0" font-size="12.5" text-anchor="start" font-weight="600">阴雨：4 个样本</text>
  <text class="muted" x="598.0" y="128.0" font-size="11" text-anchor="start" font-weight="400">去打球 0 / 不去 4</text>
  <text class="muted" x="598.0" y="144.0" font-size="11" text-anchor="start" font-weight="400">熵 0.000 比特，基尼 0.000</text>
  <text class="muted" x="304.0" y="200.0" font-size="11" text-anchor="start" font-weight="400">加权后（按样本数加权）：熵 0.390 比特，基尼 0.167</text>
  <text class="text" x="304.0" y="224.0" font-size="11.5" text-anchor="start" font-weight="600">增益 = 父节点减加权后：熵 +0.610，基尼 +0.333</text>
  <text class="muted" x="304.0" y="248.0" font-size="10.5" text-anchor="start" font-weight="400">两个子节点越纯，加权后的值越小，增益越大；增益为 0 说明这个特征没有分开两类。</text>
  <text class="muted" x="304.0" y="270.0" font-size="10.5" text-anchor="start" font-weight="400">两个指标在同一个划分上给出的高低顺序一致，差别只在离群的绝对数值。</text>
  <rect class="group" x="292" y="304" width="576" height="238" rx="8"/>
  <text class="text" x="304.0" y="326.0" font-size="12.5" text-anchor="start" font-weight="600">候选 B：温度高吗</text>
  <rect class="card" x="304.0" y="338.0" width="262.0" height="82.0" rx="7"/>
  <text class="text" x="316.0" y="359.0" font-size="12.5" text-anchor="start" font-weight="600">高温：5 个样本</text>
  <text class="muted" x="316.0" y="378.0" font-size="11" text-anchor="start" font-weight="400">去打球 3 / 不去 2</text>
  <text class="muted" x="316.0" y="394.0" font-size="11" text-anchor="start" font-weight="400">熵 0.971 比特，基尼 0.480</text>
  <rect class="card" x="586.0" y="338.0" width="262.0" height="82.0" rx="7"/>
  <text class="text" x="598.0" y="359.0" font-size="12.5" text-anchor="start" font-weight="600">低温：5 个样本</text>
  <text class="muted" x="598.0" y="378.0" font-size="11" text-anchor="start" font-weight="400">去打球 2 / 不去 3</text>
  <text class="muted" x="598.0" y="394.0" font-size="11" text-anchor="start" font-weight="400">熵 0.971 比特，基尼 0.480</text>
  <text class="muted" x="304.0" y="450.0" font-size="11" text-anchor="start" font-weight="400">加权后（按样本数加权）：熵 0.971 比特，基尼 0.480</text>
  <text class="text" x="304.0" y="474.0" font-size="11.5" text-anchor="start" font-weight="600">增益 = 父节点减加权后：熵 +0.029，基尼 +0.020</text>
  <text class="muted" x="304.0" y="498.0" font-size="10.5" text-anchor="start" font-weight="400">两个子节点越纯，加权后的值越小，增益越大；增益为 0 说明这个特征没有分开两类。</text>
  <text class="muted" x="304.0" y="520.0" font-size="10.5" text-anchor="start" font-weight="400">两个指标在同一个划分上给出的高低顺序一致，差别只在离群的绝对数值。</text>
</svg>
