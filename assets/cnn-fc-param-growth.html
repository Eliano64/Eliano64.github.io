<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>全连接首层的参数随输入维度线性增长</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;
--in:#dbe7ff; --inS:#2f5bb7; --param:#ece0ff; --paramS:#6b46c1;
--state:#e9edf3; --stateS:#4a5568; --out:#d9f2e2; --outS:#2f7a4f;
--cur:#ffe6c7; --curS:#b45309; --accent:#2f5bb7;
}
@media (prefers-color-scheme:dark){:root{
--bg:#14181f; --panel:#1c222b; --fg:#e8ecf3; --muted:#9aa4b2; --line:#39424f;
--in:#1f3149; --inS:#8fb0ef; --param:#2d2350; --paramS:#b49af0;
--state:#262d38; --stateS:#aab4c2; --out:#1e3a2b; --outS:#87c9a2;
--cur:#4a3418; --curS:#f0b26b; --accent:#8fb0ef;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>全连接首层的参数随输入维度线性增长</h1><p class="sub">隐藏层取 512 时，首层参数量约为 512×d；图像输入维度大，首层就占掉大部分参数预算</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="全连接首层的参数随输入维度线性增长"><rect x="0" y="0" width="1100" height="620" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wp{stroke:var(--paramS);stroke-width:2.2;fill:none;marker-end:url(#arp)}
.ws{stroke:var(--stateS);stroke-width:2.2;fill:none;marker-end:url(#ars)}
.wout{stroke:var(--outS);stroke-width:2.2;fill:none;marker-end:url(#aro)}
.wcur{stroke:var(--curS);stroke-width:2.2;fill:none;marker-end:url(#arc)}
.win{stroke:var(--inS);stroke-width:2.2;fill:none;marker-end:url(#ari)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}
</style><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="arp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--paramS)"/></marker>
<marker id="ars" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--stateS)"/></marker>
<marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--outS)"/></marker>
<marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--curS)"/></marker>
<marker id="ari" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--inS)"/></marker></defs><text class="tt" x="28" y="52">全连接首层的参数随输入维度线性增长</text><text class="ss" x="28" y="80">隐藏层取 512 时，首层参数量约为 512×d；图像输入维度大，首层就占掉大部分参数预算</text><path d="M120,480 L820,480" stroke="var(--line)" stroke-width="1.4"/><path d="M120,480 L120,150" stroke="var(--line)" stroke-width="1.4"/><text class="sm" x="470.0" y="530" text-anchor="middle">输入维度 d（对数刻度）</text><text class="sm" x="60" y="315.0" transform="rotate(-90 60,315.0)" text-anchor="middle">首层参数量（对数刻度）</text><text class="sm" x="194.9" y="504" text-anchor="middle">784</text><path d="M194.9,480 L194.9,486" stroke="var(--muted)" stroke-width="1"/><text class="sm" x="345.9" y="504" text-anchor="middle">3072</text><path d="M345.9,480 L345.9,486" stroke="var(--muted)" stroke-width="1"/><text class="sm" x="776.1" y="504" text-anchor="middle">150528</text><path d="M776.1,480 L776.1,486" stroke="var(--muted)" stroke-width="1"/><text class="sm" x="108" y="449.3" text-anchor="end">40 万</text><path d="M120,444.3 L820,444.3" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="108" y="379.4" text-anchor="end">157 万</text><path d="M120,374.4 L820,374.4" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="108" y="180.1" text-anchor="end">7707 万</text><path d="M120,175.1 L820,175.1" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><polyline points="194.9,444.3 345.9,374.4 776.1,175.1" fill="none" stroke="var(--curS)" stroke-width="3"/><circle cx="194.9" cy="444.3" r="6" fill="var(--curS)"/><text class="sm" x="184.9" y="432.3" text-anchor="end">40万</text><circle cx="345.9" cy="374.4" r="6" fill="var(--curS)"/><text class="sm" x="335.9" y="362.4" text-anchor="end">157万</text><circle cx="776.1" cy="175.1" r="6" fill="var(--curS)"/><text class="sm" x="766.1" y="163.1" text-anchor="end">7710万</text><rect x="820" y="150" width="250" height="54" rx="10" fill="var(--panel)" stroke="var(--line)"/><text class="sm" x="834" y="172">图例</text><path d="M834,189 L866,189" stroke="var(--curS)" stroke-width="3" stroke-dasharray=""/><text class="sm" x="876" y="194">首层参数 ≈ 512 × d</text><text class="sm" x="840" y="250">隐藏层取 512；</text><text class="sm" x="840" y="272">参数量与输入维度成正比</text><text class="sm" x="840" y="310">MNIST：784 → 40 万</text><text class="sm" x="840" y="332">CIFAR-10：3072 → 157 万</text><text class="sm" x="840" y="354">ImageNet：150528 → 7707 万</text><rect x="30" y="556" width="1040" height="46" rx="10" fill="var(--state)" opacity="0.55"/><text class="sm" x="46" y="584">结论：输入维度是参数量的主因；把首层换成卷积，权重共享后参数量由核大小决定，与输入尺寸无关。</text></svg></div><p class="cap"></p></div></body></html>
