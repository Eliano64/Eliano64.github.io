<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" width="400" height="344" role="img" aria-label="教师强制与推理的逐步输入对照">
<style>
  :root { --bg: #ffffff; --fg: #1b2330; --muted: #5b6472; --line: #c8d0da; --chip: #eef2f8; --key: #3b5bdb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171b23; --fg: #e6eaf2; --muted: #9aa4b2; --line: #3a4250; --chip: #232a36; --key: #8fa6ff; }
  }
  text { font-family: "Segoe UI", "Noto Sans SC", system-ui, sans-serif; fill: var(--fg); }
  .h { font-size: 12.5px; font-weight: 600; }
  .lbl { font-size: 10.5px; fill: var(--muted); }
  .tok { font-size: 11.5px; text-anchor: middle; }
  .mono { font-family: Consolas, "Courier New", monospace; }
  .note { font-size: 9.5px; fill: var(--muted); }
  .chip { fill: var(--chip); stroke: var(--line); }
  .key { fill: none; stroke: var(--key); stroke-width: 1.4; }
</style>
<rect x="0" y="0" width="400" height="344" fill="var(--bg)"/>
<text class="h" x="14" y="24">训练：每步读真实前缀</text>
<rect class="chip" x="106" y="38" width="52" height="26" rx="5"/>
<rect class="key" x="106" y="38" width="52" height="26" rx="5"/>
<text class="tok" x="132.0" y="55.0">&lt;bos&gt;</text>
<rect class="chip" x="106" y="74" width="52" height="26" rx="5"/>
<text class="tok" x="132.0" y="91.0">学生</text>
<rect class="chip" x="162" y="38" width="52" height="26" rx="5"/>
<text class="tok" x="188.0" y="55.0">学生</text>
<rect class="chip" x="162" y="74" width="52" height="26" rx="5"/>
<text class="tok" x="188.0" y="91.0">喜欢</text>
<rect class="chip" x="218" y="38" width="52" height="26" rx="5"/>
<text class="tok" x="244.0" y="55.0">喜欢</text>
<rect class="chip" x="218" y="74" width="52" height="26" rx="5"/>
<text class="tok" x="244.0" y="91.0">深度</text>
<rect class="chip" x="274" y="38" width="52" height="26" rx="5"/>
<text class="tok" x="300.0" y="55.0">深度</text>
<rect class="chip" x="274" y="74" width="52" height="26" rx="5"/>
<text class="tok" x="300.0" y="91.0">学习</text>
<rect class="chip" x="330" y="38" width="52" height="26" rx="5"/>
<text class="tok" x="356.0" y="55.0">学习</text>
<rect class="chip" x="330" y="74" width="52" height="26" rx="5"/>
<text class="tok" x="356.0" y="91.0">&lt;eos&gt;</text>
<text class="lbl" x="14" y="56">解码器输入</text>
<text class="lbl" x="14" y="92">监督标签</text>
<text class="note" x="14" y="120">两个整行一次送入，标签整体错开一位；状态仍按 s1 到 s5</text>
<text class="note" x="14" y="134">顺序更新，没有位置级并行。</text>
<line x1="14" y1="146" x2="386" y2="146" stroke="var(--line)" stroke-width="1"/>
<text class="h" x="14" y="168">推理：每步只送上一个输出</text>
<text class="lbl" x="52" y="188">步</text>
<text class="lbl" x="92" y="188">送入</text>
<text class="lbl" x="190" y="188">输出</text>
<text class="tok" x="56" y="214" text-anchor="start">1</text>
<rect class="chip" x="92" y="197" width="68" height="19" rx="5"/>
<text class="tok" x="126.0" y="210.5">&lt;bos&gt;</text>
<rect class="chip" x="190" y="197" width="68" height="19" rx="5"/>
<text class="tok" x="224.0" y="210.5">学生</text>
<text class="tok" x="56" y="234" text-anchor="start">2</text>
<rect class="chip" x="92" y="217" width="68" height="19" rx="5"/>
<text class="tok" x="126.0" y="230.5">学生</text>
<rect class="chip" x="190" y="217" width="68" height="19" rx="5"/>
<text class="tok" x="224.0" y="230.5">喜欢</text>
<text class="tok" x="56" y="254" text-anchor="start">3</text>
<rect class="chip" x="92" y="237" width="68" height="19" rx="5"/>
<text class="tok" x="126.0" y="250.5">喜欢</text>
<rect class="chip" x="190" y="237" width="68" height="19" rx="5"/>
<text class="tok" x="224.0" y="250.5">深度</text>
<text class="tok" x="56" y="274" text-anchor="start">4</text>
<rect class="chip" x="92" y="257" width="68" height="19" rx="5"/>
<text class="tok" x="126.0" y="270.5">深度</text>
<rect class="chip" x="190" y="257" width="68" height="19" rx="5"/>
<text class="tok" x="224.0" y="270.5">学习</text>
<text class="tok" x="56" y="294" text-anchor="start">5</text>
<rect class="chip" x="92" y="277" width="68" height="19" rx="5"/>
<text class="tok" x="126.0" y="290.5">学习</text>
<rect class="chip" x="190" y="277" width="68" height="19" rx="5"/>
<text class="tok" x="224.0" y="290.5">&lt;eos&gt;</text>
<text class="note" x="14" y="318">第 1 步送 &lt;bos&gt;，之后每步读回上一步的输出；遇到 &lt;eos&gt; 停止，</text>
<text class="note" x="14" y="332">否则达到长度上限。示意用词，不代表训练后的输出。</text>
</svg>