<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>页面置换算法过程</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #182235;
      --muted: #66758b;
      --line: #cbd5e1;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --green: #15803d;
      --green-soft: #dcfce7;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --red: #b91c1c;
      --red-soft: #fee2e2;
      --purple: #7c3aed;
      --shadow: rgba(15, 23, 42, .10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --panel: #111c2d;
        --panel-soft: #162235;
        --ink: #e7edf6;
        --muted: #a9b6c8;
        --line: #40506a;
        --blue: #60a5fa;
        --blue-soft: #18365e;
        --green: #4ade80;
        --green-soft: #143d2a;
        --amber: #fbbf24;
        --amber-soft: #4a3510;
        --red: #fb7185;
        --red-soft: #4a1f2a;
        --purple: #c4b5fd;
        --shadow: rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 680px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    button { font: inherit; }

    .deck {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.3vw, 30px);
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .tabs,
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }

    button:hover:not(:disabled) { border-color: var(--blue); }

    button.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 700;
    }

    button:disabled {
      opacity: .42;
      cursor: not-allowed;
    }

    main {
      min-height: 570px;
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(300px, .82fr);
      gap: 14px;
    }

    .stage,
    .side {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 10px 28px var(--shadow);
    }

    .stage {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .sequence {
      display: grid;
      grid-template-columns: repeat(10, minmax(30px, 1fr));
      gap: 5px;
    }

    .reference {
      min-height: 31px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-soft);
      font-size: 13px;
      font-weight: 700;
    }

    .reference.past { opacity: .42; }

    .reference.current {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--blue);
      outline: 2px solid color-mix(in srgb, var(--blue), transparent 62%);
    }

    .frames {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding-top: 27px;
    }

    .frame {
      min-height: 128px;
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      gap: 5px;
      padding: 10px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
      transition: border-color .15s, background .15s;
    }

    .frame.empty { opacity: .7; }
    .frame.focus { border-color: var(--green); background: var(--green-soft); }
    .frame.inspected { border-color: var(--amber); background: var(--amber-soft); }
    .frame.victim { border-color: var(--red); background: var(--red-soft); }

    .frame.pointer::before {
      content: "▼ hand：待检查";
      position: absolute;
      top: -27px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .frame-label {
      color: var(--muted);
      font-size: 12px;
    }

    .page {
      font-size: 38px;
      font-weight: 850;
      line-height: 1;
    }

    .frame-meta {
      min-height: 25px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .bits {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .bit {
      min-width: 44px;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      font-weight: 750;
    }

    .scan-panel {
      min-height: 76px;
      padding: 10px 12px;
      border: 1px dashed var(--line);
      border-radius: 9px;
      background: var(--panel-soft);
    }

    .scan-panel.hidden {
      visibility: hidden;
    }

    .scan-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .scan-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pending-page {
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 750;
    }

    .pending-page:empty { display: none; }

    .scan-heading strong {
      color: var(--ink);
      font-size: 13px;
    }

    .trail {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .trail-item {
      padding: 4px 7px;
      border-radius: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: 12px;
    }

    .trail-arrow {
      color: var(--muted);
      font-size: 12px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: auto;
    }

    .metric {
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 3px;
      color: var(--ink);
      font-size: 19px;
    }

    .side {
      padding: 17px;
      overflow: hidden;
    }

    .badge {
      display: inline-flex;
      min-height: 25px;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .side h2 {
      margin: 12px 0 10px;
      font-size: 21px;
      line-height: 1.35;
    }

    .explain {
      min-height: 112px;
      line-height: 1.68;
      font-size: 14px;
    }

    .explain p { margin: 0 0 10px; }

    .movement {
      margin: 10px 0 14px;
      padding: 9px 11px;
      border-left: 4px solid var(--purple);
      border-radius: 6px;
      background: color-mix(in srgb, var(--purple), transparent 90%);
      font-size: 13px;
      line-height: 1.55;
    }

    .movement:empty { display: none; }

    .rule {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel-soft);
    }

    .rule h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .rule ol,
    .rule ul {
      margin: 0;
      padding-left: 1.25em;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .side { min-height: 360px; }
    }
  </style>
</head>
<body>
  <div class="deck">
    <header>
      <div>
        <h1>页面置换算法过程</h1>
        <div class="subtitle">“下一步”推进一个可见动作；CLOCK 的扫描和指针移动不会被跳过。</div>
      </div>
      <div class="controls">
        <button id="prev" type="button">上一步</button>
        <button id="next" type="button">下一步</button>
        <button id="reset" type="button">重置</button>
      </div>
    </header>

    <nav class="tabs" aria-label="算法选择">
      <button data-algo="OPT" class="active" type="button">OPT</button>
      <button data-algo="FIFO" type="button">FIFO</button>
      <button data-algo="LRU" type="button">LRU</button>
      <button data-algo="CLOCK" type="button">CLOCK</button>
      <button data-algo="ICLOCK" type="button">改进 CLOCK</button>
    </nav>

    <main>
      <section class="stage">
        <div id="sequence" class="sequence"></div>
        <div id="frames" class="frames"></div>
        <div id="scanPanel" class="scan-panel hidden">
          <div class="scan-heading">
            <strong id="scanTitle">扫描过程</strong>
            <div class="scan-status">
              <span id="scanRule"></span>
              <span id="pendingPage" class="pending-page"></span>
            </div>
          </div>
          <div id="trail" class="trail"></div>
        </div>
        <div class="metrics">
          <div class="metric">当前访问<strong id="currentPage">-</strong></div>
          <div class="metric">缺页次数<strong id="faults">0</strong></div>
          <div class="metric">置换次数<strong id="replacements">0</strong></div>
          <div class="metric">缺页率<strong id="rate">0%</strong></div>
        </div>
      </section>

      <aside class="side">
        <div id="badge" class="badge">准备开始</div>
        <h2 id="eventTitle">选择算法并逐步执行</h2>
        <div id="explain" class="explain"></div>
        <div id="movement" class="movement"></div>
        <div class="rule">
          <h3 id="ruleTitle">本算法只观察什么？</h3>
          <div id="ruleBody"></div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const sequence = [7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1];
    const frameCount = 3;
    // 改进型 CLOCK 必须知道每一次访问是读还是写。
    // W 会把当前驻留副本的 M 置为 1；页面被重新调入时，M 重新由本次访问决定。
    const writeAccesses = new Set([0, 3, 7, 12, 17]);

    function isWrite(refIndex) {
      return writeAccesses.has(refIndex);
    }

    const introductions = {
      OPT: "OPT 只比较各页下一次被访问的时间；以后不再访问的页最适合淘汰。",
      FIFO: "FIFO 只比较页面进入主存的先后；命中不会改变先后次序。",
      LRU: "LRU 只比较页面上一次被访问的时间；命中会更新最近使用次序。",
      CLOCK: "指针 hand 始终指向待检查页框。本例令 hand 初值为 0，页框按 0→1→2→0 构成环。",
      ICLOCK: "指针 hand 始终指向待检查页框，初值为 0。访问串中的 R 表示读，W 表示写；只有写访问才会把当前驻留页的 M 置为 1。"
    };

    const ruleBodies = {
      OPT: "<ul><li>命中：页框不变。</li><li>缺页且已满：淘汰未来最晚再访问的页。</li></ul>",
      FIFO: "<ul><li>命中：进入次序不变。</li><li>缺页且已满：淘汰最早调入的页。</li></ul>",
      LRU: "<ul><li>命中：把该页更新为最近使用。</li><li>缺页且已满：淘汰最久未访问的页。</li></ul>",
      CLOCK: "<ol><li>hand 始终指向待检查页框；本例 hand=0，环为 0→1→2→0。</li><li>有空页框：在 hand 处装入，然后 hand 后移。</li><li>命中：把该页的 R 置为 1，hand 不动。</li><li>置换：检查 hand 所指页框；R=1 时清零并后移，R=0 时淘汰。</li><li>装入完成后，hand 移到下一待检查页框。</li></ol>",
      ICLOCK: "<ol><li>hand 始终指向待检查页框；本例初值为 0，环为 0→1→2→0。</li><li>访问串中 R 表示读，W 表示写；写访问把该页的 M 置为 1。</li><li>第 1 轮找 (0,0)，不清 R。</li><li>第 2 轮找 (0,1)，同时把越过页面的 R 清为 0。</li><li>仍未找到时，再依次找 (0,0)、(0,1)；装入后 hand 指向下一待检查页框。</li></ol>"
    };

    let algorithm = "OPT";
    let cursor = 0;
    let events = [];

    function cloneFrames(frames) {
      return frames.map(function (frame) {
        return frame ? Object.assign({}, frame) : null;
      });
    }

    function makeEvent(state, details) {
      const event = Object.assign({
        refIndex: state.refIndex,
        page: state.page,
        faults: state.faults,
        replacements: state.replacements,
        frames: cloneFrames(state.frames),
        pointer: null,
        inspected: null,
        focus: null,
        victim: null,
        trail: [],
        scanTitle: "",
        scanRule: "",
        pending: false,
        movement: "",
        title: "",
        message: ""
      }, details);
      event.trail = (event.trail || []).slice();
      return event;
    }

    function simulateBasic(kind) {
      const frames = Array(frameCount).fill(null);
      const fifo = [];
      const recent = [];
      const result = [];
      let faults = 0;
      let replacements = 0;

      sequence.forEach(function (page, refIndex) {
        const state = { frames, page, refIndex, faults, replacements };
        let index = frames.findIndex(function (frame) { return frame && frame.page === page; });

        if (index >= 0) {
          if (kind === "LRU") {
            const old = recent.indexOf(page);
            if (old >= 0) recent.splice(old, 1);
            recent.unshift(page);
            frames[index].lastUsed = refIndex;
          }
          state.faults = faults;
          state.replacements = replacements;
          result.push(makeEvent(state, {
            focus: index,
            title: "页 " + page + " 命中",
            message: kind === "LRU"
              ? "页已在主存中，更新它的最近访问时间；页框内容不变。"
              : "页已在主存中，不发生缺页，页框内容不变。",
            movement: "本次没有页面换入、换出。"
          }));
          return;
        }

        faults++;
        let target = frames.findIndex(function (frame) { return !frame; });
        let evicted = null;

        if (target < 0) {
          replacements++;
          if (kind === "OPT") {
            let farthest = -1;
            frames.forEach(function (frame, frameIndex) {
              const later = sequence.slice(refIndex + 1).indexOf(frame.page);
              const distance = later < 0 ? Number.POSITIVE_INFINITY : later;
              if (distance > farthest) {
                farthest = distance;
                target = frameIndex;
              }
            });
          } else if (kind === "FIFO") {
            const victimPage = fifo.shift();
            target = frames.findIndex(function (frame) { return frame.page === victimPage; });
          } else {
            const victimPage = recent.pop();
            target = frames.findIndex(function (frame) { return frame.page === victimPage; });
          }
          evicted = frames[target].page;
        }

        frames[target] = {
          page,
          loadedAt: refIndex,
          lastUsed: refIndex,
          r: 1,
          m: isWrite(refIndex) ? 1 : 0
        };
        if (kind === "FIFO") fifo.push(page);
        if (kind === "LRU") recent.unshift(page);

        state.faults = faults;
        state.replacements = replacements;
        result.push(makeEvent(state, {
          focus: target,
          title: evicted === null ? "缺页：直接调入页 " + page : "缺页：换入页 " + page,
          message: evicted === null
            ? "主存还有空闲页框，页 " + page + " 直接装入页框 " + target + "。"
            : algorithmName(kind) + " 选择页 " + evicted + "，用页 " + page + " 替换它。",
          movement: evicted === null
            ? "空闲页框 " + target + " ← 页 " + page
            : "页框 " + target + "：" + evicted + " → " + page
        }));
      });
      return result;
    }

    function simulateClock(improved) {
      const frames = Array(frameCount).fill(null);
      const result = [];
      let hand = 0;
      let faults = 0;
      let replacements = 0;

      sequence.forEach(function (page, refIndex) {
        const state = { frames, page, refIndex, faults, replacements };
        const hitIndex = frames.findIndex(function (frame) { return frame && frame.page === page; });

        if (hitIndex >= 0) {
          frames[hitIndex].r = 1;
          if (improved && isWrite(refIndex)) frames[hitIndex].m = 1;
          state.faults = faults;
          state.replacements = replacements;
          result.push(makeEvent(state, {
            pointer: hand,
            focus: hitIndex,
            title: "页 " + page + " 命中",
            message: improved
              ? (isWrite(refIndex)
                  ? "本次是写访问：把该页的 R 和 M 都置为 1。"
                  : "本次是读访问：把该页的 R 置为 1，M 保持原值。")
              : "把该页的访问位 R 置为 1。",
            movement: "命中不会移动扫描指针；指针仍指向页框 " + hand + "。"
          }));
          return;
        }

        faults++;
        state.faults = faults;
        const empty = frames.findIndex(function (frame) { return !frame; });
        if (empty >= 0) {
          const target = frames[hand] ? empty : hand;
          frames[target] = {
            page,
            loadedAt: refIndex,
            lastUsed: refIndex,
            r: 1,
            m: isWrite(refIndex) ? 1 : 0
          };
          hand = (target + 1) % frameCount;
          state.replacements = replacements;
          result.push(makeEvent(state, {
            pointer: hand,
            focus: target,
            title: "缺页：直接调入页 " + page,
            message: improved
              ? "页框 " + target + " 为空，装入页面；本次为" + (isWrite(refIndex) ? "写" : "读") + "访问，因此设置 (R,M)=(1," + (isWrite(refIndex) ? 1 : 0) + ")。"
              : "页框 " + target + " 为空，装入页面并把 R 置为 1。",
            movement: "页 " + page + " 装入页框 " + target + "；指针移到页框 " + hand + "。"
          }));
          return;
        }

        state.replacements = replacements;
        let trail = [];
        result.push(makeEvent(state, {
          pointer: hand,
          title: "缺页：从指针处开始扫描",
          message: "页框已满，当前不能直接调入页 " + page + "。",
          movement: "扫描从页框 " + hand + " 开始。",
          scanTitle: improved ? "改进 CLOCK：准备第 1 轮" : "CLOCK：准备扫描",
          scanRule: improved ? "本轮目标 (R,M)=(0,0)" : "寻找 R=0",
          pending: true,
          trail
        }));

        if (!improved) {
          while (true) {
            const inspected = hand;
            const frame = frames[inspected];
            if (frame.r === 0) {
              trail.push("页框" + inspected + "：" + frame.page + "，R=0 ✓");
              result.push(makeEvent(state, {
                pointer: inspected,
                inspected,
                victim: inspected,
                title: "找到 R=0：选择页 " + frame.page,
                message: "页框 " + inspected + " 的 R=0，不再给第二次机会。",
                movement: "指针停在页框 " + inspected + "，准备在这里完成置换。",
                scanTitle: "CLOCK：扫描路径",
                scanRule: "R=0，停止",
                pending: true,
                trail: trail.slice()
              }));
              const oldPage = frame.page;
              frames[inspected] = {
                page,
                loadedAt: refIndex,
                lastUsed: refIndex,
                r: 1,
                m: isWrite(refIndex) ? 1 : 0
              };
              hand = (inspected + 1) % frameCount;
              replacements++;
              state.replacements = replacements;
              result.push(makeEvent(state, {
                pointer: hand,
                focus: inspected,
                title: "置换完成：页 " + oldPage + " → 页 " + page,
                message: "新页装入后 R=1。下一次扫描不从这里重来，而从下一页框开始。",
                movement: "页框 " + inspected + " 完成置换；指针移到页框 " + hand + "。",
                scanTitle: "CLOCK：本次扫描完成",
                scanRule: "hand：页框 " + hand,
                trail: trail.slice()
              }));
              break;
            }

            frames[inspected].r = 0;
            hand = (inspected + 1) % frameCount;
            trail.push("页框" + inspected + "：" + frame.page + "，R 1→0");
            result.push(makeEvent(state, {
              pointer: hand,
              inspected,
              title: "R=1：给页 " + frame.page + " 第二次机会",
              message: "清除页框 " + inspected + " 的 R，然后继续检查下一页框。",
              movement: "指针：页框 " + inspected + " → 页框 " + hand,
              scanTitle: "CLOCK：扫描路径",
              scanRule: "R=1 时清零并后移",
              pending: true,
              trail: trail.slice()
            }));
          }
          return;
        }

        let chosen = -1;
        let chosenPass = 0;
        for (let pass = 1; pass <= 4 && chosen < 0; pass++) {
          const targetR = 0;
          const targetM = pass % 2 === 1 ? 0 : 1;
          const clearR = pass % 2 === 0;
          const passStart = hand;

          for (let count = 0; count < frameCount; count++) {
            const inspected = hand;
            const frame = frames[inspected];
            const beforeR = frame.r;
            const beforeM = frame.m;

            if (beforeR === targetR && beforeM === targetM) {
              trail.push("第" + pass + "轮·页框" + inspected + "：(" + beforeR + "," + beforeM + ") ✓");
              chosen = inspected;
              chosenPass = pass;
              result.push(makeEvent(state, {
                pointer: inspected,
                inspected,
                victim: inspected,
                title: "第 " + pass + " 轮找到 (" + targetR + "," + targetM + ")",
                message: "页 " + frame.page + " 符合本轮目标，停止扫描并选择该页。",
                movement: "指针停在页框 " + inspected + "，准备完成置换。",
                scanTitle: "改进 CLOCK：扫描路径",
                scanRule: "第 " + pass + " 轮目标 (" + targetR + "," + targetM + ")",
                pending: true,
                trail: trail.slice()
              }));
              break;
            }

            let action = "不符合，越过";
            if (clearR && frame.r === 1) {
              frame.r = 0;
              action = "不符合，R 1→0";
            }
            hand = (inspected + 1) % frameCount;
            trail.push("第" + pass + "轮·页框" + inspected + "：(" + beforeR + "," + beforeM + ") " + action);
            result.push(makeEvent(state, {
              pointer: hand,
              inspected,
              title: "第 " + pass + " 轮：页框 " + inspected + " 不符合",
              message: clearR
                ? "本轮寻找 (" + targetR + "," + targetM + ")；越过页面时把 R=1 清为 0。"
                : "本轮只寻找 (" + targetR + "," + targetM + ")，不修改访问位。",
              movement: "指针：页框 " + inspected + " → 页框 " + hand,
              scanTitle: "改进 CLOCK：扫描路径",
              scanRule: "第 " + pass + " 轮目标 (" + targetR + "," + targetM + ")",
              pending: true,
              trail: trail.slice()
            }));
          }

          if (chosen < 0 && hand !== passStart) hand = passStart;
        }

        const oldPage = frames[chosen].page;
        frames[chosen] = {
          page,
          loadedAt: refIndex,
          lastUsed: refIndex,
          r: 1,
          m: isWrite(refIndex) ? 1 : 0
        };
        hand = (chosen + 1) % frameCount;
        replacements++;
        state.replacements = replacements;
        result.push(makeEvent(state, {
          pointer: hand,
          focus: chosen,
          title: "置换完成：页 " + oldPage + " → 页 " + page,
          message: "在第 " + chosenPass + " 轮选中页框 " + chosen + "。新页因本次" + (isWrite(refIndex) ? "写" : "读") + "访问而设置 (R,M)=(1," + (isWrite(refIndex) ? 1 : 0) + ")。",
          movement: "页框 " + chosen + " 完成置换；指针移到页框 " + hand + "。",
          scanTitle: "改进 CLOCK：本次扫描完成",
          scanRule: "hand：页框 " + hand,
          trail: trail.slice()
        }));
      });
      return result;
    }

    function algorithmName(kind) {
      return kind === "OPT" ? "OPT" : kind === "FIFO" ? "FIFO" : "LRU";
    }

    function buildEvents(kind) {
      if (kind === "CLOCK") return simulateClock(false);
      if (kind === "ICLOCK") return simulateClock(true);
      return simulateBasic(kind);
    }

    function frameMeta(frame, index, event) {
      if (!frame) return "空闲";
      if (algorithm === "CLOCK") {
        return '<div class="bits"><span class="bit">R=' + frame.r + "</span></div>";
      }
      if (algorithm === "ICLOCK") {
        return '<div class="bits"><span class="bit">R=' + frame.r + '</span><span class="bit">M=' + frame.m + "</span></div>";
      }
      if (algorithm === "FIFO") {
        return "第 " + (frame.loadedAt + 1) + " 次访问时调入";
      }
      if (algorithm === "LRU") {
        return "最近访问：第 " + (frame.lastUsed + 1) + " 项";
      }
      const later = sequence.slice(event.refIndex + 1).indexOf(frame.page);
      return later < 0 ? "以后不再访问" : "下次访问：+" + (later + 1);
    }

    function renderSequence(refIndex) {
      const wrap = document.getElementById("sequence");
      wrap.innerHTML = "";
      sequence.forEach(function (page, index) {
        const item = document.createElement("div");
        item.className = "reference";
        if (index < refIndex) item.classList.add("past");
        if (index === refIndex) item.classList.add("current");
        item.textContent = algorithm === "ICLOCK"
          ? page + (isWrite(index) ? "W" : "R")
          : page;
        wrap.appendChild(item);
      });
    }

    function renderFrames(event) {
      const wrap = document.getElementById("frames");
      wrap.innerHTML = "";
      const showInitialHand = !event && (algorithm === "CLOCK" || algorithm === "ICLOCK");
      for (let index = 0; index < frameCount; index++) {
        const frame = event ? event.frames[index] : null;
        const el = document.createElement("div");
        el.className = "frame";
        if (!frame) el.classList.add("empty");
        if (event && event.focus === index) el.classList.add("focus");
        if (event && event.inspected === index) el.classList.add("inspected");
        if (event && event.victim === index) el.classList.add("victim");
        if ((event && event.pointer === index && (algorithm === "CLOCK" || algorithm === "ICLOCK")) || (showInitialHand && index === 0)) {
          el.classList.add("pointer");
        }
        el.innerHTML =
          '<div class="frame-label">页框 ' + index + "</div>" +
          '<div class="page">' + (frame ? frame.page : "—") + "</div>" +
          '<div class="frame-meta">' + frameMeta(frame, index, event || { refIndex: -1 }) + "</div>";
        wrap.appendChild(el);
      }
    }

    function renderTrail(event) {
      const panel = document.getElementById("scanPanel");
      const trailWrap = document.getElementById("trail");
      const isClock = algorithm === "CLOCK" || algorithm === "ICLOCK";
      panel.classList.toggle("hidden", !isClock);
      if (!isClock) return;

      document.getElementById("scanTitle").textContent = event && event.scanTitle ? event.scanTitle : "尚未开始扫描";
      document.getElementById("scanRule").textContent = event && event.scanRule ? event.scanRule : "命中时指针不动";
      document.getElementById("pendingPage").textContent = event && event.pending
        ? "待调入页 " + event.page + (algorithm === "ICLOCK" ? (isWrite(event.refIndex) ? "W" : "R") : "")
        : "";
      trailWrap.innerHTML = "";
      const items = event && event.trail ? event.trail : [];
      if (items.length === 0) {
        const empty = document.createElement("span");
        empty.className = "trail-item";
        empty.textContent = "等待缺页且页框已满";
        trailWrap.appendChild(empty);
        return;
      }
      items.forEach(function (text, index) {
        if (index > 0) {
          const arrow = document.createElement("span");
          arrow.className = "trail-arrow";
          arrow.textContent = "→";
          trailWrap.appendChild(arrow);
        }
        const item = document.createElement("span");
        item.className = "trail-item";
        item.textContent = text;
        trailWrap.appendChild(item);
      });
    }

    function render() {
      document.querySelectorAll(".tabs button").forEach(function (button) {
        button.classList.toggle("active", button.dataset.algo === algorithm);
      });

      const event = cursor === 0 ? null : events[cursor - 1];
      const refIndex = event ? event.refIndex : -1;
      renderSequence(refIndex);
      renderFrames(event);
      renderTrail(event);

      document.getElementById("currentPage").textContent = event
        ? event.page + (algorithm === "ICLOCK" ? (isWrite(event.refIndex) ? "W" : "R") : "")
        : "—";
      document.getElementById("faults").textContent = event ? event.faults : "0";
      document.getElementById("replacements").textContent = event ? event.replacements : "0";
      document.getElementById("rate").textContent = event
        ? Math.round(event.faults / (event.refIndex + 1) * 1000) / 10 + "%"
        : "0%";

      const actionText = cursor === 0 ? "准备开始" : "动作 " + cursor + " / " + events.length;
      const accessText = event ? " · 访问 " + (event.refIndex + 1) + " / " + sequence.length : "";
      document.getElementById("badge").textContent = actionText + accessText;
      document.getElementById("eventTitle").textContent = event ? event.title : algorithm + "：准备开始";
      document.getElementById("explain").innerHTML = event
        ? "<p>" + event.message + "</p>"
        : "<p>" + introductions[algorithm] + "</p><p>点击“下一步”开始。相同页面访问可能包含多个扫描动作。</p>";
      document.getElementById("movement").textContent = event
        ? event.movement
        : (algorithm === "CLOCK" || algorithm === "ICLOCK"
            ? "hand=0：待检查页框为页框 0；命中不会移动 hand。"
            : "");
      document.getElementById("ruleBody").innerHTML = ruleBodies[algorithm];

      document.getElementById("prev").disabled = cursor === 0;
      document.getElementById("next").disabled = cursor === events.length;
    }

    function chooseAlgorithm(nextAlgorithm) {
      algorithm = nextAlgorithm;
      events = buildEvents(algorithm);
      cursor = 0;
      render();
    }

    document.querySelectorAll(".tabs button").forEach(function (button) {
      button.addEventListener("click", function () {
        chooseAlgorithm(button.dataset.algo);
      });
    });

    document.getElementById("prev").addEventListener("click", function () {
      if (cursor > 0) {
        cursor--;
        render();
      }
    });

    document.getElementById("next").addEventListener("click", function () {
      if (cursor < events.length) {
        cursor++;
        render();
      }
    });

    document.getElementById("reset").addEventListener("click", function () {
      cursor = 0;
      render();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft" && cursor > 0) {
        cursor--;
        render();
      }
      if (event.key === "ArrowRight" && cursor < events.length) {
        cursor++;
        render();
      }
    });

    chooseAlgorithm("OPT");
  </script>
</body>
</html>
