<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFS Cycle Detection</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --panel: #f7f8fb;
    --text: #162033;
    --muted: #5d687a;
    --line: #d8dee9;
    --edge: #9ba6b4;
    --tree: #16a34a;
    --parent: #f59e0b;
    --cycle: #dc2626;
    --cross: #7c3aed;
    --seen: #3b82f6;
    --done: #64748b;
    --node: #ffffff;
    --code: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14;
      --panel: #121923;
      --text: #e7edf6;
      --muted: #a6b0c0;
      --line: #2a3444;
      --edge: #657287;
      --tree: #4ade80;
      --parent: #fbbf24;
      --cycle: #f87171;
      --cross: #c4b5fd;
      --seen: #60a5fa;
      --done: #94a3b8;
      --node: #172033;
      --code: #111827;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
  .top { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 23px; }
  .hint { margin-top: 4px; color: var(--muted); font-size: 14px; }
  .counter { color: var(--muted); font: 14px Consolas, monospace; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, .9fr); gap: 14px; }
  .panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 13px; }
  #stage svg { display: block; width: 100%; height: 410px; }
  .edge { stroke: var(--edge); stroke-width: 3; fill: none; }
  .tree { stroke: var(--tree); stroke-width: 5; fill: none; }
  .parent { stroke: var(--parent); stroke-width: 5; fill: none; }
  .cycle { stroke: var(--cycle); stroke-width: 5; fill: none; }
  .cross { stroke: var(--cross); stroke-width: 5; fill: none; }
  .node { fill: var(--node); stroke: var(--edge); stroke-width: 3; }
  .node.visited, .node.visiting { stroke: var(--seen); }
  .node.done { stroke: var(--done); stroke-dasharray: 5 4; }
  .node.current { fill: var(--parent); stroke: var(--parent); }
  .node-label { fill: var(--text); font-size: 19px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .edge-label { fill: var(--text); font-size: 19px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 6px; stroke-linejoin: round; }
  .mode { display: inline-flex; padding: 3px 9px; margin-bottom: 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 13px; }
  .explain { min-height: 155px; font-size: 15px; line-height: 1.65; }
  .explain strong { font-size: 18px; }
  .legend { display: grid; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .tag { display: flex; align-items: center; gap: 8px; }
  .sample-line { width: 25px; height: 0; border-top: 4px solid var(--edge); flex: 0 0 auto; }
  .sample-line.tree { border-color: var(--tree); }
  .sample-line.parent { border-color: var(--parent); }
  .sample-line.cycle { border-color: var(--cycle); }
  .sample-line.cross { border-color: var(--cross); }
  .sample-dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--seen); flex: 0 0 auto; }
  .sample-dot.done { border-color: var(--done); border-style: dashed; }
  pre { margin: 12px 0 0; padding: 11px; white-space: pre-wrap; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--code); font: 13px/1.5 Consolas, monospace; }
  .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 8px 13px; cursor: pointer; }
  button:hover { border-color: var(--seen); }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    #stage svg { height: 340px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>DFS 判断图是否有环</h1>
      <div class="hint">无向图排除父边；有向图判断是否指回当前递归路径。</div>
    </div>
    <div class="counter" id="counter"></div>
  </header>

  <section class="grid">
    <div class="panel" id="stage"></div>
    <div class="panel">
      <div class="mode" id="mode"></div>
      <div class="explain" id="explain"></div>
      <div class="legend" id="legend"></div>
      <pre id="code"></pre>
    </div>
  </section>

  <div class="controls">
    <button id="prev" type="button">上一页</button>
    <button id="next" type="button">下一页</button>
  </div>
</main>

<script>
const graphs = {
  undirected: {
    directed: false,
    nodes: { A:[95,220], B:[255,95], C:[460,185], D:[300,345] },
    edges: [["A","B"],["B","C"],["C","D"],["D","A"]]
  },
  directed: {
    directed: true,
    nodes: { 1:[90,220], 2:[255,95], 3:[470,205], 4:[265,345], 5:[625,345] },
    edges: [["1","2"],["2","3"],["3","5"],["3","4"],["4","5"],["4","2"]]
  }
};

const slides = [
  {
    kind:"undirected",
    title:"为什么会再次遇到父顶点",
    current:"B", visited:["A","B"], done:[], tree:[["A","B"]],
    highlights:[{edge:["A","B"], type:"parent", label:"父边：同一条边的反向检查"}],
    explain:"A 通过无向边 {A,B} 发现 B，因此 parent[B] = A。无向边会从两个端点各检查一次；处理 B 时会再次看到已经访问的 A。这只是原来那条树边的另一端，不是第二条返回路径。",
    code:"v 已访问 && v == parent[u]\n→ 同一条无向边被反向检查，忽略"
  },
  {
    kind:"undirected",
    title:"非父边为什么必然闭合成环",
    current:"D", visited:["A","B","C","D"], done:[],
    tree:[["A","B"],["B","C"],["C","D"]],
    highlights:[{edge:["D","A"], type:"cycle", label:"非父边：闭合成环"}],
    explain:"DFS 树中已经存在路径 A—B—C—D。处理 D 时又遇到已访问的 A，且 A 不是 parent[D]。因为树中路径和新边都可以双向经过，路径 A—B—C—D 加上边 {D,A} 必然闭合成环。",
    code:"v 已访问 && v != parent[u]\n→ 树中已有 u 到 v 的路径\n→ 再加边 {u,v}，形成环"
  },
  {
    kind:"undirected",
    title:"无向图只需 visited + parent",
    current:"C", visited:["A","B","C"], done:[],
    tree:[["A","B"],["B","C"]], highlights:[],
    explain:"无向图中，父边是来路；除此以外，只要连到已访问顶点，就会与 DFS 树中的既有路径闭合。因此不必区分 VISITING 和 DONE。",
    code:"if (!visited[v]) {\n    parent[v] = u;\n    DFS(v);\n} else if (v != parent[u]) {\n    return true;\n}"
  },
  {
    kind:"directed",
    title:"有向图的 visited 丢失了关键信息",
    current:"4", visiting:["1","2","3","4"], done:["5"],
    tree:[["1","2"],["2","3"],["3","5"],["3","4"]],
    highlights:[
      {edge:["4","5"], type:"cross", label:"指向 DONE"},
      {edge:["4","2"], type:"cycle", label:"指向 VISITING"}
    ],
    explain:"顶点 2 和 5 都已经访问，但两条弧的结果不同。原因不是“访问时间”本身，而是方向：要让 u→v 成环，还必须已经存在 v→⋯→u。visited[] 只记录“发现过”，不能回答这条返回路径是否存在。",
    code:"visited[v] == true\n不能说明 v 能沿有向路径返回 u"
  },
  {
    kind:"directed",
    title:"指向 DONE：不能推出存在返回路径",
    current:"4", visiting:["1","2","3","4"], done:["5"],
    tree:[["1","2"],["2","3"],["3","5"],["3","4"]],
    highlights:[{edge:["4","5"], type:"cross", label:"5 已退出当前路径"}],
    explain:"5 的后继已经处理完，它不在当前递归路径中。弧 4→5 只能说明 4 能到达 5，不能推出 5 能返回 4，所以不能由这条弧判定有向环。",
    code:"state[5] == DONE\n→ 5 不在当前路径\n→ 不能据此判环"
  },
  {
    kind:"directed",
    title:"指向 VISITING：已有路径能够闭合",
    current:"4", visiting:["1","2","3","4"], done:["5"],
    tree:[["1","2"],["2","3"],["3","5"],["3","4"]],
    highlights:[{edge:["4","2"], type:"cycle", label:"回到当前递归路径"}],
    explain:"2 仍在当前递归路径上，所以路径中已经存在 2→3→4。再加上弧 4→2，方向首尾相接，形成有向环 2→3→4→2。",
    code:"state[2] == VISITING\n→ 已有 2 → ⋯ → 4\n→ 加上 4 → 2，形成有向环"
  },
  {
    kind:"directed",
    title:"差别不只是多一个 DONE 状态",
    current:null, visiting:["1","2","3","4"], done:["5"],
    tree:[["1","2"],["2","3"],["3","5"],["3","4"]],
    highlights:[
      {edge:["4","5"], type:"cross", label:"不能闭合"},
      {edge:["4","2"], type:"cycle", label:"能够闭合"}
    ],
    explain:"无向图中，非父边与树中路径天然能够双向闭合，所以排除父边即可。有向图中，边的方向可能使路径无法闭合，因此必须用 VISITING 判断终点是否仍在当前递归路径上；DONE 用来排除已经退出该路径的顶点。",
    code:"无向图：visited + parent\n有向图：UNVISITED / VISITING / DONE"
  }
];

let index = 0;

function sameEdge(first, second, directed) {
  return first[0] === second[0] && first[1] === second[1]
    || (!directed && first[0] === second[1] && first[1] === second[0]);
}

function hasEdge(list, edge, directed) {
  return (list || []).some(item => sameEdge(item, edge, directed));
}

function edgeEnds(nodes, a, b) {
  const [sx, sy] = nodes[a];
  const [tx, ty] = nodes[b];
  const dx = tx - sx;
  const dy = ty - sy;
  const length = Math.hypot(dx, dy);
  return [sx + dx * 30 / length, sy + dy * 30 / length, tx - dx * 35 / length, ty - dy * 35 / length];
}

function markerDefinitions() {
  const colors = { edge:"--edge", tree:"--tree", parent:"--parent", cycle:"--cycle", cross:"--cross" };
  return `<defs>${Object.entries(colors).map(([name, variable]) => `
    <marker id="arrow-${name}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path style="fill:var(${variable})" d="M0 0 L10 5 L0 10 Z"></path>
    </marker>`).join("")}</defs>`;
}

function legendFor(kind) {
  if (kind === "undirected") {
    return `
      <span class="tag"><span class="sample-line tree"></span>DFS 树中已有的路径</span>
      <span class="tag"><span class="sample-line parent"></span>父边：同一条边的反向检查</span>
      <span class="tag"><span class="sample-line cycle"></span>非父边：与树中路径闭合</span>`;
  }
  return `
    <span class="tag"><span class="sample-dot"></span>VISITING：仍在当前递归路径</span>
    <span class="tag"><span class="sample-dot done"></span>DONE：已经退出当前路径</span>
    <span class="tag"><span class="sample-line cross"></span>指向 DONE：不能据此判环</span>
    <span class="tag"><span class="sample-line cycle"></span>指向 VISITING：形成有向环</span>`;
}

function render() {
  const slide = slides[index];
  const graph = graphs[slide.kind];
  const highlights = slide.highlights || [];

  const edges = graph.edges.map(edge => {
    const highlight = highlights.find(item => sameEdge(item.edge, edge, graph.directed));
    const type = highlight ? highlight.type : hasEdge(slide.tree, edge, graph.directed) ? "tree" : "edge";
    const [x1, y1, x2, y2] = edgeEnds(graph.nodes, edge[0], edge[1]);
    const marker = graph.directed ? ` marker-end="url(#arrow-${type})"` : "";
    return `<line class="${type}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${marker}></line>`;
  }).join("");

  const labels = highlights.map(item => {
    const [a, b] = item.edge;
    const [x1, y1] = graph.nodes[a];
    const [x2, y2] = graph.nodes[b];
    const dx = item.dx || 0;
    const dy = item.dy === undefined ? -12 : item.dy;
    return `<text class="edge-label" x="${(x1 + x2) / 2 + dx}" y="${(y1 + y2) / 2 + dy}">${item.label}</text>`;
  }).join("");

  const nodes = Object.entries(graph.nodes).map(([id, position]) => {
    const visited = (slide.visited || []).includes(id);
    const visiting = (slide.visiting || []).includes(id);
    const done = (slide.done || []).includes(id);
    const current = slide.current === id;
    const classes = ["node", visited ? "visited" : "", visiting ? "visiting" : "", done ? "done" : "", current ? "current" : ""].filter(Boolean).join(" ");
    return `<circle class="${classes}" cx="${position[0]}" cy="${position[1]}" r="25"></circle>
      <text class="node-label" x="${position[0]}" y="${position[1]}">${id}</text>`;
  }).join("");

  document.getElementById("stage").innerHTML = `<svg viewBox="0 0 700 430" role="img" aria-label="${slide.title}">${markerDefinitions()}${edges}${labels}${nodes}</svg>`;
  document.getElementById("mode").textContent = slide.kind === "undirected" ? "无向图" : "有向图";
  document.getElementById("explain").innerHTML = `<strong>${slide.title}</strong><br>${slide.explain}`;
  document.getElementById("legend").innerHTML = legendFor(slide.kind);
  document.getElementById("code").textContent = slide.code;
  document.getElementById("counter").textContent = `${index + 1} / ${slides.length}`;
}

function step(delta) {
  index = (index + delta + slides.length) % slides.length;
  render();
}

document.getElementById("prev").addEventListener("click", event => { event.stopPropagation(); step(-1); });
document.getElementById("next").addEventListener("click", event => { event.stopPropagation(); step(1); });
document.body.addEventListener("click", () => step(1));
document.addEventListener("keydown", event => {
  if (event.key === "ArrowLeft") step(-1);
  if (event.key === "ArrowRight" || event.key === " ") step(1);
});

render();
</script>
</body>
</html>
