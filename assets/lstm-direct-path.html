<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LSTM 的直接路径</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;
--in:#dbe7ff; --inS:#2f5bb7; --param:#ece0ff; --paramS:#6b46c1;
--state:#e9edf3; --stateS:#4a5568; --out:#d9f2e2; --outS:#2f7a4f;
--cur:#ffe6c7; --curS:#b45309; --accent:#2f5bb7;
}
@media (prefers-color-scheme:dark){:root{
--bg:#14181f; --panel:#1c222b; --fg:#e8ecf3; --muted:#9aa4b2; --line:#39424f;
--in:#1f3149; --inS:#8fb0ef; --param:#2d2350; --paramS:#b49af0;
--state:#262d38; --stateS:#aab4c2; --out:#1e3a2b; --outS:#87c9a2;
--cur:#4a3418; --curS:#f0b26b; --accent:#8fb0ef;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>LSTM 的直接路径</h1><p class="sub">梯度沿 c 的加法主干回传，每步乘以 diag(f)；门值接近 1 时信息容易穿过</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="LSTM 的直接路径"><rect x="0" y="0" width="1100" height="620" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wp{stroke:var(--paramS);stroke-width:2.2;fill:none;marker-end:url(#arp)}
.ws{stroke:var(--stateS);stroke-width:2.2;fill:none;marker-end:url(#ars)}
.wout{stroke:var(--outS);stroke-width:2.2;fill:none;marker-end:url(#aro)}
.wcur{stroke:var(--curS);stroke-width:2.2;fill:none;marker-end:url(#arc)}
.win{stroke:var(--inS);stroke-width:2.2;fill:none;marker-end:url(#ari)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}
</style><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="arp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--paramS)"/></marker>
<marker id="ars" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--stateS)"/></marker>
<marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--outS)"/></marker>
<marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--curS)"/></marker>
<marker id="ari" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--inS)"/></marker></defs><text class="tt" x="28" y="52">LSTM 的直接路径</text><text class="ss" x="28" y="80">梯度沿 c 的加法主干回传，每步乘以 diag(f)；门值接近 1 时信息容易穿过</text><rect x="30" y="104" width="14" height="14" rx="3" fill="var(--in)" stroke="var(--inS)"/><text class="sm" x="49" y="116">输入</text><rect x="120" y="104" width="14" height="14" rx="3" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="139" y="116">参数</text><rect x="210" y="104" width="14" height="14" rx="3" fill="var(--state)" stroke="var(--stateS)"/><text class="sm" x="229" y="116">中间状态</text><rect x="300" y="104" width="14" height="14" rx="3" fill="var(--out)" stroke="var(--outS)"/><text class="sm" x="319" y="116">输出</text><rect x="390" y="104" width="14" height="14" rx="3" fill="var(--cur)" stroke="var(--curS)"/><text class="sm" x="409" y="116">当前步</text><rect x="848" y="92" width="222" height="66" rx="10" fill="var(--panel)" stroke="var(--line)"/><text class="sm" x="860" y="112">图例</text><text class="sm" x="860" y="132">diag(f) 逐维乘</text><text class="sm" x="860" y="150">∂c/∂c 沿主干回传</text><rect x="24" y="170" width="900" height="290" rx="14" fill="none" stroke="var(--line)" stroke-dasharray="9 6"/><text class="sm" x="40" y="152">反向传播时，梯度沿 c 的加法主干直线回传</text><rect class="b state" x="60" y="250" width="150" height="70" rx="10"/><text class="lb" x="135.0" y="281.0" text-anchor="middle">c(t−1)</text><text class="sm" x="135.0" y="301.0" text-anchor="middle">2 维</text><text class="sm" x="135" y="240" text-anchor="middle">c(t−1)</text><rect class="b state" x="330" y="250" width="150" height="70" rx="10"/><text class="lb" x="405.0" y="281.0" text-anchor="middle">c(t)</text><text class="sm" x="405.0" y="301.0" text-anchor="middle">2 维</text><text class="sm" x="405" y="240" text-anchor="middle">c(t)</text><rect class="b state" x="600" y="250" width="150" height="70" rx="10"/><text class="lb" x="675.0" y="281.0" text-anchor="middle">c(t+1)</text><text class="sm" x="675.0" y="301.0" text-anchor="middle">2 维</text><text class="sm" x="675" y="240" text-anchor="middle">c(t+1)</text><path class="ws" d="M210,285 L326,285"/><path class="ws" d="M480,285 L596,285"/><circle class="b plain" cx="270" cy="285" r="26"/><text class="sm" x="270" y="290" text-anchor="middle">⊙</text><circle class="b plain" cx="540" cy="285" r="26"/><text class="sm" x="540" y="290" text-anchor="middle">⊙</text><rect class="b param" x="215" y="380" width="150" height="64" rx="10"/><text class="lb" x="290.0" y="408.0" text-anchor="middle">f(t)</text><text class="val" x="290.0" y="428.0" text-anchor="middle">[0.545, 0.510]</text><rect class="b param" x="485" y="380" width="150" height="64" rx="10"/><text class="lb" x="560.0" y="408.0" text-anchor="middle">f(t+1)</text><text class="val" x="560.0" y="428.0" text-anchor="middle">[0.493, 0.550]</text><path class="wp" d="M290,380 L272,315"/><path class="wp" d="M560,380 L542,315"/><text class="sm" x="300" y="240">diag(f(t))</text><text class="sm" x="570" y="240">diag(f(t+1))</text><path class="wcur" d="M750,285 L810,285 L810,210 L60,210 L60,240"/><text class="sm" x="300" y="200">梯度回传：连乘各步的 f</text><rect x="60" y="470" width="620" height="66" rx="12" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="76" y="496">∂c(t+1)/∂c(t−1) = diag(f(t+1)) · diag(f(t))</text><text class="sm" x="76" y="520">演示：连乘 = [0.269, 0.281]；f 接近 1 时这条路径接近恒等</text><rect x="720" y="400" width="330" height="60" rx="8" fill="var(--state)" opacity="0.7"/><text class="sm" x="732" y="424">绕经门与 h 的路径也存在</text><text class="sm" x="732" y="446">直接路径是主要通道，不是全部梯度</text><rect class="b state" x="30" y="572" width="196" height="34" rx="8"/><text class="sm" x="128.0" y="594" text-anchor="middle">c 主干</text><path class="wire" d="M228,589 L242,589"/><rect class="b param" x="244" y="572" width="196" height="34" rx="8"/><text class="sm" x="342.0" y="594" text-anchor="middle">逐维乘 f</text><path class="wire" d="M442,589 L456,589"/><rect class="b cur" x="458" y="572" width="196" height="34" rx="8"/><text class="sm" x="556.0" y="594" text-anchor="middle">逐步连乘</text></svg></div></div></body></html>
