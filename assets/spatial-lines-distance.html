<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>辅助平面求公垂线</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: light-dark(#ffffff, #181818);
      --foreground: light-dark(#1a1c1f, #f5f5f5);
      --muted: light-dark(#eef0f3, #303236);
      --muted-foreground: light-dark(#667085, #aeb4bf);
      --border: light-dark(#cfd4dc, #555b65);
      --viz-series-1: light-dark(#2563eb, #60a5fa);
      --viz-series-2: light-dark(#dc2626, #fb7185);
      --viz-series-3: light-dark(#059669, #34d399);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
    }

    body {
      padding: 16px;
      color: var(--foreground);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--foreground);
      background: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.96);
    }

    .text-small {
      font-size: 0.875rem;
    }

    .text-muted {
      color: var(--muted-foreground);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
<div id="spatial-lines-3d">
  <style>
    #spatial-lines-3d {
      width: 100%;
      min-width: 0;
      color: var(--foreground);
      font-family: inherit;
    }
    #spatial-lines-3d .scene-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    #spatial-lines-3d h2 {
      margin: 0;
      font-weight: 500;
    }
    #spatial-lines-3d .scene-stage {
      width: 100%;
      height: clamp(360px, 68vw, 560px);
      min-height: 360px;
      touch-action: none;
      cursor: grab;
    }
    #spatial-lines-3d .scene-stage.is-dragging {
      cursor: grabbing;
    }
    #spatial-lines-3d svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #spatial-lines-3d .plane {
      stroke: var(--border);
      stroke-width: 1;
    }
    #spatial-lines-3d #sld-plane-one .plane {
      fill: var(--viz-series-1);
      fill-opacity: 0.11;
    }
    #spatial-lines-3d #sld-plane-two .plane {
      fill: var(--viz-series-2);
      fill-opacity: 0.11;
    }
    #spatial-lines-3d .grid-line {
      fill: none;
      stroke: var(--border);
      stroke-width: 1;
      stroke-opacity: 0.72;
    }
    #spatial-lines-3d .line-one,
    #spatial-lines-3d .line-two,
    #spatial-lines-3d .normal-line {
      fill: none;
      stroke-linecap: round;
    }
    #spatial-lines-3d .line-one {
      stroke: var(--viz-series-1);
      stroke-width: 5;
    }
    #spatial-lines-3d .line-two {
      stroke: var(--viz-series-2);
      stroke-width: 5;
    }
    #spatial-lines-3d .normal-line {
      stroke: var(--viz-series-3);
      stroke-width: 5;
    }
    #spatial-lines-3d .right-angle {
      fill: none;
      stroke: var(--foreground);
      stroke-width: 1.7;
    }
    #spatial-lines-3d .point-one {
      fill: var(--viz-series-1);
    }
    #spatial-lines-3d .point-two {
      fill: var(--viz-series-2);
    }
    #spatial-lines-3d svg text {
      fill: var(--foreground);
      font-size: 12px;
      paint-order: stroke;
      stroke: var(--background);
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    #spatial-lines-3d svg .secondary-label {
      fill: var(--muted-foreground);
    }
    #spatial-lines-3d svg .distance-label {
      font-size: 13px;
      font-weight: 500;
    }
  </style>

  <div class="scene-head">
    <div>
      <h2>两个辅助平面的交线</h2>
      <div class="text-small text-muted">拖动旋转 · 滚轮缩放</div>
    </div>
    <button id="sld-reset" type="button" class="btn btn-ghost">重置视角</button>
  </div>

  <div id="sld-stage" class="scene-stage">
    <svg id="sld-svg" viewBox="0 0 736 520" role="img" aria-labelledby="sld-title sld-desc">
      <title id="sld-title">用两个辅助平面的交线构造公垂线</title>
      <desc id="sld-desc">平面 Π1 包含直线 L1 和方向 n，平面 Π2 包含直线 L2 和方向 n。两平面的交线 m 就是两条异面直线的公垂线。</desc>

      <g id="sld-plane-one">
        <polygon class="plane"></polygon>
        <g class="grid"></g>
      </g>
      <g id="sld-plane-two">
        <polygon class="plane"></polygon>
        <g class="grid"></g>
      </g>

      <line id="sld-line-one" class="line-one"></line>
      <line id="sld-line-two" class="line-two"></line>
      <line id="sld-normal" class="normal-line"></line>

      <polyline id="sld-angle-one" class="right-angle"></polyline>
      <polyline id="sld-angle-two" class="right-angle"></polyline>

      <circle id="sld-point-p" class="point-one" r="5"></circle>
      <circle id="sld-point-q" class="point-two" r="5"></circle>

      <text id="sld-label-one">L₁：p + s a</text>
      <text id="sld-label-two">L₂：q + t b</text>
      <text id="sld-label-p">P</text>
      <text id="sld-label-q">Q</text>
      <text id="sld-label-distance" class="distance-label">垂线段 PQ</text>
      <text id="sld-label-normal" class="secondary-label">m = Π₁ ∩ Π₂，方向为 n = a × b</text>
      <text id="sld-label-plane-one" class="secondary-label">Π₁</text>
      <text id="sld-label-plane-two" class="secondary-label">Π₂</text>
    </svg>
  </div>

  <div id="sld-status" class="sr-only" aria-live="polite">三维示意图已载入。</div>

  <script>
    (() => {
      const root = document.getElementById("spatial-lines-3d");
      const stage = document.getElementById("sld-stage");
      const reset = document.getElementById("sld-reset");
      const status = document.getElementById("sld-status");

      const elements = {
        planeOne: root.querySelector("#sld-plane-one .plane"),
        planeTwo: root.querySelector("#sld-plane-two .plane"),
        gridOne: root.querySelector("#sld-plane-one .grid"),
        gridTwo: root.querySelector("#sld-plane-two .grid"),
        lineOne: document.getElementById("sld-line-one"),
        lineTwo: document.getElementById("sld-line-two"),
        normal: document.getElementById("sld-normal"),
        angleOne: document.getElementById("sld-angle-one"),
        angleTwo: document.getElementById("sld-angle-two"),
        pointP: document.getElementById("sld-point-p"),
        pointQ: document.getElementById("sld-point-q"),
        labelOne: document.getElementById("sld-label-one"),
        labelTwo: document.getElementById("sld-label-two"),
        labelP: document.getElementById("sld-label-p"),
        labelQ: document.getElementById("sld-label-q"),
        labelDistance: document.getElementById("sld-label-distance"),
        labelNormal: document.getElementById("sld-label-normal"),
        labelPlaneOne: document.getElementById("sld-label-plane-one"),
        labelPlaneTwo: document.getElementById("sld-label-plane-two")
      };

      const state = {
        yaw: 0.35,
        pitch: -0.72,
        zoom: 1,
        dragging: false,
        lastX: 0,
        lastY: 0
      };

      const P = [0, 0, 0];
      const Q = [0, 0, 2];
      const a = [1, 1, 0];
      const b = [1, -1, 0];

      const add = (u, v) => [u[0] + v[0], u[1] + v[1], u[2] + v[2]];
      const scale = (u, c) => [u[0] * c, u[1] * c, u[2] * c];
      const normalize = (u) => {
        const length = Math.hypot(u[0], u[1], u[2]);
        return [u[0] / length, u[1] / length, u[2] / length];
      };

      const aUnit = normalize(a);
      const bUnit = normalize(b);
      const nUnit = [0, 0, 1];
      const planeExtent = 2.45;
      const zMin = -0.8;
      const zMax = 2.8;

      function planeCorners(direction) {
        return [
          add(scale(direction, -planeExtent), [0, 0, zMin]),
          add(scale(direction, planeExtent), [0, 0, zMin]),
          add(scale(direction, planeExtent), [0, 0, zMax]),
          add(scale(direction, -planeExtent), [0, 0, zMax])
        ];
      }

      function project(point) {
        const cy = Math.cos(state.yaw);
        const sy = Math.sin(state.yaw);
        const cp = Math.cos(state.pitch);
        const sp = Math.sin(state.pitch);

        const x1 = cy * point[0] - sy * point[1];
        const y1 = sy * point[0] + cy * point[1];
        const z1 = point[2];
        const y2 = cp * y1 - sp * z1;
        const z2 = sp * y1 + cp * z1;
        const perspective = 6.5 / (6.5 - z2);
        const sceneScale = 78 * state.zoom * perspective;

        return {
          x: 368 + x1 * sceneScale,
          y: 282 - y2 * sceneScale
        };
      }

      function pointString(points) {
        return points.map((point) => {
          const p = project(point);
          return p.x.toFixed(1) + "," + p.y.toFixed(1);
        }).join(" ");
      }

      function setLine(element, start, end) {
        const p1 = project(start);
        const p2 = project(end);
        element.setAttribute("x1", p1.x);
        element.setAttribute("y1", p1.y);
        element.setAttribute("x2", p2.x);
        element.setAttribute("y2", p2.y);
      }

      function setPoint(element, point) {
        const p = project(point);
        element.setAttribute("cx", p.x);
        element.setAttribute("cy", p.y);
      }

      function setLabel(element, point, dx, dy) {
        const p = project(point);
        element.setAttribute("x", p.x + dx);
        element.setAttribute("y", p.y + dy);
      }

      function addGridLine(group, start, end) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("class", "grid-line");
        line.dataset.a = start.join(",");
        line.dataset.b = end.join(",");
        group.appendChild(line);
      }

      function buildGrid(group, direction) {
        [-2, -1, 0, 1, 2].forEach((value) => {
          const anchor = scale(direction, value);
          addGridLine(group, add(anchor, [0, 0, zMin]), add(anchor, [0, 0, zMax]));
        });
        [-0.5, 0, 0.5, 1, 1.5, 2, 2.5].forEach((z) => {
          addGridLine(
            group,
            add(scale(direction, -planeExtent), [0, 0, z]),
            add(scale(direction, planeExtent), [0, 0, z])
          );
        });
      }

      function updateGrid(group) {
        group.querySelectorAll("line").forEach((line) => {
          const start = line.dataset.a.split(",").map(Number);
          const end = line.dataset.b.split(",").map(Number);
          setLine(line, start, end);
        });
      }

      buildGrid(elements.gridOne, a);
      buildGrid(elements.gridTwo, b);

      function render() {
        elements.planeOne.setAttribute("points", pointString(planeCorners(a)));
        elements.planeTwo.setAttribute("points", pointString(planeCorners(b)));
        updateGrid(elements.gridOne);
        updateGrid(elements.gridTwo);

        setLine(elements.lineOne, add(P, scale(a, -2.4)), add(P, scale(a, 2.4)));
        setLine(elements.lineTwo, add(Q, scale(b, -2.4)), add(Q, scale(b, 2.4)));
        setLine(elements.normal, [0, 0, zMin], [0, 0, zMax]);
        setPoint(elements.pointP, P);
        setPoint(elements.pointQ, Q);

        const markerSize = 0.24;
        elements.angleOne.setAttribute("points", pointString([
          add(P, scale(aUnit, markerSize)),
          add(add(P, scale(aUnit, markerSize)), scale(nUnit, markerSize)),
          add(P, scale(nUnit, markerSize))
        ]));
        elements.angleTwo.setAttribute("points", pointString([
          add(Q, scale(bUnit, markerSize)),
          add(add(Q, scale(bUnit, markerSize)), scale(nUnit, -markerSize)),
          add(Q, scale(nUnit, -markerSize))
        ]));

        setLabel(elements.labelOne, add(P, scale(a, 1.55)), 10, 14);
        setLabel(elements.labelTwo, add(Q, scale(b, 1.55)), 10, -10);
        setLabel(elements.labelP, P, 10, 18);
        setLabel(elements.labelQ, Q, 10, -8);
        setLabel(elements.labelDistance, [0, 0, 1], 12, 4);
        setLabel(elements.labelNormal, [0, 0, 2.65], 12, -8);
        setLabel(elements.labelPlaneOne, add(scale(a, -1.45), [0, 0, 2.35]), -8, -8);
        setLabel(elements.labelPlaneTwo, add(scale(b, 1.45), [0, 0, 2.35]), 8, -8);
      }

      stage.addEventListener("pointerdown", (event) => {
        state.dragging = true;
        state.lastX = event.clientX;
        state.lastY = event.clientY;
        stage.classList.add("is-dragging");
        stage.setPointerCapture(event.pointerId);
      });

      stage.addEventListener("pointermove", (event) => {
        if (!state.dragging) return;
        const dx = event.clientX - state.lastX;
        const dy = event.clientY - state.lastY;
        state.lastX = event.clientX;
        state.lastY = event.clientY;
        state.yaw += dx * 0.009;
        state.pitch = Math.max(-1.15, Math.min(1.15, state.pitch + dy * 0.009));
        render();
      });

      function stopDrag(event) {
        if (!state.dragging) return;
        state.dragging = false;
        stage.classList.remove("is-dragging");
        if (stage.hasPointerCapture(event.pointerId)) {
          stage.releasePointerCapture(event.pointerId);
        }
      }

      stage.addEventListener("pointerup", stopDrag);
      stage.addEventListener("pointercancel", stopDrag);

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        state.zoom = Math.max(0.65, Math.min(1.45, state.zoom * Math.exp(-event.deltaY * 0.001)));
        render();
      }, { passive: false });

      reset.addEventListener("click", () => {
        state.yaw = 0.35;
        state.pitch = -0.72;
        state.zoom = 1;
        render();
        status.textContent = "视角已重置。";
      });

      render();
    })();
  </script>
</div>
</body>
</html>
