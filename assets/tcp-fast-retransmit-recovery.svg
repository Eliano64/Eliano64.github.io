<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
  <title id="title">TCP 快重传、快恢复与超时的拥塞窗口对比</title>
  <desc id="desc">上半部分解释三个重复 ACK 的计数，下半部分用同一拥塞前窗口 24 MSS 对比超时后窗口降到 1 和三个重复 ACK 后窗口降到新门限 12。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>
  <style>
    svg{background:#f8fafc;color-scheme:light dark}text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.title{font-size:25px;font-weight:700;fill:#172033}.head{font-size:18px;font-weight:700;fill:#172033}.label{font-size:14px;fill:#526174}.small{font-size:12px;fill:#526174}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.soft-blue{fill:#eff6ff;stroke:#2563eb}.soft-red{fill:#fef2f2;stroke:#dc2626}.soft-purple{fill:#f5f3ff;stroke:#7c3aed}.axis{stroke:#94a3b8;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-dasharray:5 5}.common{fill:none;stroke:#2563eb;stroke-width:4}.timeout{fill:none;stroke:#dc2626;stroke-width:3}.fast{fill:none;stroke:#7c3aed;stroke-width:3}.packet{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.lost{stroke:#dc2626;stroke-width:3;stroke-dasharray:6 4}.blue{fill:#2563eb}.red{fill:#b91c1c}.purple{fill:#7c3aed}.orange{fill:#b45309}.dot-blue{fill:#2563eb}.dot-red{fill:#dc2626}.dot-purple{fill:#7c3aed}
    @media(prefers-color-scheme:dark){svg{background:#0b1020}.title,.head{fill:#e5edf5}.label,.small{fill:#a9b7c6}.panel{fill:#121b25;stroke:#344354}.soft-blue{fill:#17345a;stroke:#60a5fa}.soft-red{fill:#3a1717;stroke:#f87171}.soft-purple{fill:#2d2350;stroke:#c4b5fd}.axis{stroke:#526174}.grid{stroke:#243244}.blue{fill:#93c5fd}.red{fill:#fca5a5}.purple{fill:#c4b5fd}.orange{fill:#fdba74}}
  </style>
  <text x="520" y="36" text-anchor="middle" class="title">TCP 快重传与快恢复：3 个重复 ACK 怎样计数</text>

  <rect x="42" y="58" width="956" height="206" rx="12" class="panel"/>
  <text x="190" y="88" text-anchor="middle" class="head">发送方 A</text><text x="850" y="88" text-anchor="middle" class="head">接收方 B</text>
  <line x1="190" y1="96" x2="190" y2="242" class="axis"/><line x1="850" y1="96" x2="850" y2="242" class="axis"/>
  <line x1="190" y1="112" x2="850" y2="126" class="packet"/><text x="520" y="112" text-anchor="middle" class="small">M1、M2 正常到达，返回新的累计 ACK</text>
  <line x1="190" y1="140" x2="500" y2="148" class="lost"/><text x="520" y="151" class="label red">M3 丢失</text>
  <line x1="190" y1="168" x2="850" y2="180" class="packet"/><text x="520" y="168" text-anchor="middle" class="small">M4 到达 → 重复 ACK #1（仍确认 M3 前的字节）</text>
  <line x1="190" y1="194" x2="850" y2="206" class="packet"/><text x="520" y="194" text-anchor="middle" class="small">M5 到达 → 重复 ACK #2</text>
  <line x1="190" y1="220" x2="850" y2="232" class="packet"/><text x="520" y="220" text-anchor="middle" class="small">M6 到达 → 重复 ACK #3，发送方立即重传 M3</text>
  <rect x="698" y="106" width="136" height="50" rx="8" class="soft-red"/><text x="766" y="128" text-anchor="middle" class="head red">计数关键</text><text x="766" y="147" text-anchor="middle" class="small">正常 ACK 不算重复</text>

  <text x="520" y="300" text-anchor="middle" class="title">同一丢包点的 cwnd 处理对比（408 简化规则）</text>
  <rect x="42" y="320" width="956" height="350" rx="12" class="panel"/>
  <line x1="92" y1="600" x2="952" y2="600" class="axis"/><line x1="92" y1="354" x2="92" y2="600" class="axis"/>
  <line x1="92" y1="480" x2="952" y2="480" class="grid"/><line x1="92" y1="360" x2="952" y2="360" class="grid"/>
  <text x="78" y="604" text-anchor="end" class="small">0</text><text x="78" y="484" text-anchor="end" class="small">12</text><text x="78" y="364" text-anchor="end" class="small">24</text><text x="44" y="480" text-anchor="middle" class="label" transform="rotate(-90 44 480)">cwnd（MSS）</text>
  <polyline points="112,520 180,460 248,410 316,385 384,360" class="common"/><circle cx="384" cy="360" r="6" class="dot-blue"/>
  <text x="238" y="344" text-anchor="middle" class="label blue">丢包前逐步增长到 24</text>
  <line x1="384" y1="342" x2="384" y2="610" class="lost"/><text x="384" y="626" text-anchor="middle" class="label red">发现丢包</text>

  <polyline points="384,360 452,590 520,570 588,530 656,480 724,470 792,460" class="timeout"/><circle cx="452" cy="590" r="6" class="dot-red"/>
  <rect x="426" y="382" width="218" height="80" rx="9" class="soft-red"/><text x="535" y="406" text-anchor="middle" class="head red">超时</text><text x="535" y="429" text-anchor="middle" class="label">ssthresh ← 12，cwnd ← 1</text><text x="535" y="450" text-anchor="middle" class="small">重新慢开始：1 → 2 → 4 → 8 → 12</text>

  <polyline points="384,360 452,480 530,470 608,460 686,450 764,440 842,430" class="fast"/><circle cx="452" cy="480" r="6" class="dot-purple"/>
  <rect x="690" y="500" width="250" height="80" rx="9" class="soft-purple"/><text x="815" y="524" text-anchor="middle" class="head purple">3 个重复 ACK</text><text x="815" y="547" text-anchor="middle" class="label">ssthresh ← 12，cwnd ← 12</text><text x="815" y="568" text-anchor="middle" class="small">跳过慢开始，直接拥塞避免</text>

  <line x1="120" y1="642" x2="160" y2="642" class="common"/><text x="172" y="647" class="small">共同增长路径</text><line x1="330" y1="642" x2="370" y2="642" class="timeout"/><text x="382" y="647" class="small">超时路径</text><line x1="500" y1="642" x2="540" y2="642" class="fast"/><text x="552" y="647" class="small">3 个重复 ACK 路径</text>
  <text x="520" y="702" text-anchor="middle" class="label">两种信号都会令 ssthresh 减半；区别是 cwnd 回到 1，还是直接降到新门限</text>
</svg>
