<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-labelledby="title desc">
  <title id="title">用户工具与内核进程控制信息的边界</title>
  <desc id="desc">tasklist 等用户态工具通过系统查询接口取得内核选择性复制的进程属性，不能直接读取内核中的 PCB 或进程对象。</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--fg:#111827;--muted:#64748b;--line:#94a3b8;--blue:#dbeafe;--green:#dcfce7;--red:#fee2e2;--accent:#2563eb;--return:#059669}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#0f172a;--fg:#e5e7eb;--muted:#94a3b8;--line:#64748b;--blue:#1e3a8a;--green:#14532d;--red:#7f1d1d;--accent:#60a5fa;--return:#34d399}}
    .bg{fill:var(--bg)}.box{stroke:var(--line);stroke-width:2}.blue{fill:var(--blue)}.green{fill:var(--green)}.red{fill:var(--red)}
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:var(--fg)}.title{font-size:24px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.small{font-size:16px;fill:var(--muted)}
    .request{stroke:var(--accent);stroke-width:3;fill:none;marker-end:url(#a1)}.return{stroke:var(--return);stroke-width:3;fill:none;marker-end:url(#a2)}.wall{stroke:var(--line);stroke-width:2;stroke-dasharray:7 7}
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--accent)"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--return)"/></marker>
  </defs>
  <rect class="bg" width="980" height="400"/>
  <text class="title" x="490" y="42" text-anchor="middle">CMD 可以查询进程属性，但不能直接读取 PCB</text>

  <rect class="box blue" x="45" y="112" width="230" height="150" rx="12"/>
  <text class="h" x="160" y="151" text-anchor="middle">用户态工具</text>
  <text class="t" x="160" y="188" text-anchor="middle">tasklist / PowerShell</text>
  <text class="small" x="160" y="220" text-anchor="middle">显示 PID、内存、线程数等</text>

  <rect class="box green" x="375" y="112" width="230" height="150" rx="12"/>
  <text class="h" x="490" y="151" text-anchor="middle">系统查询接口</text>
  <text class="t" x="490" y="188" text-anchor="middle">系统调用 / Win32 API</text>
  <text class="small" x="490" y="220" text-anchor="middle">检查权限，整理公开字段</text>

  <line class="wall" x1="655" y1="76" x2="655" y2="318"/>
  <text class="small" x="655" y="344" text-anchor="middle">用户态 / 内核态边界</text>

  <rect class="box red" x="705" y="112" width="230" height="150" rx="12"/>
  <text class="h" x="820" y="151" text-anchor="middle">内核进程对象</text>
  <text class="t" x="820" y="188" text-anchor="middle">PCB / EPROCESS 等</text>
  <text class="small" x="820" y="220" text-anchor="middle">内核地址，普通进程不可访问</text>

  <path class="request" d="M275 158 L375 158"/>
  <path class="request" d="M605 158 L705 158"/>
  <text class="small" x="325" y="143" text-anchor="middle">查询请求</text>
  <text class="small" x="655" y="143" text-anchor="middle">进入内核</text>

  <path class="return" d="M705 246 L605 246"/>
  <path class="return" d="M375 246 L275 246"/>
  <text class="small" x="655" y="281" text-anchor="middle">复制允许公开的字段</text>
  <text class="small" x="325" y="281" text-anchor="middle">格式化显示</text>

  <text class="small" x="490" y="380" text-anchor="middle">工具看到的是接口返回的数据副本，不是内核控制块本体，也不是其全部字段。</text>
</svg>
