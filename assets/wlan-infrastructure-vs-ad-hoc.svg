<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">802.11 基础结构模式与 ad hoc 模式</title>
  <desc id="desc">左侧三个站点都通过接入点通信，接入点连接分布系统和外部网络；右侧三个站点在同一 IBSS 内直接单跳通信，没有接入点。</desc>
  <defs>
    <style>
      :root { --bg:#f8fafc; --panel:#fff; --ink:#172033; --muted:#637187; --line:#64748b; --blue:#2563eb; --green:#059669; --amber:#d97706; --soft:#eaf1fb; }
      @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --panel:#172033; --ink:#e5edf7; --muted:#aab7c8; --line:#94a3b8; --blue:#60a5fa; --green:#34d399; --amber:#fbbf24; --soft:#1f2d42; } }
      text { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; fill:var(--ink); }
      .title { font-size:25px; font-weight:800; }
      .head { font-size:19px; font-weight:750; }
      .body { font-size:15px; }
      .small { font-size:13px; fill:var(--muted); }
      .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
      .node { fill:var(--soft); stroke:var(--blue); stroke-width:2; }
      .ap { fill:var(--panel); stroke:var(--amber); stroke-width:2.5; }
      .wire { fill:none; stroke:var(--line); stroke-width:2.5; }
      .radio { fill:none; stroke:var(--green); stroke-width:2.5; stroke-dasharray:7 6; }
    </style>
  </defs>
  <rect width="1000" height="430" fill="var(--bg)"/>
  <text x="30" y="40" class="title">802.11 的两种组网方式</text>

  <rect x="30" y="65" width="455" height="335" rx="15" class="panel"/>
  <text x="55" y="98" class="head">基础结构模式</text>
  <text x="55" y="122" class="small">所有站点经 AP 转发；AP 可接入 DS 和外部网络</text>
  <rect x="198" y="194" width="116" height="62" rx="11" class="ap"/>
  <text x="256" y="220" text-anchor="middle" class="body" font-weight="750">AP</text>
  <text x="256" y="242" text-anchor="middle" class="small">接入点</text>
  <rect x="62" y="163" width="88" height="48" rx="9" class="node"/>
  <text x="106" y="192" text-anchor="middle" class="body">STA A</text>
  <rect x="62" y="284" width="88" height="48" rx="9" class="node"/>
  <text x="106" y="313" text-anchor="middle" class="body">STA B</text>
  <rect x="362" y="284" width="88" height="48" rx="9" class="node"/>
  <text x="406" y="313" text-anchor="middle" class="body">STA C</text>
  <path d="M150 187 C174 188 186 201 198 214 M150 308 C179 294 196 267 211 252 M362 308 C331 291 315 266 300 252" class="radio"/>
  <rect x="350" y="153" width="96" height="52" rx="9" class="node"/>
  <text x="398" y="176" text-anchor="middle" class="body" font-weight="700">DS</text>
  <text x="398" y="195" text-anchor="middle" class="small">分布系统</text>
  <path d="M314 215 L350 188" class="wire"/>
  <path d="M446 179 L468 179 L468 131" class="wire"/>
  <text x="449" y="119" class="small">外部网络</text>
  <text x="55" y="372" class="small">STA A → AP → STA B，而不是 A 直接向 B 发送数据帧</text>

  <rect x="515" y="65" width="455" height="335" rx="15" class="panel"/>
  <text x="540" y="98" class="head">ad hoc 模式（IBSS）</text>
  <text x="540" y="122" class="small">没有 AP；无线覆盖范围内的站点直接单跳通信</text>
  <rect x="696" y="157" width="94" height="50" rx="9" class="node"/>
  <text x="743" y="187" text-anchor="middle" class="body">STA A</text>
  <rect x="574" y="292" width="94" height="50" rx="9" class="node"/>
  <text x="621" y="322" text-anchor="middle" class="body">STA B</text>
  <rect x="818" y="292" width="94" height="50" rx="9" class="node"/>
  <text x="865" y="322" text-anchor="middle" class="body">STA C</text>
  <path d="M716 207 L648 292 M770 207 L838 292 M668 317 L818 317" class="radio"/>
  <circle cx="743" cy="257" r="26" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="743" y="253" text-anchor="middle" class="small">无</text>
  <text x="743" y="270" text-anchor="middle" class="small">AP</text>
  <text x="540" y="372" class="small">802.11 ad hoc 不负责多跳转发；多跳需要额外路由协议</text>
</svg>

