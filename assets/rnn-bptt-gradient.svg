<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" width="100%" role="img" aria-label="梯度过时间回退的缩放：w=0.5 时变小，w=1.6 时变大">
<style>:root{--bg:#ffffff;--fg:#1b1f23;--muted:#5b6570;--line:#c9d0d8;--weak:#3f74c9;--strong:#c2553f}@media (prefers-color-scheme: dark){:root{--bg:#171b23;--fg:#e8eaee;--muted:#9aa3ad;--line:#3a4149;--weak:#7fa8ee;--strong:#ef9a83}}text{font-family:inherit}.t{font-size:14px;font-weight:600;fill:var(--fg)}.s{font-size:11px;fill:var(--muted)}.p{font-size:11.5px;fill:var(--fg)}.v{font-size:10px;fill:var(--muted)}.vin{font-size:10px;fill:var(--bg)}.ax{font-size:10px;fill:var(--muted)}</style>
<rect x="0" y="0" width="440" height="430" fill="var(--bg)"/>
<text class="t" x="16" y="26">梯度沿时间回退的缩放</text>
<text class="s" x="16" y="44">标量递推 h(t) = w·h(t-1) + x(t)，只对末步求损失</text>
<text class="s" x="16" y="60">回退一步乘 w，回退五步乘 w 的五次方</text>
<text class="p" x="16" y="82">w = 0.5：回退时变小</text>
<line x1="62" y1="92" x2="62" y2="176" stroke="var(--line)" stroke-width="1"/>
<line x1="62" y1="176" x2="404" y2="176" stroke="var(--line)" stroke-width="1"/>
<line x1="62" y1="127.1" x2="404" y2="127.1" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>
<text class="ax" x="56" y="130.6" text-anchor="end">1</text>
<text class="ax" x="56" y="96" text-anchor="end">13</text>
<text class="ax" x="56" y="175" text-anchor="end">0.03</text>
<rect x="75.7" y="174.5" width="29.6" height="1.5" fill="var(--weak)" rx="2"/>
<text class="v" x="90.5" y="169.5" text-anchor="middle">0.031</text>
<text class="ax" x="90.5" y="189.0" text-anchor="middle">t=1</text>
<rect x="132.7" y="165.0" width="29.6" height="11.0" fill="var(--weak)" rx="2"/>
<text class="v" x="147.5" y="160.0" text-anchor="middle">0.062</text>
<text class="ax" x="147.5" y="189.0" text-anchor="middle">t=2</text>
<rect x="189.7" y="155.5" width="29.6" height="20.5" fill="var(--weak)" rx="2"/>
<text class="v" x="204.5" y="150.5" text-anchor="middle">0.12</text>
<text class="ax" x="204.5" y="189.0" text-anchor="middle">t=3</text>
<rect x="246.7" y="146.1" width="29.6" height="29.9" fill="var(--weak)" rx="2"/>
<text class="vin" x="261.5" y="159.1" text-anchor="middle">0.25</text>
<text class="ax" x="261.5" y="189.0" text-anchor="middle">t=4</text>
<rect x="303.7" y="136.6" width="29.6" height="39.4" fill="var(--weak)" rx="2"/>
<text class="vin" x="318.5" y="149.6" text-anchor="middle">0.50</text>
<text class="ax" x="318.5" y="189.0" text-anchor="middle">t=5</text>
<rect x="360.7" y="127.1" width="29.6" height="48.9" fill="var(--weak)" rx="2"/>
<text class="vin" x="375.5" y="140.1" text-anchor="middle">1.00</text>
<text class="ax" x="375.5" y="189.0" text-anchor="middle">t=6</text>
<text class="p" x="16" y="222">w = 1.6：回退时变大</text>
<line x1="62" y1="232" x2="62" y2="334" stroke="var(--line)" stroke-width="1"/>
<line x1="62" y1="334" x2="404" y2="334" stroke="var(--line)" stroke-width="1"/>
<line x1="62" y1="274.6" x2="404" y2="274.6" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>
<text class="ax" x="56" y="278.1" text-anchor="end">1</text>
<text class="ax" x="56" y="236" text-anchor="end">13</text>
<text class="ax" x="56" y="333" text-anchor="end">0.03</text>
<rect x="75.7" y="235.6" width="29.6" height="98.4" fill="var(--strong)" rx="2"/>
<text class="vin" x="90.5" y="248.6" text-anchor="middle">10.49</text>
<text class="ax" x="90.5" y="347.0" text-anchor="middle">t=1</text>
<rect x="132.7" y="243.4" width="29.6" height="90.6" fill="var(--strong)" rx="2"/>
<text class="vin" x="147.5" y="256.4" text-anchor="middle">6.55</text>
<text class="ax" x="147.5" y="347.0" text-anchor="middle">t=2</text>
<rect x="189.7" y="251.2" width="29.6" height="82.8" fill="var(--strong)" rx="2"/>
<text class="vin" x="204.5" y="264.2" text-anchor="middle">4.10</text>
<text class="ax" x="204.5" y="347.0" text-anchor="middle">t=3</text>
<rect x="246.7" y="259.0" width="29.6" height="75.0" fill="var(--strong)" rx="2"/>
<text class="vin" x="261.5" y="272.0" text-anchor="middle">2.56</text>
<text class="ax" x="261.5" y="347.0" text-anchor="middle">t=4</text>
<rect x="303.7" y="266.8" width="29.6" height="67.2" fill="var(--strong)" rx="2"/>
<text class="vin" x="318.5" y="279.8" text-anchor="middle">1.60</text>
<text class="ax" x="318.5" y="347.0" text-anchor="middle">t=5</text>
<rect x="360.7" y="274.6" width="29.6" height="59.4" fill="var(--strong)" rx="2"/>
<text class="vin" x="375.5" y="287.6" text-anchor="middle">1.00</text>
<text class="ax" x="375.5" y="347.0" text-anchor="middle">t=6</text>
<text class="s" x="16" y="362">纵轴是回退到该步时的梯度绝对值，末步取 1</text>
<text class="s" x="16" y="380">对数刻度：等高距离表示相同倍数；回退五步分别乘 0.031 与 10.49</text>
<text class="s" x="16" y="398">换成 tanh 后每步还要乘 1 - h(t) 的平方，上限为 1</text>
<text class="s" x="16" y="416">因此长期依赖的梯度更容易偏小，也可能在 w 较大时放大</text>
</svg>
