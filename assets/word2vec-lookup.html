<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>查表、CBOW 与 Skip-gram 的二维数值</title>
<style>
:root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--line:#c8d0da;--panel:#f4f7fb;
--accent:#3b5bdb;--hi:#e8efff;--keep:#2f66b3;--write:#b44a35}
@media (prefers-color-scheme:dark){:root{--bg:#171b23;--fg:#e6eaf2;--muted:#9aa4b2;--line:#3a4250;
--panel:#1e2430;--accent:#8fa6ff;--hi:#243052;--keep:#7fa8ee;--write:#ef9a83}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{padding:12px;max-width:680px;color:var(--fg);font:13.5px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
h1{font-size:17px;line-height:1.35;margin:0 0 3px}
h2{font-size:13.5px;margin:0 0 5px}
p{margin:5px 0}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
.cap{color:var(--muted);font-size:11.5px;margin:2px 0 4px}
.note{color:var(--muted);font-size:11.5px}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.controls .cap{margin:0}
button,select{font:inherit;font-size:12.5px;padding:4px 9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px}
button{cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px;margin:7px 0;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:7px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.card b{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:2px}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11.5px;overflow-wrap:anywhere}
.vec{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0}
.vec span{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11px;background:var(--panel)}
.row{display:grid;grid-template-columns:58px 1fr;gap:5px;align-items:start;padding:3px 0;border-bottom:1px solid var(--line);font-size:12px}
.row:last-child{border-bottom:0}
.row b{font-size:11px;color:var(--muted);font-weight:500}
table.m{width:100%;border-collapse:collapse;font-size:11.5px}
table.m th,table.m td{border-bottom:1px solid var(--line);padding:2px 4px;text-align:left;overflow-wrap:anywhere}
table.m th{font-weight:600;color:var(--muted)}
table.m td.n,table.m th.n{text-align:right;font-family:ui-monospace,Consolas,"Courier New",monospace;white-space:nowrap}
table.m tr.hi td,table.m tr.hi th{background:var(--hi)}
details{border:1px solid var(--line);border-radius:7px;background:var(--panel);margin:8px 0;padding:0 9px}
details[open]{padding-bottom:7px}
summary{cursor:pointer;font-size:12px;color:var(--muted);padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>查表、CBOW 与 Skip-gram 的二维数值</h1>
<p class="sub">词表 6 个 token，向量维数 2。矩阵行号就是 token ID。以下参数只用于演示计算，不代表训练后的语义。</p>
<div class="controls" role="group" aria-label="计算步骤">
<span class="cap">步骤</span>
<button type="button" class="step" data-step="0" aria-pressed="true">查表</button>
<button type="button" class="step" data-step="1" aria-pressed="false">CBOW</button>
<button type="button" class="step" data-step="2" aria-pressed="false">Skip-gram</button>
<button type="button" class="step" data-step="3" aria-pressed="false">余弦</button>
</div>
<div id="stage"></div>
<details>
<summary>示例参数</summary>
<div class="two">
<div><div class="cap">输入表 E：6×2，行号即 ID</div><table class="m"><thead><tr><th class="n">ID</th><th class="n">token</th><th class="n">E 行</th></tr></thead><tbody id="etab"></tbody></table></div>
<div><div class="cap">输出表 U：6×2，行号即 ID</div><table class="m"><thead><tr><th class="n">ID</th><th class="n">token</th><th class="n">U 行</th></tr></thead><tbody id="utab"></tbody></table></div>
</div>
</details>
<p class="note">两个向量接近由演示参数决定，不能作为语义相似的证据。</p>
<script>
(function(){
  "use strict";
  var T=["小明","今天","想","吃","苹果","香蕉"];
  var E=[[0.8,0.1],[0.2,0.7],[0.6,0.4],[0.1,0.9],[0.9,0.2],[0.75,0.3]];
  var U=[[0.3,-0.2],[-0.1,0.5],[0.7,0.2],[0.2,0.6],[0.5,0.1],[0.4,0]];
  var step=0;
  function f(x){return x.toFixed(3);}
  function p4(x){return x.toFixed(4);}
  function vec(a){return '<div class="vec">'+a.map(function(v){return '<span>'+v+'</span>';}).join('')+'</div>';}
  function row(label,val){return '<div class="row"><b>'+label+'</b><div>'+val+'</div></div>';}
  function table(head,rows,hi){
    var h='<table class="m"><thead><tr>'+head.map(function(x){return '<th class="n">'+x+'</th>';}).join('')+'</tr></thead><tbody>';
    rows.forEach(function(r,i){h+='<tr'+(hi===i?' class="hi"':'')+'>'+r.map(function(x){return '<td class="n">'+x+'</td>';}).join('')+'</tr>';});
    return h+'</tbody></table>';
  }
  function softmax(z){var m=Math.max.apply(null,z);var e=z.map(function(v){return Math.exp(v-m);});var s=e.reduce(function(a,b){return a+b;},0);return e.map(function(v){return v/s;});}
  function scoreAll(U,h){return U.map(function(u){return u[0]*h[0]+u[1]*h[1];});}
  function meanVec(E,idx){var h=[0,0];idx.forEach(function(i){h[0]+=E[i][0];h[1]+=E[i][1];});return h.map(function(v){return v/idx.length;});}
  function cos(a,b){var d=a[0]*b[0]+a[1]*b[1];return d/(Math.hypot(a[0],a[1])*Math.hypot(b[0],b[1]));}
  function lookup(t){
    var oh=[0,0,0,0,0,0];oh[t]=1;
    return '<div class="panel"><h2>查表：用 one-hot 选中 E 的一行</h2>'+
      row('token',T[t]+'，ID '+t)+
      row('one-hot (6 维)',vec(oh))+
      row('E['+t+'] (2 维)',vec([f(E[t][0]),f(E[t][1])]))+
      row('one-hot · E',vec([f(E[t][0]),f(E[t][1])]))+
      '</div>';
  }
  function cbow(){
    var idx=[0,1,3,4],h=meanVec(E,idx),rows=idx.map(function(i){return [T[i],i,'['+f(E[i][0])+', '+f(E[i][1])+']'];});
    var sc=scoreAll(U,h),pr=softmax(sc);
    var rows2=T.map(function(n,i){return [n,i,f(sc[i]),p4(pr[i])];});
    return '<div class="panel"><h2>CBOW：上下文均值预测中心词</h2><p class="note" style="margin:0 0 4px">窗口半径 2，中心词“想”，上下文 4 个。</p>'+
      table(['上下文 token','ID','E 行'],rows)+
      '<p class="mono">h = ('+idx.map(function(i){return '['+f(E[i][0])+', '+f(E[i][1])+']';}).join(' + ')+') / '+idx.length+' = ['+f(h[0])+', '+f(h[1])+']</p>'+
      '<div class="cap">每个词的输出得分与概率；目标 ID 为 2</div>'+table(['token','ID','U h','softmax'],rows2,2)+
      '<p class="mono">p(想) = '+p4(pr[2])+'，L = −ln p(想) = '+p4(-Math.log(pr[2]))+'</p></div>';
  }
  function skip(){
    var c=E[2],sc=scoreAll(U,c),pr=softmax(sc);
    var rows=T.map(function(n,i){return [n,i,f(sc[i]),p4(pr[i])];});
    var tg=[0,1,3,4],tot=0,rows2=tg.map(function(i){tot+=-Math.log(pr[i]);return [T[i],p4(pr[i]),p4(-Math.log(pr[i]))];});
    return '<div class="panel"><h2>Skip-gram：中心词分别预测每个上下文词</h2>'+
      '<p class="mono">中心向量 v(想) = ['+f(c[0])+', '+f(c[1])+']；四个目标共用同一行得分 U v(想)。</p>'+
      '<div class="cap">同一中心词下每个词作为目标的得分与概率</div>'+table(['token','ID','U v(想)','softmax'],rows,2)+
      '<div class="cap">四个上下文目标各自的概率与损失</div>'+table(['目标','p(目标)','−ln p'],rows2)+
      '<p class="mono">四个目标损失之和 = '+p4(tot)+'</p></div>';
  }
  function cosine(){
    var a=E[4],b=E[5],c=cos(a,b);
    return '<div class="panel"><h2>余弦：只比较方向</h2>'+
      row('苹果向量',vec([f(a[0]),f(a[1])]))+
      row('香蕉向量',vec([f(b[0]),f(b[1])]))+
      '<p class="mono">苹果 · 香蕉 = '+f(a[0]*b[0]+a[1]*b[1])+'；|苹果| = '+f(Math.hypot(a[0],a[1]))+'，|香蕉| = '+f(Math.hypot(b[0],b[1]))+'；cos = '+c+'</p>'+
      '<p class="note">cos 接近 1 只说明演示向量方向接近，不能作为语义相似的证据。</p></div>';
  }
  function render(){
    if(step===0){
      document.getElementById('stage').innerHTML=lookup(2)+
        '<div class="controls"><span class="cap">查看其他 token</span><select id="tsel">'+T.map(function(n,i){return '<option value="'+i+'"'+(i===2?' selected':'')+'>'+n+'</option>';}).join('')+'</select></div>';
      bindSel();
    }else if(step===1){document.getElementById('stage').innerHTML=cbow();}
    else if(step===2){document.getElementById('stage').innerHTML=skip();}
    else{document.getElementById('stage').innerHTML=cosine();}
  }
  function bindSel(){
    var s=document.getElementById('tsel');
    if(s)s.addEventListener('change',function(){
      var val=Number(this.value);
      document.getElementById('stage').innerHTML=lookup(val)+
        '<div class="controls"><span class="cap">查看其他 token</span><select id="tsel">'+T.map(function(n,i){return '<option value="'+i+'"'+(i===val?' selected':'')+'>'+n+'</option>';}).join('')+'</select></div>';
      bindSel();
    });
  }
  document.getElementById('etab').innerHTML=T.map(function(n,i){return '<tr><td class="n">'+i+'</td><td class="n">'+n+'</td><td class="n">['+f(E[i][0])+', '+f(E[i][1])+']</td></tr>';}).join('');
  document.getElementById('utab').innerHTML=T.map(function(n,i){return '<tr><td class="n">'+i+'</td><td class="n">'+n+'</td><td class="n">['+f(U[i][0])+', '+f(U[i][1])+']</td></tr>';}).join('');
  window.__modelTest={inputs:{T:T,E:E,U:U,context:[0,1,3,4],center:2},compute:{lookup:function(t){return E[t].slice();},meanVec:meanVec,scoreAll:scoreAll,softmax:softmax,loss:function(p){return -Math.log(p);},cosine:cos}};
  Array.prototype.forEach.call(document.querySelectorAll('.step'),function(b){
    b.addEventListener('click',function(){
      step=Number(b.getAttribute('data-step'));
      Array.prototype.forEach.call(document.querySelectorAll('.step'),function(x){x.setAttribute('aria-pressed',String(x===b));});
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
