<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">文件访问的分层路径</title>
  <desc id="desc">用户进程的文件系统调用依次经过系统调用接口、VFS、具体文件系统、页缓存与块IO层、设备驱动，最后到达存储设备。</desc>
  <style>
    svg{background:#f8fafc}
    @media(prefers-color-scheme:dark){svg{background:#0b1020}}
    :root{--bg:#f8fafc;--fg:#0f172a;--muted:#475569;--line:#94a3b8;--panel:#fff;--blue:#2563eb;--blueFill:#dbeafe;--green:#059669;--greenFill:#d1fae5;--orange:#d97706;--orangeFill:#ffedd5}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#e5e7eb;--muted:#cbd5e1;--line:#64748b;--panel:#111827;--blue:#60a5fa;--blueFill:#172554;--green:#34d399;--greenFill:#052e2b;--orange:#fbbf24;--orangeFill:#422006}}
    .bg{fill:var(--bg)}.box{fill:var(--panel);stroke:var(--line);stroke-width:2}.vfs{fill:var(--blueFill);stroke:var(--blue);stroke-width:3}.cache{fill:var(--greenFill);stroke:var(--green);stroke-width:2}.device{fill:var(--orangeFill);stroke:var(--orange);stroke-width:2}.t{fill:var(--fg);font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.m{fill:var(--muted);font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.a{stroke:var(--blue);stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--blue)"/></marker></defs>
  <rect class="bg" width="1100" height="620"/>
  <text class="t" x="550" y="42" text-anchor="middle" font-size="26" font-weight="700">文件访问的分层路径</text>
  <text class="m" x="550" y="70" text-anchor="middle" font-size="15">VFS 位于内核系统调用接口与具体文件系统之间</text>

  <rect class="box" x="205" y="96" width="690" height="64" rx="10"/>
  <text class="t" x="390" y="124" text-anchor="middle" font-size="18" font-weight="700">用户进程</text>
  <text class="m" x="675" y="124" text-anchor="middle" font-size="15">open / read / write / close</text>
  <text class="m" x="550" y="148" text-anchor="middle" font-size="13">路径名、文件描述符、缓冲区</text>

  <rect class="box" x="205" y="190" width="690" height="58" rx="10"/>
  <text class="t" x="390" y="226" text-anchor="middle" font-size="18" font-weight="700">系统调用接口</text>
  <text class="m" x="675" y="226" text-anchor="middle" font-size="14">进入内核并检查参数</text>

  <rect class="vfs" x="205" y="278" width="690" height="70" rx="10"/>
  <text class="t" x="390" y="309" text-anchor="middle" font-size="20" font-weight="700">VFS</text>
  <text class="m" x="675" y="304" text-anchor="middle" font-size="14">统一的 file / dentry / inode / superblock 对象</text>
  <text class="m" x="675" y="328" text-anchor="middle" font-size="14">把通用操作分派给具体文件系统</text>

  <rect class="box" x="205" y="378" width="690" height="64" rx="10"/>
  <text class="t" x="390" y="407" text-anchor="middle" font-size="18" font-weight="700">具体文件系统</text>
  <text class="m" x="675" y="404" text-anchor="middle" font-size="14">ext4 / FAT / NTFS</text>
  <text class="m" x="675" y="427" text-anchor="middle" font-size="14">目录、权限、块映射、空闲空间</text>

  <rect class="cache" x="205" y="472" width="690" height="58" rx="10"/>
  <text class="t" x="390" y="508" text-anchor="middle" font-size="18" font-weight="700">页缓存与块 I/O 层</text>
  <text class="m" x="675" y="508" text-anchor="middle" font-size="14">缓存文件页，生成块设备请求</text>

  <rect class="device" x="205" y="560" width="690" height="46" rx="10"/>
  <text class="t" x="390" y="589" text-anchor="middle" font-size="17" font-weight="700">设备驱动与存储设备</text>
  <text class="m" x="675" y="589" text-anchor="middle" font-size="14">提交并完成实际读写</text>

  <path class="a" d="M550 160 V188"/><path class="a" d="M550 248 V276"/><path class="a" d="M550 348 V376"/><path class="a" d="M550 442 V470"/><path class="a" d="M550 530 V558"/>
</svg>
