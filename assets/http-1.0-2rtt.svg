<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1120" viewBox="0 0 1100 1120" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 1.0 非持续连接传送多个对象</title>
  <desc id="desc">每个对象使用一条TCP连接。中间连接的挥手与下一条连接的建立同时进行，图中只画建立过程；最后一个对象传完后，完整画出最后一条连接的四次挥手。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker>
  </defs>
  <style>
    svg{color-scheme:light dark}
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.actor{fill:#fff;stroke-width:2}.client{stroke:#059669}.server{stroke:#2563eb}
    .title{fill:#172033;font-size:26px;font-weight:700}.head{fill:#172033;font-size:18px;font-weight:700}.label{fill:#526174;font-size:14px}.small{fill:#526174;font-size:13px}
    .blue{fill:#2563eb}.green{fill:#059669}.orange{fill:#b45309}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:5 5}
    .tcp{stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow-blue)}.response{stroke:#059669;stroke-width:3;marker-end:url(#arrow-green)}.close{stroke:#d97706;stroke-width:2.5;marker-end:url(#arrow-orange)}
    .note{fill:#fff7ed;stroke:#d97706;stroke-width:1.5}.note-text{fill:#9a5a08;font-size:14px;font-weight:700}.divider{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:7 5}
    @media(prefers-color-scheme:dark){
      .bg{fill:#0b1020}.panel,.actor{fill:#121b25;stroke:#344354}.client{stroke:#34d399}.server{stroke:#60a5fa}
      .title,.head{fill:#e5edf5}.label,.small{fill:#a9b7c6}.blue{fill:#93c5fd}.green{fill:#6ee7b7}.orange{fill:#fdba74}.life{stroke:#526174}.divider{stroke:#344354}
      .note{fill:#362616;stroke:#f59e0b}.note-text{fill:#fdba74}
    }
  </style>

  <rect class="bg" width="1100" height="1120"/>
  <text x="550" y="38" text-anchor="middle" class="title">HTTP/1.0 非持续连接：多个对象依次使用不同连接</text>

  <rect x="75" y="60" width="240" height="58" rx="10" class="actor client"/>
  <text x="195" y="87" text-anchor="middle" class="head">浏览器</text>
  <text x="195" y="108" text-anchor="middle" class="label">HTTP 客户</text>
  <rect x="785" y="60" width="240" height="58" rx="10" class="actor server"/>
  <text x="905" y="87" text-anchor="middle" class="head">Web 服务器</text>
  <text x="905" y="108" text-anchor="middle" class="label">TCP 80</text>
  <line x1="195" y1="118" x2="195" y2="1090" class="life"/>
  <line x1="905" y1="118" x2="905" y2="1090" class="life"/>

  <rect x="45" y="140" width="1010" height="230" rx="14" class="panel"/>
  <text x="72" y="171" class="head blue">连接 1：传送基本 HTML</text>
  <text x="72" y="203" class="small">建立连接</text>
  <line x1="195" y1="194" x2="905" y2="206" class="tcp"/><text x="550" y="193" text-anchor="middle" class="label">SYN</text>
  <line x1="905" y1="224" x2="195" y2="236" class="tcp"/><text x="550" y="223" text-anchor="middle" class="label">SYN + ACK</text>
  <line x1="195" y1="254" x2="905" y2="266" class="tcp"/><text x="550" y="253" text-anchor="middle" class="label">ACK</text>
  <line x1="195" y1="298" x2="905" y2="310" class="tcp"/><text x="550" y="297" text-anchor="middle" class="head blue">GET /index.html</text>
  <line x1="905" y1="338" x2="195" y2="350" class="response"/><text x="550" y="336" text-anchor="middle" class="head green">200 OK + 基本 HTML</text>

  <rect x="45" y="394" width="1010" height="250" rx="14" class="panel"/>
  <text x="72" y="425" class="head blue">连接 2：传送第一个引用对象</text>
  <rect x="665" y="405" width="350" height="32" rx="8" class="note"/>
  <text x="840" y="426" text-anchor="middle" class="note-text">连接 1 同时挥手，图中省略</text>
  <line x1="195" y1="454" x2="905" y2="466" class="tcp"/><text x="550" y="453" text-anchor="middle" class="label">SYN</text>
  <line x1="905" y1="484" x2="195" y2="496" class="tcp"/><text x="550" y="483" text-anchor="middle" class="label">SYN + ACK</text>
  <line x1="195" y1="514" x2="905" y2="526" class="tcp"/><text x="550" y="513" text-anchor="middle" class="label">ACK</text>
  <line x1="195" y1="558" x2="905" y2="570" class="tcp"/><text x="550" y="557" text-anchor="middle" class="head blue">GET /image-1.png</text>
  <line x1="905" y1="604" x2="195" y2="616" class="response"/><text x="550" y="602" text-anchor="middle" class="head green">200 OK + 引用对象 1</text>

  <line x1="90" y1="672" x2="1010" y2="672" class="divider"/>
  <text x="550" y="698" text-anchor="middle" class="head">⋮　其余对象重复“建立新连接 → 请求 → 响应”　⋮</text>
  <line x1="90" y1="718" x2="1010" y2="718" class="divider"/>

  <rect x="45" y="742" width="1010" height="348" rx="14" class="panel"/>
  <text x="72" y="773" class="head blue">最后一条连接：传送最后一个引用对象</text>
  <rect x="665" y="753" width="350" height="32" rx="8" class="note"/>
  <text x="840" y="774" text-anchor="middle" class="note-text">上一条连接同时挥手，图中省略</text>
  <line x1="195" y1="802" x2="905" y2="814" class="tcp"/><text x="550" y="801" text-anchor="middle" class="label">SYN</text>
  <line x1="905" y1="832" x2="195" y2="844" class="tcp"/><text x="550" y="831" text-anchor="middle" class="label">SYN + ACK</text>
  <line x1="195" y1="862" x2="905" y2="874" class="tcp"/><text x="550" y="861" text-anchor="middle" class="label">ACK</text>
  <line x1="195" y1="906" x2="905" y2="918" class="tcp"/><text x="550" y="905" text-anchor="middle" class="head blue">GET /last-object</text>
  <line x1="905" y1="946" x2="195" y2="958" class="response"/><text x="550" y="944" text-anchor="middle" class="head green">200 OK + 最后一个对象</text>

  <text x="72" y="983" class="small orange">没有下一条连接：完整关闭最后一条连接</text>
  <line x1="905" y1="1000" x2="195" y2="1010" class="close"/><text x="550" y="999" text-anchor="middle" class="label orange">FIN</text>
  <line x1="195" y1="1025" x2="905" y2="1035" class="close"/><text x="550" y="1024" text-anchor="middle" class="label orange">ACK</text>
  <line x1="195" y1="1050" x2="905" y2="1060" class="close"/><text x="440" y="1049" text-anchor="middle" class="label orange">FIN</text>
  <line x1="905" y1="1075" x2="195" y2="1085" class="close"/><text x="660" y="1074" text-anchor="middle" class="label orange">ACK</text>

  <text x="550" y="1110" text-anchor="middle" class="small">中间连接并非不关闭；只是它们的挥手与下一次建连重叠，所以不重复画出。</text>
</svg>
