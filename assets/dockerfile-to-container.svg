<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="400" viewBox="0 0 1160 400" role="img" aria-labelledby="title desc">
  <title id="title">从 Dockerfile 到容器</title>
  <desc id="desc">docker build 把项目目录里的 Dockerfile 和源代码构建成镜像，docker run 再由镜像启动容器，映射端口后可以从宿主机浏览器访问。</desc>
  <style>/* paired-theme-canvas */
svg{background:#f8fafc}
@media(prefers-color-scheme:dark){svg{background:#0b1020}}
:root{color-scheme:light dark}
.bg{fill:#f8fafc}
.text{fill:#0f172a;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:18px}
.title{font-size:25px;font-weight:700}
.small{fill:#334155;font-size:15px}
.box-a{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
.box-b{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
.box-c{fill:#fed7aa;stroke:#f97316;stroke-width:2}
.arrow{stroke:#64748b;stroke-width:2.6;fill:none;marker-end:url(#arr)}
.head{fill:#64748b}
.label{fill:#0369a1;font-size:14px;font-weight:700}
@media(prefers-color-scheme:dark){
  .bg{fill:#020617}
  .text{fill:#e5e7eb}
  .small{fill:#cbd5e1}
  .box-a{fill:#172554;stroke:#60a5fa}
  .box-b{fill:#052e16;stroke:#4ade80}
  .box-c{fill:#431407;stroke:#fb923c}
  .arrow{stroke:#94a3b8}
  .head{fill:#94a3b8}
  .label{fill:#67e8f9}
}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1160" height="400"/>
  <text class="text title" x="580" y="48" text-anchor="middle">从 Dockerfile 到容器</text>

  <rect class="box-a" x="40" y="120" width="260" height="150" rx="10"/>
  <text class="text" x="170" y="158" text-anchor="middle" font-weight="700">项目目录</text>
  <text class="text small" x="170" y="192" text-anchor="middle">Dockerfile</text>
  <text class="text small" x="170" y="218" text-anchor="middle">app.py</text>
  <text class="text small" x="170" y="244" text-anchor="middle">requirements.txt</text>

  <path class="arrow" d="M312 195 L424 195"/>
  <text class="text label" x="368" y="152" text-anchor="middle">docker build</text>
  <text class="text label" x="368" y="174" text-anchor="middle">-t my-flask-app .</text>

  <rect class="box-b" x="440" y="120" width="250" height="150" rx="10"/>
  <text class="text" x="565" y="180" text-anchor="middle" font-weight="700">镜像 image</text>
  <text class="text small" x="565" y="212" text-anchor="middle">my-flask-app</text>
  <text class="text small" x="565" y="240" text-anchor="middle">只读模板</text>

  <path class="arrow" d="M702 195 L814 195"/>
  <text class="text label" x="758" y="152" text-anchor="middle">docker run -d</text>
  <text class="text label" x="758" y="174" text-anchor="middle">-p 8000:5000</text>

  <rect class="box-c" x="830" y="120" width="270" height="150" rx="10"/>
  <text class="text" x="965" y="180" text-anchor="middle" font-weight="700">容器 container</text>
  <text class="text small" x="965" y="212" text-anchor="middle">my-flask-server</text>
  <text class="text small" x="965" y="240" text-anchor="middle">运行中的实例</text>

  <path class="arrow" d="M965 270 L965 330"/>
  <text class="text" x="965" y="362" text-anchor="middle">宿主机浏览器访问 127.0.0.1:8000</text>
</svg>
