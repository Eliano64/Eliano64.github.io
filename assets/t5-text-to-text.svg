<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d">
  <title id="t">T5 用文本到文本统一任务</title>
  <desc id="d">过去分类、翻译、摘要、问答各用不同任务头；T5 把任务前缀写进输入，所有任务都由同一个编码器解码器生成文本。</desc>
  <style>
    :root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--line:#c8d0da;--panel:#f6f8fc;--accent:#3b5bdb;--hi:#e8efff;--old:#fdecea;--old2:#c05050;--new:#e8f5ec;--new2:#3f8f5a;--box:#ffffff}
    @media (prefers-color-scheme:dark){:root{--bg:#232d3b;--fg:#ffffff;--muted:#dbe3ef;--line:#8d9bb1;--panel:#313e52;--accent:#a8bcff;--hi:#34445e;--old:#3d2929;--old2:#e09a9a;--new:#263d2e;--new2:#8fd3a5;--box:#38475c}}
    text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
    .box{fill:var(--box);stroke:var(--line);stroke-width:1}
    .panel{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .old{fill:var(--old);stroke:var(--old2);stroke-width:1.3}
    .new{fill:var(--new);stroke:var(--new2);stroke-width:1.3}
    .hi{fill:var(--hi);stroke:var(--accent);stroke-width:1.4}
    .ttl{font-size:15px;font-weight:700}
    .lbl{font-size:11px}
    .sm{font-size:9.5px;fill:var(--muted)}
    .arw{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"/></marker></defs>
  <rect width="1000" height="460" fill="var(--bg)"/>
  <text class="ttl" x="24" y="32">T5：把所有任务统一为 text-to-text</text>
  <text class="sm" x="24" y="50">任务类型由输入前缀表达，同一个编码器解码器生成输出</text>

  <!-- old -->
  <rect class="panel" x="24" y="75" width="330" height="330" rx="9"/>
  <text class="lbl" x="38" y="100">过去：不同任务，不同任务头</text>

  <g>
    <rect class="box" x="42" y="120" width="125" height="40" rx="5"/><text class="sm" x="54" y="138">这部 电影 真不错</text>
    <path class="arw" d="M167,140 L195,140"/>
    <rect class="old" x="198" y="120" width="80" height="40" rx="5"/><text class="sm" x="210" y="145">分类头</text>
    <path class="arw" d="M278,140 L306,140"/>
    <rect class="box" x="309" y="120" width="34" height="40" rx="5"/><text class="sm" x="318" y="145">+</text>
  </g>
  <g>
    <rect class="box" x="42" y="195" width="125" height="40" rx="5"/><text class="sm" x="50" y="213">The house is ...</text>
    <path class="arw" d="M167,215 L195,215"/>
    <rect class="old" x="198" y="195" width="80" height="40" rx="5"/><text class="sm" x="206" y="220">生成头</text>
    <path class="arw" d="M278,215 L306,215"/>
    <rect class="box" x="309" y="195" width="34" height="40" rx="5"/><text class="sm" x="314" y="220">德语</text>
  </g>
  <g>
    <rect class="box" x="42" y="270" width="125" height="40" rx="5"/><text class="sm" x="50" y="288">阿里 是 哪年 成立</text>
    <path class="arw" d="M167,290 L195,290"/>
    <rect class="old" x="198" y="270" width="80" height="40" rx="5"/><text class="sm" x="206" y="295">问答头</text>
    <path class="arw" d="M278,290 L306,290"/>
    <rect class="box" x="309" y="270" width="34" height="40" rx="5"/><text class="sm" x="314" y="295">1999</text>
  </g>
  <text class="sm" x="42" y="350">每个任务单独设计输出结构，参数与训练流程难以共享。</text>

  <!-- new -->
  <rect class="panel" x="380" y="75" width="596" height="330" rx="9"/>
  <text class="lbl" x="394" y="100">现在：同一个模型，任务写在输入前缀里</text>

  <rect class="hi" x="394" y="120" width="568" height="42" rx="6"/>
  <text class="sm" x="406" y="138">输入：任务前缀 + 文本</text>
  <g>
    <rect class="new" x="406" y="145" width="120" height="12" rx="3"/><text class="sm" x="412" y="155">sst2 sentence:</text>
    <rect class="new" x="536" y="145" width="180" height="12" rx="3"/><text class="sm" x="544" y="155">translate English to German:</text>
    <rect class="new" x="726" y="145" width="110" height="12" rx="3"/><text class="sm" x="734" y="155">summarize:</text>
  </g>

  <rect class="box" x="420" y="190" width="120" height="150" rx="7"/><text class="lbl" x="442" y="216">Encoder</text>
  <text class="sm" x="438" y="238">双向</text>
  <text class="sm" x="438" y="254">上下文</text>
  <rect class="box" x="560" y="190" width="120" height="150" rx="7"/><text class="lbl" x="582" y="216">Decoder</text>
  <text class="sm" x="576" y="238">Cross-Attn</text>
  <text class="sm" x="576" y="254">逐 Token</text>
  <path class="arw" d="M540,250 L560,250"/>
  <path class="arw" d="M680,250 L720,250"/>
  <rect class="new" x="724" y="225" width="190" height="50" rx="6"/><text class="lbl" x="738" y="246">输出文本</text>
  <text class="sm" x="738" y="264">positive / 德语 / 摘要 / 答案</text>

  <text class="sm" x="394" y="360">任务格式统一；但新任务通常仍需要训练数据，统一格式不等于无需适配。</text>
</svg>
