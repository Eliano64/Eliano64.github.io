<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">一次访存的完整路径</title>
  <desc id="desc">CPU 先通过 TLB 或页表把虚拟地址转换为物理地址；若发生缺页，操作系统从辅存调页到主存并重启访问。得到物理地址后查询 Cache，命中时直接返回，未命中时访问主存并填充 Cache。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <style>
      svg{background:#f8fafc}
      .panel{fill:#ffffff;stroke:#d5deea;stroke-width:2}
      .osBand{fill:#fffaf0;stroke:#f2c36b;stroke-width:1.6;stroke-dasharray:7 6}
      .title{font:700 30px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:500 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .phase{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .phaseHint{font:500 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .head{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a;text-anchor:middle}
      .body{font:500 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569;text-anchor:middle}
      .decision{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a;text-anchor:middle}
      .edgeLabel{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569;text-anchor:middle}
      .badgeText{font:700 13px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle}
      .node{stroke-width:2}
      .cpu{fill:#eff6ff;stroke:#3b82f6}
      .tlb{fill:#ecfdf5;stroke:#10b981}
      .table{fill:#f8fafc;stroke:#94a3b8}
      .address{fill:#eef2ff;stroke:#6366f1}
      .memory{fill:#fff7ed;stroke:#f59e0b}
      .storage{fill:#f5f3ff;stroke:#8b5cf6}
      .fault{fill:#fff1f2;stroke:#f43f5e}
      .result{fill:#ecfeff;stroke:#06b6d4}
      .decisionShape{fill:#ffffff;stroke:#64748b;stroke-width:2}
      .flow{fill:none;stroke:#475569;stroke-width:2.6;marker-end:url(#arrow)}
      .primaryFlow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}
      .retry{fill:none;stroke:#d97706;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .hardwareBadge{fill:#e0f2fe;stroke:#7dd3fc}
      .osBadge{fill:#ffedd5;stroke:#fdba74}
      .hardwareText{fill:#0369a1}
      .osText{fill:#c2410c}
      @media(prefers-color-scheme:dark){
        svg{background:#0b1020}
        .panel{fill:#111827;stroke:#334155}
        .osBand{fill:#2a2115;stroke:#a16207}
        .title,.phase,.head,.decision{fill:#f8fafc}
        .subtitle,.phaseHint,.body,.edgeLabel{fill:#cbd5e1}
        .cpu{fill:#172554;stroke:#60a5fa}
        .tlb{fill:#12372a;stroke:#34d399}
        .table{fill:#1f2937;stroke:#64748b}
        .address{fill:#252556;stroke:#818cf8}
        .memory{fill:#3b2a12;stroke:#fbbf24}
        .storage{fill:#2e1f4f;stroke:#a78bfa}
        .fault{fill:#3b1d27;stroke:#fb7185}
        .result{fill:#14343a;stroke:#22d3ee}
        .decisionShape{fill:#1f2937;stroke:#94a3b8}
        .flow{stroke:#cbd5e1}
        .primaryFlow{stroke:#60a5fa}
        .retry{stroke:#fbbf24}
        #arrow path{fill:#cbd5e1}
        #arrowBlue path{fill:#60a5fa}
        .hardwareBadge{fill:#17324d;stroke:#38bdf8}
        .osBadge{fill:#432813;stroke:#fb923c}
        .hardwareText{fill:#7dd3fc}
        .osText{fill:#fdba74}
      }
    </style>
  </defs>

  <text class="title" x="48" y="54">一次访存：先转换地址，再访问数据</text>
  <text class="subtitle" x="48" y="84">TLB 与页表负责找到物理地址；Cache 与主存负责返回目标数据。</text>

  <rect class="panel" x="40" y="110" width="1120" height="480" rx="20"/>
  <text class="phase" x="70" y="151">① 地址转换</text>
  <text class="phaseHint" x="214" y="151">虚拟地址 → 物理地址</text>
  <rect class="hardwareBadge" x="1018" y="128" width="108" height="30" rx="15"/>
  <text class="badgeText hardwareText" x="1072" y="148">硬件完成</text>

  <rect class="node cpu" x="72" y="196" width="168" height="76" rx="14"/>
  <text class="head" x="156" y="226">CPU</text>
  <text class="body" x="156" y="250">产生虚拟地址</text>

  <polygon class="decisionShape" points="370,184 454,234 370,284 286,234"/>
  <text class="decision" x="370" y="229">TLB</text>
  <text class="body" x="370" y="251">命中？</text>

  <rect class="node address" x="904" y="196" width="208" height="76" rx="14"/>
  <text class="head" x="1008" y="226">物理地址</text>
  <text class="body" x="1008" y="250">页框号 + 页内偏移</text>

  <rect class="node table" x="282" y="325" width="176" height="72" rx="14"/>
  <text class="head" x="370" y="353">查询页表</text>
  <text class="body" x="370" y="377">读取对应页表项</text>

  <polygon class="decisionShape" points="590,311 680,361 590,411 500,361"/>
  <text class="decision" x="590" y="356">页在主存？</text>
  <text class="body" x="590" y="379">页表项是否有效</text>

  <rect class="node tlb" x="738" y="325" width="176" height="72" rx="14"/>
  <text class="head" x="826" y="353">写入 TLB</text>
  <text class="body" x="826" y="377">缓存页表项</text>

  <path class="primaryFlow" d="M240 234 H280"/>
  <path class="primaryFlow" d="M454 234 H896"/>
  <text class="edgeLabel" x="672" y="219">命中</text>
  <path class="flow" d="M370 284 V317"/>
  <text class="edgeLabel" x="418" y="307">未命中</text>
  <path class="flow" d="M458 361 H492"/>
  <path class="flow" d="M680 361 H730"/>
  <text class="edgeLabel" x="705" y="345">是</text>
  <path class="primaryFlow" d="M914 361 H946 V280"/>

  <rect class="osBand" x="470" y="430" width="664" height="110" rx="16"/>
  <rect class="osBadge" x="962" y="443" width="146" height="28" rx="14"/>
  <text class="badgeText osText" x="1035" y="462">操作系统参与</text>

  <rect class="node fault" x="500" y="480" width="168" height="46" rx="12"/>
  <text class="head" x="584" y="509">发生缺页</text>

  <rect class="node storage" x="736" y="480" width="150" height="46" rx="12"/>
  <text class="head" x="811" y="509">辅存</text>

  <rect class="node memory" x="954" y="480" width="150" height="46" rx="12"/>
  <text class="head" x="1029" y="509">调入主存</text>

  <path class="flow" d="M590 411 V472"/>
  <text class="edgeLabel" x="610" y="444">否</text>
  <path class="flow" d="M668 503 H728"/>
  <text class="edgeLabel" x="698" y="470">读取目标页</text>
  <path class="flow" d="M886 503 H946"/>
  <path class="retry" d="M1029 526 V558 H156 V280"/>
  <text class="edgeLabel" x="593" y="578">更新页表后，重启本次访存</text>

  <rect class="panel" x="40" y="615" width="1120" height="285" rx="20"/>
  <text class="phase" x="70" y="656">② 数据访问</text>
  <text class="phaseHint" x="214" y="656">用物理地址查询 Cache</text>
  <rect class="hardwareBadge" x="1018" y="633" width="108" height="30" rx="15"/>
  <text class="badgeText hardwareText" x="1072" y="653">硬件完成</text>

  <rect class="node address" x="70" y="700" width="180" height="72" rx="14"/>
  <text class="head" x="160" y="728">物理地址</text>
  <text class="body" x="160" y="752">定位 Cache 块</text>

  <polygon class="decisionShape" points="380,686 466,736 380,786 294,736"/>
  <text class="decision" x="380" y="731">Cache</text>
  <text class="body" x="380" y="753">命中？</text>

  <rect class="node memory" x="525" y="803" width="170" height="62" rx="14"/>
  <text class="head" x="610" y="829">访问主存</text>
  <text class="body" x="610" y="850">读取对应主存块</text>

  <rect class="node tlb" x="750" y="803" width="170" height="62" rx="14"/>
  <text class="head" x="835" y="829">填充 Cache</text>
  <text class="body" x="835" y="850">同时返回目标数据</text>

  <rect class="node result" x="930" y="700" width="182" height="72" rx="14"/>
  <text class="head" x="1021" y="728">返回 CPU</text>
  <text class="body" x="1021" y="752">得到指令或数据</text>

  <path class="primaryFlow" d="M250 736 H286"/>
  <path class="primaryFlow" d="M466 736 H922"/>
  <text class="edgeLabel" x="691" y="720">命中</text>
  <path class="flow" d="M380 786 V834 H517"/>
  <text class="edgeLabel" x="438" y="817">未命中</text>
  <path class="flow" d="M695 834 H742"/>
  <path class="primaryFlow" d="M920 834 H1021 V780"/>
</svg>
