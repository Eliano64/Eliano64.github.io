<line x1="256.6" y1="352" x2="256.6" y2="357" stroke="var(--line)" stroke-width="1"/>
<line x1="397.2" y1="352" x2="397.2" y2="357" stroke="var(--line)" stroke-width="1"/>
<line x1="116" y1="352" x2="398" y2="352" stroke="var(--line)" stroke-width="1"/>
<line x1="116" y1="492" x2="398" y2="492" stroke="var(--line)" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
<line x1="116" y1="492" x2="270.8" y2="492" stroke="var(--bar)" stroke-width="8" stroke-linecap="round"/>
<circle cx="458" cy="492" r="4" fill="var(--hit)"/>
