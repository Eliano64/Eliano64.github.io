<line x1="116" y1="534" x2="398" y2="534" stroke="var(--line)" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
<line x1="116" y1="534" x2="398.0" y2="534" stroke="var(--bar)" stroke-width="8" stroke-linecap="round"/>
<line x1="116" y1="555" x2="398" y2="555" stroke="var(--line)" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
<line x1="116" y1="555" x2="358.7" y2="555" stroke="var(--bar)" stroke-width="8" stroke-linecap="round"/>
<circle cx="458" cy="555" r="4" fill="var(--hit)"/>
<line x1="116" y1="576" x2="398" y2="576" stroke="var(--line)" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
<line x1="116" y1="576" x2="351.5" y2="576" stroke="var(--bar)" stroke-width="8" stroke-linecap="round"/>
<circle cx="458" cy="576" r="4" fill="var(--hit)"/>
<line x1="116" y1="597" x2="398" y2="597" stroke="var(--line)" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
<line x1="116" y1="597" x2="301.3" y2="597" stroke="var(--bar)" stroke-width="8" stroke-linecap="round"/>
</svg>