<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>加深网络反而变差：退化现象</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;
--in:#dbe7ff; --inS:#2f5bb7; --param:#ece0ff; --paramS:#6b46c1;
--state:#e9edf3; --stateS:#4a5568; --out:#d9f2e2; --outS:#2f7a4f;
--cur:#ffe6c7; --curS:#b45309; --accent:#2f5bb7;
}
@media (prefers-color-scheme:dark){:root{
--bg:#14181f; --panel:#1c222b; --fg:#e8ecf3; --muted:#9aa4b2; --line:#39424f;
--in:#1f3149; --inS:#8fb0ef; --param:#2d2350; --paramS:#b49af0;
--state:#262d38; --stateS:#aab4c2; --out:#1e3a2b; --outS:#87c9a2;
--cur:#4a3418; --curS:#f0b26b; --accent:#8fb0ef;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>加深网络反而变差：退化现象</h1><p class="sub">普通网络从 20 层到 56 层训练误差由 8.6 升到 13.2；残差网络从 7.7 降到 7.4</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="加深网络反而变差：退化现象"><rect x="0" y="0" width="1100" height="620" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wp{stroke:var(--paramS);stroke-width:2.2;fill:none;marker-end:url(#arp)}
.ws{stroke:var(--stateS);stroke-width:2.2;fill:none;marker-end:url(#ars)}
.wout{stroke:var(--outS);stroke-width:2.2;fill:none;marker-end:url(#aro)}
.wcur{stroke:var(--curS);stroke-width:2.2;fill:none;marker-end:url(#arc)}
.win{stroke:var(--inS);stroke-width:2.2;fill:none;marker-end:url(#ari)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}
</style><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="arp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--paramS)"/></marker>
<marker id="ars" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--stateS)"/></marker>
<marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--outS)"/></marker>
<marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--curS)"/></marker>
<marker id="ari" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--inS)"/></marker></defs><text class="tt" x="28" y="52">加深网络反而变差：退化现象</text><text class="ss" x="28" y="80">普通网络从 20 层到 56 层训练误差由 8.6 升到 13.2；残差网络从 7.7 降到 7.4</text><path d="M130,470 L750,470" stroke="var(--line)" stroke-width="1.4"/><path d="M130,470 L130,150" stroke="var(--line)" stroke-width="1.4"/><path d="M130.0,470 L130.0,476" stroke="var(--muted)" stroke-width="1"/><text class="sm" x="130.0" y="494" text-anchor="middle">20</text><path d="M130.0,470 L130.0,150" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><path d="M336.7,470 L336.7,476" stroke="var(--muted)" stroke-width="1"/><text class="sm" x="336.7" y="494" text-anchor="middle">32</text><path d="M336.7,470 L336.7,150" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><path d="M543.3,470 L543.3,476" stroke="var(--muted)" stroke-width="1"/><text class="sm" x="543.3" y="494" text-anchor="middle">44</text><path d="M543.3,470 L543.3,150" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><path d="M750.0,470 L750.0,476" stroke="var(--muted)" stroke-width="1"/><text class="sm" x="750.0" y="494" text-anchor="middle">56</text><path d="M750.0,470 L750.0,150" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="440.0" y="520" text-anchor="middle">网络深度（层）</text><text class="sm" x="70" y="310.0" transform="rotate(-90 70,310.0)" text-anchor="middle">训练误差（%）</text><text class="sm" x="118" y="475.0" text-anchor="end">6</text><path d="M130,470.0 L750,470.0" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="118" y="395.0" text-anchor="end">8</text><path d="M130,390.0 L750,390.0" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="118" y="315.0" text-anchor="end">10</text><path d="M130,310.0 L750,310.0" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="118" y="235.0" text-anchor="end">12</text><path d="M130,230.0 L750,230.0" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="118" y="155.0" text-anchor="end">14</text><path d="M130,150.0 L750,150.0" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><polyline points="130.0,366.0 336.7,306.0 543.3,246.0 750.0,182.0" fill="none" stroke="var(--curS)" stroke-width="3"/><circle cx="130.0" cy="366.0" r="5" fill="var(--curS)"/><circle cx="336.7" cy="306.0" r="5" fill="var(--curS)"/><circle cx="543.3" cy="246.0" r="5" fill="var(--curS)"/><circle cx="750.0" cy="182.0" r="5" fill="var(--curS)"/><polyline points="130.0,402.0 336.7,406.0 543.3,410.0 750.0,414.0" fill="none" stroke="var(--outS)" stroke-width="3"/><circle cx="130.0" cy="402.0" r="5" fill="var(--outS)"/><circle cx="336.7" cy="406.0" r="5" fill="var(--outS)"/><circle cx="543.3" cy="410.0" r="5" fill="var(--outS)"/><circle cx="750.0" cy="414.0" r="5" fill="var(--outS)"/><rect x="800" y="150" width="270" height="80" rx="10" fill="var(--panel)" stroke="var(--line)"/><text class="sm" x="814" y="172">图例</text><path d="M814,189 L846,189" stroke="var(--curS)" stroke-width="3" stroke-dasharray=""/><text class="sm" x="856" y="194">普通网络：8.6 → 13.2</text><path d="M814,215 L846,215" stroke="var(--outS)" stroke-width="3" stroke-dasharray=""/><text class="sm" x="856" y="220">残差网络：7.7 → 7.4</text><text class="sm" x="820" y="250">加深反而更差，</text><text class="sm" x="820" y="272">不能只用「更深更强」解释。</text><text class="sm" x="820" y="300">两条线都是示意，</text><text class="sm" x="820" y="322">趋势取自退化现象的报道。</text><rect x="30" y="556" width="1040" height="46" rx="10" fill="var(--state)" opacity="0.55"/><text class="sm" x="46" y="584">结论：退化不是过拟合（训练误差也在升）；残差连接让加深至少不劣化。</text></svg></div><p class="cap"></p></div></body></html>
