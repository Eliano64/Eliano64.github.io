<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-fold sample roles</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#ffffff;color:#20242c;font-size:13px;line-height:1.5;padding:12px}
h2{font-size:14px;line-height:1.3;margin:0 0 4px;font-weight:650}
p{margin:4px 0}
.folds{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 6px}
button{font:inherit;font-size:11.5px;padding:4px 9px;border:1px solid #c9cfd9;border-radius:5px;background:#f7f8fa;color:#20242c;cursor:pointer}
button:hover{background:#eef1f5}
button:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
button[aria-pressed="true"]{border-color:#d97706;background:#fff7ed;color:#9a3412}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:#5f6673;margin:4px 0 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:330px}
.cell{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9px;text-align:center;padding:4px 0;border-radius:3px;border:1px solid transparent}
.train{background:#dbeafe;color:#1e3a8a;border-color:#bfdbfe}
.val{background:#ffedd5;color:#9a3412;border-color:#fdba74}
.test{background:#ccfbf1;color:#115e59;border-color:#99f6e4}
.muted{background:#eef0f4;color:#5f6673;border-color:#e3e6eb}
.rowlabel{font-size:10.5px;color:#5f6673;margin:8px 0 3px}
.counts{font-size:11.5px;margin-top:8px}
.counts b{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.note{font-size:11px;color:#5f6673;margin-top:6px}
@media (prefers-color-scheme:dark){
body{background:#17191d;color:#e6e9ef}
.legend,.rowlabel,.note{color:#aab2c0}
button{background:#232830;color:#e6e9ef;border-color:#4a5260}
button:hover{background:#2c333d}
button[aria-pressed="true"]{background:#3a2416;color:#fdba74;border-color:#d97706}
.train{background:#1e3a5f;color:#bfdbfe;border-color:#1e40af}
.val{background:#4a2410;color:#fed7aa;border-color:#9a3412}
.test{background:#0f3f3a;color:#99f6e4;border-color:#115e59}
.muted{background:#232830;color:#aab2c0;border-color:#333a46}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h2>K 折中的样本角色</h2>
<div class="folds" id="folds" role="group" aria-label="选择验证折"></div>
<div class="legend">
  <span><i class="train"></i>训练</span>
  <span><i class="val"></i>验证折</span>
  <span><i class="test"></i>最终测试</span>
</div>
<div class="rowlabel">交叉验证数据（20 个样本）</div>
<div class="grid" id="grid"></div>
<div class="rowlabel">留到最后的测试集（5 个样本）</div>
<div class="grid" id="testgrid" style="grid-template-columns:repeat(5,minmax(0,1fr));max-width:165px"></div>
<p class="counts" id="counts"></p>
<p class="note">验证折每次换一份，其余折训练；测试集不参与交叉验证，只在最后报告一次。</p>
<script>
/* MODEL-START */
const MODEL = { n: 20, k: 5, testSize: 5 };
function roles(fold) {
  const size = MODEL.n / MODEL.k;
  const start = (fold - 1) * size;
  const validation = [];
  const training = [];
  for (let i = 1; i <= MODEL.n; i++) {
    if (i > start && i <= start + size) validation.push(i);
    else training.push(i);
  }
  const test = Array.from({ length: MODEL.testSize }, (_, i) => "T" + (i + 1));
  return { validation, training, test };
}
const __test = { MODEL, roles };
/* MODEL-END */

let fold = 1;
function cell(label, cls) {
  const d = document.createElement("div");
  d.className = "cell " + cls;
  d.textContent = label;
  return d;
}
function render() {
  const r = roles(fold);
  const folds = document.getElementById("folds");
  const preserveFocus = folds.contains(document.activeElement);
  folds.innerHTML = "";
  for (let f = 1; f <= MODEL.k; f++) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "折 " + f;
    b.setAttribute("aria-pressed", f === fold ? "true" : "false");
    b.addEventListener("click", () => { fold = f; render(); });
    folds.appendChild(b);
  }
  if (preserveFocus) folds.querySelector('[aria-pressed="true"]').focus({preventScroll:true});
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (let i = 1; i <= MODEL.n; i++) {
    grid.appendChild(cell(String(i), r.validation.includes(i) ? "val" : "train"));
  }
  const tg = document.getElementById("testgrid");
  tg.innerHTML = "";
  r.test.forEach((t) => tg.appendChild(cell(t, "test")));
  document.getElementById("counts").textContent =
    "训练 " + r.training.length + " 个，验证 " + r.validation.length + " 个，测试 " +
    r.test.length + " 个；验证折 = 样本 " + r.validation[0] + " 到 " + r.validation[r.validation.length - 1] + "。";
}
render();
</script>
</body>
</html>
