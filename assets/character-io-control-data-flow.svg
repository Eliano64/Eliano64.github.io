<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">字符 I/O 的软件硬件层次、控制流与数据流</title>
  <desc id="desc">中央是用户程序、系统调用、内核 I/O、驱动和中断处理、设备控制器与设备六层。左侧蓝线表示输出数据向下，右侧绿线表示输入数据向上，橙线表示系统调用请求向下，红色虚线表示中断控制转移向上。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
  </defs>
  <style>
    svg{background:#f8fafc;color-scheme:light dark}text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
    .title{font-size:26px;font-weight:700;fill:#172033}.head{font-size:18px;font-weight:700;fill:#172033}.label{font-size:14px;fill:#526174}.small{font-size:12px;fill:#526174}
    .layer{fill:#fff;stroke:#94a3b8;stroke-width:2}.user{fill:#ecfdf5;stroke:#059669}.kernel{fill:#eff6ff;stroke:#2563eb}.hardware{fill:#fff7ed;stroke:#d97706}.group{fill:none;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:7 5}
    .output{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#blue-arrow)}.input{fill:none;stroke:#059669;stroke-width:5;marker-end:url(#green-arrow)}.request{fill:none;stroke:#d97706;stroke-width:3;marker-end:url(#orange-arrow)}.interrupt{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:8 5;marker-end:url(#red-arrow)}
    .dot-blue{fill:#2563eb}.dot-green{fill:#059669}.badge{fill:#fff;stroke:#cbd5e1}.blue{fill:#2563eb}.green{fill:#059669}.orange{fill:#b45309}.red{fill:#b91c1c}
    @media(prefers-color-scheme:dark){svg{background:#0b1020}.title,.head{fill:#e5edf5}.label,.small{fill:#a9b7c6}.layer,.badge{fill:#121b25;stroke:#526174}.user{fill:#123d2d;stroke:#34d399}.kernel{fill:#17345a;stroke:#60a5fa}.hardware{fill:#3a2511;stroke:#fb923c}.group{stroke:#344354}.blue{fill:#93c5fd}.green{fill:#6ee7b7}.orange{fill:#fdba74}.red{fill:#fca5a5}}
  </style>

  <text x="550" y="38" text-anchor="middle" class="title">字符 I/O：控制流与数据流分开看</text>

  <rect x="52" y="60" width="230" height="38" rx="7" class="badge"/><line x1="72" y1="79" x2="112" y2="79" class="output"/><text x="124" y="84" class="label blue">输出数据：向设备</text>
  <rect x="300" y="60" width="230" height="38" rx="7" class="badge"/><line x1="320" y1="79" x2="360" y2="79" class="input"/><text x="372" y="84" class="label green">输入数据：向程序</text>
  <rect x="548" y="60" width="230" height="38" rx="7" class="badge"/><line x1="568" y1="79" x2="608" y2="79" class="request"/><text x="620" y="84" class="label orange">请求控制流</text>
  <rect x="796" y="60" width="250" height="38" rx="7" class="badge"/><line x1="816" y1="79" x2="856" y2="79" class="interrupt"/><text x="868" y="84" class="label red">中断控制转移</text>

  <rect x="332" y="116" width="436" height="530" rx="16" class="group"/>
  <text x="550" y="138" text-anchor="middle" class="small">同一条 I/O 路径中的六个职责层次</text>

  <rect x="370" y="150" width="360" height="62" rx="9" class="layer user"/><text x="550" y="176" text-anchor="middle" class="head">用户程序与 C 库</text><text x="550" y="198" text-anchor="middle" class="label">格式处理 · 用户缓冲 · 用户变量</text>
  <rect x="370" y="236" width="360" height="62" rx="9" class="layer kernel"/><text x="550" y="262" text-anchor="middle" class="head">系统调用接口</text><text x="550" y="284" text-anchor="middle" class="label">参数检查 · 用户态 / 内核态边界</text>
  <rect x="370" y="322" width="360" height="62" rx="9" class="layer kernel"/><text x="550" y="348" text-anchor="middle" class="head">操作系统 I/O 子系统</text><text x="550" y="370" text-anchor="middle" class="label">等待关系 · 内核缓冲 · 请求队列</text>
  <rect x="370" y="408" width="360" height="62" rx="9" class="layer kernel"/><text x="550" y="434" text-anchor="middle" class="head">设备驱动与中断处理</text><text x="550" y="456" text-anchor="middle" class="label">翻译命令 · 读取状态 · 完成通知</text>
  <rect x="370" y="494" width="360" height="62" rx="9" class="layer hardware"/><text x="550" y="520" text-anchor="middle" class="head">设备控制器</text><text x="550" y="542" text-anchor="middle" class="label">控制 / 状态 / 数据寄存器或内部缓冲</text>
  <rect x="370" y="580" width="360" height="62" rx="9" class="layer hardware"/><text x="550" y="606" text-anchor="middle" class="head">I/O 设备</text><text x="550" y="628" text-anchor="middle" class="label">键盘输入 · 终端输出</text>

  <path d="M250 175V610" class="output"/>
  <circle cx="250" cy="181" r="6" class="dot-blue"/><circle cx="250" cy="267" r="6" class="dot-blue"/><circle cx="250" cy="353" r="6" class="dot-blue"/><circle cx="250" cy="439" r="6" class="dot-blue"/><circle cx="250" cy="525" r="6" class="dot-blue"/>
  <text x="230" y="185" text-anchor="end" class="small blue">用户库缓冲</text><text x="230" y="271" text-anchor="end" class="small blue">write 请求</text><text x="230" y="357" text-anchor="end" class="small blue">内核输出区</text><text x="230" y="443" text-anchor="end" class="small blue">驱动交付</text><text x="230" y="529" text-anchor="end" class="small blue">控制器持有</text><text x="230" y="616" text-anchor="end" class="small blue">字符可见</text>

  <path d="M850 610V175" class="input"/>
  <circle cx="850" cy="611" r="6" class="dot-green"/><circle cx="850" cy="525" r="6" class="dot-green"/><circle cx="850" cy="439" r="6" class="dot-green"/><circle cx="850" cy="353" r="6" class="dot-green"/><circle cx="850" cy="267" r="6" class="dot-green"/>
  <text x="870" y="616" class="small green">设备产生字符</text><text x="870" y="529" class="small green">控制器暂存</text><text x="870" y="443" class="small green">驱动接收</text><text x="870" y="357" class="small green">内核输入区</text><text x="870" y="271" class="small green">read 交付</text><text x="870" y="185" class="small green">用户缓冲 → ch</text>

  <path d="M370 180H110V438H365" class="request"/><text x="92" y="285" text-anchor="middle" class="label orange" transform="rotate(-90 92 285)">系统调用使请求向下进入内核与驱动</text>
  <path d="M730 525H1010V438H735" class="interrupt"/><text x="1028" y="484" text-anchor="middle" class="label red" transform="rotate(-90 1028 484)">设备事件使 CPU 转入中断处理</text>

  <rect x="160" y="678" width="780" height="52" rx="9" class="badge"/>
  <text x="550" y="701" text-anchor="middle" class="head">控制流回答“CPU 执行谁”；数据流回答“字符在哪里”</text>
  <text x="550" y="721" text-anchor="middle" class="small">进程状态是第三条独立轴：运行 → 阻塞 → 就绪 → 再次运行</text>
</svg>
