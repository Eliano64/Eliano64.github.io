<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 486" role="img" aria-labelledby="t d">
  <title id="t">代词 it 的注意力分配</title>
  <desc id="d">左侧为句子中的各个 Token，右侧是当前位置 it。连线越粗，表示 it 在更新自身表示时对该位置的注意力权重越大。</desc>
  <style>
    :root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--box:#eef3fb;--line:#c8d0da;--accent:#2f66b3;--hi:#dbe7fb}
    @media (prefers-color-scheme:dark){
      :root{--bg:#171b23;--fg:#e6eaf2;--muted:#9aa4b2;--box:#1e2430;--line:#3a4250;--accent:#7fa8ee;--hi:#243052}
    }
    text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
    .tok{fill:var(--box);stroke:var(--line);stroke-width:1}
    .tok.cur{fill:var(--hi);stroke:var(--accent);stroke-width:1.5}
    .lbl{font-size:13px}
    .title{font-size:14px;font-weight:600}
    .sub{font-size:11.5px;fill:var(--muted)}
    .conn{stroke:var(--accent);stroke-linecap:round}
    .legend{font-size:11px;fill:var(--muted)}
  </style>
  <rect width="680" height="486" fill="var(--bg)"/>
  <text class="title" x="20" y="22">代词 it 更新表示时的注意力分配</text>
  <text class="sub" x="20" y="40">线越粗，注意力权重越大</text>

  <g class="tokens">
    <rect class="tok" x="24" y="52"  width="126" height="26" rx="5"/><text class="lbl" x="34" y="70">The</text>
    <rect class="tok" x="24" y="85"  width="126" height="26" rx="5"/><text class="lbl" x="34" y="103">animal</text>
    <rect class="tok" x="24" y="118" width="126" height="26" rx="5"/><text class="lbl" x="34" y="136">didn't</text>
    <rect class="tok" x="24" y="151" width="126" height="26" rx="5"/><text class="lbl" x="34" y="169">cross</text>
    <rect class="tok" x="24" y="184" width="126" height="26" rx="5"/><text class="lbl" x="34" y="202">the</text>
    <rect class="tok" x="24" y="217" width="126" height="26" rx="5"/><text class="lbl" x="34" y="235">street</text>
    <rect class="tok" x="24" y="250" width="126" height="26" rx="5"/><text class="lbl" x="34" y="268">because</text>
    <rect class="tok cur" x="24" y="283" width="126" height="26" rx="5"/><text class="lbl" x="34" y="301">it</text>
    <rect class="tok" x="24" y="316" width="126" height="26" rx="5"/><text class="lbl" x="34" y="334">was</text>
    <rect class="tok" x="24" y="349" width="126" height="26" rx="5"/><text class="lbl" x="34" y="367">too</text>
    <rect class="tok" x="24" y="382" width="126" height="26" rx="5"/><text class="lbl" x="34" y="400">tired</text>
    <rect class="tok" x="24" y="415" width="126" height="26" rx="5"/><text class="lbl" x="34" y="433">.</text>
  </g>

  <g class="connections">
    <line class="conn" x1="480" y1="296" x2="150" y2="428" stroke-width="1.4" opacity="0.24"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="65"  stroke-width="1.7" opacity="0.25"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="197" stroke-width="1.7" opacity="0.25"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="131" stroke-width="1.9" opacity="0.27"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="362" stroke-width="1.9" opacity="0.27"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="395" stroke-width="2.2" opacity="0.30"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="164" stroke-width="2.3" opacity="0.30"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="263" stroke-width="2.4" opacity="0.32"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="329" stroke-width="2.1" opacity="0.30"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="230" stroke-width="5.5" opacity="0.50"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="296" stroke-width="6.0" opacity="0.55"/>
    <line class="conn" x1="480" y1="296" x2="150" y2="98"  stroke-width="10.0" opacity="0.90"/>
  </g>

  <g class="target">
    <rect class="tok cur" x="480" y="281" width="150" height="30" rx="6"/>
    <text class="lbl" x="492" y="301">it（当前位置）</text>
  </g>

  <g class="legend">
    <line x1="20" y1="470" x2="56" y2="470" stroke="var(--accent)" stroke-width="9" opacity="0.9" stroke-linecap="round"/>
    <text class="legend" x="62" y="474">高权重</text>
    <line x1="130" y1="470" x2="166" y2="470" stroke="var(--accent)" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <text class="legend" x="172" y="474">低权重</text>
  </g>
</svg>
