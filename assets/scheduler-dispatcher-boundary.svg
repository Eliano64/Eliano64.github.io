<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">调度、分派与返回用户态</title>
  <desc id="desc">展示用户进程因中断或系统调用进入内核，调度器选择、分派器切换，被选任务可能先续接内核路径，再通过返回指令进入用户态。</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--fg:#111827;--muted:#64748b;--line:#94a3b8;--user:#dbeafe;--kernel:#fef3c7;--dispatch:#dcfce7;--accent:#2563eb;--return:#059669}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#0f172a;--fg:#e5e7eb;--muted:#94a3b8;--line:#64748b;--user:#1e3a8a;--kernel:#713f12;--dispatch:#14532d;--accent:#60a5fa;--return:#34d399}}
    .bg{fill:var(--bg)}.box{stroke:var(--line);stroke-width:2}.user{fill:var(--user)}.kernel{fill:var(--kernel)}.dispatch{fill:var(--dispatch)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:var(--fg)}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:15px;fill:var(--muted)}.boundary{stroke:var(--line);stroke-width:2;stroke-dasharray:8 8}.arrow{stroke:var(--accent);stroke-width:3;fill:none;marker-end:url(#a1)}.back{stroke:var(--return);stroke-width:3;fill:none;marker-end:url(#a2)}
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--accent)"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--return)"/></marker>
  </defs>
  <rect class="bg" width="980" height="560"/>
  <text class="title" x="490" y="38" text-anchor="middle">调度完成时仍在内核态；返回指令之后才进入用户态</text>

  <rect class="box user" x="42" y="66" width="190" height="74" rx="12"/>
  <text class="head" x="137" y="99" text-anchor="middle">用户态：进程 P1</text>
  <text class="small" x="137" y="124" text-anchor="middle">正在执行用户指令</text>
  <rect class="box user" x="748" y="66" width="190" height="74" rx="12"/>
  <text class="head" x="843" y="99" text-anchor="middle">用户态：进程 P2</text>
  <text class="small" x="843" y="124" text-anchor="middle">可能先续接自己的内核路径</text>

  <line class="boundary" x1="25" y1="170" x2="955" y2="170"/>
  <text class="small" x="490" y="160" text-anchor="middle">用户态 / 内核态边界</text>

  <path class="arrow" d="M137 140 L137 220"/>
  <text class="small" x="158" y="196">中断 / 异常 / 系统调用</text>

  <rect class="box kernel" x="42" y="220" width="190" height="116" rx="12"/>
  <text class="head" x="137" y="257" text-anchor="middle">进入内核</text>
  <text class="t" x="137" y="289" text-anchor="middle">处理事件，更新状态</text>
  <text class="small" x="137" y="316" text-anchor="middle">可能标记需要调度</text>

  <rect class="box kernel" x="278" y="220" width="190" height="116" rx="12"/>
  <text class="head" x="373" y="257" text-anchor="middle">调度器</text>
  <text class="t" x="373" y="289" text-anchor="middle">从就绪队列选出 P2</text>
  <text class="small" x="373" y="316" text-anchor="middle">此时仍在内核态</text>

  <rect class="box dispatch" x="514" y="220" width="190" height="116" rx="12"/>
  <text class="head" x="609" y="257" text-anchor="middle">分派器</text>
  <text class="t" x="609" y="289" text-anchor="middle">保存 P1，恢复 P2</text>
  <text class="small" x="609" y="316" text-anchor="middle">切换地址空间与栈</text>

  <rect class="box dispatch" x="750" y="220" width="188" height="116" rx="12"/>
  <text class="head" x="844" y="257" text-anchor="middle">P2 继续内核路径</text>
  <text class="t" x="844" y="289" text-anchor="middle">完成后恢复用户现场</text>
  <text class="small" x="844" y="316" text-anchor="middle">再执行 iret / sysret 等</text>

  <path class="arrow" d="M232 278 L278 278"/>
  <path class="arrow" d="M468 278 L514 278"/>
  <path class="arrow" d="M704 278 L750 278"/>
  <path class="back" d="M844 220 L844 140"/>

  <rect class="panel" x="78" y="390" width="824" height="110" rx="12"/>
  <text class="head" x="490" y="425" text-anchor="middle">三个动作不能混为一个</text>
  <text class="t" x="490" y="457" text-anchor="middle">调度：选谁　　分派：切换现场　　返回：恢复用户态执行</text>
  <text class="small" x="490" y="484" text-anchor="middle">若选中的是内核线程，或者内核仍有工作要做，分派后也不一定立即进入用户态。</text>
</svg>
