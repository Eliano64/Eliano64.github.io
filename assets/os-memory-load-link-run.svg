<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">从源文件到运行中的进程</title>
  <desc id="desc">源文件经过编译和汇编成为目标文件，链接器生成可执行文件，装入程序建立进程用户空间和初始执行现场。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      svg{background:#f8fafc}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .subtitle{font:500 15px "Microsoft YaHei",sans-serif;fill:#64748b}
      .box{stroke-width:2.2}
      .source{fill:#f8fafc;stroke:#64748b}
      .object{fill:#eff6ff;stroke:#3b82f6}
      .exe{fill:#ecfdf5;stroke:#10b981}
      .process{fill:#fff7ed;stroke:#f59e0b}
      .head{font:700 21px "Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}
      .body{font:500 15px "Microsoft YaHei",sans-serif;fill:#334155;text-anchor:middle}
      .tag{font:700 13px Consolas,monospace;fill:#475569;text-anchor:middle}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .step{font:700 17px "Microsoft YaHei",sans-serif;fill:#1e293b;text-anchor:middle}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.6}
      .cardHead{font:700 17px "Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}
      .cardBody{font:500 14px "Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}
      .linkCard{fill:#eff6ff;stroke:#60a5fa}.loadCard{fill:#fff7ed;stroke:#fbbf24}
      @media(prefers-color-scheme:dark){
        svg{background:#0b1020}
        .panel{fill:#111827;stroke:#334155}
        .title,.head,.step,.cardHead{fill:#f8fafc}
        .subtitle,.body,.tag,.cardBody{fill:#cbd5e1}
        .source{fill:#1e293b;stroke:#94a3b8}
        .object{fill:#172554;stroke:#60a5fa}
        .exe{fill:#12372a;stroke:#34d399}
        .process{fill:#3b2a12;stroke:#fbbf24}
        .arrow{stroke:#94a3b8}
        #arrow path{fill:#94a3b8}
        .linkCard{fill:#172554;stroke:#3b82f6}
        .loadCard{fill:#3b2a12;stroke:#f59e0b}
      }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="1060" height="430" rx="20"/>
  <text class="title" x="50" y="62">从源文件到运行中的进程</text>
  <text class="subtitle" x="50" y="90">链接整理模块和地址引用，装入建立用户空间与初始执行现场</text>

  <rect class="box source" x="45" y="150" width="150" height="145" rx="15"/>
  <text class="head" x="120" y="190">源文件</text>
  <text class="body" x="120" y="222">函数 · 变量</text>
  <text class="body" x="120" y="248">源代码</text>
  <text class="tag" x="120" y="278">.c / .cpp</text>

  <path class="arrow" d="M203 222 H255"/>
  <text class="step" x="229" y="202">编译</text>
  <text class="subtitle" x="229" y="252" text-anchor="middle">汇编</text>

  <rect class="box object" x="263" y="135" width="210" height="175" rx="15"/>
  <text class="head" x="368" y="175">目标文件</text>
  <text class="body" x="368" y="208">代码节 · 数据节</text>
  <text class="body" x="368" y="234">符号表</text>
  <text class="body" x="368" y="260">重定位项</text>
  <text class="tag" x="368" y="292">.o / .obj</text>

  <path class="arrow" d="M481 222 H533"/>
  <text class="step" x="507" y="202">链接</text>

  <rect class="box exe" x="541" y="135" width="220" height="175" rx="15"/>
  <text class="head" x="651" y="175">可执行文件</text>
  <text class="body" x="651" y="208">可装入段</text>
  <text class="body" x="651" y="234">入口地址</text>
  <text class="body" x="651" y="260">动态依赖与重定位信息</text>
  <text class="tag" x="651" y="292">executable</text>

  <path class="arrow" d="M769 222 H821"/>
  <text class="step" x="795" y="202">装入</text>

  <rect class="box process" x="829" y="125" width="230" height="195" rx="15"/>
  <text class="head" x="944" y="165">进程用户空间</text>
  <text class="body" x="944" y="198">代码 / 数据 / BSS</text>
  <text class="body" x="944" y="224">共享库与其他映射</text>
  <text class="body" x="944" y="250">用户栈与启动参数</text>
  <text class="body" x="944" y="276">入口 PC · 初始 SP</text>
  <text class="tag" x="944" y="303">ready to run</text>

  <rect class="card linkCard" x="275" y="350" width="350" height="72" rx="13"/>
  <text class="cardHead" x="450" y="379">链接器</text>
  <text class="cardBody" x="450" y="404">合并节　解析符号　分配地址　执行重定位</text>

  <rect class="card loadCard" x="660" y="350" width="365" height="72" rx="13"/>
  <text class="cardHead" x="842.5" y="379">装入程序</text>
  <text class="cardBody" x="842.5" y="404">建立映射　准备栈　处理依赖　设置入口现场</text>
</svg>
