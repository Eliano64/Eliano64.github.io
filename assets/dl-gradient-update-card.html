<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient update walkthrough</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#ffffff;color:#20242c;font-size:13px;line-height:1.5;padding:12px;--axis:#5f6673;--grid:#9aa0aa;--curve:#2563eb;--resid:#d97706}
h2{font-size:14px;line-height:1.3;margin:0 0 4px;font-weight:650}
p{margin:4px 0}
.data{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;background:#f3f5f8;padding:6px 8px;border-radius:6px;overflow-x:auto}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.phasebar{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#5f6673;border-bottom:1px solid #e3e6eb;padding-bottom:4px;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.vals th,.vals td{padding:4px 3px;border-bottom:1px solid #e8ebf0;text-align:left;font-size:12px}
.vals th{font-weight:500;color:#5f6673;width:46%}
.vals td{text-align:right;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px}
.buttons{display:flex;gap:6px;margin:9px 0 4px}
button{font:inherit;font-size:12px;padding:5px 10px;border:1px solid #c9cfd9;border-radius:6px;background:#f7f8fa;color:#20242c;cursor:pointer}
button:hover:not(:disabled){background:#eef1f5}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.hint{font-size:11px;color:#5f6673;min-height:32px}
.plotwrap{border:1px solid #e3e6eb;border-radius:6px;padding:4px;background:#fbfbfd}
svg{display:block;width:100%;height:auto}
.svg-grid{stroke:var(--grid);stroke-opacity:.28;stroke-width:1}
.svg-axis{stroke:var(--axis);stroke-width:.8;fill:none}
.svg-text{fill:var(--axis);font-size:9.5px}
.svg-curve{stroke:var(--curve);stroke-width:2;fill:none}
.svg-curve-dash{stroke:var(--curve);stroke-width:2;stroke-dasharray:5 4;opacity:.6;fill:none}
.svg-resid{stroke:var(--resid);stroke-width:2;opacity:.85}
.svg-dot{fill:var(--curve)}
.svg-mark{fill:none;stroke:var(--resid);stroke-width:1.6}
svg text{fill:var(--axis)!important}
svg line{stroke:var(--axis)!important}
svg circle{fill:var(--curve)!important}
svg .curve{stroke:var(--curve)!important}
svg .resid{stroke:var(--resid)!important}
svg .dash{stroke-dasharray:5 4;opacity:.6}
.note{font-size:11px;color:#5f6673;margin-top:6px}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){
body{background:#17191d;color:#e6e9ef;--axis:#c9d1dc;--grid:#8b94a5;--curve:#60a5fa;--resid:#fbbf24}
.data{background:#232830}
.phasebar,.hint,.note,.vals th{color:#aab2c0}
.phasebar,.vals th,.vals td{border-bottom-color:#333a46}
button{background:#232830;color:#e6e9ef;border-color:#4a5260}
button:hover:not(:disabled){background:#2c333d}
.plotwrap{background:#1b1e24;border-color:#333a46}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h2>一次梯度更新的四个状态</h2>
<p class="data">x = [1, 2]，y = [3, 5]，ŷ = θx + b，θ₀ = 0，b₀ = 0，η = 0.2</p>
<div class="grid">
  <div>
    <div class="phasebar"><span id="phase">第 1 轮 · 前向</span><span id="count">1 / 12</span></div>
    <table class="vals">
      <tbody>
        <tr><th>θ</th><td id="theta">0.00</td></tr>
        <tr><th>b</th><td id="b">0.00</td></tr>
        <tr id="rowPred"><th>预测 ŷ</th><td id="pred">[0.00, 0.00]</td></tr>
        <tr id="rowResid"><th>残差 y − ŷ</th><td id="resid">[-]</td></tr>
        <tr id="rowLoss"><th>损失 L</th><td id="loss">[-]</td></tr>
        <tr id="rowGrad"><th>∂L/∂θ</th><td id="gtheta">[-]</td></tr>
        <tr id="rowGrad2"><th>∂L/∂b</th><td id="gb">[-]</td></tr>
      </tbody>
    </table>
    <div class="buttons">
      <button type="button" id="prev">上一步</button>
      <button type="button" id="next">下一步</button>
      <button type="button" id="reset">重置</button>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </div>
  <div>
    <div class="plotwrap"><svg id="plot" viewBox="0 0 340 230" role="img" aria-label="样本点、当前直线与残差"></svg></div>
    <p class="note" id="mseNote"></p>
  </div>
</div>
<script>
/* MODEL-START */
const MODEL = {
  x: [1, 2],
  y: [3, 5],
  eta: 0.2,
  theta0: 0,
  b0: 0,
  iterations: 3
};
const PHASES = ["forward", "loss", "gradients", "update"];
const PHASE_NAMES = { forward: "前向", loss: "损失", gradients: "梯度", update: "更新" };
function predict(theta, b) {
  return MODEL.x.map((x) => theta * x + b);
}
function evaluateAt(theta, b) {
  const pred = predict(theta, b);
  const resid = pred.map((p, i) => MODEL.y[i] - p);
  const loss = resid.reduce((s, r) => s + r * r, 0) / MODEL.x.length;
  const gTheta = -resid.reduce((s, r, i) => s + r * MODEL.x[i], 0) * (2 / MODEL.x.length);
  const gB = -resid.reduce((s, r) => s + r, 0) * (2 / MODEL.x.length);
  return { pred, resid, loss, gTheta, gB };
}
function snapshots() {
  const out = [];
  let theta = MODEL.theta0;
  let b = MODEL.b0;
  for (let it = 1; it <= MODEL.iterations; it++) {
    const state = evaluateAt(theta, b);
    const next = { theta: theta - MODEL.eta * state.gTheta, b: b - MODEL.eta * state.gB };
    const after = evaluateAt(next.theta, next.b);
    for (const phase of PHASES) {
      out.push({ iter: it, phase, theta, b, next, after, ...state });
    }
    theta = next.theta;
    b = next.b;
  }
  return out;
}
const __test = { MODEL, evaluateAt, snapshots };
/* MODEL-END */

const SNAPS = snapshots();
let index = 0;

function fmt(v, d) {
  return (Math.abs(v) < 5e-7 ? 0 : v).toFixed(d);
}
function vec(v, d) {
  return "[" + v.map((x) => fmt(x, d)).join(", ") + "]";
}
function setRow(id, visible, text) {
  document.getElementById(id).hidden = !visible;
  if (text !== undefined) document.getElementById(id === "rowResid" ? "resid" : id === "rowLoss" ? "loss" : id === "rowGrad" ? "gtheta" : "gb").textContent = text;
}
function renderPlot(snap) {
  const W = 340;
  const H = 230;
  const m = { l: 38, r: 12, t: 12, b: 30 };
  const xMax = 3;
  const yMax = 6.5;
  const sx = (x) => m.l + (x / xMax) * (W - m.l - m.r);
  const sy = (y) => H - m.b - (y / yMax) * (H - m.t - m.b);
  let s = "";
  for (let i = 0; i <= 6; i += 2) {
    const y = sy(i);
    s += '<line x1="' + m.l + '" y1="' + y + '" x2="' + (W - m.r) + '" y2="' + y + '" stroke="#9aa0aa" stroke-opacity="0.28" stroke-width="1"/>';
    s += '<text x="' + (m.l - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="10" fill="#5f6673">' + i + "</text>";
  }
  for (let i = 0; i <= 3; i++) {
    const x = sx(i);
    s += '<text x="' + x + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10" fill="#5f6673">' + i + "</text>";
  }
  s += '<text x="' + (W - m.r) + '" y="' + (H - 2) + '" text-anchor="end" font-size="10" fill="#5f6673">x</text>';
  s += '<text x="6" y="' + m.t + '" font-size="10" fill="#5f6673">y</text>';
  s += '<line x1="' + m.l + '" y1="' + (H - m.b) + '" x2="' + (W - m.r) + '" y2="' + (H - m.b) + '" stroke="#5f6673" stroke-width="0.8"/>';
  s += '<line x1="' + m.l + '" y1="' + m.t + '" x2="' + m.l + '" y2="' + (H - m.b) + '" stroke="#5f6673" stroke-width="0.8"/>';

  const drawLine = (theta, b, dash, color) => {
    const xEnd = theta !== 0 ? Math.min(2.7, (yMax - b) / theta) : 2.7;
    return '<line class="' + (dash ? "curve dash" : "curve") + '" x1="' + sx(0) + '" y1="' + sy(b) + '" x2="' + sx(Math.max(0, xEnd)) + '" y2="' + sy(theta * Math.max(0, xEnd) + b) + '" stroke="' + color + '" stroke-width="2" ' + (dash ? 'stroke-dasharray="5 4" opacity="0.55"' : "") + "/>";
  };
  s += drawLine(snap.theta, snap.b, false, "#2563eb");
  if (snap.phase === "update") s += drawLine(snap.next.theta, snap.next.b, true, "#2563eb");

  MODEL.x.forEach((x, i) => {
    const cx = sx(x);
    const cy = sy(MODEL.y[i]);
    if (snap.phase === "loss" || snap.phase === "gradients") {
      const py = sy(snap.pred[i]);
      s += '<line class="resid" x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + py + '" stroke="#d97706" stroke-width="2" opacity="0.85"/>';
    }
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="4.4" fill="#2563eb"/>';
  });
  s += '<circle cx="' + (W - 104) + '" cy="18" r="4" fill="#2563eb"/>';
  s += '<text x="' + (W - 96) + '" y="21.5" font-size="9.5" fill="#5f6673">样本 (x, y)</text>';
  if (snap.phase === "loss" || snap.phase === "gradients") {
    s += '<line class="resid" x1="' + (W - 104) + '" y1="34" x2="' + (W - 92) + '" y2="34" stroke="#d97706" stroke-width="2"/>';
    s += '<text x="' + (W - 86) + '" y="37.5" font-size="9.5" fill="#5f6673">残差</text>';
  }
  if (snap.phase === "update") {
    s += '<line class="curve" x1="' + (W-104) + '" y1="34" x2="' + (W-92) + '" y2="34" stroke="var(--curve)" stroke-width="2"/>';
    s += '<text x="' + (W-86) + '" y="37.5" font-size="9.5">更新前</text>';
    s += '<line class="curve dash" x1="' + (W-104) + '" y1="50" x2="' + (W-92) + '" y2="50" stroke="var(--curve)" stroke-width="2" stroke-dasharray="5 4"/>';
    s += '<text x="' + (W-86) + '" y="53.5" font-size="9.5">更新后</text>';
  }
  document.getElementById("plot").innerHTML = s;
}
function render() {
  const snap = SNAPS[index];
  document.getElementById("phase").textContent = "第 " + snap.iter + " 轮 · " + PHASE_NAMES[snap.phase];
  document.getElementById("count").textContent = (index + 1) + " / " + SNAPS.length;
  if (snap.phase === "update") {
    document.getElementById("theta").textContent = fmt(snap.theta, 2) + " → " + fmt(snap.next.theta, 2);
    document.getElementById("b").textContent = fmt(snap.b, 2) + " → " + fmt(snap.next.b, 2);
  } else {
    document.getElementById("theta").textContent = fmt(snap.theta, 2);
    document.getElementById("b").textContent = fmt(snap.b, 2);
  }
  document.getElementById("pred").textContent = snap.phase === "update"
    ? vec(snap.pred, 2) + " → " + vec(snap.after.pred, 2)
    : vec(snap.pred, 2);
  document.querySelector("#rowPred th").textContent = snap.phase === "update" ? "预测 ŷ（前 → 后）" : "预测 ŷ";
  document.querySelector("#rowResid th").textContent = snap.phase === "update" ? "残差（前 → 后）" : "残差 y − ŷ";
  document.querySelector("#rowLoss th").textContent = snap.phase === "update" ? "损失（前 → 后）" : "损失 L";
  document.querySelector("#rowGrad th").textContent = snap.phase === "update" ? "∂L/∂θ（更新前）" : "∂L/∂θ";
  document.querySelector("#rowGrad2 th").textContent = snap.phase === "update" ? "∂L/∂b（更新前）" : "∂L/∂b";
  const showLoss = snap.phase === "loss" || snap.phase === "gradients" || snap.phase === "update";
  const showGrad = snap.phase === "gradients" || snap.phase === "update";
  setRow("rowResid", showLoss, showLoss ? (snap.phase === "update" ? vec(snap.resid, 2) + " → " + vec(snap.after.resid, 2) : vec(snap.resid, 2)) : undefined);
  setRow("rowLoss", showLoss, showLoss ? (snap.phase === "update" ? fmt(snap.loss, 3) + " → " + fmt(snap.after.loss, 3) : fmt(snap.loss, 3)) : undefined);
  setRow("rowGrad", showGrad, showGrad ? fmt(snap.gTheta, 2) : undefined);
  setRow("rowGrad2", showGrad, showGrad ? fmt(snap.gB, 2) : undefined);
  let hint = "";
  if (snap.phase === "forward") hint = "用当前参数算出两个预测值。";
  else if (snap.phase === "loss") hint = "残差平方取平均，得到本轮损失。";
  else if (snap.phase === "gradients") hint = "链式法则给出损失对 θ 与 b 的偏导。";
  else hint = "按负梯度更新参数；虚线是更新后的直线。";
  if (index === SNAPS.length - 1) hint += " 三轮结束：θ = " + fmt(snap.next.theta, 2) + "，b = " + fmt(snap.next.b, 2) + "。";
  document.getElementById("hint").textContent = hint;
  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = index === SNAPS.length - 1;
  renderPlot(snap);
}
document.getElementById("prev").addEventListener("click", () => { if (index > 0) { index -= 1; render(); } });
document.getElementById("next").addEventListener("click", () => { if (index < SNAPS.length - 1) { index += 1; render(); } });
document.getElementById("reset").addEventListener("click", () => { index = 0; render(); });
document.getElementById("mseNote").textContent = "MSE：L = (1/n)Σ(ŷ − y)²，n = " + MODEL.x.length + "。按各参数的梯度更新。";
render();
</script>
</body>
</html>
