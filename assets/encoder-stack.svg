<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="t d">
  <title id="t">编码器的多层堆叠与输出 H</title>
  <desc id="d">输入 X⁰ 是 N 行、每行 d_model 维的矩阵。它依次经过多个编码器层，每层保持形状不变；最后一层输出 H，形状仍为 N×d_model。H 的每一行对应一个输入位置，并作为解码器交叉注意力的键和值来源。</desc>
  <style>
    :root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--line:#c8d0da;--panel:#f4f7fb;--accent:#3b5bdb;--hi:#e8efff}
    @media (prefers-color-scheme:dark){:root{--bg:#171b23;--fg:#e6eaf2;--muted:#9aa4b2;--line:#3a4250;--panel:#1e2430;--accent:#8fa6ff;--hi:#243052}}
    text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
    .box{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .lbl{font-size:11.5px}
    .small{font-size:10px;fill:var(--muted)}
    .ttl{font-size:12px;font-weight:600}
    .arrow{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#ah)}
    .note{font-size:10.5px;fill:var(--muted)}
    .r0{fill:#3b5bdb}.r1{fill:#8b5cf6}.r2{fill:#2f9e6e}.r3{fill:#7cb342}
    .r4{fill:#e0a030}.r5{fill:#e07a3f}.r6{fill:#e05f8f}.r7{fill:#5c6bc0}
    @media (prefers-color-scheme:dark){
      .r0{fill:#8fa6ff}.r1{fill:#b79cff}.r2{fill:#6fd3a8}.r3{fill:#a7d86f}
      .r4{fill:#e6c05c}.r5{fill:#e8a06a}.r6{fill:#e88aa8}.r7{fill:#8f9cf0}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect width="920" height="380" fill="var(--bg)"/>

  <!-- X0 matrix -->
  <g>
    <text class="ttl" x="22" y="52">X⁽⁰⁾</text>
    <rect class="box" x="20" y="64" width="80" height="200" rx="4"/>
    <g>
      <rect class="r0" x="26" y="70" width="68" height="22"/><rect class="r1" x="26" y="94" width="68" height="22"/>
      <rect class="r2" x="26" y="118" width="68" height="22"/><rect class="r3" x="26" y="142" width="68" height="22"/>
      <rect class="r4" x="26" y="166" width="68" height="22"/><rect class="r5" x="26" y="190" width="68" height="22"/>
      <rect class="r6" x="26" y="214" width="68" height="22"/><rect class="r7" x="26" y="238" width="68" height="22"/>
    </g>
    <text class="small" x="24" y="282">N × d_model</text>
  </g>
  <line class="arrow" x1="100" y1="164" x2="128" y2="164"/>

  <!-- Layer 1 -->
  <rect class="box" x="130" y="64" width="150" height="200" rx="7"/>
  <text class="ttl" x="142" y="84">Encoder Layer 1</text>
  <rect class="box" x="142" y="96" width="126" height="30" rx="5"/><text class="lbl" x="156" y="116">Self-Attention</text>
  <line class="arrow" x1="205" y1="126" x2="205" y2="140"/>
  <rect class="box" x="142" y="142" width="126" height="26" rx="5"/><text class="lbl" x="158" y="159">Add &amp; Norm</text>
  <line class="arrow" x1="205" y1="168" x2="205" y2="182"/>
  <rect class="box" x="142" y="184" width="126" height="26" rx="5"/><text class="lbl" x="186" y="201">FFN</text>
  <line class="arrow" x1="205" y1="210" x2="205" y2="224"/>
  <rect class="box" x="142" y="226" width="126" height="26" rx="5"/><text class="lbl" x="158" y="243">Add &amp; Norm</text>
  <line class="arrow" x1="280" y1="164" x2="308" y2="164"/>

  <!-- X1 matrix -->
  <g>
    <text class="ttl" x="312" y="52">X⁽¹⁾</text>
    <rect class="box" x="310" y="64" width="80" height="200" rx="4"/>
    <g>
      <rect class="r0" x="316" y="70" width="68" height="22"/><rect class="r1" x="316" y="94" width="68" height="22"/>
      <rect class="r2" x="316" y="118" width="68" height="22"/><rect class="r3" x="316" y="142" width="68" height="22"/>
      <rect class="r4" x="316" y="166" width="68" height="22"/><rect class="r5" x="316" y="190" width="68" height="22"/>
      <rect class="r6" x="316" y="214" width="68" height="22"/><rect class="r7" x="316" y="238" width="68" height="22"/>
    </g>
    <text class="small" x="314" y="282">N × d_model</text>
  </g>

  <text class="ttl" x="410" y="170">…</text>
  <line class="arrow" x1="390" y1="164" x2="430" y2="164"/>

  <!-- Layer L -->
  <rect class="box" x="432" y="64" width="150" height="200" rx="7"/>
  <text class="ttl" x="444" y="84">Encoder Layer L</text>
  <rect class="box" x="444" y="96" width="126" height="30" rx="5"/><text class="lbl" x="458" y="116">Self-Attention</text>
  <line class="arrow" x1="507" y1="126" x2="507" y2="140"/>
  <rect class="box" x="444" y="142" width="126" height="26" rx="5"/><text class="lbl" x="460" y="159">Add &amp; Norm</text>
  <line class="arrow" x1="507" y1="168" x2="507" y2="182"/>
  <rect class="box" x="444" y="184" width="126" height="26" rx="5"/><text class="lbl" x="488" y="201">FFN</text>
  <line class="arrow" x1="507" y1="210" x2="507" y2="224"/>
  <rect class="box" x="444" y="226" width="126" height="26" rx="5"/><text class="lbl" x="460" y="243">Add &amp; Norm</text>
  <line class="arrow" x1="582" y1="164" x2="610" y2="164"/>

  <!-- H matrix -->
  <g>
    <text class="ttl" x="614" y="52">H</text>
    <rect class="box" x="612" y="64" width="80" height="200" rx="4"/>
    <g>
      <rect class="r0" x="618" y="70" width="68" height="22"/><rect class="r1" x="618" y="94" width="68" height="22"/>
      <rect class="r2" x="618" y="118" width="68" height="22"/><rect class="r3" x="618" y="142" width="68" height="22"/>
      <rect class="r4" x="618" y="166" width="68" height="22"/><rect class="r5" x="618" y="190" width="68" height="22"/>
      <rect class="r6" x="618" y="214" width="68" height="22"/><rect class="r7" x="618" y="238" width="68" height="22"/>
    </g>
    <text class="small" x="616" y="282">N × d_model</text>
  </g>

  <!-- H to decoder K/V -->
  <line class="arrow" x1="692" y1="120" x2="740" y2="120"/>
  <line class="arrow" x1="692" y1="210" x2="740" y2="210"/>
  <rect class="box" x="742" y="82" width="150" height="170" rx="7"/>
  <text class="ttl" x="752" y="102">Decoder 交叉注意力</text>
  <text class="small" x="752" y="122">K = H W_K</text>
  <text class="small" x="752" y="140">V = H W_V</text>
  <text class="small" x="752" y="168">Q 来自 Decoder</text>
  <rect class="box" x="772" y="270" width="88" height="26" rx="5"/>
  <text class="lbl" x="786" y="288">Q（Decoder）</text>
  <line class="arrow" x1="816" y1="270" x2="816" y2="254"/>

  <text class="note" x="20" y="322">每一层的输入输出形状都是 N × d_model；堆叠只更新每一行的内容，不改变行数。</text>
  <text class="note" x="20" y="342">H 的第 i 行对应输入序列的第 i 个位置，作为解码器交叉注意力的键和值来源。</text>
</svg>
