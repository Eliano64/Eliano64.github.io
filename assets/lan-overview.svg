<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">局域网中的设备、链路与二层边界</title>
  <desc id="desc">一个交换式局域网示例。主机、服务器和无线接入点连接交换机，路由器作为默认网关并终止二层广播。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--blue)"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--green)"/>
    </marker>
    <style>
      :root { --bg:#f8fafc; --panel:#ffffff; --ink:#172033; --muted:#59677b; --line:#718096; --blue:#2563eb; --green:#059669; --amber:#d97706; --purple:#7c3aed; --soft:#eef4fb; }
      @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --panel:#172033; --ink:#edf3fb; --muted:#b4c0d0; --line:#94a3b8; --blue:#60a5fa; --green:#34d399; --amber:#fbbf24; --purple:#c4b5fd; --soft:#1e2c42; } }
      text { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; fill:var(--ink); }
      .title { font-size:26px; font-weight:800; }
      .heading { font-size:17px; font-weight:750; }
      .body { font-size:15px; }
      .small { font-size:13px; fill:var(--muted); }
      .boundary { fill:var(--panel); stroke:var(--line); stroke-width:1.8; stroke-dasharray:8 6; }
      .device { fill:var(--soft); stroke:var(--blue); stroke-width:2; }
      .switch { fill:var(--panel); stroke:var(--purple); stroke-width:2.4; }
      .router { fill:var(--panel); stroke:var(--amber); stroke-width:2.4; }
      .wired { fill:none; stroke:var(--line); stroke-width:2.4; }
      .frame { fill:none; stroke:var(--blue); stroke-width:3.2; marker-end:url(#arrow-blue); }
      .wireless { fill:none; stroke:var(--green); stroke-width:2.5; stroke-dasharray:7 6; marker-end:url(#arrow-green); }
    </style>
  </defs>

  <rect width="1100" height="560" fill="var(--bg)"/>
  <text x="40" y="45" class="title">局域网中的设备、链路与二层边界</text>

  <rect x="30" y="68" width="905" height="420" rx="18" class="boundary"/>
  <text x="54" y="99" class="heading">一个二层广播域（例如 VLAN 10）</text>
  <text x="54" y="121" class="small">交换机会转发广播帧；路由器不会把该二层广播继续转发到外部网络</text>

  <rect x="390" y="230" width="150" height="76" rx="12" class="switch"/>
  <text x="465" y="261" text-anchor="middle" class="heading">交换机</text>
  <text x="465" y="285" text-anchor="middle" class="small">按目的 MAC 转发帧</text>

  <rect x="75" y="170" width="130" height="64" rx="11" class="device"/>
  <text x="140" y="198" text-anchor="middle" class="heading">主机 A</text>
  <text x="140" y="218" text-anchor="middle" class="small">端系统 + 网卡</text>

  <rect x="75" y="342" width="130" height="64" rx="11" class="device"/>
  <text x="140" y="370" text-anchor="middle" class="heading">服务器</text>
  <text x="140" y="390" text-anchor="middle" class="small">端系统 + 网卡</text>

  <rect x="630" y="335" width="125" height="68" rx="11" class="device"/>
  <text x="692" y="365" text-anchor="middle" class="heading">AP</text>
  <text x="692" y="386" text-anchor="middle" class="small">无线接入点</text>

  <rect x="805" y="172" width="105" height="72" rx="12" class="router"/>
  <text x="857" y="202" text-anchor="middle" class="heading">路由器</text>
  <text x="857" y="224" text-anchor="middle" class="small">默认网关</text>

  <rect x="802" y="365" width="104" height="58" rx="10" class="device"/>
  <text x="854" y="400" text-anchor="middle" class="body">无线站点</text>

  <path d="M205 202 L390 250" class="wired"/>
  <path d="M205 374 L390 286" class="wired"/>
  <path d="M540 281 L630 353" class="wired"/>
  <path d="M540 250 L805 210" class="wired"/>

  <path d="M205 188 L385 237" class="frame"/>
  <path d="M545 238 L799 200" class="frame"/>
  <text x="560" y="184" class="small">发往其他网络：帧先交给默认网关</text>

  <path d="M802 387 C770 380 751 372 755 369" class="wireless"/>
  <text x="720" y="442" text-anchor="middle" class="small">无线站点共享无线信道</text>

  <path d="M910 208 L1010 208" class="wired"/>
  <rect x="1005" y="171" width="72" height="74" rx="12" fill="var(--soft)" stroke="var(--line)" stroke-width="2"/>
  <text x="1041" y="200" text-anchor="middle" class="body">其他</text>
  <text x="1041" y="222" text-anchor="middle" class="body">网络</text>
  <line x1="935" y1="135" x2="935" y2="280" stroke="var(--amber)" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="950" y="300" class="small" fill="var(--amber)">二层广播边界</text>

  <text x="42" y="526" class="small">蓝色路径表示主机访问外部网络时的本地帧路径；进入下一条链路后，路由器会重新封装帧。</text>
</svg>
