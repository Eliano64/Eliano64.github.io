<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
  <title id="title">ASK FSK PSK 波形比较</title>
  <desc id="desc">以比特序列 1 0 1 1 为例，比较幅移键控、频移键控和相移键控的载波波形。</desc>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f8fafc;
      --text: #172033;
      --muted: #64748b;
      --line: #334155;
      --grid: #cbd5e1;
      --blue: #2563eb;
      --green: #16a34a;
      --amber: #d97706;
      --purple: #7c3aed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --line: #94a3b8;
        --grid: #334155;
        --blue: #60a5fa;
        --green: #4ade80;
        --amber: #fbbf24;
        --purple: #c4b5fd;
      }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.6; }
    .axis { stroke: var(--line); stroke-width: 1.2; }
    .grid { stroke: var(--grid); stroke-width: 1.2; stroke-dasharray: 5 5; }
    .ask { fill: none; stroke: var(--blue); stroke-width: 3; }
    .fsk { fill: none; stroke: var(--green); stroke-width: 3; }
    .psk { fill: none; stroke: var(--amber); stroke-width: 3; }
    text { fill: var(--text); font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 700; }
    .small { font-size: 15px; fill: var(--muted); }
    .bit { font: 700 20px Consolas, monospace; text-anchor: middle; }
  </style>

  <rect class="bg" width="980" height="650"/>
  <text class="title" x="46" y="48">数字数据调制：改变载波的哪个参数？</text>
  <text class="small" x="46" y="76">示例 bit 序列：1　0　1　1；虚线是码元边界</text>

  <text class="bit" x="352" y="112">1</text>
  <text class="bit" x="512" y="112">0</text>
  <text class="bit" x="672" y="112">1</text>
  <text class="bit" x="832" y="112">1</text>

  <rect class="panel" x="42" y="130" width="896" height="142" rx="12"/>
  <text class="label" x="78" y="170">ASK</text>
  <text class="small" x="78" y="198">改变振幅</text>
  <line class="axis" x1="272" y1="207" x2="912" y2="207"/>
  <line class="grid" x1="272" y1="150" x2="272" y2="250"/>
  <line class="grid" x1="432" y1="150" x2="432" y2="250"/>
  <line class="grid" x1="592" y1="150" x2="592" y2="250"/>
  <line class="grid" x1="752" y1="150" x2="752" y2="250"/>
  <line class="grid" x1="912" y1="150" x2="912" y2="250"/>
  <path class="ask" d="M272 207 C282 162 292 162 302 207 S322 252 332 207 S352 162 362 207 S382 252 392 207 S412 162 422 207 M432 207 H592 M592 207 C602 162 612 162 622 207 S642 252 652 207 S672 162 682 207 S702 252 712 207 S732 162 742 207 M752 207 C762 162 772 162 782 207 S802 252 812 207 S832 162 842 207 S862 252 872 207 S892 162 902 207"/>

  <rect class="panel" x="42" y="290" width="896" height="142" rx="12"/>
  <text class="label" x="78" y="330">FSK</text>
  <text class="small" x="78" y="358">改变频率</text>
  <line class="axis" x1="272" y1="367" x2="912" y2="367"/>
  <line class="grid" x1="272" y1="310" x2="272" y2="410"/>
  <line class="grid" x1="432" y1="310" x2="432" y2="410"/>
  <line class="grid" x1="592" y1="310" x2="592" y2="410"/>
  <line class="grid" x1="752" y1="310" x2="752" y2="410"/>
  <line class="grid" x1="912" y1="310" x2="912" y2="410"/>
  <path class="fsk" d="M272 367 C282 327 292 327 302 367 S322 407 332 367 S352 327 362 367 S382 407 392 367 S412 327 422 367 M432 367 C452 327 472 327 492 367 S532 407 552 367 S572 327 592 367 M592 367 C602 327 612 327 622 367 S642 407 652 367 S672 327 682 367 S702 407 712 367 S732 327 742 367 M752 367 C762 327 772 327 782 367 S802 407 812 367 S832 327 842 367 S862 407 872 367 S892 327 902 367"/>

  <rect class="panel" x="42" y="450" width="896" height="142" rx="12"/>
  <text class="label" x="78" y="490">PSK</text>
  <text class="small" x="78" y="518">改变相位</text>
  <line class="axis" x1="272" y1="527" x2="912" y2="527"/>
  <line class="grid" x1="272" y1="470" x2="272" y2="570"/>
  <line class="grid" x1="432" y1="470" x2="432" y2="570"/>
  <line class="grid" x1="592" y1="470" x2="592" y2="570"/>
  <line class="grid" x1="752" y1="470" x2="752" y2="570"/>
  <line class="grid" x1="912" y1="470" x2="912" y2="570"/>
  <path class="psk" d="M272 527 C282 487 292 487 302 527 S322 567 332 527 S352 487 362 527 S382 567 392 527 S412 487 422 527 M432 527 C442 567 452 567 462 527 S482 487 492 527 S512 567 522 527 S542 487 552 527 S572 567 582 527 M592 527 C602 487 612 487 622 527 S642 567 652 527 S672 487 682 527 S702 567 712 527 S732 487 742 527 M752 527 C762 487 772 487 782 527 S802 567 812 527 S832 487 842 527 S862 567 872 527 S892 487 902 527"/>

  <text class="small" x="490" y="628" text-anchor="middle">ASK：振幅不同　　FSK：频率不同　　PSK：相位不同</text>
</svg>
