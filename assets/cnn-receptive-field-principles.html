<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>感受野：两层的覆盖范围</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;
--in:#dbe7ff; --inS:#2f5bb7; --param:#ece0ff; --paramS:#6b46c1;
--state:#e9edf3; --stateS:#4a5568; --out:#d9f2e2; --outS:#2f7a4f;
--cur:#ffe6c7; --curS:#b45309; --accent:#2f5bb7;
}
@media (prefers-color-scheme:dark){:root{
--bg:#14181f; --panel:#1c222b; --fg:#e8ecf3; --muted:#9aa4b2; --line:#39424f;
--in:#1f3149; --inS:#8fb0ef; --param:#2d2350; --paramS:#b49af0;
--state:#262d38; --stateS:#aab4c2; --out:#1e3a2b; --outS:#87c9a2;
--cur:#4a3418; --curS:#f0b26b; --accent:#8fb0ef;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>感受野：两层的覆盖范围</h1><p class="sub">核宽 3、步幅 1：第一层 3 个窗口，第二层读这 3 个位置，并集是 5 个输入位置</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="感受野：两层的覆盖范围"><rect x="0" y="0" width="1100" height="620" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wp{stroke:var(--paramS);stroke-width:2.2;fill:none;marker-end:url(#arp)}
.ws{stroke:var(--stateS);stroke-width:2.2;fill:none;marker-end:url(#ars)}
.wout{stroke:var(--outS);stroke-width:2.2;fill:none;marker-end:url(#aro)}
.wcur{stroke:var(--curS);stroke-width:2.2;fill:none;marker-end:url(#arc)}
.win{stroke:var(--inS);stroke-width:2.2;fill:none;marker-end:url(#ari)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}
</style><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="arp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--paramS)"/></marker>
<marker id="ars" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--stateS)"/></marker>
<marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--outS)"/></marker>
<marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--curS)"/></marker>
<marker id="ari" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--inS)"/></marker></defs><text class="tt" x="28" y="52">感受野：两层的覆盖范围</text><text class="ss" x="28" y="80">核宽 3、步幅 1：第一层 3 个窗口，第二层读这 3 个位置，并集是 5 个输入位置</text><rect x="30" y="104" width="14" height="14" rx="3" fill="var(--in)" stroke="var(--inS)"/><text class="sm" x="49" y="116">输入</text><rect x="120" y="104" width="14" height="14" rx="3" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="139" y="116">参数</text><rect x="210" y="104" width="14" height="14" rx="3" fill="var(--state)" stroke="var(--stateS)"/><text class="sm" x="229" y="116">中间状态</text><rect x="300" y="104" width="14" height="14" rx="3" fill="var(--out)" stroke="var(--outS)"/><text class="sm" x="319" y="116">输出</text><rect x="390" y="104" width="14" height="14" rx="3" fill="var(--cur)" stroke="var(--curS)"/><text class="sm" x="409" y="116">当前步</text><rect x="848" y="92" width="222" height="66" rx="10" fill="var(--panel)" stroke="var(--line)"/><text class="sm" x="860" y="112">图例</text><text class="sm" x="860" y="132">核宽 3，步幅 1</text><text class="sm" x="860" y="150">重叠部分只算一次</text><text class="sm" x="40" y="150">输入位置（0–6）</text><rect class="b in" x="60" y="164" width="64" height="36" rx="10"/><text class="sm" x="92.0" y="188.0" text-anchor="middle">0</text><rect class="b in" x="132" y="164" width="64" height="36" rx="10"/><text class="sm" x="164.0" y="188.0" text-anchor="middle">1</text><rect class="b in" x="204" y="164" width="64" height="36" rx="10"/><text class="sm" x="236.0" y="188.0" text-anchor="middle">2</text><rect class="b in" x="276" y="164" width="64" height="36" rx="10"/><text class="sm" x="308.0" y="188.0" text-anchor="middle">3</text><rect class="b in" x="348" y="164" width="64" height="36" rx="10"/><text class="sm" x="380.0" y="188.0" text-anchor="middle">4</text><rect class="b in" x="420" y="164" width="64" height="36" rx="10"/><text class="sm" x="452.0" y="188.0" text-anchor="middle">5</text><rect class="b in" x="492" y="164" width="64" height="36" rx="10"/><text class="sm" x="524.0" y="188.0" text-anchor="middle">6</text><path class="wp" d="M60,225 L60,245 L268,245 L268,225"/><path class="win" d="M164.0,268 L164.0,288"/><path class="wp" d="M132,225 L132,245 L340,245 L340,225"/><path class="win" d="M236.0,268 L236.0,288"/><path class="wp" d="M204,225 L204,245 L412,245 L412,225"/><path class="win" d="M308.0,268 L308.0,288"/><text class="sm" x="40" y="326">第二层窗口读这 3 个位置</text><rect class="b param" x="60" y="336" width="300" height="56" rx="10"/><text class="sm" x="210.0" y="370.0" text-anchor="middle">第二层：核宽 3，步幅 1</text><path class="wp" d="M364,364 L396,364"/><rect class="b out" x="400" y="336" width="260" height="56" rx="10"/><text class="sm" x="530.0" y="370.0" text-anchor="middle">并集：输入 0–4（5 个位置）</text><rect x="54" y="158" width="364" height="48" rx="8" fill="none" stroke="var(--outS)" stroke-width="2.5"/><rect x="620" y="200" width="420" height="60" rx="8" fill="var(--state)" opacity="0.7"/><text class="sm" x="632" y="224">核宽不能直接相乘：3+3=6，实际是 5</text><text class="sm" x="632" y="246">重叠部分只算一次</text><rect x="60" y="470" width="700" height="66" rx="12" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="76" y="496">感受野 = 两层窗口覆盖的输入并集</text><text class="sm" x="76" y="520">层数越多、步幅越大，后层一个位置覆盖的输入范围越大</text><rect class="b param" x="30" y="572" width="196" height="34" rx="8"/><text class="sm" x="128.0" y="594" text-anchor="middle">第一层 3 个窗口</text><path class="wire" d="M228,589 L242,589"/><rect class="b param" x="244" y="572" width="196" height="34" rx="8"/><text class="sm" x="342.0" y="594" text-anchor="middle">第二层读 3 个</text><path class="wire" d="M442,589 L456,589"/><rect class="b out" x="458" y="572" width="196" height="34" rx="8"/><text class="sm" x="556.0" y="594" text-anchor="middle">并集 5 个</text></svg></div></div></body></html>
