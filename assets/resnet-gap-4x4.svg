<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="4×4 特征图求平均：总和 5.4，除以 16 得 0.3375，约 0.34">
<style>
:root{--bg:#ffffff;--ink:#1b1f24;--muted:#4d5865;--grid:#b9c3ce;--cell:#f4f7fa;--accent:#0b6b64;}
@media (prefers-color-scheme: dark){:root{--bg:#14171c;--ink:#e8ebf0;--muted:#a7b1be;--grid:#3b434e;--cell:#1d222a;--accent:#2dd4bf;}}
text{font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;}
.head{font-size:22px;fill:var(--ink);}
.label{font-size:20px;fill:var(--muted);}
.op{font-size:24px;fill:var(--ink);}
</style>
<rect width="520" height="340" fill="var(--bg)"/>
<text x="20" y="32" class="head">全局平均池化：4×4 → 1</text>
<text x="20" y="60" class="label">单通道特征图</text>
<rect x="20" y="72" width="208" height="208" fill="var(--cell)" stroke="var(--grid)" stroke-width="1.2"/>
<line x1="72" y1="72" x2="72" y2="280" stroke="var(--grid)" stroke-width="1"/>
<line x1="124" y1="72" x2="124" y2="280" stroke="var(--grid)" stroke-width="1"/>
<line x1="176" y1="72" x2="176" y2="280" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="124" x2="228" y2="124" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="176" x2="228" y2="176" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="228" x2="228" y2="228" stroke="var(--grid)" stroke-width="1"/>
<text x="46.0" y="104.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.2</text>
<text x="98.0" y="104.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.4</text>
<text x="150.0" y="104.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.1</text>
<text x="202.0" y="104.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.3</text>
<text x="46.0" y="156.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.6</text>
<text x="98.0" y="156.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.5</text>
<text x="150.0" y="156.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.2</text>
<text x="202.0" y="156.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.4</text>
<text x="46.0" y="208.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.3</text>
<text x="98.0" y="208.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.1</text>
<text x="150.0" y="208.48" text-anchor="middle" font-size="18" fill="var(--ink)">0</text>
<text x="202.0" y="208.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.2</text>
<text x="46.0" y="260.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.7</text>
<text x="98.0" y="260.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.6</text>
<text x="150.0" y="260.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.3</text>
<text x="202.0" y="260.48" text-anchor="middle" font-size="18" fill="var(--ink)">0.5</text>
<text x="260" y="130" class="label">总和 Σ = 5.4</text>
<text x="260" y="160" class="label">除以 H×W = 16</text>
<text x="260" y="198" class="op">0.3375</text>
<text x="260" y="226" class="label">≈ 0.34</text>
<text x="20" y="316" class="label">每个通道单独取平均，输出通道数保持 C。</text>
</svg>