<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>RIP 多路由器距离无穷计数</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f8fafc;--panel:#fff;--text:#172033;--muted:#526174;
  --line:#64748b;--red:#dc2626;--blue:#2563eb;--green:#059669;
  --amber:#b45309;--purple:#7c3aed;--border:#cbd5e1;--soft:#eef2f7;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#020617;--panel:#111827;--text:#e5e7eb;--muted:#a8b3c5;
    --line:#94a3b8;--red:#f87171;--blue:#60a5fa;--green:#34d399;
    --amber:#fbbf24;--purple:#c4b5fd;--border:#334155;--soft:#172033;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
.wrap{max-width:1040px;margin:auto;padding:14px 18px 12px}
.title{text-align:center;font-size:23px;font-weight:800;margin:0 0 12px}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:14px;align-items:stretch}
.side{display:grid;grid-template-rows:repeat(4,1fr);gap:8px}
.step{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 10px;cursor:pointer}
.step.active{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.step b{display:block;font-size:15px;margin-bottom:3px}
.step span{display:block;font-size:13px;color:var(--muted);line-height:1.38}
.stage{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:8px 12px 10px}
svg{display:block;width:100%;height:334px}
.note{min-height:46px;margin-top:3px;padding:8px 10px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:14px;line-height:1.45}
.note strong{color:var(--text)}
.controls{text-align:center;margin-top:10px}
button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 14px;margin:0 4px;cursor:pointer}
button:hover{border-color:var(--blue)}
@media(max-width:760px){
  .wrap{padding:10px}.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(4,1fr);grid-template-rows:none}.step span{display:none}
  svg{height:310px}.title{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">RIP 坏消息传播慢：多路由器形成计数环路</div>
  <div class="layout">
    <div class="side" id="steps" aria-label="演示步骤"></div>
    <div class="stage">
      <svg viewBox="0 0 680 350" role="img" aria-label="A、B、C 三台路由器围绕网络 D 形成距离无穷计数">
        <defs>
          <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
          <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
          <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
        </defs>

        <rect x="292" y="12" width="96" height="50" rx="8" fill="var(--panel)" stroke="var(--green)" stroke-width="2"/>
        <text x="340" y="34" text-anchor="middle" fill="var(--text)" font-size="18" font-weight="700">网络 D</text>
        <text x="340" y="52" text-anchor="middle" fill="var(--muted)" font-size="12">目的网络</text>

        <line x1="340" y1="62" x2="340" y2="92" stroke="var(--red)" stroke-width="3" stroke-dasharray="7 5"/>
        <line x1="328" y1="72" x2="352" y2="88" stroke="var(--red)" stroke-width="3"/>
        <line x1="352" y1="72" x2="328" y2="88" stroke="var(--red)" stroke-width="3"/>
        <text x="367" y="82" fill="var(--red)" font-size="12">故障</text>

        <line x1="315" y1="133" x2="186" y2="229" stroke="var(--line)" stroke-width="2.5"/>
        <line x1="365" y1="133" x2="494" y2="229" stroke="var(--line)" stroke-width="2.5"/>
        <line x1="196" y1="252" x2="484" y2="252" stroke="var(--line)" stroke-width="2.5"/>

        <circle cx="340" cy="118" r="30" fill="var(--panel)" stroke="var(--blue)" stroke-width="2.5"/>
        <circle cx="165" cy="250" r="31" fill="var(--panel)" stroke="var(--blue)" stroke-width="2.5"/>
        <circle cx="515" cy="250" r="31" fill="var(--panel)" stroke="var(--blue)" stroke-width="2.5"/>
        <text x="340" y="125" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700">B</text>
        <text x="165" y="257" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700">A</text>
        <text x="515" y="257" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700">C</text>

        <rect x="257" y="151" width="166" height="29" rx="7" fill="var(--soft)" stroke="var(--border)"/>
        <rect x="64" y="289" width="202" height="29" rx="7" fill="var(--soft)" stroke="var(--border)"/>
        <rect x="414" y="289" width="202" height="29" rx="7" fill="var(--soft)" stroke="var(--border)"/>
        <text id="stateB" x="340" y="171" text-anchor="middle" fill="var(--text)" font-size="14"></text>
        <text id="stateA" x="165" y="309" text-anchor="middle" fill="var(--text)" font-size="14"></text>
        <text id="stateC" x="515" y="309" text-anchor="middle" fill="var(--text)" font-size="14"></text>

        <path id="msg1" fill="none" stroke-width="4"/>
        <path id="msg2" fill="none" stroke-width="4"/>
        <text id="label1" text-anchor="middle" font-size="14" font-weight="700" style="paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round"></text>
        <text id="label2" text-anchor="middle" font-size="14" font-weight="700" style="paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round"></text>
        <text id="caption" x="340" y="342" text-anchor="middle" fill="var(--muted)" font-size="14"></text>
      </svg>
      <div class="note" id="note" aria-live="polite"></div>
    </div>
  </div>
  <div class="controls">
    <button id="prev" type="button">上一步</button>
    <button id="next" type="button">下一步</button>
  </div>
</div>
<script>
const colors={
  red:{stroke:"var(--red)",marker:"url(#arrow-red)"},
  amber:{stroke:"var(--amber)",marker:"url(#arrow-amber)"},
  purple:{stroke:"var(--purple)",marker:"url(#arrow-purple)"}
};
const data=[
  {
    title:"坏消息先到 A",
    summary:"B 到 D 的链路失效，B 先通知 A；C 仍保留旧路由。",
    a:"A：D = 16",
    b:"B：D = 16",
    c:"C：D = 2，经 B（旧）",
    caption:"C 尚未收到坏消息",
    note:"A 已删除经 B 到 D 的路由，但 C 仍以为自己可以经 B 到达 D。",
    arrows:[
      {d:"M318 139 Q245 165 184 222",label:"B → A：D = 16",x:245,y:174,color:"red"}
    ]
  },
  {
    title:"旧距离误导 A",
    summary:"C 向 A 通告旧距离 2，A 改为经 C 到 D，距离为 3。",
    a:"A：D = 3，经 C",
    b:"B：D = 16",
    c:"C：D = 2，经 B（旧）",
    caption:"A 看不出 C 的旧路径本来就经过 B",
    note:"A 只收到“C 到 D 的距离为 2”，不知道这条路径实际是 C → B → D。",
    arrows:[
      {d:"M484 268 Q340 337 196 268",label:"C → A：D = 2",x:340,y:332,color:"amber"}
    ]
  },
  {
    title:"A 又误导 C",
    summary:"C 得知 B 不可达后，又从 A 收到有限距离，于是改为经 A。",
    a:"A：D = 3，经 C",
    b:"B：D = 16",
    c:"C：D = 4，经 A",
    caption:"A、C 的下一跳开始互相指向对方",
    note:"C 先放弃经 B 的旧路由，又被 A 通告的距离 3 误导，得到候选距离 4。",
    arrows:[
      {d:"M362 140 Q440 165 496 222",label:"B → C：D = 16",x:438,y:174,color:"red",dash:"7 5"},
      {d:"M196 268 Q340 327 484 268",label:"A → C：D = 3",x:340,y:323,color:"amber"}
    ]
  },
  {
    title:"距离逐步增至 16",
    summary:"A、C 相互通告更大的有限距离，直到 RIP 判定不可达。",
    a:"A：3、5、7…→16",
    b:"B：D = 16",
    c:"C：4、6、8…→16",
    caption:"距离无穷计数：有限值不断增加，最终达到 16",
    note:"A 与 C 互相把对方当作下一跳，分组会在二者之间循环；RIP 用 16 表示不可达，限制了计数过程。",
    arrows:[
      {d:"M196 236 Q340 177 484 236",label:"A → C：5、7…",x:340,y:191,color:"purple"},
      {d:"M484 268 Q340 337 196 268",label:"C → A：4、6…",x:340,y:332,color:"purple"}
    ]
  }
];

let index=0;
const steps=document.getElementById("steps");
data.forEach((item,i)=>{
  const el=document.createElement("div");
  el.className="step";
  el.innerHTML=`<b>${i+1}. ${item.title}</b><span>${item.summary}</span>`;
  el.addEventListener("click",()=>{index=i;render()});
  steps.appendChild(el);
});

function drawArrow(pathEl,labelEl,item){
  if(!item){
    pathEl.style.display="none";
    labelEl.style.display="none";
    return;
  }
  const color=colors[item.color];
  pathEl.style.display="";
  labelEl.style.display="";
  pathEl.setAttribute("d",item.d);
  pathEl.setAttribute("stroke",color.stroke);
  pathEl.setAttribute("marker-end",color.marker);
  pathEl.setAttribute("stroke-dasharray",item.dash||"");
  labelEl.setAttribute("x",item.x);
  labelEl.setAttribute("y",item.y);
  labelEl.setAttribute("fill",color.stroke);
  labelEl.textContent=item.label;
}

function render(){
  const item=data[index];
  [...steps.children].forEach((el,i)=>el.classList.toggle("active",i===index));
  stateA.textContent=item.a;
  stateB.textContent=item.b;
  stateC.textContent=item.c;
  caption.textContent=item.caption;
  note.innerHTML=`<strong>${item.title}：</strong>${item.note}`;
  drawArrow(msg1,label1,item.arrows[0]);
  drawArrow(msg2,label2,item.arrows[1]);
}

prev.addEventListener("click",()=>{index=(index+data.length-1)%data.length;render()});
next.addEventListener("click",()=>{index=(index+1)%data.length;render()});
render();
</script>
</body>
</html>
