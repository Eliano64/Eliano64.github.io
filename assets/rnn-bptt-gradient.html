<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>梯度过时间回退：连乘的缩放</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;
--in:#dbe7ff; --inS:#2f5bb7; --param:#ece0ff; --paramS:#6b46c1;
--state:#e9edf3; --stateS:#4a5568; --out:#d9f2e2; --outS:#2f7a4f;
--cur:#ffe6c7; --curS:#b45309; --accent:#2f5bb7;
}
@media (prefers-color-scheme:dark){:root{
--bg:#14181f; --panel:#1c222b; --fg:#e8ecf3; --muted:#9aa4b2; --line:#39424f;
--in:#1f3149; --inS:#8fb0ef; --param:#2d2350; --paramS:#b49af0;
--state:#262d38; --stateS:#aab4c2; --out:#1e3a2b; --outS:#87c9a2;
--cur:#4a3418; --curS:#f0b26b; --accent:#8fb0ef;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>梯度过时间回退：连乘的缩放</h1><p class="sub">|w|=0.5 时逐步变小，|w|=1.6 时逐步变大；两者都是同一因子反复相乘</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="梯度过时间回退：连乘的缩放"><rect x="0" y="0" width="1100" height="620" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wp{stroke:var(--paramS);stroke-width:2.2;fill:none;marker-end:url(#arp)}
.ws{stroke:var(--stateS);stroke-width:2.2;fill:none;marker-end:url(#ars)}
.wout{stroke:var(--outS);stroke-width:2.2;fill:none;marker-end:url(#aro)}
.wcur{stroke:var(--curS);stroke-width:2.2;fill:none;marker-end:url(#arc)}
.win{stroke:var(--inS);stroke-width:2.2;fill:none;marker-end:url(#ari)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}
</style><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="arp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--paramS)"/></marker>
<marker id="ars" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--stateS)"/></marker>
<marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--outS)"/></marker>
<marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--curS)"/></marker>
<marker id="ari" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--inS)"/></marker></defs><text class="tt" x="28" y="52">梯度过时间回退：连乘的缩放</text><text class="ss" x="28" y="80">|w|=0.5 时逐步变小，|w|=1.6 时逐步变大；两者都是同一因子反复相乘</text><path d="M140,460 L740,460" stroke="var(--line)" stroke-width="1.4"/><path d="M140,460 L140,140" stroke="var(--line)" stroke-width="1.4"/><text class="sm" x="140.0" y="482" text-anchor="middle">0</text><text class="sm" x="200.0" y="482" text-anchor="middle">1</text><text class="sm" x="260.0" y="482" text-anchor="middle">2</text><text class="sm" x="320.0" y="482" text-anchor="middle">3</text><text class="sm" x="380.0" y="482" text-anchor="middle">4</text><text class="sm" x="440.0" y="482" text-anchor="middle">5</text><text class="sm" x="500.0" y="482" text-anchor="middle">6</text><text class="sm" x="560.0" y="482" text-anchor="middle">7</text><text class="sm" x="620.0" y="482" text-anchor="middle">8</text><text class="sm" x="680.0" y="482" text-anchor="middle">9</text><text class="sm" x="740.0" y="482" text-anchor="middle">10</text><text class="sm" x="128" y="465.0" text-anchor="end">0.001</text><path d="M140,460.0 L740,460.0" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="128" y="419.2857142857143" text-anchor="end">0.01</text><path d="M140,414.2857142857143 L740,414.2857142857143" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="128" y="373.57142857142856" text-anchor="end">0.1</text><path d="M140,368.57142857142856 L740,368.57142857142856" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="128" y="327.8571428571429" text-anchor="end">1</text><path d="M140,322.8571428571429 L740,322.8571428571429" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="128" y="282.14285714285717" text-anchor="end">10</text><path d="M140,277.14285714285717 L740,277.14285714285717" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="128" y="236.42857142857142" text-anchor="end">100</text><path d="M140,231.42857142857142 L740,231.42857142857142" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="3 7"/><text class="sm" x="440.0" y="508" text-anchor="middle">回退步数 t</text><polyline points="140.0,322.9 200.0,336.6 260.0,350.4 320.0,364.1 380.0,377.9 440.0,391.7 500.0,405.4 560.0,419.2 620.0,432.9 680.0,446.7 740.0,460.5" fill="none" stroke="var(--inS)" stroke-width="3"/><polyline points="140.0,322.9 200.0,313.5 260.0,304.2 320.0,294.9 380.0,285.5 440.0,276.2 500.0,266.9 560.0,257.5 620.0,248.2 680.0,238.9 740.0,229.5" fill="none" stroke="var(--curS)" stroke-width="3"/><rect x="780" y="150" width="260" height="80" rx="10" fill="var(--panel)" stroke="var(--line)"/><text class="sm" x="794" y="172">图例</text><path d="M794,189 L826,189" stroke="var(--inS)" stroke-width="3" stroke-dasharray=""/><text class="sm" x="836" y="194">w = 0.5：衰减</text><path d="M794,215 L826,215" stroke="var(--curS)" stroke-width="3" stroke-dasharray=""/><text class="sm" x="836" y="220">w = 1.6：放大</text><text class="sm" x="800" y="250">因子是 w 的连乘；</text><text class="sm" x="800" y="272">深回退时两端都会失控。</text><rect x="30" y="556" width="1040" height="46" rx="10" fill="var(--state)" opacity="0.55"/><text class="sm" x="46" y="584">结论：梯度爆炸与消失来自同一件事：长连乘。门控把因子变成可学的门值，不是取消连乘。</text></svg></div><p class="cap"></p></div></body></html>
