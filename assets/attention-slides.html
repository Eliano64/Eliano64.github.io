<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点积注意力单步演示</title>
<style>
  :root{--bg:#fff;--fg:#1b2330;--muted:#5b6472;--line:#c8d0da;--panel:#f4f7fb;--accent:#3b5bdb}
  @media (prefers-color-scheme: dark){:root{--bg:#171b23;--fg:#e6eaf2;--muted:#9aa4b2;--line:#3a4250;--panel:#1e2430;--accent:#8fa6ff}}
  *{box-sizing:border-box}
  body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,"Noto Sans SC",sans-serif}
  h1{font-size:16px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  button{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
  button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .grid{display:flex;gap:12px;flex-wrap:wrap}
  .col{flex:1 1 250px;min-width:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .muted{color:var(--muted)}
  .bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 6px;align-items:center;font-size:12.5px}
  .track{position:relative;background:var(--line);border-radius:3px;height:11px;overflow:hidden}
  .bar{height:11px;background:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{border-bottom:1px solid var(--line);padding:3px 5px;text-align:left;white-space:nowrap}
  .scroll{overflow-x:auto}
  label.chk{font-size:12.5px;color:var(--muted)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
  <h1>查询、打分、归一化、加权求和</h1>
  <p class="sub">四行状态与两个查询是未训练的演示取值；权重、上下文与柱长由同一份数据算出。</p>

  <div class="controls">
    <button id="q1" type="button" aria-pressed="true">查询“深度”</button>
    <button id="q2" type="button" aria-pressed="false">查询“学习”</button>
    <label class="chk"><input type="checkbox" id="mask"> 第 4 位当作 PAD</label>
    <button id="prev" type="button">上一步</button>
    <button id="next" type="button">下一步</button>
  </div>

  <div class="grid">
    <div class="col">
      <div class="panel">
        <div class="mono" id="stepText" aria-live="polite"></div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <div class="muted" style="font-size:12.5px;margin-bottom:6px">注意力权重（0 到 1）</div>
        <div class="bars" id="bars"></div>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:12px">
    <div class="scroll">
      <table>
        <thead><tr><th>位置</th><th>词</th><th>分数</th><th>权重</th><th>h</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="mono" id="ctx" style="margin-top:8px"></div>
  </div>

<script>
(function(){
  "use strict";
  const words=["Students","love","deep","learning"];
  const H=[[0.2,0.1],[0.1,0.2],[2.5,0.3],[0.3,2.5]];
  const Q={"深度":[1,0],"学习":[0,1]};
  let query="深度", masked=false, step=1;
  const fmt=v=>(Math.abs(v)<0.0005?0:v).toFixed(4);
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
  function compute(){
    const q=Q[query];
    const scores=H.map(h=>dot(q,h));
    const valid=H.map((_,i)=>!(masked && i===3));
    const maskedScores=scores.map((s,i)=>valid[i]?s:-Infinity);
    const m=Math.max.apply(null,maskedScores.filter(isFinite));
    const ex=maskedScores.map(s=>isFinite(s)?Math.exp(s-m):0);
    const sum=ex.reduce((a,v)=>a+v,0);
    const w=ex.map(v=>v/sum);
    const ctx=[0,1].map(d=>w.reduce((a,wi,i)=>a+wi*H[i][d],0));
    return {scores:scores, w:w, ctx:ctx, valid:valid};
  }
  const state=compute();

  function stepText(){
    const r=state, q=Q[query];
    if(step===1){
      return '第 1 步 输入：q = ['+q[0]+', '+q[1]+']，H 的各行见下表。分数、权重与上下文尚未计算。';
    }
    if(step===2){
      return '第 2 步 打分：e_i = q·h_i = ['+r.scores.map(s=>s.toFixed(1)).join(', ')+']。权重与上下文尚未计算。';
    }
    if(step===3){
      const shown=r.w.map(v=>fmt(v)).join(', ');
      return '第 3 步 归一化：softmax(e) = ['+shown+']，和 = '+fmt(r.w.reduce((a,v)=>a+v,0))
        +(masked?'；第 4 位分数为 −∞，不参与归一化':'')+'。上下文尚未计算。';
    }
    return '第 4 步 加权求和：c = Σ α_i·h_i = ['
      + r.w.map((w,i)=>fmt(w)+' · ['+H[i][0]+', '+H[i][1]+']').join(' + ')+'] = ['
      + fmt(r.ctx[0])+', '+fmt(r.ctx[1])+']。';
  }

  function render(){
    document.getElementById('stepText').textContent=stepText();
    const scoresShown = step>=2;
    const weightsShown = step>=3;
    const ctxShown = step>=4;
    const bars=document.getElementById('bars'); bars.innerHTML='';
    words.forEach((w,i)=>{
      const name=document.createElement('span'); name.textContent = (masked&&i===3)?'<pad>':w;
      const track=document.createElement('div'); track.className='track';
      const bar=document.createElement('div'); bar.className='bar';
      if(weightsShown){ bar.style.width=(100*state.w[i]).toFixed(1)+'%'; }
      else { bar.style.display='none'; }
      track.appendChild(bar);
      const val=document.createElement('span'); val.className='mono';
      val.textContent = weightsShown ? fmt(state.w[i]) : '未计算';
      bars.appendChild(name); bars.appendChild(track); bars.appendChild(val);
    });
    const rows=document.getElementById('rows'); rows.innerHTML='';
    words.forEach((w,i)=>{
      const tr=document.createElement('tr');
      tr.innerHTML='<td>'+(i+1)+'</td><td>'+esc((masked&&i===3)?'<pad>':w)+'</td>'
        +'<td class="mono">'+(scoresShown?(state.valid[i]?state.scores[i].toFixed(1):'−∞'):'未计算')+'</td>'
        +'<td class="mono">'+(weightsShown?fmt(state.w[i]):'未计算')+'</td>'
        +'<td class="mono">['+H[i][0]+', '+H[i][1]+']</td>';
      rows.appendChild(tr);
    });
    document.getElementById('ctx').textContent = ctxShown
      ? 'c = ['+fmt(state.ctx[0])+', '+fmt(state.ctx[1])+']'
      : 'c 未计算';
    document.getElementById('q1').setAttribute('aria-pressed',String(query==='深度'));
    document.getElementById('q2').setAttribute('aria-pressed',String(query==='学习'));
    document.getElementById('prev').disabled=step===1;
    document.getElementById('next').disabled=step===4;
  }

  function setQuery(q){ query=q; step=1; const s=compute(); Object.assign(state,s); render(); }
  document.getElementById('q1').addEventListener('click',()=>setQuery('深度'));
  document.getElementById('q2').addEventListener('click',()=>setQuery('学习'));
  document.getElementById('mask').addEventListener('change',e=>{
    masked=e.target.checked; const s=compute(); Object.assign(state,s); render();
  });
  document.getElementById('prev').addEventListener('click',()=>{ if(step>1){step--; render();} });
  document.getElementById('next').addEventListener('click',()=>{ if(step<4){step++; render();} });
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight' && step<4){step++; render();}
    if(e.key==='ArrowLeft' && step>1){step--; render();}
  });
  render();
})();
</script>
</body>
</html>
