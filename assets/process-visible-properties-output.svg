<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Windows 进程属性查询的实测输出</title>
  <desc id="desc">在本机实际运行 tasklist 与 Get-CimInstance 后，将输出等宽转录为便于阅读的终端图。</desc>
  <style>
    :root{color-scheme:light dark;--outer:#e2e8f0;--term:#111827;--bar:#334155;--text:#e5e7eb;--prompt:#86efac;--muted:#94a3b8}
    @media(prefers-color-scheme:dark){:root{--outer:#0b1020;--term:#020617;--bar:#1e293b;--text:#e5e7eb;--prompt:#6ee7b7;--muted:#94a3b8}}
    .bg{fill:var(--outer)}.term{fill:var(--term)}.bar{fill:var(--bar)}text{font-family:Consolas,"Cascadia Mono",monospace;fill:var(--text);font-size:16px}.title{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:15px}.prompt{fill:var(--prompt)}.muted{fill:var(--muted);font-size:14px}
  </style>
  <rect class="bg" width="980" height="500"/>
  <rect class="term" x="20" y="20" width="940" height="460" rx="12"/>
  <path class="bar" d="M32 20 H948 A12 12 0 0 1 960 32 V62 H20 V32 A12 12 0 0 1 32 20Z"/>
  <circle cx="48" cy="41" r="7" fill="#fb7185"/><circle cx="72" cy="41" r="7" fill="#fbbf24"/><circle cx="96" cy="41" r="7" fill="#4ade80"/>
  <text class="title" x="490" y="47" text-anchor="middle">本机实测进程属性（输出转录）</text>

  <text class="prompt" x="42" y="91">C:\&gt; tasklist /fi "PID eq 12800"</text>
  <text x="42" y="125">Image Name             PID   Session Name   Session#   Mem Usage</text>
  <text x="42" y="151">================== ======== ============== ========== ============</text>
  <text x="42" y="177">explorer.exe          12800 Console                1    339,436 K</text>

  <text class="prompt" x="42" y="225">PS C:\&gt; Get-CimInstance Win32_Process -Filter "ProcessId=12800" |</text>
  <text class="prompt" x="42" y="251">         Select ProcessId,ParentProcessId,ThreadCount,Priority,WorkingSetSize</text>
  <text x="42" y="293">ProcessId ParentProcessId ThreadCount Priority WorkingSetSize</text>
  <text x="42" y="319">--------- --------------- ----------- -------- --------------</text>
  <text x="42" y="345">    12800           13292         221        8      347578368</text>

  <text class="muted" x="42" y="402">PID、父 PID、线程数、优先级和工作集由系统查询接口返回。</text>
  <text class="muted" x="42" y="432">进程运行期间数值会变化；这不是 PCB 的内存转储。</text>
  <text class="muted" x="42" y="458">命令于 2026-07-24 在 Windows 本机执行。</text>
</svg>
