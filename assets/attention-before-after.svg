<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
  <title id="t">注意力前后的向量</title>
  <desc id="d">左侧是注意力之前的四个 Token 向量，每个向量只包含自身信息，用单一颜色表示。右侧是注意力之后的四个向量，每个向量混入了其他位置的信息，形状仍为四个分量。中间箭头表示注意力计算。</desc>
  <style>
    :root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--box:#eef3fb;--line:#c8d0da;
      --c0:#3b5bdb;--c1:#2f9e6e;--c2:#c47f17;--c3:#8b5cf6;--panel:#f6f8fc}
    @media (prefers-color-scheme:dark){
      :root{--bg:#171b23;--fg:#e6eaf2;--muted:#9aa4b2;--box:#1e2430;--line:#3a4250;
        --c0:#8fa6ff;--c1:#6fd3a8;--c2:#e6b45c;--c3:#b79cff;--panel:#1b2029}
    }
    text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
    .tok{fill:var(--box);stroke:var(--line);stroke-width:1}
    .lbl{font-size:13px}
    .cap{font-size:12px;fill:var(--muted)}
    .note{font-size:12.5px;fill:var(--muted)}
  </style>
  <rect width="760" height="330" fill="var(--bg)"/>

  <rect x="14" y="14" width="330" height="286" rx="10" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="380" y="14" width="366" height="286" rx="10" fill="var(--panel)" stroke="var(--line)"/>

  <text class="lbl" x="30" y="42" font-weight="600">注意力之前</text>
  <text class="cap" x="30" y="60">每个向量只表示自身</text>
  <text class="lbl" x="400" y="42" font-weight="600">注意力之后</text>
  <text class="cap" x="400" y="60">每个向量融合其他位置</text>

  <g class="before">
    <rect class="tok" x="30"  y="80" width="60" height="26" rx="5"/><text class="lbl" x="52" y="98">x₁</text>
    <rect class="tok" x="110" y="80" width="60" height="26" rx="5"/><text class="lbl" x="132" y="98">x₂</text>
    <rect class="tok" x="190" y="80" width="60" height="26" rx="5"/><text class="lbl" x="212" y="98">x₃</text>
    <rect class="tok" x="270" y="80" width="60" height="26" rx="5"/><text class="lbl" x="292" y="98">x₄</text>

    <g fill="var(--c0)">
      <rect x="51" y="120" width="18" height="14" rx="3"/><rect x="51" y="138" width="18" height="14" rx="3"/>
      <rect x="51" y="156" width="18" height="14" rx="3"/><rect x="51" y="174" width="18" height="14" rx="3"/>
      <rect x="51" y="192" width="18" height="14" rx="3"/>
    </g>
    <g fill="var(--c1)">
      <rect x="131" y="120" width="18" height="14" rx="3"/><rect x="131" y="138" width="18" height="14" rx="3"/>
      <rect x="131" y="156" width="18" height="14" rx="3"/><rect x="131" y="174" width="18" height="14" rx="3"/>
      <rect x="131" y="192" width="18" height="14" rx="3"/>
    </g>
    <g fill="var(--c2)">
      <rect x="211" y="120" width="18" height="14" rx="3"/><rect x="211" y="138" width="18" height="14" rx="3"/>
      <rect x="211" y="156" width="18" height="14" rx="3"/><rect x="211" y="174" width="18" height="14" rx="3"/>
      <rect x="211" y="192" width="18" height="14" rx="3"/>
    </g>
    <g fill="var(--c3)">
      <rect x="291" y="120" width="18" height="14" rx="3"/><rect x="291" y="138" width="18" height="14" rx="3"/>
      <rect x="291" y="156" width="18" height="14" rx="3"/><rect x="291" y="174" width="18" height="14" rx="3"/>
      <rect x="291" y="192" width="18" height="14" rx="3"/>
    </g>
    <text class="cap" x="30" y="232">维度：4</text>
  </g>

  <g class="after">
    <rect class="tok" x="400" y="80" width="60" height="26" rx="5"/><text class="lbl" x="422" y="98">x₁</text>
    <rect class="tok" x="480" y="80" width="60" height="26" rx="5"/><text class="lbl" x="502" y="98">x₂</text>
    <rect class="tok" x="560" y="80" width="60" height="26" rx="5"/><text class="lbl" x="582" y="98">x₃</text>
    <rect class="tok" x="640" y="80" width="60" height="26" rx="5"/><text class="lbl" x="662" y="98">x₄</text>

    <g>
      <rect x="421" y="120" width="18" height="14" rx="3" fill="var(--c0)"/><rect x="421" y="138" width="18" height="14" rx="3" fill="var(--c1)"/>
      <rect x="421" y="156" width="18" height="14" rx="3" fill="var(--c2)"/><rect x="421" y="174" width="18" height="14" rx="3" fill="var(--c3)"/>
      <rect x="421" y="192" width="18" height="14" rx="3" fill="var(--c0)"/>

      <rect x="501" y="120" width="18" height="14" rx="3" fill="var(--c1)"/><rect x="501" y="138" width="18" height="14" rx="3" fill="var(--c2)"/>
      <rect x="501" y="156" width="18" height="14" rx="3" fill="var(--c3)"/><rect x="501" y="174" width="18" height="14" rx="3" fill="var(--c0)"/>
      <rect x="501" y="192" width="18" height="14" rx="3" fill="var(--c1)"/>

      <rect x="581" y="120" width="18" height="14" rx="3" fill="var(--c2)"/><rect x="581" y="138" width="18" height="14" rx="3" fill="var(--c3)"/>
      <rect x="581" y="156" width="18" height="14" rx="3" fill="var(--c0)"/><rect x="581" y="174" width="18" height="14" rx="3" fill="var(--c1)"/>
      <rect x="581" y="192" width="18" height="14" rx="3" fill="var(--c2)"/>

      <rect x="661" y="120" width="18" height="14" rx="3" fill="var(--c3)"/><rect x="661" y="138" width="18" height="14" rx="3" fill="var(--c0)"/>
      <rect x="661" y="156" width="18" height="14" rx="3" fill="var(--c1)"/><rect x="661" y="174" width="18" height="14" rx="3" fill="var(--c2)"/>
      <rect x="661" y="192" width="18" height="14" rx="3" fill="var(--c3)"/>
    </g>
    <text class="cap" x="400" y="232">维度：4</text>
  </g>

  <g>
    <line x1="350" y1="166" x2="373" y2="166" stroke="var(--muted)" stroke-width="2"/>
    <path d="M373 160 L384 166 L373 172 Z" fill="var(--muted)"/>
    <text class="cap" x="362" y="150" text-anchor="middle">Attention</text>
  </g>

  <text class="note" x="380" y="278" text-anchor="middle">形状不变，内容改变</text>
</svg>
