<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>局部连接与权重共享</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;
--in:#dbe7ff; --inS:#2f5bb7; --param:#ece0ff; --paramS:#6b46c1;
--state:#e9edf3; --stateS:#4a5568; --out:#d9f2e2; --outS:#2f7a4f;
--cur:#ffe6c7; --curS:#b45309; --accent:#2f5bb7;
}
@media (prefers-color-scheme:dark){:root{
--bg:#14181f; --panel:#1c222b; --fg:#e8ecf3; --muted:#9aa4b2; --line:#39424f;
--in:#1f3149; --inS:#8fb0ef; --param:#2d2350; --paramS:#b49af0;
--state:#262d38; --stateS:#aab4c2; --out:#1e3a2b; --outS:#87c9a2;
--cur:#4a3418; --curS:#f0b26b; --accent:#8fb0ef;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>局部连接与权重共享</h1><p class="sub">每个输出只看一个小窗口；同一组 9 个权重在所有位置复用，所以参数少</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="局部连接与权重共享"><rect x="0" y="0" width="1100" height="620" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wp{stroke:var(--paramS);stroke-width:2.2;fill:none;marker-end:url(#arp)}
.ws{stroke:var(--stateS);stroke-width:2.2;fill:none;marker-end:url(#ars)}
.wout{stroke:var(--outS);stroke-width:2.2;fill:none;marker-end:url(#aro)}
.wcur{stroke:var(--curS);stroke-width:2.2;fill:none;marker-end:url(#arc)}
.win{stroke:var(--inS);stroke-width:2.2;fill:none;marker-end:url(#ari)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}
</style><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="arp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--paramS)"/></marker>

"30" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="150" y="284" width="30" height="30" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="180" y="284" width="30" height="30" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="210" y="284" width="30" height="30" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="60" y="314" width="30" height="30" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="90" y="314" width="30" height="30" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="120" y="314" width="30" height="30" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="150" y="314" width="30" height="30" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="180" y="314" width="30" height="30" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="210" y="314" width="30" height="30" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="60" y="164" width="90" height="90" fill="none" stroke="var(--curS)" stroke-width="2.5"/><text class="sm" x="105" y="272" text-anchor="middle">窗口 A</text><rect x="120" y="164" width="90" height="90" fill="none" stroke="var(--curS)" stroke-width="2.5"/><text class="sm" x="165" y="272" text-anchor="middle">窗口 B</text><rect class="b param" x="60" y="350" width="150" height="60" rx="10"/><text class="lb" x="135.0" y="376.0" text-anchor="middle">同一组权重 w</text><text class="sm" x="135.0" y="396.0" text-anchor="middle">3×3 = 9 个</text><rect class="b out" x="260" y="350" width="180" height="60" rx="10"/><text class="lb" x="350.0" y="376.0" text-anchor="middle">响应 A</text><text class="sm" x="350.0" y="396.0" text-anchor="middle">2.1</text><rect class="b out" x="500" y="350" width="180" height="60" rx="10"/><text class="lb" x="590.0" y="376.0" text-anchor="middle">响应 B</text><text class="sm" x="590.0" y="396.0" text-anchor="middle">2.1</text><path class="wout" d="M210,380 L256,380"/><path class="wout" d="M135,410 L135,432 L590,432 L590,414"/><rect x="700" y="170" width="350" height="82" rx="8" fill="var(--state)" opacity="0.7"/><text class="sm" x="712" y="194">局部连接：每个输出只看 3×3 窗口</text><text class="sm" x="712" y="216">权重共享：滑到别处仍用这 9 个数</text><text class="sm" x="712" y="238">参数量 9，而全连接要 36×9</text><rect x="60" y="470" width="700" height="66" rx="12" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="76" y="496">y(i,j) = Σ w(u,v)·x(i+u, j+v) + b</text><text class="sm" x="76" y="520">演示：边缘竖直，核 [-1,0,1] 三列，响应 3×(0.9−0.2)=2.1</text><rect class="b in" x="30" y="572" width="196" height="34" rx="8"/><text class="sm" x="128.0" y="594" text-anchor="middle">局部窗口</text><path class="wire" d="M228,589 L242,589"/><rect class="b param" x="244" y="572" width="196" height="34" rx="8"/><text class="sm" x="342.0" y="594" text-anchor="middle">点积</text><path class="wire" d="M442,589 L456,589"/><rect class="b cur" x="458" y="572" width="196" height="34" rx="8"/><text class="sm" x="556.0" y="594" text-anchor="middle">滑到下一位置</text><path class="wire" d="M656,589 L670,589"/><rect class="b param" x="672" y="572" width="196" height="34" rx="8"/><text class="sm" x="770.0" y="594" text-anchor="middle">同一组 w</text></svg></div></div></body></html>
