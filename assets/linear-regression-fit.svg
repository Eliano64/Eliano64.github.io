<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="tlin dlin">
  <title id="tlin">一条最小二乘直线与它背后的残差</title>
  <desc id="dlin">8 个房价样本，拟合得斜率 4.58、截距 38.6，均方误差 450.2。面积 118 与 100 两个样本的平方误差合计占总损失的 66%。</desc>
  <style>
    .bg { fill: #f8fafc; }
    @media (prefers-color-scheme: dark) { .bg { fill: #0b1020; } }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    @media (prefers-color-scheme: dark) { .panel { fill: #111827; stroke: #334155; } }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) { .grid { stroke: #24334a; } }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .tick { stroke: #94a3b8; stroke-width: 1; }
    .ref { stroke: #be123c; stroke-width: 1.3; stroke-dasharray: 6 5; fill: none; }
    .text { fill: #0f172a; font-family: Arial, "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) { .text { fill: #e2e8f0; } }
    .muted { fill: #475569; font-family: Arial, "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) { .muted { fill: #94a3b8; } }
    .mono { fill: #0f172a; font-family: Consolas, "Courier New", monospace; }
    @media (prefers-color-scheme: dark) { .mono { fill: #e2e8f0; } }
    .em { fill: #15803d; font-family: Arial, "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) { .em { fill: #4ade80; } }
    .c1 { fill: none; stroke: #2563eb; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c2 { fill: none; stroke: #be123c; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c3 { fill: none; stroke: #16a34a; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c4 { fill: none; stroke: #b45309; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c5 { fill: none; stroke: #7c3aed; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .c1 { stroke: #60a5fa; } .c2 { stroke: #fb7185; } .c3 { stroke: #4ade80; }
      .c4 { stroke: #fbbf24; } .c5 { stroke: #c4b5fd; }
    }
    .dot1 { fill: #2563eb; } .dot2 { fill: #be123c; } .dot3 { fill: #16a34a; }
    .dot4 { fill: #b45309; } .dot5 { fill: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .dot1 { fill: #60a5fa; } .dot2 { fill: #fb7185; } .dot3 { fill: #4ade80; }
      .dot4 { fill: #fbbf24; } .dot5 { fill: #c4b5fd; }
    }
    .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    .card-em { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.8; }
    .group { fill: none; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .group-em { fill: rgba(22,163,74,0.05); stroke: #16a34a; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1e293b; stroke: #334155; }
      .card-em { fill: #052e1b; stroke: #4ade80; }
      .group { stroke: #334155; }
      .group-em { fill: rgba(74,222,128,0.06); stroke: #4ade80; }
    }
    .plate { fill: #ffffff; opacity: 0.86; }
    @media (prefers-color-scheme: dark) { .plate { fill: #0b1020; } }
    .shade { fill: #f1f5f9; }
    @media (prefers-color-scheme: dark) { .shade { fill: #1e293b; } }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="520" rx="10"/>
  <rect class="panel" x="14" y="12" width="852" height="496" rx="8"/>
  <text class="text" x="30.0" y="38.0" font-size="13" text-anchor="start" font-weight="600">房价与面积：最小二乘直线，以及每个样本的竖直残差</text>
  <line class="grid" x1="104.5" y1="72.0" x2="104.5" y2="400.0"/>
  <line class="tick" x1="104.5" y1="400.0" x2="104.5" y2="404.0"/>
  <text class="muted" x="104.5" y="416.0" font-size="10" text-anchor="middle" font-weight="400">50</text>
  <line class="grid" x1="218.4" y1="72.0" x2="218.4" y2="400.0"/>
  <line class="tick" x1="218.4" y1="400.0" x2="218.4" y2="404.0"/>
  <text class="muted" x="218.4" y="416.0" font-size="10" text-anchor="middle" font-weight="400">70</text>
  <line class="grid" x1="332.2" y1="72.0" x2="332.2" y2="400.0"/>
  <line class="tick" x1="332.2" y1="400.0" x2="332.2" y2="404.0"/>
  <text class="muted" x="332.2" y="416.0" font-size="10" text-anchor="middle" font-weight="400">90</text>
  <line class="grid" x1="446.1" y1="72.0" x2="446.1" y2="400.0"/>
  <line class="tick" x1="446.1" y1="400.0" x2="446.1" y2="404.0"/>
  <text class="muted" x="446.1" y="416.0" font-size="10" text-anchor="middle" font-weight="400">110</text>
  <line class="grid" x1="560.0" y1="72.0" x2="560.0" y2="400.0"/>
  <line class="tick" x1="560.0" y1="400.0" x2="560.0" y2="404.0"/>
  <text class="muted" x="560.0" y="416.0" font-size="10" text-anchor="middle" font-weight="400">130</text>
  <line class="grid" x1="76.0" y1="382.7" x2="560.0" y2="382.7"/>
  <line class="tick" x1="72.0" y1="382.7" x2="76.0" y2="382.7"/>
  <text class="muted" x="69.0" y="386.2" font-size="10" text-anchor="end" font-weight="400">300</text>
  <line class="grid" x1="76.0" y1="296.4" x2="560.0" y2="296.4"/>
  <line class="tick" x1="72.0" y1="296.4" x2="76.0" y2="296.4"/>
  <text class="muted" x="69.0" y="299.9" font-size="10" text-anchor="end" font-weight="400">400</text>
  <line class="grid" x1="76.0" y1="210.1" x2="560.0" y2="210.1"/>
  <line class="tick" x1="72.0" y1="210.1" x2="76.0" y2="210.1"/>
  <text class="muted" x="69.0" y="213.6" font-size="10" text-anchor="end" font-weight="400">500</text>
  <line class="grid" x1="76.0" y1="123.8" x2="560.0" y2="123.8"/>
  <line class="tick" x1="72.0" y1="123.8" x2="76.0" y2="123.8"/>
  <text class="muted" x="69.0" y="127.3" font-size="10" text-anchor="end" font-weight="400">600</text>
  <line class="axis" x1="76.0" y1="400.0" x2="560.0" y2="400.0"/>
  <line class="axis" x1="76.0" y1="72.0" x2="76.0" y2="400.0"/>
  <text class="muted" x="318.0" y="432.0" font-size="11" text-anchor="middle" font-weight="400">面积 (m²)</text>
  <text class="muted" x="42.0" y="236.0" font-size="11" text-anchor="middle" transform="rotate(-90 42.0 236.0)">总价 (万元)</text>
  <path class="c2" d="M 76.0,430.3 L 560.0,93.9"/>
  <line class="ref" x1="132.9" y1="390.7" x2="132.9" y2="374.1"/>
  <circle class="dot1" cx="132.9" cy="374.1" r="4"/>
  <line class="ref" x1="172.8" y1="363.0" x2="172.8" y2="352.5"/>
  <circle class="dot1" cx="172.8" cy="352.5" r="4"/>
  <line class="ref" x1="218.4" y1="331.3" x2="218.4" y2="330.9"/>
  <circle class="dot1" cx="218.4" cy="330.9" r="4"/>
  <line class="ref" x1="263.9" y1="299.7" x2="263.9" y2="309.4"/>
  <circle class="dot1" cx="263.9" cy="309.4" r="4"/>
  <line class="ref" x1="303.8" y1="272.0" x2="303.8" y2="283.5"/>
  <circle class="dot1" cx="303.8" cy="283.5" r="4"/>
  <line class="ref" x1="343.6" y1="244.3" x2="343.6" y2="261.9"/>
  <circle class="dot1" cx="343.6" cy="261.9" r="4"/>
  <line class="ref" x1="389.2" y1="212.6" x2="389.2" y2="236.0"/>
  <circle class="dot1" cx="389.2" cy="236.0" r="4"/>
  <line class="ref" x1="491.7" y1="141.4" x2="491.7" y2="106.5"/>
  <circle class="dot1" cx="491.7" cy="106.5" r="4"/>
  <rect class="plate" x="309.8" y="74.5" width="174.9" height="36" rx="5"/>
  <text class="text" x="479.7" y="86.5" font-size="10.5" text-anchor="end" font-weight="400">面积 118：残差 40.4，平方 1630</text>
  <text class="muted" x="479.7" y="101.5" font-size="10" text-anchor="end" font-weight="400">单独一个样本吃掉三成损失</text>
  <rect class="plate" x="398.2" y="248.0" width="174.9" height="36" rx="5"/>
  <text class="text" x="403.2" y="260.0" font-size="10.5" text-anchor="start" font-weight="400">面积 100：残差 -27.1，平方 735</text>
  <text class="muted" x="403.2" y="275.0" font-size="10" text-anchor="start" font-weight="400">与上一个合计 66%</text>
  <rect class="plate" x="63.4" y="344.9" width="146.0" height="36" rx="5"/>
  <text class="text" x="204.4" y="356.9" font-size="10.5" text-anchor="end" font-weight="400">面积 70：残差 0.4，平方 0</text>
  <text class="muted" x="204.4" y="371.9" font-size="10" text-anchor="end" font-weight="400">几乎贴着直线，贡献为零</text>
  <text class="text" x="596.0" y="92.0" font-size="12.5" text-anchor="start" font-weight="600">拟合结果</text>
  <text class="muted" x="596.0" y="118.0" font-size="11" text-anchor="start" font-weight="400">斜率</text>
  <text class="text" x="746.0" y="118.0" font-size="11" text-anchor="start" font-weight="600">4.585 万元/m²</text>
  <text class="muted" x="596.0" y="142.0" font-size="11" text-anchor="start" font-weight="400">截距</text>
  <text class="text" x="746.0" y="142.0" font-size="11" text-anchor="start" font-weight="600">38.6 万元</text>
  <text class="muted" x="596.0" y="166.0" font-size="11" text-anchor="start" font-weight="400">均方误差 MSE</text>
  <text class="text" x="746.0" y="166.0" font-size="11" text-anchor="start" font-weight="600">450.2</text>
  <text class="muted" x="596.0" y="190.0" font-size="11" text-anchor="start" font-weight="400">决定系数 R²</text>
  <text class="text" x="746.0" y="190.0" font-size="11" text-anchor="start" font-weight="600">0.946</text>
  <text class="muted" x="596.0" y="214.0" font-size="11" text-anchor="start" font-weight="400">两个最大平方误差之和</text>
  <text class="text" x="746.0" y="214.0" font-size="11" text-anchor="start" font-weight="600">66% 的总损失</text>
  <text class="text" x="596.0" y="262.0" font-size="12.5" text-anchor="start" font-weight="600">平方如何放大差距</text>
  <text class="muted" x="596.0" y="288.0" font-size="10.5" text-anchor="start" font-weight="400">残差 40 平方后 1630</text>
  <text class="muted" x="596.0" y="308.0" font-size="10.5" text-anchor="start" font-weight="400">残差 -27 平方后 735</text>
  <text class="muted" x="596.0" y="328.0" font-size="10.5" text-anchor="start" font-weight="400">残差 0.4 平方后 0</text>
  <text class="muted" x="596.0" y="348.0" font-size="10.5" text-anchor="start" font-weight="400">绝对值只差几倍，平方后差出两个数量级，</text>
  <text class="muted" x="596.0" y="368.0" font-size="10.5" text-anchor="start" font-weight="400">梯度也因此被这个大样本主导。</text>
  <text class="muted" x="30.0" y="452.0" font-size="10.5" text-anchor="start" font-weight="400">损失 = 残差平方的平均 = 450.2；同样的 8 个点，若把最大残差改成 0，MSE 会降到 246.5。</text>
  <text class="muted" x="30.0" y="474.0" font-size="10.5" text-anchor="start" font-weight="400">直线由解析解一次算出：斜率与截距由 X 与 y 唯一决定，不需要迭代。</text>
</svg>
