<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">三级存储系统中的数据流动</title>
  <desc id="desc">CPU 分别与 Cache、主存连接，Cache 与主存按块交换，主存与辅存按页交换。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <style>
      svg{background:#f8fafc}
      .panel{fill:#fff;stroke:#d5deea;stroke-width:2}
      .title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .subtitle{font:500 15px "Microsoft YaHei",sans-serif;fill:#64748b}
      .node{stroke-width:2.2}
      .cpu{fill:#eff6ff;stroke:#3b82f6}
      .cache{fill:#ecfdf5;stroke:#10b981}
      .memory{fill:#fff7ed;stroke:#f59e0b}
      .storage{fill:#f5f3ff;stroke:#8b5cf6}
      .head{font:700 23px "Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}
      .body{font:500 15px "Microsoft YaHei",sans-serif;fill:#334155;text-anchor:middle}
      .tag{font:700 14px "Microsoft YaHei",sans-serif;text-anchor:middle}
      .cpuTag{fill:#2563eb}.cacheTag{fill:#059669}.memTag{fill:#d97706}.diskTag{fill:#7c3aed}
      .flow{stroke:#475569;stroke-width:3;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .flowLabel{font:700 15px "Microsoft YaHei",sans-serif;fill:#334155;text-anchor:middle}
      .flowSub{font:500 13px "Microsoft YaHei",sans-serif;fill:#64748b;text-anchor:middle}
      .hub{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}
      .hubText{font:700 14px "Microsoft YaHei",sans-serif;fill:#b45309;text-anchor:middle}
      @media(prefers-color-scheme:dark){
        svg{background:#0b1020}
        .panel{fill:#111827;stroke:#334155}
        .title,.head{fill:#f8fafc}
        .subtitle,.body,.flowSub{fill:#cbd5e1}
        .flowLabel{fill:#e2e8f0}
        .cpu{fill:#172554;stroke:#60a5fa}
        .cache{fill:#12372a;stroke:#34d399}
        .memory{fill:#3b2a12;stroke:#fbbf24}
        .storage{fill:#2e1f4f;stroke:#a78bfa}
        .cpuTag{fill:#60a5fa}.cacheTag{fill:#34d399}.memTag{fill:#fbbf24}.diskTag{fill:#c4b5fd}
        .flow{stroke:#94a3b8}
        #arrow path{fill:#94a3b8}
        .hub{fill:#3b2a12;stroke:#f59e0b}
        .hubText{fill:#fbbf24}
      }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="920" height="400" rx="20"/>
  <text class="title" x="48" y="65">三级存储系统中的数据流动</text>
  <text class="subtitle" x="48" y="92">CPU 的读写请求可由 Cache 响应，也可到达主存；主存按需与辅存交换数据</text>

  <rect class="node cpu" x="45" y="178" width="165" height="132" rx="16"/>
  <text class="head" x="127.5" y="220">CPU</text>
  <text class="body" x="127.5" y="252">发出访存请求</text>
  <text class="tag cpuTag" x="127.5" y="282">读取指令或数据</text>

  <rect class="node cache" x="275" y="178" width="175" height="132" rx="16"/>
  <text class="head" x="362.5" y="220">Cache</text>
  <text class="body" x="362.5" y="252">保存最近访问的数据</text>
  <text class="tag cacheTag" x="362.5" y="282">命中时直接返回</text>

  <rect class="node memory" x="515" y="162" width="185" height="164" rx="16"/>
  <text class="head" x="607.5" y="210">主存</text>
  <text class="body" x="607.5" y="244">保存程序正在使用的数据</text>
  <rect class="hub" x="550" y="272" width="115" height="31" rx="15.5"/>
  <text class="hubText" x="607.5" y="293">接受 CPU 读写</text>

  <rect class="node storage" x="765" y="178" width="150" height="132" rx="16"/>
  <text class="head" x="840" y="220">辅存</text>
  <text class="body" x="840" y="250">保存程序和文件</text>
  <text class="body" x="840" y="275">接纳换出的页面</text>
  <text class="tag diskTag" x="840" y="299">需要时再调入</text>

  <path class="flow" d="M218 244 H267"/>
  <text class="flowLabel" x="242.5" y="144">查询 Cache</text>
  <text class="flowSub" x="242.5" y="164">命中后返回</text>

  <path class="flow" d="M458 244 H507"/>
  <text class="flowLabel" x="482.5" y="144">调入或写回</text>
  <text class="flowSub" x="482.5" y="164">每次传送一个块</text>

  <path class="flow" d="M708 244 H757"/>
  <text class="flowLabel" x="732.5" y="144">调入或换出</text>
  <text class="flowSub" x="732.5" y="164">每次传送一个页</text>

  <path class="flow" d="M205 292 C285 365 435 365 520 302"/>
  <text class="flowLabel" x="362.5" y="386">CPU 读取或写入主存</text>
</svg>
