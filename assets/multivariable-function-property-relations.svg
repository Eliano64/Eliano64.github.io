<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">二元函数在一点处的性质关系</title>
  <desc id="desc">一阶偏导数连续推出可微；可微分别推出连续和偏导数存在；连续推出二重极限存在和分别连续；偏导数存在推出分别连续。</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f8fafc;--fg:#0f172a;--muted:#475569;--line:#2563eb;--border:#94a3b8;--five:#fff7ed;--four:#eff6ff;--two:#f0fdf4;--three:#faf5ff;--one:#f8fafc;--separate:#ecfeff}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#e5e7eb;--muted:#cbd5e1;--line:#60a5fa;--border:#64748b;--five:#2b1708;--four:#10213f;--two:#052e16;--three:#2e1065;--one:#111827;--separate:#083344}}
    .bg{fill:var(--bg)}.node{stroke:var(--border);stroke-width:2}.five{fill:var(--five);stroke:#f97316}.four{fill:var(--four);stroke:#3b82f6}.two{fill:var(--two);stroke:#22c55e}.three{fill:var(--three);stroke:#a855f7}.one{fill:var(--one)}.separate{fill:var(--separate);stroke:#06b6d4}
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:var(--fg)}.heading{font-size:25px;font-weight:700}.name{font-size:20px;font-weight:700}.small{font-size:14px;fill:var(--muted)}.arrow{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#arrow)}.legend{font-size:16px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="1120" height="480"/>
  <text class="heading" x="560" y="42" text-anchor="middle">在 P 点：只画必然成立的推导</text>

  <rect class="node five" x="35" y="185" width="210" height="100" rx="14"/>
  <text class="name" x="140" y="224" text-anchor="middle">⑤ 一阶偏导数连续</text>
  <text class="small" x="140" y="253" text-anchor="middle">在邻域内存在，并在 P 连续</text>

  <rect class="node four" x="305" y="185" width="205" height="100" rx="14"/>
  <text class="name" x="408" y="244" text-anchor="middle">④ 可微</text>

  <rect class="node two" x="570" y="72" width="210" height="96" rx="14"/>
  <text class="name" x="675" y="128" text-anchor="middle">② 连续</text>

  <rect class="node three" x="570" y="302" width="210" height="96" rx="14"/>
  <text class="name" x="675" y="341" text-anchor="middle">③ 一阶偏导数存在</text>
  <text class="small" x="675" y="369" text-anchor="middle">fₓ(P)、fᵧ(P) 均存在</text>

  <rect class="node one" x="865" y="72" width="220" height="96" rx="14"/>
  <text class="name" x="975" y="112" text-anchor="middle">① 二重极限存在</text>
  <text class="small" x="975" y="140" text-anchor="middle">点值可以与极限不同</text>

  <rect class="node separate" x="865" y="302" width="220" height="96" rx="14"/>
  <text class="name" x="975" y="341" text-anchor="middle">②′ 分别连续</text>
  <text class="small" x="975" y="369" text-anchor="middle">只固定一个变量考察另一个</text>

  <path class="arrow" d="M245 235 H305"/>
  <path class="arrow" d="M510 216 C535 216 540 120 570 120"/>
  <path class="arrow" d="M510 254 C535 254 540 350 570 350"/>
  <path class="arrow" d="M780 120 H865"/>
  <path class="arrow" d="M730 168 C770 225 815 273 865 320"/>
  <path class="arrow" d="M780 350 H865"/>

  <text class="legend" x="560" y="450" text-anchor="middle">A → B：A 成立时 B 必然成立；没有反向箭头，就不能直接反推</text>
</svg>
