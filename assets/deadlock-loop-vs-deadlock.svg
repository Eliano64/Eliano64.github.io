<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
  <title id="title">资源实例数决定有环是否等于死锁</title>
  <desc id="desc">单实例资源图有环等价于死锁；多实例资源图中，环外进程可以释放额外实例打破循环等待。</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--fg:#111827;--muted:#64748b;--line:#94a3b8;--proc:#dbeafe;--resource:#fef3c7;--bad:#fee2e2;--ok:#dcfce7;--arrow:#475569;--badline:#dc2626;--okline:#16a34a}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#0f172a;--fg:#e5e7eb;--muted:#94a3b8;--line:#64748b;--proc:#1e3a8a;--resource:#713f12;--bad:#7f1d1d;--ok:#14532d;--arrow:#cbd5e1;--badline:#f87171;--okline:#4ade80}}
    .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.p{fill:var(--proc);stroke:var(--line);stroke-width:2}.r{fill:var(--resource);stroke:var(--line);stroke-width:2}.bad{fill:var(--bad);stroke:var(--badline);stroke-width:2}.ok{fill:var(--ok);stroke:var(--okline);stroke-width:2}
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:var(--fg)}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:15px;fill:var(--muted)}.edge{fill:none;stroke:var(--arrow);stroke-width:2.5;marker-end:url(#arrow)}.release{fill:none;stroke:var(--okline);stroke-width:3;marker-end:url(#green)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--arrow)"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--okline)"/></marker>
  </defs>
  <rect class="bg" width="980" height="650"/>
  <text class="title" x="490" y="40" text-anchor="middle">资源分配图有环，是否已经死锁？</text>
  <text class="small" x="490" y="67" text-anchor="middle">请求边：进程 → 资源　　分配边：资源 → 进程</text>

  <rect class="panel" x="30" y="88" width="440" height="500" rx="16"/>
  <text class="head" x="250" y="124" text-anchor="middle">每类资源只有一个实例</text>
  <circle class="p" cx="135" cy="225" r="36"/><text class="t" x="135" y="231" text-anchor="middle">P1</text>
  <rect class="r" x="315" y="193" width="84" height="64" rx="10"/><text class="t" x="357" y="231" text-anchor="middle">R2 ·</text>
  <circle class="p" cx="357" cy="385" r="36"/><text class="t" x="357" y="391" text-anchor="middle">P2</text>
  <rect class="r" x="93" y="353" width="84" height="64" rx="10"/><text class="t" x="135" y="391" text-anchor="middle">R1 ·</text>
  <path class="edge" d="M171 225 L315 225"/>
  <path class="edge" d="M357 257 L357 349"/>
  <path class="edge" d="M321 385 L177 385"/>
  <path class="edge" d="M135 353 L135 261"/>
  <rect class="bad" x="86" y="472" width="328" height="62" rx="10"/>
  <text class="head" x="250" y="500" text-anchor="middle">环无法被外部资源打破</text>
  <text class="t" x="250" y="525" text-anchor="middle">有环 ⇔ 死锁</text>

  <rect class="panel" x="510" y="88" width="440" height="500" rx="16"/>
  <text class="head" x="730" y="124" text-anchor="middle">某类资源有多个实例</text>
  <circle class="p" cx="610" cy="215" r="34"/><text class="t" x="610" y="221" text-anchor="middle">P1</text>
  <rect class="r" x="795" y="185" width="100" height="60" rx="10"/><text class="t" x="845" y="221" text-anchor="middle">R2 ×2</text>
  <circle class="p" cx="845" cy="365" r="34"/><text class="t" x="845" y="371" text-anchor="middle">P2</text>
  <rect class="r" x="560" y="335" width="100" height="60" rx="10"/><text class="t" x="610" y="371" text-anchor="middle">R1 ×2</text>
  <circle class="p" cx="730" cy="485" r="34"/><text class="t" x="730" y="491" text-anchor="middle">P3</text>

  <path class="edge" d="M644 215 L795 215"/>
  <path class="edge" d="M845 245 L845 331"/>
  <path class="edge" d="M811 365 L660 365"/>
  <path class="edge" d="M610 335 L610 249"/>
  <path class="edge" d="M660 380 L704 459"/>
  <path class="edge" d="M820 242 C805 330 775 414 747 456"/>
  <rect class="ok" x="548" y="532" width="364" height="42" rx="10"/>
  <text class="t" x="730" y="559" text-anchor="middle">P3 完成并释放资源 → 环可被打破</text>

  <text class="small" x="490" y="623" text-anchor="middle">多实例时，有环只是死锁的必要条件；还要检查是否存在可完成并释放资源的进程。</text>
</svg>
