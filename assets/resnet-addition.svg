<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="逐元素相加：x 加 F 得到 z，示例输出 1.1,1.8,3,4.3">
<style>
:root{--bg:#ffffff;--ink:#1b1f24;--muted:#4d5865;--grid:#b9c3ce;--cell:#f4f7fa;--accent:#0b6b64;}
@media (prefers-color-scheme: dark){:root{--bg:#14171c;--ink:#e8ebf0;--muted:#a7b1be;--grid:#3b434e;--cell:#1d222a;--accent:#2dd4bf;}}
text{font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;}
.head{font-size:22px;fill:var(--ink);}
.label{font-size:20px;fill:var(--muted);}
.op{font-size:24px;fill:var(--ink);}
</style>
<rect width="600" height="220" fill="var(--bg)"/>
<text x="20" y="34" class="head">残差相加：z = x + F(x)</text>
<text x="20" y="66" class="label">x</text>
<rect x="20" y="78" width="108" height="108" fill="var(--cell)" stroke="var(--grid)" stroke-width="1.2"/>
<line x1="74" y1="78" x2="74" y2="186" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="132" x2="128" y2="132" stroke="var(--grid)" stroke-width="1"/>
<text x="47.0" y="112.2" text-anchor="middle" font-size="20" fill="var(--ink)">1</text>
<text x="101.0" y="112.2" text-anchor="middle" font-size="20" fill="var(--ink)">2</text>
<text x="47.0" y="166.2" text-anchor="middle" font-size="20" fill="var(--ink)">3</text>
<text x="101.0" y="166.2" text-anchor="middle" font-size="20" fill="var(--ink)">4</text>
<text x="146" y="170" class="op">+</text>
<text x="176" y="66" class="label">F(x)</text>
<rect x="176" y="78" width="108" height="108" fill="var(--cell)" stroke="var(--grid)" stroke-width="1.2"/>
<line x1="230" y1="78" x2="230" y2="186" stroke="var(--grid)" stroke-width="1"/>
<line x1="176" y1="132" x2="284" y2="132" stroke="var(--grid)" stroke-width="1"/>
<text x="203.0" y="112.2" text-anchor="middle" font-size="20" fill="var(--ink)">0.1</text>
<text x="257.0" y="112.2" text-anchor="middle" font-size="20" fill="var(--ink)">-0.2</text>
<text x="203.0" y="166.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="257.0" y="166.2" text-anchor="middle" font-size="20" fill="var(--ink)">0.3</text>
<text x="300" y="170" class="op">=</text>
<text x="326" y="66" class="label">z</text>
<rect x="326" y="78" width="108" height="108" fill="var(--cell)" stroke="var(--grid)" stroke-width="1.2"/>
<line x1="380" y1="78" x2="380" y2="186" stroke="var(--grid)" stroke-width="1"/>
<line x1="326" y1="132" x2="434" y2="132" stroke="var(--grid)" stroke-width="1"/>
<text x="353.0" y="112.2" text-anchor="middle" font-size="20" fill="var(--accent)">1.1</text>
<text x="407.0" y="112.2" text-anchor="middle" font-size="20" fill="var(--accent)">1.8</text>
<text x="353.0" y="166.2" text-anchor="middle" font-size="20" fill="var(--accent)">3</text>
<text x="407.0" y="166.2" text-anchor="middle" font-size="20" fill="var(--accent)">4.3</text>
</svg>