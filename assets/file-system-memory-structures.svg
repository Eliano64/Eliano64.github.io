<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc">
  <title id="title">文件系统的内存对象与访问路径</title>
  <desc id="desc">文件描述符经过进程文件描述符表找到file对象，再经过dentry和inode到达页缓存及磁盘数据；挂载表和superblock描述已挂载文件系统。</desc>
  <style>
    svg{background:#f8fafc}
    @media(prefers-color-scheme:dark){svg{background:#0b1020}}
    :root{--bg:#f8fafc;--fg:#0f172a;--muted:#475569;--line:#94a3b8;--panel:#fff;--blue:#2563eb;--blueFill:#dbeafe;--green:#059669;--greenFill:#d1fae5;--purple:#7c3aed;--purpleFill:#ede9fe;--orange:#d97706;--orangeFill:#ffedd5}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#e5e7eb;--muted:#cbd5e1;--line:#64748b;--panel:#111827;--blue:#60a5fa;--blueFill:#172554;--green:#34d399;--greenFill:#052e2b;--purple:#c084fc;--purpleFill:#2e1065;--orange:#fbbf24;--orangeFill:#422006}}
    .bg{fill:var(--bg)}.box{fill:var(--panel);stroke:var(--line);stroke-width:2}.vfs{fill:var(--blueFill);stroke:var(--blue);stroke-width:2.5}.cache{fill:var(--greenFill);stroke:var(--green);stroke-width:2}.mount{fill:var(--purpleFill);stroke:var(--purple);stroke-width:2}.disk{fill:var(--orangeFill);stroke:var(--orange);stroke-width:2}.t{fill:var(--fg);font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.m{fill:var(--muted);font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.a{stroke:var(--blue);stroke-width:3;fill:none;marker-end:url(#arrow)}.pa{stroke:var(--purple);stroke-width:2.5;fill:none;marker-end:url(#parrow)}.ga{stroke:var(--green);stroke-width:3;fill:none;marker-end:url(#garrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--blue)"/></marker>
    <marker id="parrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--purple)"/></marker>
    <marker id="garrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--green)"/></marker>
  </defs>
  <rect class="bg" width="1240" height="650"/>
  <text class="t" x="620" y="42" text-anchor="middle" font-size="26" font-weight="700">文件系统的内存对象与访问路径</text>
  <text class="m" x="620" y="70" text-anchor="middle" font-size="15">路径查找建立 file 对象；后续 read(fd) 沿对象关系访问页缓存</text>

  <rect class="box" x="34" y="212" width="150" height="118" rx="10"/>
  <text class="t" x="109" y="245" text-anchor="middle" font-size="18" font-weight="700">用户进程</text>
  <text class="t" x="109" y="278" text-anchor="middle" font-size="16">read(fd=3)</text>
  <text class="m" x="109" y="306" text-anchor="middle" font-size="13">fd 是索引号</text>

  <rect class="box" x="220" y="197" width="170" height="148" rx="10"/>
  <text class="t" x="305" y="230" text-anchor="middle" font-size="17" font-weight="700">进程 fd 表</text>
  <rect class="vfs" x="246" y="254" width="118" height="42" rx="6"/>
  <text class="t" x="305" y="280" text-anchor="middle" font-size="14">fd 3 → file</text>
  <text class="m" x="305" y="322" text-anchor="middle" font-size="12">每个进程独立</text>

  <rect class="vfs" x="430" y="197" width="170" height="148" rx="10"/>
  <text class="t" x="515" y="230" text-anchor="middle" font-size="18" font-weight="700">file 对象</text>
  <text class="m" x="515" y="261" text-anchor="middle" font-size="13">一次打开文件描述</text>
  <text class="m" x="515" y="286" text-anchor="middle" font-size="13">偏移 · 状态标志</text>
  <text class="m" x="515" y="311" text-anchor="middle" font-size="13">file_operations</text>

  <rect class="vfs" x="640" y="197" width="170" height="148" rx="10"/>
  <text class="t" x="725" y="230" text-anchor="middle" font-size="18" font-weight="700">dentry 对象</text>
  <text class="m" x="725" y="261" text-anchor="middle" font-size="13">目录项与文件名</text>
  <text class="m" x="725" y="286" text-anchor="middle" font-size="13">名称 → inode</text>
  <text class="m" x="725" y="311" text-anchor="middle" font-size="13">dentry_operations</text>

  <rect class="vfs" x="850" y="197" width="170" height="148" rx="10"/>
  <text class="t" x="935" y="230" text-anchor="middle" font-size="18" font-weight="700">inode 对象</text>
  <text class="m" x="935" y="261" text-anchor="middle" font-size="13">属性 · 权限</text>
  <text class="m" x="935" y="286" text-anchor="middle" font-size="13">文件大小 · 块映射</text>
  <text class="m" x="935" y="311" text-anchor="middle" font-size="13">inode_operations</text>

  <rect class="cache" x="1060" y="197" width="150" height="148" rx="10"/>
  <text class="t" x="1135" y="230" text-anchor="middle" font-size="18" font-weight="700">页缓存</text>
  <text class="m" x="1135" y="263" text-anchor="middle" font-size="13">已调入文件页</text>
  <text class="m" x="1135" y="289" text-anchor="middle" font-size="13">脏页等待写回</text>

  <path class="a" d="M184 271 H218"/><path class="a" d="M390 271 H428"/><path class="a" d="M600 271 H638"/><path class="a" d="M810 271 H848"/><path class="ga" d="M1020 271 H1058"/>

  <rect class="mount" x="640" y="420" width="170" height="104" rx="10"/>
  <text class="t" x="725" y="453" text-anchor="middle" font-size="17" font-weight="700">挂载表</text>
  <text class="m" x="725" y="482" text-anchor="middle" font-size="13">挂载点 → 根 dentry</text>

  <rect class="vfs" x="850" y="405" width="170" height="134" rx="10"/>
  <text class="t" x="935" y="438" text-anchor="middle" font-size="18" font-weight="700">superblock 对象</text>
  <text class="m" x="935" y="469" text-anchor="middle" font-size="13">一个已挂载文件系统</text>
  <text class="m" x="935" y="494" text-anchor="middle" font-size="13">类型 · 大小 · 状态</text>
  <text class="m" x="935" y="519" text-anchor="middle" font-size="13">super_operations</text>

  <rect class="disk" x="1060" y="420" width="150" height="104" rx="10"/>
  <text class="t" x="1135" y="453" text-anchor="middle" font-size="17" font-weight="700">外存文件系统</text>
  <text class="m" x="1135" y="482" text-anchor="middle" font-size="13">超级块 · inode</text>
  <text class="m" x="1135" y="505" text-anchor="middle" font-size="13">目录项 · 数据块</text>

  <path class="pa" d="M810 472 H848"/><path class="pa" d="M935 405 V347"/><path class="ga" d="M1020 472 H1058"/><path class="ga" d="M1135 420 V347"/>

  <text class="m" x="620" y="603" text-anchor="middle" font-size="14">蓝色框是 VFS 的四类核心对象；不同具体文件系统为对象提供各自的操作函数</text>
</svg>
