<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>printf 字符输出时间线</title>
  <style>
    :root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--fg:#172033;--muted:#5b687a;--line:#cbd5e1;--blue:#2563eb;--green:#059669;--orange:#d97706;--violet:#7c3aed;--soft-blue:#dbeafe;--soft-green:#d1fae5;--soft-orange:#ffedd5;--soft-violet:#ede9fe;--shadow:0 12px 30px rgba(15,23,42,.10)}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#121b2a;--fg:#e5edf5;--muted:#a9b7c6;--line:#344354;--blue:#93c5fd;--green:#6ee7b7;--orange:#fdba74;--violet:#c4b5fd;--soft-blue:#17345a;--soft-green:#123d2d;--soft-orange:#4a2a13;--soft-violet:#2d2350;--shadow:0 16px 34px rgba(0,0,0,.32)}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}.app{max-width:1120px;margin:auto;padding:22px 24px 18px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:14px}h1{font-size:25px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.counter{font-weight:700;color:var(--violet);white-space:nowrap}
    .rail{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 18px}.step{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:9px 6px;min-height:50px;font-size:12px;cursor:pointer}.step strong{display:block;font-size:13px;color:var(--fg);margin-bottom:2px}.step.active{border-color:var(--violet);background:var(--soft-violet);color:var(--violet);box-shadow:0 0 0 2px color-mix(in srgb,var(--violet) 20%,transparent)}
    .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}.stage-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:13px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--soft-violet);color:var(--violet);font-weight:700;font-size:12px}.stage h2{font-size:22px;margin:8px 0 0}.event{max-width:440px;text-align:right;color:var(--muted);font-size:14px;line-height:1.65}
    .axes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.axis{border:1px solid var(--line);border-radius:11px;padding:14px;min-height:118px}.axis .k{font-size:12px;font-weight:700;margin-bottom:8px}.axis .v{font-size:17px;font-weight:700;line-height:1.5}.axis .hint{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.5}.cpu{background:var(--soft-blue)}.cpu .k{color:var(--blue)}.state{background:var(--soft-orange)}.state .k{color:var(--orange)}.data{background:var(--soft-green)}.data .k{color:var(--green)}
    .chain{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;background:color-mix(in srgb,var(--panel) 75%,var(--soft-violet));border:1px dashed var(--violet);border-radius:10px;padding:12px}.node{font-size:12px;color:var(--muted)}.node.on{font-weight:700;color:var(--violet)}.arrow{color:var(--muted)}
    footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.controls{display:flex;gap:8px}button.nav{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700}button.nav:hover{border-color:var(--violet)}button.nav:disabled{opacity:.4;cursor:not-allowed}.rule{font-size:12px;color:var(--muted)}
    @media(max-width:760px){.app{padding:16px}.rail{grid-template-columns:1fr}.axes{grid-template-columns:1fr}.stage-top{display:block}.event{text-align:left;margin-top:8px}.rule{display:none}}
  </style>
</head>
<body>
<main class="app">
  <header>
    <div><h1><code>printf("A"); fflush(stdout);</code>：字符变为可见结果</h1><div class="sub">提交数据、系统调用返回和设备完成是三个不同边界</div></div>
    <div class="counter" id="counter">阶段 1 / 5</div>
  </header>
  <nav class="rail" id="rail" aria-label="输出阶段"></nav>
  <section class="stage" aria-live="polite">
    <div class="stage-top">
      <div><span class="badge" id="badge"></span><h2 id="title"></h2></div>
      <div class="event" id="event"></div>
    </div>
    <div class="axes">
      <article class="axis cpu"><div class="k">CPU 正在执行谁</div><div class="v" id="cpu"></div><div class="hint" id="cpuHint"></div></article>
      <article class="axis state"><div class="k">发起 I/O 的进程状态</div><div class="v" id="state"></div><div class="hint" id="stateHint"></div></article>
      <article class="axis data"><div class="k">字符现在在哪里</div><div class="v" id="data"></div><div class="hint" id="dataHint"></div></article>
    </div>
    <div class="chain" id="chain" aria-label="输出数据位置"></div>
  </section>
  <footer>
    <div class="controls"><button class="nav" id="prev">← 上一步</button><button class="nav" id="next">下一步 →</button></div>
    <div class="rule">write 返回只表示内核接受到约定边界，不保证设备已经完成</div>
  </footer>
</main>
<script>
  const stages = [
    {short:"格式化",badge:"用户态",title:"printf 生成字符序列",event:"C 库解析格式串，把 A 放入用户态标准 I/O 缓冲区。",cpu:"本进程的 C 库代码",cpuHint:"普通函数调用，不一定立即进入内核。",state:"运行",stateHint:"进程正在占用 CPU。",data:"用户态库缓冲",dataHint:"字符尚未提交给操作系统。",pos:0},
    {short:"刷新",badge:"状态切换",title:"fflush 发起 write",event:"显式刷新让 C 库提交已有输出，系统调用入口使 CPU 受控进入内核。",cpu:"C 库 → 系统调用处理",cpuHint:"CPU 从用户态切换到内核态。",state:"运行",stateHint:"进入内核本身不表示阻塞。",data:"用户缓冲 → 内核",dataHint:"内核正在接收输出请求。",pos:1},
    {short:"排队",badge:"内核态",title:"内核接受输出数据",event:"内核把字节纳入输出缓冲或请求队列，驱动准备控制器命令。",cpu:"内核 I/O 层与驱动",cpuHint:"具体缓冲层数和复制次数依实现而异。",state:"通常运行",stateHint:"若输出队列已满，阻塞式 write 也可能等待。",data:"内核输出区域",dataHint:"设备还没有完成显示。",pos:2},
    {short:"设备",badge:"异步工作",title:"控制器驱动设备",event:"驱动交付请求后，控制器与设备独立工作；CPU 可以继续执行其他代码。",cpu:"任意可运行代码",cpuHint:"不需要为每个物理动作持续忙等。",state:"运行 / 就绪 / 阻塞均可能",stateHint:"取决于 write 是否返回及后续调度。",data:"控制器 / 设备路径",dataHint:"字符正在被输出设备处理。",pos:3},
    {short:"可见",badge:"设备完成",title:"字符真正显示",event:"设备形成可见结果；必要时完成中断更新队列并唤醒等待者。",cpu:"任意当前代码",cpuHint:"设备完成与当前 CPU 指令没有固定对应关系。",state:"无固定状态",stateHint:"发起进程可能早已继续执行其他工作。",data:"输出设备的可见结果",dataHint:"此时才可以说字符真正出现。",pos:4}
  ];
  const places = ["用户库缓冲","进入内核","内核输出区","控制器 / 设备","字符可见"];
  let current = 0;
  const $ = id => document.getElementById(id);

  // One render pass updates the three independent axes and the data-location chain together.
  function render(){
    const s = stages[current];
    $("counter").textContent = `阶段 ${current + 1} / ${stages.length}`;
    ["badge","title","event","cpu","cpuHint","state","stateHint","data","dataHint"].forEach(key => $(key).textContent = s[key]);
    $("prev").disabled = current === 0; $("next").disabled = current === stages.length - 1;
    document.querySelectorAll(".step").forEach((el,i) => el.classList.toggle("active", i === current));
    $("chain").innerHTML = places.map((p,i) => `<span class="node ${i === s.pos ? "on" : ""}">${p}</span>${i < places.length - 1 ? '<span class="arrow">→</span>' : ''}`).join("");
  }
  stages.forEach((s,i) => {const b=document.createElement("button");b.className="step";b.innerHTML=`<strong>${i+1}</strong>${s.short}`;b.addEventListener("click",()=>{current=i;render();});$("rail").appendChild(b);});
  $("prev").addEventListener("click",()=>{if(current>0){current--;render();}});$("next").addEventListener("click",()=>{if(current<stages.length-1){current++;render();}});
  document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")$("prev").click();if(e.key==="ArrowRight")$("next").click();});
  render();
</script>
</body>
</html>
