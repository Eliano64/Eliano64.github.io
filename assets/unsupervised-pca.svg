<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="tpca dpca">
  <title id="tpca">二维点云投影到第一主成分：保住 88.2% 的方差，丢掉垂直方向的波动</title>
  <desc id="dpca">20 个点先标准化，协方差矩阵为 [[1.000, 0.763], [0.763, 1.000]]；特征值 1.763 与 0.237，第一主成分方向 (0.707, 0.707)，方差解释率 88.16%。投影后的一维坐标从 -2.84 到 2.79，垂直于 PC1 的方向只剩 0.237 的方差。</desc>
