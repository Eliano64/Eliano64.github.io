<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>残差图：误差有没有结构</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>残差图：误差有没有结构</h1><p class="sub">左：残差随预测值呈 U 形；右：残差围绕零线随机散布</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="残差图：误差有没有结构"><rect x="0" y="0" width="960" height="540" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}

<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker></defs><text class="tt" x="28" y="52">残差图：误差有没有结构</text><text class="ss" x="28" y="80">左：残差随预测值呈 U 形；右：残差围绕零线随机散布</text><rect x="40" y="90" width="380" height="370" rx="12" fill="var(--panel)" stroke="var(--line)"/><circle cx="44" cy="112" r="6" fill="var(--curS)"/><text class="lb" x="60" y="118">残差有结构：模型漏掉了曲线</text><path d="M60,410 L400,410" stroke="var(--line)" stroke-width="1.2"/><path d="M60,410 L60,130" stroke="var(--line)" stroke-width="1.2"/><path d="M60,270.0 L400,270.0" stroke="var(--stateS)" stroke-width="1.2" stroke-dasharray="6 5"/><text class="sm" x="54" y="275.0" text-anchor="end">0</text><circle cx="80.0" cy="242.3" r="5" fill="var(--curS)"/><circle cx="107.3" cy="274.0" r="5" fill="var(--curS)"/><circle cx="134.5" cy="299.4" r="5" fill="var(--curS)"/><circle cx="161.8" cy="318.4" r="5" fill="var(--curS)"/><circle cx="189.1" cy="331.1" r="5" fill="var(--curS)"/><circle cx="216.4" cy="337.4" r="5" fill="var(--curS)"/><circle cx="243.6" cy="337.4" r="5" fill="var(--curS)"/><circle cx="270.9" cy="331.1" r="5" fill="var(--curS)"/><circle cx="298.2" cy="318.4" r="5" fill="var(--curS)"/><circle cx="325.5" cy="299.4" r="5" fill="var(--curS)"/><circle cx="352.7" cy="274.0" r="5" fill="var(--curS)"/><circle cx="380.0" cy="242.3" r="5" fill="var(--curS)"/><text class="sm" x="230.0" y="432" text-anchor="middle">预测值</text><text class="sm" x="56" y="462">纵轴：残差 = 真实值 − 预测值</text><rect x="500" y="90" width="380" height="370" rx="12" fill="var(--panel)" stroke="var(--line)"/><circle cx="504" cy="112" r="6" fill="var(--inS)"/><text class="lb" x="520" y="118">残差接近纯噪声</text><path d="M520,410 L860,410" stroke="var(--line)" stroke-width="1.2"/><path d="M520,410 L520,130" stroke="var(--line)" stroke-width="1.2"/><path d="M520,270.0 L860,270.0" stroke="var(--stateS)" stroke-width="1.2" stroke-dasharray="6 5"/><text class="sm" x="514" y="275.0" text-anchor="end">0</text><circle cx="540.0" cy="277.1" r="5" fill="var(--inS)"/><circle cx="567.3" cy="261.1" r="5" fill="var(--inS)"/><circle cx="594.5" cy="206.9" r="5" fill="var(--inS)"/><circle cx="621.8" cy="275.1" r="5" fill="var(--inS)"/><circle cx="649.1" cy="268.8" r="5" fill="var(--inS)"/><circle cx="676.4" cy="257.0" r="5" fill="var(--inS)"/><circle cx="703.6" cy="316.9" r="5" fill="var(--inS)"/><circle cx="730.9" cy="268.2" r="5" fill="var(--inS)"/><circle cx="758.2" cy="250.7" r="5" fill="var(--inS)"/><circle cx="785.5" cy="226.4" r="5" fill="var(--inS)"/><circle cx="812.7" cy="330.4" r="5" fill="var(--inS)"/><circle cx="840.0" cy="299.3" r="5" fill="var(--inS)"/><text class="sm" x="690.0" y="432" text-anchor="middle">预测值</text><text class="sm" x="516" y="462">纵轴：残差 = 真实值 − 预测值</text></svg></div><p class="cap">残差与预测值无关、均值近零、两侧大致对称，才接近纯噪声；U 形或喇叭形说明结构没被模型吸收。</p></div></body></html>
