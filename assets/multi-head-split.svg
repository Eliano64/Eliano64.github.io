<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="t d">
  <title id="t">多头注意力的拆分、拼接与输出映射</title>
  <desc id="d">输入 X 的形状为 N×512。每个 Head 用自己的投影得到 64 维的查询、键、值，独立计算注意力，得到 N×64 的输出。8 个 Head 的输出拼接成 N×512，再经过输出投影 W_O 回到 N×512。</desc>
  <style>
    :root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--box:#ffffff;--panel:#f6f8fc;--line:#c8d0da;--accent:#3b5bdb;--hi:#e8efff}
    @media (prefers-color-scheme:dark){
      :root{--bg:#171b23;--fg:#e6eaf2;--muted:#9aa4b2;--box:#232a36;--panel:#1e2430;--line:#3a4250;--accent:#8fa6ff;--hi:#243052}
    }
    text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
    .box{fill:var(--box);stroke:var(--line);stroke-width:1}
    .grp{fill:var(--panel);stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
    .hl{fill:var(--hi);stroke:var(--accent);stroke-width:1.5}
    .lbl{font-size:11.5px}
    .sub{font-size:10px;fill:var(--muted)}
    .ttl{font-size:12px;font-weight:600}
    .arrow{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#ah)}
    .note{font-size:11px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect width="820" height="380" fill="var(--bg)"/>

  <!-- input -->
  <rect class="box" x="20" y="120" width="130" height="90" rx="7"/>
  <text class="lbl" x="62" y="158">X</text>
  <text class="sub" x="45" y="176">(N, 512)</text>
  <line class="arrow" x1="150" y1="165" x2="178" y2="165"/>

  <!-- head group -->
  <rect class="grp" x="180" y="45" width="350" height="280" rx="9"/>
  <text class="ttl" x="194" y="66">Head i（共 h = 8 个，结构相同）</text>

  <rect class="box" x="200" y="86" width="86" height="28" rx="5"/>
  <text class="lbl" x="216" y="104">Qᵢ</text><text class="sub" x="240" y="104">(N,64)</text>
  <rect class="box" x="300" y="86" width="86" height="28" rx="5"/>
  <text class="lbl" x="316" y="104">Kᵢ</text><text class="sub" x="340" y="104">(N,64)</text>
  <rect class="box" x="400" y="86" width="86" height="28" rx="5"/>
  <text class="lbl" x="416" y="104">Vᵢ</text><text class="sub" x="440" y="104">(N,64)</text>
  <line class="arrow" x1="243" y1="114" x2="243" y2="150"/>
  <line class="arrow" x1="343" y1="114" x2="343" y2="150"/>
  <line class="arrow" x1="443" y1="114" x2="443" y2="150"/>

  <rect class="hl" x="200" y="152" width="286" height="36" rx="5"/>
  <text class="lbl" x="212" y="174">Attention(Qᵢ, Kᵢ, Vᵢ) = softmax(QᵢKᵢᵀ/√d_k)Vᵢ</text>
  <line class="arrow" x1="343" y1="188" x2="343" y2="220"/>

  <rect class="box" x="240" y="222" width="206" height="28" rx="5"/>
  <text class="lbl" x="252" y="240">headᵢ</text><text class="sub" x="300" y="240">(N, 64)</text>
  <line class="arrow" x1="446" y1="236" x2="540" y2="200"/>

  <!-- concat -->
  <rect class="box" x="545" y="120" width="100" height="90" rx="7"/>
  <text class="lbl" x="562" y="150">Concat</text>
  <text class="sub" x="556" y="168">8 × (N,64)</text>
  <text class="sub" x="556" y="184">= (N,512)</text>
  <line class="arrow" x1="645" y1="165" x2="672" y2="165"/>

  <!-- output projection -->
  <rect class="hl" x="675" y="140" width="55" height="50" rx="6"/>
  <text class="lbl" x="694" y="170">W<tspan baseline-shift="sub" font-size="8">O</tspan></text>
  <line class="arrow" x1="730" y1="165" x2="752" y2="165"/>
  <rect class="box" x="755" y="120" width="55" height="90" rx="7"/>
  <text class="lbl" x="772" y="158">O</text>
  <text class="sub" x="762" y="176">(N,512)</text>

  <!-- batch shapes -->
  <text class="note" x="20" y="352">批量形状：(B,N,512) → (B,N,8,64) → (B,8,N,64) → Attention → (B,N,512)</text>
  <text class="note" x="20" y="368">子空间变小，每个 Head 的注意力权重矩阵仍是 N×N；拼接后用 W_O 把各 Head 的信息重新组合。</text>
</svg>
