<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一次请求的完整链路</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f8fafc; --text:#172033; --muted:#526174; --line:#536273;
    --grid:#cbd5e1; --accent:#2563eb; --hit:#0f766e; --own:#b45309; --free:#eef2f7;
    --chip:#e6eef9; --shadow:rgba(15,23,42,.12); --warm:#be123c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111318; --panel:#1b2029; --text:#e8edf5; --muted:#aab5c4; --line:#9aa8ba;
      --grid:#455366; --accent:#7aa2ff; --hit:#62d4c5; --own:#f6b85f; --free:#232a35;
      --chip:#263142; --shadow:rgba(0,0,0,.38); --warm:#ff8aa0;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
  header{padding:16px 22px 4px;text-align:center}
  h1{margin:0;font-size:22px}
  .sub{margin-top:5px;color:var(--muted);font-size:12.5px;line-height:1.5}
  .steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .dot{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);display:flex;
       align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);cursor:pointer;
       font-variant-numeric:tabular-nums}
  .dot.on{background:var(--chip);border-color:var(--accent);color:var(--accent);font-weight:700}
  .dot.done{color:var(--text)}
  main{padding:8px 18px 4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .pane{border:1.4px solid var(--line);border-radius:12px;background:var(--panel);
        box-shadow:0 6px 16px var(--shadow);padding:10px 11px;min-height:300px}
  .pane h2{margin:0 0 8px;font-size:13.5px}
  .pane h2 span{font-weight:400;color:var(--muted);font-size:11.5px}
  .row{margin-bottom:8px}
  .k{font-size:11px;color:var(--muted);margin-bottom:3px}
  .card{border:1px solid var(--grid);border-radius:8px;padding:6px 8px;font-size:11.5px;line-height:1.45}
  .card.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .card.dim{opacity:.45}
  .ids{font-family:"Cascadia Code",Consolas,monospace;font-size:11px;color:var(--muted);
       word-break:break-all;line-height:1.4}
  .bar{display:flex;height:26px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .bar div{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#fff;white-space:nowrap}
  .bar .b-hit{background:var(--hit)}
  .bar .b-own{background:var(--own)}
  .bar .b-free{background:var(--free);color:var(--muted)}
  @media (prefers-color-scheme: dark){ .bar div{color:#0b1020} .bar .b-free{color:var(--muted)} }
  .table{display:flex;gap:4px;flex-wrap:wrap}
  .blk{min-width:44px;padding:3px 5px;border-radius:6px;border:1px solid var(--grid);
       font-size:10.5px;text-align:center;font-variant-numeric:tabular-nums}
  .blk.hit{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 14%,transparent)}
  .blk.own{border-color:var(--own);background:color-mix(in srgb,var(--own) 14%,transparent)}
  .blk.part{border-style:dashed}
  .sse{display:flex;gap:4px;flex-wrap:wrap}
  .tok{width:26px;height:22px;border-radius:5px;border:1px solid var(--accent);
       display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--accent)}
  .tok.ghost{border-style:dashed;border-color:var(--grid);color:var(--muted)}
  .flow{font-size:11px;color:var(--muted);line-height:1.5}
  .flow b{color:var(--text)}
  .log{margin:8px 18px 0;border:1.4px solid var(--line);border-radius:12px;background:var(--panel);
       padding:9px 12px;font-size:12.5px;line-height:1.55;min-height:52px;box-shadow:0 6px 16px var(--shadow)}
  .log b{color:var(--accent)}
  .nums{margin:8px 18px 0;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);
        font-variant-numeric:tabular-nums}
  footer{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;padding:10px 16px 14px}
  button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;
         padding:6px 12px;font-size:12.5px;cursor:pointer}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{color:var(--muted);font-size:12.5px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
  @media (max-width:820px){
    main{grid-template-columns:1fr;padding:6px 12px 2px}
    .pane{min-height:0}
    h1{font-size:19px}
    .log{margin:6px 12px 0;font-size:12px}
    .nums{margin:6px 12px 0}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header>
  <h1>一次请求的完整链路</h1>
  <div class="sub">一条 1800 token 的请求，前 1200 个已有完整前缀缓存；块容量 16 token，池子沿用 24 GB 卡那一档的 2355 块</div>
  <div class="steps" id="steps" role="tablist" aria-label="链路步骤"></div>
</header>

<main>
  <section class="pane" id="paneApi">
    <h2>API server <span>请求预处理与结果输出</span></h2>
    <div class="row">
      <div class="k">收到的请求</div>
      <div class="card" id="reqCard">…</div>
    </div>
    <div class="row">
      <div class="k">分词结果（前 8 个 id）</div>
      <div class="ids" id="tokenIds">…</div>
    </div>
    <div class="row">
      <div class="k">已推给客户端的 token</div>
      <div class="sse" id="sse"></div>
    </div>
  </section>

  <section class="pane" id="paneCore">
    <h2>EngineCore <span>调度与块</span></h2>
    <div class="row">
      <div class="k">等待队列</div>
      <div class="table" id="queue"></div>
    </div>
    <div class="row">
      <div class="k">块池</div>
      <div class="bar" id="pool"></div>
    </div>
    <div class="row">
      <div class="k">本请求的块表（逻辑块 → 物理块）</div>
      <div class="table" id="blockTable"></div>
    </div>
    <div class="row">
      <div class="k">这一轮的批次</div>
      <div class="card" id="batch">…</div>
    </div>
  </section>

  <section class="pane" id="paneWorker">
    <h2>GPU worker <span>每卡一个，执行前向</span></h2>
    <div class="row">
      <div class="k">这一轮在算什么</div>
      <div class="card" id="compute">…</div>
    </div>
    <div class="row">
      <div class="k">前向</div>
      <div class="flow" id="flow">…</div>
    </div>
    <div class="row">
      <div class="k">采样</div>
      <div class="card" id="sample">…</div>
    </div>
  </section>
</main>

<div class="log" id="log"></div>
<div class="nums" id="nums"></div>

<footer>
  <button id="play" type="button" aria-pressed="false">播放</button>
  <button id="prev" type="button">上一步</button>
  <div class="count" id="count">1 / 9</div>
  <button id="next" type="button">下一步</button>
  <button id="reset" type="button">回到第 1 步</button>
</footer>

<script>
/* 全部读数由这一组常量算出，改一个数，链路里的数量和文本跟着变。 */
const MODEL_INPUT = { promptTokens: 1800, sharedTokens: 1200, blockSize: 16, poolBlocks: 2355, slots: 4 };

const SHARED_BLOCKS = MODEL_INPUT.sharedTokens / MODEL_INPUT.blockSize;             // 1200 / 16 = 75
const NEW_TOKENS = MODEL_INPUT.promptTokens - MODEL_INPUT.sharedTokens;             // 600
const NEW_BLOCKS = Math.ceil(NEW_TOKENS / MODEL_INPUT.blockSize);                   // 600 / 16 = 38（末块半满）
const PROMPT_BLOCKS = SHARED_BLOCKS + NEW_BLOCKS;                                   // 113
const FREE_AFTER = MODEL_INPUT.poolBlocks - NEW_BLOCKS;                             // 命中不新占块，只加引用

const STEPS = [
  {
    title: "分词",
    log: "API server 收下请求：套 chat 模板、分词成 1800 个 token id，连同采样参数打包，经 ZMQ 交给 EngineCore。API server 不碰显存，也不决定这一轮算什么。",
    state: { tokens: true }
  },
  {
    title: "排队",
    log: "EngineCore 把请求放进等待队列。这一轮的 token 预算已经分给正在执行的请求，该请求需要等下一轮的空位。",
    state: { tokens: true, queued: 1 }
  },
  {
    title: "查前缀",
    log: "KV 管理器拿前 1200 个 token 逐块算哈希：命中 75 块，这些块的引用计数各加一，前 1200 个 token 的 KV 不用再算。命中的块不占新显存。",
    state: { tokens: true, queued: 1, hit: SHARED_BLOCKS }
  },
  {
    title: "预填",
    log: "余下 600 个 token 要做 prefill。这一轮还有别的请求在 decode，预算只够一半，所以 prefill 切成两轮。",
    state: { tokens: true, queued: 1, hit: SHARED_BLOCKS, batch: "prefill 600 token（切 2 轮）+ decode 2 条" }
  },
  {
    title: "要块",
    log: `prefill 要写新的 KV：从空闲队列取 ${NEW_BLOCKS} 块。${NEW_TOKENS} 个 token 只够 ${(NEW_TOKENS / MODEL_INPUT.blockSize).toFixed(1)} 块，末块写不满也照样占一整块。`,
    state: { tokens: true, queued: 1, hit: SHARED_BLOCKS, own: NEW_BLOCKS, batch: "prefill 600 token（切 2 轮）+ decode 2 条" }
  },
  {
    title: "下发",
    log: "这一轮的批次连同每条的块表下发到 4 个 GPU worker。跨进程传的只有 token id、采样参数和块表，张量不出显卡。",
    state: { tokens: true, hit: SHARED_BLOCKS, own: NEW_BLOCKS, batch: "prefill 600 token（切 2 轮）+ decode 2 条", compute: "prefill" }
  },
  {
    title: "采样",
    log: "worker 按块表读 KV，做 attention 与 FFN，得到 logits，就地采样出第 1 个 token id 回给 EngineCore。",
    state: { tokens: true, hit: SHARED_BLOCKS, own: NEW_BLOCKS, batch: "本轮完成", compute: "prefill", sampled: 1 }
  },
  {
    title: "回流",
    log: "EngineCore 把 token id 交给 API server；API server 解码成文本，按 SSE 推给客户端。之后每轮重复要块、下发、采样三步：token 一个个填进尾块，尾块写满就再向空闲队列要一块。",
    state: { tokens: true, hit: SHARED_BLOCKS, own: NEW_BLOCKS, compute: "decode", sampled: 4 }
  },
  {
    title: "归还",
    log: `结束符到了：请求的块表作废。共享的 ${SHARED_BLOCKS} 块引用计数减一，仍留在池子里给下一条请求用；私有的块（${NEW_BLOCKS} 块，加上生成时新开的）引用计数减到零后释放；计数为零的完整块也可能留在缓存中等待复用，直到被淘汰。`,
    state: { tokens: true, released: true, sampled: 8 }
  }
];

let step = 0;

function el(id){ return document.getElementById(id); }

function chip(text, cls){
  const d = document.createElement("div");
  d.className = "blk" + (cls ? " " + cls : "");
  d.textContent = text;
  return d;
}

function buildStepDots(){
  const host = el("steps");
  host.innerHTML = "";
  STEPS.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "dot" + (i === step ? " on" : i < step ? " done" : "");
    b.textContent = String(i + 1);
    b.title = s.title;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(i === step));
    b.addEventListener("click", () => { step = i; render(); });
    host.appendChild(b);
  });
}

function render(){
  const s = STEPS[step];
  const st = s.state;

  el("log").innerHTML = `<b>第 ${step + 1} 步 · ${s.title}</b>　${s.log}`;
  el("count").textContent = `${step + 1} / ${STEPS.length}`;

  /* API server */
  el("reqCard").textContent = st.tokens
    ? `messages = 系统提示 + 用户问题　约 ${MODEL_INPUT.promptTokens} token`
    : "还没有请求进来";
  el("reqCard").className = "card" + (st.tokens ? " hot" : "");
  el("tokenIds").textContent = st.tokens ? "128000 9125 374 264 3822 13 576 4480 …" : "…";
  const sse = el("sse");
  sse.innerHTML = "";
  const shown = st.sampled || 0;
  for (let i = 0; i < Math.max(shown, 4); i++){
    const b = document.createElement("div");
    b.className = "tok" + (i < shown ? "" : " ghost");
    b.textContent = i < shown ? "tok" : "";
    sse.appendChild(b);
  }

  /* EngineCore */
  const q = el("queue");
  q.innerHTML = "";
  if (st.queued && !st.released) q.appendChild(chip("本请求", "own"));
  else q.appendChild(chip("空", ""));
  el("queue").className = "table";

  const hit = st.hit || 0;
  const own = st.own || 0;
  const free = MODEL_INPUT.poolBlocks - hit - own;   // 命中的块也占着池子，只是不新占
  const pool = el("pool");
  pool.innerHTML = "";
  const segs = [
    { cls: "b-hit", count: hit, label: `${hit} 块命中` },
    { cls: "b-own", count: own, label: `${own} 块新增` },
    { cls: "b-free", count: free, label: `空闲 ${free.toLocaleString("en-US")}` }
  ];
  segs.forEach(g => {
    if (g.count <= 0) return;
    const d = document.createElement("div");
    d.className = g.cls;
    d.style.flex = String(g.count);
    d.textContent = g.count > MODEL_INPUT.poolBlocks * 0.12 ? g.label : "";
    d.title = g.label;
    pool.appendChild(d);
  });

  const bt = el("blockTable");
  bt.innerHTML = "";
  if (hit){
    bt.appendChild(chip("0 → 命中", "hit"));
    bt.appendChild(chip("1 → 命中", "hit"));
    bt.appendChild(chip("…", ""));
    if (own){
      bt.appendChild(chip(`${hit + own - 1} → 新增`, "own part"));
    } else {
      bt.appendChild(chip(`${hit - 1} → 命中`, "hit"));
    }
  } else {
    bt.appendChild(chip("尚未分配", ""));
  }

  const batch = el("batch");
  batch.textContent = st.batch || (st.queued ? "尚未调度" : "空");
  batch.className = "card" + (st.batch && st.compute ? " hot" : "");

  /* GPU worker */
  const compute = el("compute");
  compute.textContent = st.compute === "prefill" ? "本请求的 prefill"
    : st.compute === "decode" ? "本请求的 decode（每轮 1 个 token）+ 其它请求的 decode"
    : st.batch ? "等 EngineCore 下发" : "空闲";
  compute.className = "card" + (st.compute ? " hot" : "");
  el("flow").innerHTML = st.compute
    ? "按<b>块表</b>取 KV → attention → FFN → logits"
    : "…";
  el("sample").textContent = st.sampled ? `第 ${st.sampled} 个 token id 已回传` : "还没采样";

  /* 数字 */
  const used = st.released ? 0 : (hit + own);
  el("nums").innerHTML = st.released
    ? [`共享的 ${SHARED_BLOCKS} 块引用计数减一，留在池子`,
       `私有的 ${NEW_BLOCKS} 块起（含生成时新开的）逆序回空闲队列尾部`,
       `块容量 ${MODEL_INPUT.blockSize} token · 槽位 ${MODEL_INPUT.slots}`].join("　|　")
    : [`命中 ${hit} 块 · 新增 ${own} 块 · 本请求共 ${hit + own} 块`,
       `池子 ${MODEL_INPUT.poolBlocks.toLocaleString("en-US")} 块，此刻空闲 ${free.toLocaleString("en-US")}`,
       `块容量 ${MODEL_INPUT.blockSize} token · 槽位 ${MODEL_INPUT.slots}`].join("　|　");

  buildStepDots();
}

function setStep(v){
  step = Math.max(0, Math.min(v, STEPS.length - 1));
  render();
}

let timer = null, playing = false;
function play(on){
  playing = on;
  const b = el("play");
  b.textContent = on ? "暂停" : "播放";
  b.setAttribute("aria-pressed", String(on));
  if (timer) { clearInterval(timer); timer = null; }
  if (!on) return;
  timer = setInterval(() => {
    if (step >= STEPS.length - 1) { play(false); return; }
    setStep(step + 1);
  }, 1800);
}

el("play").addEventListener("click", () => play(!playing));
el("prev").addEventListener("click", () => { play(false); setStep(step - 1); });
el("next").addEventListener("click", () => { play(false); setStep(step + 1); });
el("reset").addEventListener("click", () => { play(false); setStep(0); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON") return;
  if (e.code === "ArrowRight") setStep(step + 1);
  else if (e.code === "ArrowLeft") setStep(step - 1);
  else if (e.code === "Space") { e.preventDefault(); play(!playing); }
});

render();
</script>
</body>
</html>
