<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d">
  <title id="t">GPT 路线的三个优势</title>
  <desc id="d">自回归目标带来更密集、统一、与生成直接对齐的训练信号；任务切换靠上下文；解码器结构简单，便于扩展和工程优化。</desc>
  <style>
    :root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--line:#c8d0da;--panel:#f6f8fc;--accent:#3b5bdb;--hi:#e8efff;--box:#ffffff}
    @media (prefers-color-scheme:dark){:root{--bg:#232d3b;--fg:#ffffff;--muted:#dbe3ef;--line:#8d9bb1;--panel:#313e52;--accent:#a8bcff;--hi:#34445e;--box:#38475c}}
    text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
    .panel{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .box{fill:var(--box);stroke:var(--line);stroke-width:1}
    .ttl{font-size:15px;font-weight:700}
    .lbl{font-size:11px}
    .sm{font-size:9.5px;fill:var(--muted)}
    .num{fill:var(--hi);stroke:var(--accent);stroke-width:1.2}
  </style>
  <rect width="1000" height="380" fill="var(--bg)"/>
  <text class="ttl" x="24" y="32">GPT 路线为什么更容易扩展</text>
  <text class="sm" x="24" y="50">三条优势相互配合：训练目标、任务接口与网络结构</text>

  <rect class="panel" x="24" y="75" width="300" height="270" rx="9"/>
  <circle class="num" cx="55" cy="108" r="16"/><text class="lbl" x="48" y="113">1</text>
  <text class="lbl" x="80" y="113">训练信号密集</text>
  <text class="sm" x="42" y="150">长度为 N 的文本，多个位置都能</text>
  <text class="sm" x="42" y="168">产生预测监督，不需要构造掩码</text>
  <text class="sm" x="42" y="186">或破坏文本片段。</text>
  <rect class="box" x="42" y="210" width="264" height="54" rx="5"/>
  <text class="sm" x="54" y="230">网页、书籍、代码、对话</text>
  <text class="sm" x="54" y="248">只要是连续文本，都能用同一目标训练。</text>

  <rect class="panel" x="345" y="75" width="300" height="270" rx="9"/>
  <circle class="num" cx="376" cy="108" r="16"/><text class="lbl" x="369" y="113">2</text>
  <text class="lbl" x="401" y="113">任务切换靠上下文</text>
  <text class="sm" x="363" y="150">新任务先改任务描述与示例，</text>
  <text class="sm" x="363" y="168">用同一个模型试做；不必先准备</text>
  <text class="sm" x="363" y="186">标注数据并训练专用任务头。</text>
  <rect class="box" x="363" y="210" width="264" height="54" rx="5"/>
  <text class="sm" x="375" y="230">切换成本低，但受上下文长度限制；</text>
  <text class="sm" x="375" y="248">效果不足时仍需微调或训练。</text>

  <rect class="panel" x="666" y="75" width="310" height="270" rx="9"/>
  <circle class="num" cx="697" cy="108" r="16"/><text class="lbl" x="690" y="113">3</text>
  <text class="lbl" x="722" y="113">结构简单，便于工程扩展</text>
  <text class="sm" x="684" y="150">同一套解码器层反复堆叠，训练</text>
  <text class="sm" x="684" y="168">切分与显存管理更直接；推理围绕</text>
  <text class="sm" x="684" y="186">逐 Token 生成，可用 KV Cache、</text>
  <text class="sm" x="684" y="204">批处理与推理调度优化。</text>
  <rect class="box" x="684" y="222" width="274" height="46" rx="5"/>
  <text class="sm" x="696" y="242">经验可复用到结构相近的模型：</text>
  <text class="sm" x="696" y="260">量化、内核、部署链路。</text>

  <text class="sm" x="24" y="370">结构简单不保证效果好；这些优势要与规模、数据、训练目标一起看。</text>
</svg>
