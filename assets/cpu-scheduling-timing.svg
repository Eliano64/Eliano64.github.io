<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
  <title id="title">触发 CPU 调度决策的事件</title>
  <desc id="desc">区分运行进程不能继续、进程进入就绪态和抢占事件，并说明调度决策与实际切换的关系。</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--fg:#111827;--muted:#64748b;--line:#94a3b8;--blue:#dbeafe;--green:#dcfce7;--amber:#fef3c7;--red:#fee2e2;--accent:#2563eb}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#0f172a;--fg:#e5e7eb;--muted:#94a3b8;--line:#64748b;--blue:#1e3a8a;--green:#14532d;--amber:#713f12;--red:#7f1d1d;--accent:#60a5fa}}
    .bg{fill:var(--bg)}.box{stroke:var(--line);stroke-width:2}.blue{fill:var(--blue)}.green{fill:var(--green)}.amber{fill:var(--amber)}.red{fill:var(--red)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:var(--fg)}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.t{font-size:17px}.small{font-size:15px;fill:var(--muted)}.arrow{stroke:var(--accent);stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--accent)"/></marker></defs>
  <rect class="bg" width="980" height="640"/>
  <text class="title" x="490" y="40" text-anchor="middle">事件发生后：是否需要重新选择运行进程？</text>

  <text class="small" x="150" y="78" text-anchor="middle">事件</text>
  <text class="small" x="490" y="78" text-anchor="middle">状态变化</text>
  <text class="small" x="815" y="78" text-anchor="middle">调度结果</text>

  <rect class="box red" x="35" y="98" width="230" height="108" rx="12"/>
  <text class="head" x="150" y="134" text-anchor="middle">退出或阻塞</text>
  <text class="t" x="150" y="166" text-anchor="middle">终止 / 等待 I/O</text>
  <text class="small" x="150" y="191" text-anchor="middle">当前进程不能继续</text>
  <path class="arrow" d="M265 152 L360 152"/>
  <rect class="box amber" x="360" y="98" width="260" height="108" rx="12"/>
  <text class="head" x="490" y="142" text-anchor="middle">运行态 → 阻塞态或终止态</text>
  <text class="small" x="490" y="177" text-anchor="middle">CPU 必须交给其他实体</text>
  <path class="arrow" d="M620 152 L700 152"/>
  <rect class="box green" x="700" y="98" width="245" height="108" rx="12"/>
  <text class="head" x="823" y="142" text-anchor="middle">必须重新选择</text>
  <text class="t" x="823" y="177" text-anchor="middle">没有候选时运行 idle</text>

  <rect class="box blue" x="35" y="244" width="230" height="120" rx="12"/>
  <text class="head" x="150" y="280" text-anchor="middle">新进程创建完成</text>
  <text class="t" x="150" y="312" text-anchor="middle">或 I/O 完成而被唤醒</text>
  <text class="small" x="150" y="341" text-anchor="middle">当前进程仍可继续</text>
  <path class="arrow" d="M265 304 L360 304"/>
  <rect class="box amber" x="360" y="244" width="260" height="120" rx="12"/>
  <text class="head" x="490" y="287" text-anchor="middle">有进程进入就绪队列</text>
  <text class="small" x="490" y="322" text-anchor="middle">候选集合发生变化</text>
  <path class="arrow" d="M620 304 L700 304"/>
  <rect class="box green" x="700" y="244" width="245" height="120" rx="12"/>
  <text class="head" x="823" y="280" text-anchor="middle">抢占式：比较并可能换人</text>
  <text class="t" x="823" y="312" text-anchor="middle">非抢占式：当前进程继续</text>
  <text class="small" x="823" y="341" text-anchor="middle">以后再调度新就绪进程</text>

  <rect class="box blue" x="35" y="402" width="230" height="112" rx="12"/>
  <text class="head" x="150" y="440" text-anchor="middle">时间片用完</text>
  <text class="t" x="150" y="472" text-anchor="middle">或出现更高优先级候选</text>
  <text class="small" x="150" y="497" text-anchor="middle">当前进程仍具备运行条件</text>
  <path class="arrow" d="M265 458 L360 458"/>
  <rect class="box amber" x="360" y="402" width="260" height="112" rx="12"/>
  <text class="head" x="490" y="445" text-anchor="middle">当前进程回到就绪队列</text>
  <text class="small" x="490" y="480" text-anchor="middle">仅在允许抢占时发生</text>
  <path class="arrow" d="M620 458 L700 458"/>
  <rect class="box green" x="700" y="402" width="245" height="112" rx="12"/>
  <text class="head" x="823" y="445" text-anchor="middle">重新执行调度算法</text>
  <text class="t" x="823" y="480" text-anchor="middle">可能仍选中原进程</text>

  <rect class="panel" x="70" y="552" width="840" height="58" rx="12"/>
  <text class="t" x="490" y="578" text-anchor="middle">中断或系统调用处理可以先标记“需要调度”，再到安全点执行分派。</text>
  <text class="small" x="490" y="600" text-anchor="middle">进入就绪态会改变候选集合，但只有抢占式调度才可能立即换人。</text>
</svg>
