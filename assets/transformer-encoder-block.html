<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Transformer 编码器的一层</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;
--in:#dbe7ff; --inS:#2f5bb7; --param:#ece0ff; --paramS:#6b46c1;
--state:#e9edf3; --stateS:#4a5568; --out:#d9f2e2; --outS:#2f7a4f;
--cur:#ffe6c7; --curS:#b45309; --accent:#2f5bb7;
}
@media (prefers-color-scheme:dark){:root{
--bg:#14181f; --panel:#1c222b; --fg:#e8ecf3; --muted:#9aa4b2; --line:#39424f;
--in:#1f3149; --inS:#8fb0ef; --param:#2d2350; --paramS:#b49af0;
--state:#262d38; --stateS:#aab4c2; --out:#1e3a2b; --outS:#87c9a2;
--cur:#4a3418; --curS:#f0b26b; --accent:#8fb0ef;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>Transformer 编码器的一层</h1><p class="sub">自注意力与 FFN 各带残差与 LayerNorm；主干一条线，残差走下方弧线</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="Transformer 编码器的一层"><rect x="0" y="0" width="1100" height="620" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wp{stroke:var(--paramS);stroke-width:2.2;fill:none;marker-end:url(#arp)}
.ws{stroke:var(--stateS);stroke-width:2.2;fill:none;marker-end:url(#ars)}
.wout{stroke:var(--outS);stroke-width:2.2;fill:none;marker-end:url(#aro)}
.wcur{stroke:var(--curS);stroke-width:2.2;fill:none;marker-end:url(#arc)}
.win{stroke:var(--inS);stroke-width:2.2;fill:none;marker-end:url(#ari)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}
</style><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="arp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--paramS)"/></marker>
<marker id="ars" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--stateS)"/></marker>
<marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--outS)"/></marker>
<marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--curS)"/></marker>
<marker id="ari" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--inS)"/></marker></defs><text class="tt" x="28" y="52">Transformer 编码器的一层</text><text class="ss" x="28" y="80">自注意力与 FFN 各带残差与 LayerNorm；主干一条线，残差走下方弧线</text><rect x="30" y="104" width="14" height="14" rx="3" fill="var(--in)" stroke="var(--inS)"/><text class="sm" x="49" y="116">输入</text><rect x="120" y="104" width="14" height="14" rx="3" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="139" y="116">参数</text><rect x="210" y="104" width="14" height="14" rx="3" fill="var(--state)" stroke="var(--stateS)"/><text class="sm" x="229" y="116">中间状态</text><rect x="300" y="104" width="14" height="14" rx="3" fill="var(--out)" stroke="var(--outS)"/><text class="sm" x="319" y="116">输出</text><rect x="390" y="104" width="14" height="14" rx="3" fill="var(--cur)" stroke="var(--curS)"/><text class="sm" x="409" y="116">当前步</text><rect x="848" y="92" width="222" height="66" rx="10" fill="var(--panel)" stroke="var(--line)"/><text class="sm" x="860" y="112">图例</text><text class="sm" x="860" y="132">· 点积　⊕ 逐元素加　LN 层归一化</text><text class="sm" x="860" y="150">softmax 逐行归一</text><text class="sm" x="40" y="150">一个编码器层（× N）</text><rect class="b in" x="40" y="250" width="110" height="80" rx="10"/><text class="lb" x="95.0" y="286.0" text-anchor="middle">X</text><text class="sm" x="95.0" y="306.0" text-anchor="middle">n×d</text><rect class="b cur" x="180" y="240" width="150" height="100" rx="10"/><text class="lb" x="255.0" y="276.0" text-anchor="middle">自注意力</text><text class="sm" x="255.0" y="296.0" text-anchor="middle">Q/K/V 投影</text><text class="sm" x="255.0" y="316.0" text-anchor="middle">逐行 softmax</text><circle class="b plain" cx="370" cy="290" r="22"/><text class="sm" x="370" y="295" text-anchor="middle">⊕</text><rect class="b state" x="400" y="250" width="120" height="80" rx="10"/><text class="lb" x="460.0" y="286.0" text-anchor="middle">LayerNorm</text><text class="sm" x="460.0" y="306.0" text-anchor="middle">稳定尺度</text><rect class="b out" x="550" y="240" width="160" height="100" rx="10"/><text class="lb" x="630.0" y="276.0" text-anchor="middle">FFN</text><text class="sm" x="630.0" y="296.0" text-anchor="middle">d → d_ff → d</text><text class="sm" x="630.0" y="316.0" text-anchor="middle">GELU 逐位置</text><circle class="b plain" cx="750" cy="290" r="22"/><text class="sm" x="750" y="295" text-anchor="middle">⊕</text><rect class="b state" x="780" y="250" width="120" height="80" rx="10"/><text class="lb" x="840.0" y="286.0" text-anchor="middle">LayerNorm</text><text class="sm" x="840.0" y="306.0" text-anchor="middle">输出到下一层</text><path class="wp" d="M150,290 L176,290"/><path class="wout" d="M330,290 L344,290"/><path class="wire" d="M392,290 L396,290"/><path class="wire" d="M520,290 L546,290"/><path class="wout" d="M710,290 L724,290"/><path class="wire" d="M772,290 L776,290"/><path class="wout" d="M900,290 L930,290"/><text class="sm" x="936" y="296">→ 下一层</text><path class="ws" d="M105,330 L105,390 L370,390 L370,312"/><text class="sm" x="180" y="408">残差：X 直接加到注意力输出上</text><path class="ws" d="M460,330 L460,430 L750,430 L750,312"/><text class="sm" x="540" y="448">残差：LN 输出直接加到 FFN 输出上</text><rect x="40" y="470" width="640" height="66" rx="12" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="56" y="496">y₁ = LN(x + Attn(x))　　y₂ = LN(y₁ + FFN(y₁))</text><text class="sm" x="56" y="520">两个子层各自带残差；× N 表示整层重复</text><rect class="b cur" x="30" y="572" width="196" height="34" rx="8"/><text class="sm" x="128.0" y="594" text-anchor="middle">自注意力</text><path class="wire" d="M228,589 L242,589"/><rect class="b state" x="244" y="572" width="196" height="34" rx="8"/><text class="sm" x="342.0" y="594" text-anchor="middle">残差 + LN</text><path class="wire" d="M442,589 L456,589"/><rect class="b out" x="458" y="572" width="196" height="34" rx="8"/><text class="sm" x="556.0" y="594" text-anchor="middle">FFN</text><path class="wire" d="M656,589 L670,589"/><rect class="b out" x="672" y="572" width="196" height="34" rx="8"/><text class="sm" x="770.0" y="594" text-anchor="middle">残差 + LN</text></svg></div></div></body></html>
