<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 318" width="400" height="318" role="img" aria-label="人工智能、机器学习、深度学习与大语言模型的包含关系">
<style>
  :root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6472;--line:#8a93a3;--ai:#eef2f8;--ml:#e3ebf7;--dl:#d6e2f5}
  @media (prefers-color-scheme: dark){
    :root{--bg:#171b23;--fg:#e6eaf2;--muted:#9aa4b2;--line:#5b6472;--ai:#1e2430;--ml:#232c3b;--dl:#283346}
  }
  text{font-family:"Segoe UI","Noto Sans SC",system-ui,sans-serif;fill:var(--fg)}
  .t{font-size:13px;font-weight:600}
  .s{font-size:11px;fill:var(--muted)}
</style>
<rect x="0" y="0" width="400" height="318" fill="var(--bg)"/>
<rect x="8" y="8" width="384" height="302" rx="12" fill="var(--ai)" stroke="var(--line)"/>
<text class="t" x="22" y="30">人工智能</text>
<text class="s" x="22" y="46">规则系统与从数据学习的系统都在内</text>
<rect x="22" y="58" width="356" height="220" rx="10" fill="var(--ml)" stroke="var(--line)"/>
<text class="t" x="36" y="80">机器学习</text>
<text class="s" x="36" y="96">从数据中得到模型参数或规则</text>
<rect x="36" y="108" width="328" height="156" rx="8" fill="var(--dl)" stroke="var(--line)"/>
<text class="t" x="50" y="130">深度学习</text>
<text class="s" x="50" y="146">多层神经网络，表示可由网络学习</text>
<rect x="50" y="158" width="300" height="52" rx="6" fill="none" stroke="var(--line)" stroke-dasharray="4 3"/>
<text class="t" x="62" y="180">主流大语言模型（LLM）</text>
<text class="s" x="62" y="196">Transformer 自回归语言模型是该家族的一类</text>
<text class="s" x="50" y="232">深度学习也用于图像、语音等非文本任务</text>
<text class="s" x="22" y="298">区域表示包含关系，面积不表示规模</text>
</svg>
