<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="tsig dsig">
  <title id="tsig">sigmoid 把分数压成概率，导数决定梯度能否传回去</title>
  <desc id="dsig">左图是概率 σ(z)：z 为 0 时 0.500，z 到 ±3 时 0.953 与 0.047。右图是导数 σ(z)(1-σ(z))：z 为 0 时最大 0.250，z 到 ±3 时只剩 0.045。</desc>
