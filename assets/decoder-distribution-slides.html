<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>从 logits 到概率分布</title>
<style>
:root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--line:#c8d0da;--panel:#f4f7fb;--accent:#3b5bdb;--hi:#e8efff;--bar:#9db7e8;--sel:#3b5bdb}
@media (prefers-color-scheme:dark){:root{--bg:#232d3b;--fg:#ffffff;--muted:#dbe3ef;--line:#8d9bb1;--panel:#313e52;--accent:#c2d4ff;--hi:#3d5270;--bar:#5a78a8;--sel:#c2d4ff}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{padding:12px;max-width:820px;color:var(--fg);font:15.5px/1.5 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
h1{font-size:19px;line-height:1.3;margin:0 0 3px}
p{margin:5px 0}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 8px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
button{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stepLabel{font-size:14px;color:var(--muted)}
.tau{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px;opacity:.45;transition:opacity .15s}
.panel.active{opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.panel h2{font-size:15px;margin:0 0 6px}
.rows{display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:60px 1fr 52px;gap:5px;align-items:center;font-size:13px}
.track{height:14px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--bar);width:0}
.val{text-align:right;color:var(--muted);font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11.5px}
.strat{display:flex;flex-direction:column;gap:5px;font-size:13px}
.strat div{padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.desc{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px;margin-top:10px;min-height:50px;font-size:14px}
.note{color:var(--muted);font-size:12.5px;margin-top:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>从 logits 到概率分布</h1>
<p class="sub">同一组词表分数，经过温度缩放与 Softmax，得到下一个 Token 的概率分布。候选范围与采样放在单独的图示里。</p>

<div class="controls" role="group" aria-label="步骤控制">
  <button id="prev" type="button">上一步</button>
  <span id="stepLabel" aria-live="polite">1 / 3</span>
  <button id="next" type="button">下一步</button>
  <label class="tau">温度 τ <input id="tau" type="range" min="0.5" max="2" step="0.1" value="1"></label>
  <span id="tauVal" class="val" style="text-align:left">1.0</span>
</div>

<div class="grid">
  <div class="panel" data-step="1">
    <h2>1. Logits（原始分数）</h2>
    <div class="rows" id="logitRows"></div>
  </div>
  <div class="panel" data-step="2">
    <h2>2. 温度缩放</h2>
    <div class="strat" id="scaledReadout"></div>
  </div>
  <div class="panel" data-step="3" style="grid-column:1/-1">
    <h2>3. Softmax 概率分布</h2>
    <div class="rows" id="probRows"></div>
  </div>
</div>

<div class="desc" id="desc" aria-live="polite"></div>
<p class="note">数值由同一组 logits 与温度实时计算；τ 调高，Softmax 分布更平缓；τ 调低，分布更尖锐。</p>

<script>
const tokens = ["累", "疲惫", "困", "劳累", "疲劳"];
const logits = [5.0, 4.5, 4.0, 3.6, 2.9];
const params = new URLSearchParams(location.search);
let step = Math.max(1, Math.min(3, Number(params.get("step") || 1)));
let tau = Math.max(0.5, Math.min(2, Number(params.get("tau") || 1)));

const tauInput = document.getElementById("tau");
const tauVal = document.getElementById("tauVal");
const stepLabel = document.getElementById("stepLabel");
const desc = document.getElementById("desc");
const panels = [...document.querySelectorAll(".panel")];
const prev = document.getElementById("prev");
const next = document.getElementById("next");

function probs() {
  const scaled = logits.map(l => l / tau);
  const ex = scaled.map(Math.exp);
  const sum = ex.reduce((a, b) => a + b, 0);
  return ex.map(e => e / sum);
}
function bars(target, values, labels) {
  target.innerHTML = "";
  values.forEach((v, i) => {
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("span");
    name.textContent = tokens[i];
    const track = document.createElement("div");
    track.className = "track";
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = Math.max(2, Math.min(100, v * 100)) + "%";
    track.appendChild(fill);
    const val = document.createElement("span");
    val.className = "val";
    val.textContent = labels[i];
    row.append(name, track, val);
    target.appendChild(row);
  });
}
function render() {
  const p = probs();
  bars(document.getElementById("logitRows"), logits.map(v => v / Math.max(...logits)), logits.map(v => v.toFixed(2)));
  bars(document.getElementById("probRows"), p, p.map(v => (v * 100).toFixed(1) + "%"));

  const scaledVals = logits.map(v => v / tau);
  const direction = tau > 1 ? "τ > 1：分数差距缩小，分布更平缓"
    : tau < 1 ? "τ < 1：分数差距拉大，分布更尖锐"
    : "τ = 1：不改变分数比例";
  document.getElementById("scaledReadout").innerHTML =
    "<div>τ = <b>" + tau.toFixed(1) + "</b></div>" +
    "<div>缩放后分数：" + scaledVals.map(v => v.toFixed(2)).join("、") + "</div>" +
    "<div>" + direction + "</div>";

  panels.forEach(panel => panel.classList.toggle("active", Number(panel.dataset.step) === step));
  const texts = {
    1: "Logits 是词表中每个 Token 的原始分数，可以为负，也不是概率。",
    2: "温度 τ 在 Softmax 之前缩放 logits：τ 调高，分数差距缩小，分布更平缓；τ 调低，差距拉大，分布更尖锐。",
    3: "Softmax 把缩放后的分数变成和为 1 的概率分布。"
  };
  desc.innerHTML = "<b>" + step + "。</b>" + texts[step];
  stepLabel.textContent = step + " / 3";
  tauVal.textContent = tau.toFixed(1);
  tauInput.value = String(tau);
  prev.disabled = step === 1;
  next.disabled = step === 3;
}
tauInput.addEventListener("input", () => { tau = Number(tauInput.value); render(); });
prev.addEventListener("click", () => { if (step > 1) { step--; render(); } });
next.addEventListener("click", () => { if (step < 3) { step++; render(); } });
document.addEventListener("keydown", e => {
  if (e.target === tauInput) return;
  if (e.key === "ArrowLeft" && step > 1) { step--; render(); }
  if (e.key === "ArrowRight" && step < 3) { step++; render(); }
});
render();
</script>
</body>
</html>
