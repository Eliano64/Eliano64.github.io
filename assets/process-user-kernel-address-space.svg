<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">进程用户空间与公共内核映射</title>
  <desc id="desc">进程 A 和进程 B 的用户空间彼此隔离，但在经典地址布局中，它们的完整虚拟地址空间都含有指向同一份内核代码和数据的内核映射。</desc>
  <defs>
    <style>
      svg { background: #f8fafc; }
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #64748b; }
      .frame { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .kernel { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .user-a { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .user-b { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 2; }
      .head { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; fill: #334155; }
      .small { font-size: 14px; fill: #64748b; }
      .same { stroke: #16a34a; stroke-width: 3; stroke-dasharray: 8 6; }
      .badge { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .badge-text { font-size: 15px; font-weight: 700; fill: #166534; }
      .warning { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.5; }
      .warning-text { font-size: 16px; font-weight: 700; fill: #9a3412; }
      @media (prefers-color-scheme: dark) {
        svg { background: #0b1020; }
        text { fill: #f8fafc; }
        .subtitle, .body, .small { fill: #cbd5e1; }
        .frame { fill: #111827; stroke: #475569; }
        .kernel { fill: #12372a; stroke: #4ade80; }
        .user-a { fill: #172554; stroke: #60a5fa; }
        .user-b { fill: #2e1065; stroke: #c084fc; }
        .badge { fill: #12372a; stroke: #4ade80; }
        .badge-text { fill: #bbf7d0; }
        .warning { fill: #3b2a12; stroke: #fbbf24; }
        .warning-text { fill: #fde68a; }
      }
    </style>
  </defs>

  <text class="title" x="60" y="55">每个进程：自己的用户空间 + 同一套内核映射</text>
  <text class="subtitle" x="60" y="87">经典地址布局示意；两个进程不是共享同一份用户空间</text>

  <text class="small" x="40" y="155">高地址</text>
  <text class="small" x="40" y="600">低地址</text>

  <rect class="frame" x="125" y="125" width="405" height="490" rx="18"/>
  <text class="head" x="327" y="158" text-anchor="middle">进程 A 的完整虚拟地址空间</text>
  <rect class="kernel" x="155" y="185" width="345" height="135" rx="14"/>
  <text class="head" x="327" y="225" text-anchor="middle">内核空间</text>
  <text class="body" x="327" y="258" text-anchor="middle">内核代码与受保护的数据</text>
  <text class="small" x="327" y="287" text-anchor="middle">用户态不能访问</text>
  <rect class="user-a" x="155" y="340" width="345" height="235" rx="14"/>
  <text class="head" x="327" y="390" text-anchor="middle">A 的用户空间</text>
  <text class="body" x="327" y="430" text-anchor="middle">A 的代码 · 数据 · 堆</text>
  <text class="body" x="327" y="462" text-anchor="middle">A 的用户栈 · 文件映射</text>
  <text class="small" x="327" y="520" text-anchor="middle">只属于 A 的用户地址映射</text>

  <rect class="frame" x="670" y="125" width="405" height="490" rx="18"/>
  <text class="head" x="872" y="158" text-anchor="middle">进程 B 的完整虚拟地址空间</text>
  <rect class="kernel" x="700" y="185" width="345" height="135" rx="14"/>
  <text class="head" x="872" y="225" text-anchor="middle">内核空间</text>
  <text class="body" x="872" y="258" text-anchor="middle">内核代码与受保护的数据</text>
  <text class="small" x="872" y="287" text-anchor="middle">用户态不能访问</text>
  <rect class="user-b" x="700" y="340" width="345" height="235" rx="14"/>
  <text class="head" x="872" y="390" text-anchor="middle">B 的用户空间</text>
  <text class="body" x="872" y="430" text-anchor="middle">B 的代码 · 数据 · 堆</text>
  <text class="body" x="872" y="462" text-anchor="middle">B 的用户栈 · 文件映射</text>
  <text class="small" x="872" y="520" text-anchor="middle">只属于 B 的用户地址映射</text>

  <line class="same" x1="500" y1="252" x2="700" y2="252"/>
  <rect class="badge" x="512" y="219" width="176" height="66" rx="12"/>
  <text class="badge-text" x="600" y="244" text-anchor="middle">相同的虚拟地址</text>
  <text class="badge-text" x="600" y="268" text-anchor="middle">指向同一份内核</text>

  <rect class="warning" x="170" y="650" width="860" height="45" rx="12"/>
  <text class="warning-text" x="600" y="679" text-anchor="middle">不同的是用户部分；相同的是公共内核映射。不是把所有进程的用户空间合并起来。</text>
</svg>
