<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>权重衰减：λ 与稳态</title>
<style>
:root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--line:#c8d0da;--panel:#f4f7fb;
--accent:#3b5bdb;--hi:#e8efff;--pos:#2f66b3;--neg:#b44a35}
@media (prefers-color-scheme:dark){:root{--bg:#171b23;--fg:#e6eaf2;--muted:#9aa4b2;--line:#3a4250;
--panel:#1e2430;--accent:#8fa6ff;--hi:#243052;--pos:#7fa8ee;--neg:#ef9a83}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:12px;max-width:700px;font:13px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
h1{font-size:17px;line-height:1.35;margin:0 0 3px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
label{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
input[type=range]{width:150px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
button{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin:7px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:430px){.grid{grid-template-columns:1fr}}
.read{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:12px;color:var(--muted)}
.read b{color:var(--fg);font-weight:600}
svg{display:block;width:100%;height:auto}
.note{color:var(--muted);font-size:11.5px;margin:4px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<h1>权重衰减：λ 决定权重停在多小</h1>
<p class="sub">更新式为 w ← (1−ηλ)w − ηg。梯度固定为 g = 0.15、学习率 η = 0.1 时，稳态 w* = −g/λ。</p>
<div class="controls">
  <label>λ <input id="lam" type="range" min="0" max="0.2" step="0.01" value="0.05" aria-label="权重衰减系数 λ"><span class="mono" id="lamv">0.05</span></label>
  <button id="toggle" type="button" aria-pressed="true">对照：无衰减</button>
</div>
<div class="panel">
  <svg id="chart" viewBox="0 0 660 220" role="img" aria-label="权重随训练步数的轨迹：有衰减时收敛到负的稳态，无衰减时线性下降"></svg>
  <p class="note">实线：有衰减；灰点线：无衰减对照；红虚线：稳态 w* = −g/λ。</p>
<div class="read">
    <span>衰减因子 <b id="fac" class="mono"></b></span>
    <span>稳态 w* <b id="steady" class="mono"></b></span>
    <span>第 400 步 w <b id="w60" class="mono"></b></span>
  </div>
  <p class="note">衰减把权重按比例拉向零：梯度只要求权重变小，衰减让权重停在一个更小的位置，同时带来一点偏差。</p>
</div>
<script>
(function(){
  const eta = 0.1, g = 0.15, steps = 400;
  const lam = document.getElementById('lam'), lamv = document.getElementById('lamv');
  const toggle = document.getElementById('toggle'), chart = document.getElementById('chart');
  const fac = document.getElementById('fac'), steady = document.getElementById('steady'), w60 = document.getElementById('w60');
  function traj(l){
    let w = 1.0; const out = [w];
    for (let n = 1; n <= steps; n++){ w = (1 - eta*l) * w - eta * g; out.push(w); }
    return out;
  }
  function draw(){
    const l = +lam.value; lamv.textContent = l.toFixed(2);
    fac.textContent = (1 - eta*l).toFixed(3);
    steady.textContent = l > 0 ? (-g/l).toFixed(2) : '无界';
    const a = traj(l), b = traj(0);
    w60.textContent = a[steps].toFixed(3);
    const W = 660, H = 220, x0 = 46, x1 = W-20, y0 = 20, y1 = H-34;
    const lo = Math.min(-0.6, ...a, ...b), hi = Math.max(1.05, ...a, ...b);
    const X = n => x0 + n/steps*(x1-x0);
    const Y = v => y1 - (v-lo)/(hi-lo)*(y1-y0);
    let s = '<line x1="'+x0+'" y1="'+Y(0).toFixed(1)+'" x2="'+x1+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="4 4"/>';
    s += '<text x="'+(x0-6)+'" y="'+(Y(0)-4).toFixed(1)+'" text-anchor="end" fill="var(--muted)" font-size="15">0</text>';
    if (toggle.getAttribute('aria-pressed') === 'true'){
      s += '<polyline fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" points="'+b.map((v,n)=>X(n).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'"/>';
    }
    s += '<polyline fill="none" stroke="var(--pos)" stroke-width="2.2" points="'+a.map((v,n)=>X(n).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'"/>';
    if (l > 0){ const st = -g/l; if (st >= lo && st <= hi) s += '<line x1="'+x0+'" y1="'+Y(st).toFixed(1)+'" x2="'+x1+'" y2="'+Y(st).toFixed(1)+'" stroke="var(--neg)" stroke-width="1" stroke-dasharray="6 4"/>'; }
    s += '<text x="'+x1+'" y="'+(H-10)+'" text-anchor="end" fill="var(--muted)" font-size="15">训练步数 400</text>';
    chart.innerHTML = s;
  }
  lam.addEventListener('input', draw);
  toggle.addEventListener('click', ()=>{ toggle.setAttribute('aria-pressed', toggle.getAttribute('aria-pressed')==='true'?'false':'true'); draw(); });
  draw();
})();
</script>
</body></html>
