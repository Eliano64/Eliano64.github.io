<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="data:,">
  <title>DHCP 四报文过程</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --fg: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --accent: #0369a1;
      --active: #dbeafe;
      --done: #ecfeff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --card: #0f172a;
        --fg: #e5e7eb;
        --muted: #cbd5e1;
        --border: #334155;
        --accent: #67e8f9;
        --active: #172554;
        --done: #083344;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    .wrap { max-width: 980px; margin: auto; padding: 16px 20px 12px; }
    .title { text-align: center; font-size: 24px; font-weight: 700; }
    .subtitle { text-align: center; margin-top: 4px; color: var(--muted); font-size: 14px; }
    .endpoints {
      display: grid;
      grid-template-columns: 150px 1fr 150px;
      align-items: center;
      margin: 14px 0 8px;
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
    .endpoints .line { height: 2px; background: var(--border); }
    .steps { display: grid; gap: 7px; }
    .step {
      display: grid;
      grid-template-columns: 52px 1fr;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      transition: opacity .15s, border-color .15s, background .15s;
    }
    .step.pending { opacity: .55; }
    .step.done { background: var(--done); opacity: .78; }
    .step.active { background: var(--active); border: 2px solid var(--accent); opacity: 1; }
    .num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
    }
    .route {
      display: grid;
      grid-template-columns: 120px 1fr 120px;
      align-items: center;
      gap: 10px;
    }
    .party { color: var(--muted); text-align: center; }
    .message { text-align: center; }
    .message strong { color: var(--accent); font-size: 16px; }
    .arrow { margin: 0; font-size: 18px; line-height: 1; color: var(--accent); letter-spacing: 2px; }
    .addresses { color: var(--muted); font-size: 12px; }
    .info {
      margin-top: 10px;
      min-height: 72px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      line-height: 1.55;
    }
    .info strong { color: var(--accent); }
    .controls { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 9px; }
    button {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 15px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: .35; cursor: default; }
    #counter { min-width: 58px; text-align: center; color: var(--muted); }
    @media (max-width: 680px) {
      .wrap { padding: 14px 12px 10px; }
      .endpoints { grid-template-columns: 90px 1fr 90px; }
      .route { grid-template-columns: 72px 1fr 72px; gap: 5px; }
      .party { font-size: 13px; }
      .addresses { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="title">DHCP 首次获取租约：四条报文</div>
    <div class="subtitle">客户首次获取地址时，依次交换 Discover、Offer、Request 和 ACK</div>

    <div class="endpoints">
      <div>DHCP 客户</div>
      <div class="line"></div>
      <div>DHCP 服务器</div>
    </div>

    <section id="steps" class="steps" aria-live="polite"></section>
    <section id="info" class="info"></section>

    <div class="controls">
      <button id="prev" type="button">上一步</button>
      <span id="counter"></span>
      <button id="next" type="button">下一步</button>
    </div>
  </main>

  <script>
    const messages = [
      {
        name: "DHCP Discover",
        direction: "right",
        source: "0.0.0.0",
        destination: "255.255.255.255",
        detail: "客户尚无可用 IP 地址，因此用未指定地址作为源地址，以受限广播寻找本网络中的 DHCP 服务器。"
      },
      {
        name: "DHCP Offer",
        direction: "left",
        source: "服务器 IP",
        destination: "广播或单播给客户",
        detail: "服务器提供可租用地址、子网掩码、默认网关、DNS 服务器和租期等配置。"
      },
      {
        name: "DHCP Request",
        direction: "right",
        source: "0.0.0.0",
        destination: "255.255.255.255",
        detail: "客户广播选择结果：被选中的服务器继续处理，其他服务器可以收回为该客户预留的地址。"
      },
      {
        name: "DHCP ACK",
        direction: "left",
        source: "服务器 IP",
        destination: "广播或单播给客户",
        detail: "服务器正式确认租约。客户收到 ACK 后才能配置并使用获租的地址。"
      }
    ];

    let current = 0;
    const steps = document.getElementById("steps");
    const info = document.getElementById("info");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const counter = document.getElementById("counter");

    function render() {
      steps.innerHTML = messages.map((item, index) => {
        const state = index < current ? "done" : index === current ? "active" : "pending";
        const arrow = item.direction === "right" ? "⟶" : "⟵";
        return `<article class="step ${state}">
          <div class="num">${index + 1}</div>
          <div class="route">
            <div class="party">客户</div>
            <div class="message">
              <strong>${item.name}</strong>
              <div class="arrow">${arrow}</div>
              <div class="addresses">源：${item.source}　目的：${item.destination}</div>
            </div>
            <div class="party">服务器</div>
          </div>
        </article>`;
      }).join("");

      info.innerHTML = `<strong>第 ${current + 1} 步说明</strong><br>${messages[current].detail}`;
      counter.textContent = `${current + 1} / ${messages.length}`;
      prev.disabled = current === 0;
      next.disabled = current === messages.length - 1;
    }

    prev.addEventListener("click", () => { current = Math.max(0, current - 1); render(); });
    next.addEventListener("click", () => { current = Math.min(messages.length - 1, current + 1); render(); });
    render();
  </script>
</body>
</html>
