<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>残差块：学习分支 + 捷径</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;
--in:#dbe7ff; --inS:#2f5bb7; --param:#ece0ff; --paramS:#6b46c1;
--state:#e9edf3; --stateS:#4a5568; --out:#d9f2e2; --outS:#2f7a4f;
--cur:#ffe6c7; --curS:#b45309; --accent:#2f5bb7;
}
@media (prefers-color-scheme:dark){:root{
--bg:#14181f; --panel:#1c222b; --fg:#e8ecf3; --muted:#9aa4b2; --line:#39424f;
--in:#1f3149; --inS:#8fb0ef; --param:#2d2350; --paramS:#b49af0;
--state:#262d38; --stateS:#aab4c2; --out:#1e3a2b; --outS:#87c9a2;
--cur:#4a3418; --curS:#f0b26b; --accent:#8fb0ef;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>残差块：学习分支 + 捷径</h1><p class="sub">输入分两路：一路学习修正量，一路直接传；相加后过 ReLU</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="残差块：学习分支 + 捷径"><rect x="0" y="0" width="1100" height="620" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wp{stroke:var(--paramS);stroke-width:2.2;fill:none;marker-end:url(#arp)}
.ws{stroke:var(--stateS);stroke-width:2.2;fill:none;marker-end:url(#ars)}
.wout{stroke:var(--outS);stroke-width:2.2;fill:none;marker-end:url(#aro)}
.wcur{stroke:var(--curS);stroke-width:2.2;fill:none;marker-end:url(#arc)}
.win{stroke:var(--inS);stroke-width:2.2;fill:none;marker-end:url(#ari)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}
</style><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="arp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--paramS)"/></marker>
<marker id="ars" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--stateS)"/></marker>
<marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--outS)"/></marker>
<marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--curS)"/></marker>
<marker id="ari" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--inS)"/></marker></defs><text class="tt" x="28" y="52">残差块：学习分支 + 捷径</text><text class="ss" x="28" y="80">输入分两路：一路学习修正量，一路直接传；相加后过 ReLU</text><rect x="30" y="104" width="14" height="14" rx="3" fill="var(--in)" stroke="var(--inS)"/><text class="sm" x="49" y="116">输入</text><rect x="120" y="104" width="14" height="14" rx="3" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="139" y="116">参数</text><rect x="210" y="104" width="14" height="14" rx="3" fill="var(--state)" stroke="var(--stateS)"/><text class="sm" x="229" y="116">中间状态</text><rect x="300" y="104" width="14" height="14" rx="3" fill="var(--out)" stroke="var(--outS)"/><text class="sm" x="319" y="116">输出</text><rect x="390" y="104" width="14" height="14" rx="3" fill="var(--cur)" stroke="var(--curS)"/><text class="sm" x="409" y="116">当前步</text><rect x="848" y="92" width="222" height="66" rx="10" fill="var(--panel)" stroke="var(--line)"/><text class="sm" x="860" y="112">图例</text><text class="sm" x="860" y="132">⊕ 逐元素加　S(x) 捷径</text><text class="sm" x="860" y="150">恒等或 1×1 卷积</text><rect x="24" y="118" width="920" height="420" rx="14" fill="none" stroke="var(--line)" stroke-dasharray="9 6"/><text class="sm" x="40" y="140">一个残差块</text><rect class="b in" x="60" y="270" width="120" height="70" rx="10"/><text class="lb" x="120.0" y="301.0" text-anchor="middle">x</text><text class="sm" x="120.0" y="321.0" text-anchor="middle">C×H×W</text><rect x="210" y="170" width="330" height="300" rx="12" fill="none" stroke="var(--paramS)" stroke-dasharray="6 5" opacity="0.85"/><text class="sm" x="222" y="192">学习分支 F(x)</text><rect class="b param" x="230" y="205" width="290" height="48" rx="10"/><text class="lb" x="375.0" y="235.0" text-anchor="middle">3×3 卷积</text><rect class="b param" x="230" y="265" width="290" height="48" rx="10"/><text class="lb" x="375.0" y="295.0" text-anchor="middle">BatchNorm + ReLU</text><rect class="b param" x="230" y="325" width="290" height="48" rx="10"/><text class="lb" x="375.0" y="355.0" text-anchor="middle">3×3 卷积</text><rect class="b param" x="230" y="385" width="290" height="48" rx="10"/><text class="lb" x="375.0" y="415.0" text-anchor="middle">BatchNorm</text><path class="wp" d="M375,253 L375,265"/><path class="wp" d="M375,313 L375,325"/><path class="wp" d="M375,373 L375,385"/><path class="wp" d="M375,205 L375,190"/><path class="wp" d="M180,305 C200,305 206,229 226,229"/><path class="wout" d="M520,229 L600,229"/><rect x="210" y="490" width="330" height="0" rx="0" fill="none"/><rect class="b state" x="600" y="150" width="210" height="60" rx="10"/><text class="lb" x="705.0" y="176.0" text-anchor="middle">捷径 S(x)</text><text class="sm" x="705.0" y="196.0" text-anchor="middle">恒等 / 1×1·stride 2</text><path class="ws" d="M180,290 C300,140 520,160 596,176"/><circle class="b plain" cx="760" cy="229" r="24"/><text class="sm" x="760" y="234" text-anchor="middle">⊕</text><path class="ws" d="M810,180 L810,205 L784,210"/><path class="wout" d="M784,229 L820,229"/><rect class="b state" x="824" y="200" width="120" height="58" rx="10"/><text class="lb" x="884.0" y="235.0" text-anchor="middle">ReLU</text><path class="wout" d="M944,229 L980,229"/><rect class="b out" x="984" y="200" width="90" height="58" rx="10"/><text class="lb" x="1029.0" y="235.0" text-anchor="middle">y</text><rect x="60" y="480" width="520" height="60" rx="8" fill="var(--state)" opacity="0.7"/><text class="sm" x="72" y="504">形状相同时 S(x)=x；形状不同时用 1×1 卷积与 stride 2 对齐</text><text class="sm" x="72" y="526">图中示例：C×H×W → C'×H'×W'</text><rect x="620" y="470" width="460" height="66" rx="12" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="636" y="496">y = ReLU(x + F(x))</text><text class="sm" x="636" y="520">相加的两路必须同形状；恒等捷径没有参数</text><rect class="b param" x="30" y="572" width="196" height="34" rx="8"/><text class="sm" x="128.0" y="594" text-anchor="middle">学习分支 F</text><path class="wire" d="M228,589 L242,589"/><rect class="b state" x="244" y="572" width="196" height="34" rx="8"/><text class="sm" x="342.0" y="594" text-anchor="middle">捷径 S</text><path class="wire" d="M442,589 L456,589"/><rect class="b cur" x="458" y="572" width="196" height="34" rx="8"/><text class="sm" x="556.0" y="594" text-anchor="middle">相加 ⊕</text><path class="wire" d="M656,589 L670,589"/><rect class="b out" x="672" y="572" width="196" height="34" rx="8"/><text class="sm" x="770.0" y="594" text-anchor="middle">ReLU</text></svg></div></div></body></html>
