<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="tkm dkm">
  <title id="tkm">K-Means 三步迭代：分配、挪质心、再分配</title>
  <desc id="dkm">12 个点、两团各 6 个；初始质心 (1.000, 1.000) 与 (4.000, 1.000)。三轮的质心依次是 (1.000, 1.000) / (4.000, 1.000)、(0.471, 0.497) / (4.723, 3.255)、(0.627, -0.222) / (4.504, 4.262)；SSE 依次 101.04、50.80、38.63。</desc>
