<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="ttl dtl">
  <title id="ttl">一次训练的三步循环：前向预测、求梯度、更新参数，连做三轮</title>
  <desc id="dtl">两个样本 x=[1,2]、y=[3,5]，模型 ŷ=θx+b，学习率 0.2，初值 θ=b=0。三轮的损失依次是 17.000、2.340、0.324、0.0467，每轮约为上一轮的 1/7；最后 θ=2.000、b=1.216。</desc>
  <style>
    .bg { fill: #f8fafc; }
    @media (prefers-color-scheme: dark) { .bg { fill: #0b1020; } }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    @media (prefers-color-scheme: dark) { .panel { fill: #111827; stroke: #334155; } }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) { .grid { stroke: #24334a; } }
    .axis { stroke: #94a3b8; stroke-width: 1.2; }
    .tick { stroke: #94a3b8; stroke-width: 1; }
    .ref { stroke: #be123c; stroke-width: 1.3; stroke-dasharray: 6 5; fill: none; }
    .text { fill: #0f172a; font-family: Arial, "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) { .text { fill: #e2e8f0; } }
    .muted { fill: #475569; font-family: Arial, "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) { .muted { fill: #94a3b8; } }
    .mono { fill: #0f172a; font-family: Consolas, "Courier New", monospace; }
    @media (prefers-color-scheme: dark) { .mono { fill: #e2e8f0; } }
    .em { fill: #15803d; font-family: Arial, "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) { .em { fill: #4ade80; } }
    .c1 { fill: none; stroke: #2563eb; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c2 { fill: none; stroke: #be123c; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c3 { fill: none; stroke: #16a34a; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c4 { fill: none; stroke: #b45309; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    .c5 { fill: none; stroke: #7c3aed; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .c1 { stroke: #60a5fa; } .c2 { stroke: #fb7185; } .c3 { stroke: #4ade80; }
      .c4 { stroke: #fbbf24; } .c5 { stroke: #c4b5fd; }
    }
    .dot1 { fill: #2563eb; } .dot2 { fill: #be123c; } .dot3 { fill: #16a34a; }
    .dot4 { fill: #b45309; } .dot5 { fill: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .dot1 { fill: #60a5fa; } .dot2 { fill: #fb7185; } .dot3 { fill: #4ade80; }
      .dot4 { fill: #fbbf24; } .dot5 { fill: #c4b5fd; }
    }
    .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    .card-em { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.8; }
    .group { fill: none; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .group-em { fill: rgba(22,163,74,0.05); stroke: #16a34a; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1e293b; stroke: #334155; }
      .card-em { fill: #052e1b; stroke: #4ade80; }
      .group { stroke: #334155; }
      .group-em { fill: rgba(74,222,128,0.06); stroke: #4ade80; }
    }
    .iso { fill: none; stroke: #94a3b8; stroke-width: 1.1; }
    .iso-em { fill: none; stroke: #64748b; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) { .iso { stroke: #64748b; } .iso-em { stroke: #94a3b8; } }
    .plate { fill: #ffffff; opacity: 0.86; }
    @media (prefers-color-scheme: dark) { .plate { fill: #0b1020; } }
    .shade { fill: #f1f5f9; }
    @media (prefers-color-scheme: dark) { .shade { fill: #1e293b; } }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="480" rx="10"/>
  <rect class="panel" x="14" y="12" width="872" height="456" rx="8"/>
  <text class="text" x="30.0" y="38.0" font-size="13" text-anchor="start" font-weight="600">三轮梯度下降：每轮只做一次前向、一次求导、一次更新</text>
  <text class="muted" x="30.0" y="60.0" font-size="10.5" text-anchor="start" font-weight="400">x=[1,2]，y=[3,5]；ŷ=θx+b；L=(1/n)Σ(ŷ-y)²；学习率 0.2；初值 θ=0、b=0。</text>
  <rect class="card" x="30.0" y="80.0" width="190.0" height="230.0" rx="7"/>
  <text class="text" x="42.0" y="104.0" font-size="13" text-anchor="start" font-weight="600">第 1 轮</text>
  <text class="muted" x="208.0" y="104.0" font-size="10" text-anchor="end" font-weight="400">本轮输入</text>
  <text class="mono" x="42.0" y="132.0" font-size="11" text-anchor="start" font-weight="400">θ=0.000，b=0.000</text>
  <text class="text" x="42.0" y="154.0" font-size="11" text-anchor="start" font-weight="400">预测 ŷ=[0.00, 0.00]</text>
  <text class="text" x="42.0" y="176.0" font-size="11" text-anchor="start" font-weight="400">残差 ŷ-y=[-3.00, -5.00]</text>
  <text class="text" x="42.0" y="198.0" font-size="11" text-anchor="start" font-weight="400">损失 L=17.000</text>
  <text class="muted" x="42.0" y="220.0" font-size="11" text-anchor="start" font-weight="400">∂L/∂θ=-13.000</text>
  <text class="muted" x="42.0" y="242.0" font-size="11" text-anchor="start" font-weight="400">∂L/∂b=-8.000</text>
  <line class="grid" x1="42.0" y1="266.0" x2="208.0" y2="266.0"/>
  <text class="em" x="42.0" y="288.0" font-size="11" text-anchor="start" font-weight="600">更新后 θ=2.600，b=1.600</text>
  <path class="axis" d="M 229.0,180.0 L 235.0,190.0 L 229.0,200.0"/>
  <rect class="card" x="238.0" y="80.0" width="190.0" height="230.0" rx="7"/>
  <text class="text" x="250.0" y="104.0" font-size="13" text-anchor="start" font-weight="600">第 2 轮</text>
  <text class="muted" x="416.0" y="104.0" font-size="10" text-anchor="end" font-weight="400">本轮输入</text>
  <text class="mono" x="250.0" y="132.0" font-size="11" text-anchor="start" font-weight="400">θ=2.600，b=1.600</text>
  <text class="text" x="250.0" y="154.0" font-size="11" text-anchor="start" font-weight="400">预测 ŷ=[4.20, 6.80]</text>
  <text class="text" x="250.0" y="176.0" font-size="11" text-anchor="start" font-weight="400">残差 ŷ-y=[+1.20, +1.80]</text>
  <text class="text" x="250.0" y="198.0" font-size="11" text-anchor="start" font-weight="400">损失 L=2.340</text>
  <text class="muted" x="250.0" y="220.0" font-size="11" text-anchor="start" font-weight="400">∂L/∂θ=+4.800</text>
  <text class="muted" x="250.0" y="242.0" font-size="11" text-anchor="start" font-weight="400">∂L/∂b=+3.000</text>
  <line class="grid" x1="250.0" y1="266.0" x2="416.0" y2="266.0"/>
  <text class="em" x="250.0" y="288.0" font-size="11" text-anchor="start" font-weight="600">更新后 θ=1.640，b=1.000</text>
  <path class="axis" d="M 437.0,180.0 L 443.0,190.0 L 437.0,200.0"/>
  <rect class="card" x="446.0" y="80.0" width="190.0" height="230.0" rx="7"/>
  <text class="text" x="458.0" y="104.0" font-size="13" text-anchor="start" font-weight="600">第 3 轮</text>
  <text class="muted" x="624.0" y="104.0" font-size="10" text-anchor="end" font-weight="400">本轮输入</text>
  <text class="mono" x="458.0" y="132.0" font-size="11" text-anchor="start" font-weight="400">θ=1.640，b=1.000</text>
  <text class="text" x="458.0" y="154.0" font-size="11" text-anchor="start" font-weight="400">预测 ŷ=[2.64, 4.28]</text>
  <text class="text" x="458.0" y="176.0" font-size="11" text-anchor="start" font-weight="400">残差 ŷ-y=[-0.36, -0.72]</text>
  <text class="text" x="458.0" y="198.0" font-size="11" text-anchor="start" font-weight="400">损失 L=0.324</text>
  <text class="muted" x="458.0" y="220.0" font-size="11" text-anchor="start" font-weight="400">∂L/∂θ=-1.800</text>
  <text class="muted" x="458.0" y="242.0" font-size="11" text-anchor="start" font-weight="400">∂L/∂b=-1.080</text>
  <line class="grid" x1="458.0" y1="266.0" x2="624.0" y2="266.0"/>
  <text class="em" x="458.0" y="288.0" font-size="11" text-anchor="start" font-weight="600">更新后 θ=2.000，b=1.216</text>
  <rect class="card" x="652.0" y="76.0" width="234.0" height="392.0" rx="7"/>
  <text class="text" x="664.0" y="98.0" font-size="12" text-anchor="start" font-weight="600">损失随轮次下降</text>
  <text class="muted" x="664.0" y="116.0" font-size="9.5" text-anchor="start" font-weight="400">纵轴取对数</text>
  <line class="grid" x1="734.1" y1="126.0" x2="734.1" y2="262.0"/>
  <line class="tick" x1="734.1" y1="262.0" x2="734.1" y2="266.0"/>
  <text class="muted" x="734.1" y="278.0" font-size="10" text-anchor="middle" font-weight="400">0</text>
  <line class="grid" x1="774.7" y1="126.0" x2="774.7" y2="262.0"/>
  <line class="tick" x1="774.7" y1="262.0" x2="774.7" y2="266.0"/>
  <text class="muted" x="774.7" y="278.0" font-size="10" text-anchor="middle" font-weight="400">1</text>
  <line class="grid" x1="815.3" y1="126.0" x2="815.3" y2="262.0"/>
  <line class="tick" x1="815.3" y1="262.0" x2="815.3" y2="266.0"/>
  <text class="muted" x="815.3" y="278.0" font-size="10" text-anchor="middle" font-weight="400">2</text>
  <line class="grid" x1="855.9" y1="126.0" x2="855.9" y2="262.0"/>
  <line class="tick" x1="855.9" y1="262.0" x2="855.9" y2="266.0"/>
  <text class="muted" x="855.9" y="278.0" font-size="10" text-anchor="middle" font-weight="400">3</text>
  <line class="grid" x1="726.0" y1="249.3" x2="866.0" y2="249.3"/>
  <line class="tick" x1="722.0" y1="249.3" x2="726.0" y2="249.3"/>
  <text class="muted" x="719.0" y="252.8" font-size="10" text-anchor="end" font-weight="400">0.01</text>
  <line class="grid" x1="726.0" y1="213.0" x2="866.0" y2="213.0"/>
  <line class="tick" x1="722.0" y1="213.0" x2="726.0" y2="213.0"/>
  <text class="muted" x="719.0" y="216.5" font-size="10" text-anchor="end" font-weight="400">0.1</text>
  <line class="grid" x1="726.0" y1="176.8" x2="866.0" y2="176.8"/>
  <line class="tick" x1="722.0" y1="176.8" x2="726.0" y2="176.8"/>
  <text class="muted" x="719.0" y="180.3" font-size="10" text-anchor="end" font-weight="400">1</text>
  <line class="grid" x1="726.0" y1="140.5" x2="866.0" y2="140.5"/>
  <line class="tick" x1="722.0" y1="140.5" x2="726.0" y2="140.5"/>
  <text class="muted" x="719.0" y="144.0" font-size="10" text-anchor="end" font-weight="400">10</text>
  <line class="axis" x1="726.0" y1="262.0" x2="866.0" y2="262.0"/>
  <line class="axis" x1="726.0" y1="126.0" x2="726.0" y2="262.0"/>
  <text class="muted" x="796.0" y="294.0" font-size="11" text-anchor="middle" font-weight="400">轮次</text>
  <text class="muted" x="692.0" y="194.0" font-size="11" text-anchor="middle" transform="rotate(-90 692.0 194.0)">损失</text>
  <path class="c2" d="M 734.1,132.1 L 774.7,163.4 L 815.3,194.5 L 855.9,225.0"/>
  <circle class="dot2" cx="734.1" cy="132.1" r="3.6"/>
  <text class="text" x="741.1" y="125.1" font-size="9.5" text-anchor="start" font-weight="400">17.000</text>
  <circle class="dot2" cx="774.7" cy="163.4" r="3.6"/>
  <text class="text" x="781.7" y="156.4" font-size="9.5" text-anchor="start" font-weight="400">2.340</text>
  <circle class="dot2" cx="815.3" cy="194.5" r="3.6"/>
  <text class="text" x="822.3" y="187.5" font-size="9.5" text-anchor="start" font-weight="400">0.324</text>
  <circle class="dot2" cx="855.9" cy="225.0" r="3.6"/>
  <text class="text" x="848.9" y="241.0" font-size="9.5" text-anchor="end" font-weight="400">0.0467</text>
  <text class="muted" x="664.0" y="300.0" font-size="9.5" text-anchor="start" font-weight="400">相邻两轮的损失比：</text>
  <text class="mono" x="664.0" y="348.0" font-size="9.5" text-anchor="start" font-weight="400">17.000 → 2.340  ÷7.26</text>
  <text class="mono" x="664.0" y="366.0" font-size="9.5" text-anchor="start" font-weight="400">2.340 → 0.324  ÷7.22</text>
  <text class="mono" x="664.0" y="384.0" font-size="9.5" text-anchor="start" font-weight="400">0.324 → 0.047  ÷6.94</text>
  <text class="muted" x="664.0" y="420.0" font-size="9.5" text-anchor="start" font-weight="400">θ 已回到真值 2，</text>
  <text class="muted" x="664.0" y="436.0" font-size="9.5" text-anchor="start" font-weight="400">剩下的损失全部来自 b：</text>
  <text class="mono" x="664.0" y="452.0" font-size="9.5" text-anchor="start" font-weight="400">(1-1.216)² = 0.0467</text>
  <text class="muted" x="30.0" y="340.0" font-size="10.5" text-anchor="start" font-weight="400">梯度由同一批样本算出：∂L/∂θ=(2/n)Σ(ŷ-y)x，∂L/∂b=(2/n)Σ(ŷ-y)，再按 θ←θ-0.2·∂L/∂θ 更新。</text>
  <text class="muted" x="30.0" y="366.0" font-size="10.5" text-anchor="start" font-weight="400">第 1 轮步长 0.2×13.000=2.600，θ 直接越过真值 2；第 2 轮梯度反向，θ 退回 1.640。</text>
  <text class="muted" x="30.0" y="392.0" font-size="10.5" text-anchor="start" font-weight="400">三轮之后 θ=2.000 已经等于真值 2，b=1.216 还差 -0.216，预测值整体比真值高 0.216。</text>
</svg>
