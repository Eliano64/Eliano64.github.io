<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>卷积的窗口视角</title><style>
:root{
--bg:#fbfcfe; --panel:#ffffff; --fg:#1b2330; --muted:#5b6572; --line:#ccd4df;
--in:#dbe7ff; --inS:#2f5bb7; --param:#ece0ff; --paramS:#6b46c1;
--state:#e9edf3; --stateS:#4a5568; --out:#d9f2e2; --outS:#2f7a4f;
--cur:#ffe6c7; --curS:#b45309; --accent:#2f5bb7;
}
@media (prefers-color-scheme:dark){:root{
--bg:#14181f; --panel:#1c222b; --fg:#e8ecf3; --muted:#9aa4b2; --line:#39424f;
--in:#1f3149; --inS:#8fb0ef; --param:#2d2350; --paramS:#b49af0;
--state:#262d38; --stateS:#aab4c2; --out:#1e3a2b; --outS:#87c9a2;
--cur:#4a3418; --curS:#f0b26b; --accent:#8fb0ef;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:10px;max-width:980px;font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
.deck{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
section.page{display:none}
section.page.active{display:block}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:100%}
.cap{font-size:13px;color:var(--fg);background:var(--state);border-left:4px solid var(--curS);border-radius:6px;padding:7px 10px;margin:8px 0 0}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-left:4px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><h1>卷积的窗口视角</h1><p class="sub">把输入切成小窗口，每个窗口展成一行，与同一组核权重点积</p><div class="deck"><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="卷积的窗口视角"><rect x="0" y="0" width="1100" height="620" fill="var(--bg)"/><style>
text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:var(--fg)}
.tt{font-size:30px;font-weight:700}.ss{font-size:15px;fill:var(--muted)}
.lb{font-size:17px}.val{font-size:15px}.sm{font-size:13px;fill:var(--muted)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.b{stroke-width:1.4;rx:8}
.in{fill:var(--in);stroke:var(--inS)}.param{fill:var(--param);stroke:var(--paramS)}
.state{fill:var(--state);stroke:var(--stateS)}.out{fill:var(--out);stroke:var(--outS)}.cur{fill:var(--cur);stroke:var(--curS)}
.plain{fill:var(--panel);stroke:var(--line)}
.wire{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ar)}
.wp{stroke:var(--paramS);stroke-width:2.2;fill:none;marker-end:url(#arp)}
.ws{stroke:var(--stateS);stroke-width:2.2;fill:none;marker-end:url(#ars)}
.wout{stroke:var(--outS);stroke-width:2.2;fill:none;marker-end:url(#aro)}
.wcur{stroke:var(--curS);stroke-width:2.2;fill:none;marker-end:url(#arc)}
.win{stroke:var(--inS);stroke-width:2.2;fill:none;marker-end:url(#ari)}
.wired{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#ard)}
.dim{opacity:.22}
.legend{font-size:13px}
.grid{stroke:var(--line);stroke-width:1}
</style><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="ard" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
<marker id="arp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--paramS)"/></marker>
<marker id="ars" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--stateS)"/></marker>
<marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--outS)"/></marker>
<marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--curS)"/></marker>
<marker id="ari" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--inS)"/></marker></defs><text class="tt" x="28" y="52">卷积的窗口视角</text><text class="ss" x="28" y="80">把输入切成小窗口，每个窗口展成一行，与同一组核权重点积</text><rect x="30" y="104" width="14" height="14" rx="3" fill="var(--in)" stroke="var(--inS)"/><text class="sm" x="49" y="116">输入</text><rect x="120" y="104" width="14" height="14" rx="3" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="139" y="116">参数</text><rect x="210" y="104" width="14" height="14" rx="3" fill="var(--state)" stroke="var(--stateS)"/><text class="sm" x="229" y="116">中间状态</text><rect x="300" y="104" width="14" height="14" rx="3" fill="var(--out)" stroke="var(--outS)"/><text class="sm" x="319" y="116">输出</text><rect x="390" y="104" width="14" height="14" rx="3" fill="var(--cur)" stroke="var(--curS)"/><text class="sm" x="409" y="116">当前步</text><rect x="848" y="92" width="222" height="66" rx="10" fill="var(--panel)" stroke="var(--line)"/><text class="sm" x="860" y="112">图例</text><text class="sm" x="860" y="132">k=2，步幅 2</text><text class="sm" x="860" y="150">窗口展成行后与核点积</text><text class="sm" x="40" y="150">输入 4×4</text><rect x="60" y="164" width="34" height="34" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="94" y="164" width="34" height="34" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="128" y="164" width="34" height="34" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="162" y="164" width="34" height="34" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="60" y="198" width="34" height="34" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="94" y="198" width="34" height="34" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="128" y="198" width="34" height="34" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="162" y="198" width="34" height="34" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="60" y="232" width="34" height="34" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="94" y="232" width="34" height="34" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="128" y="232" width="34" height="34" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="162" y="232" width="34" height="34" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="60" y="266" width="34" height="34" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="94" y="266" width="34" height="34" fill="var(--state)" stroke="var(--line)" stroke-width="0.8"/><rect x="128" y="266" width="34" height="34" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><rect x="162" y="266" width="34" height="34" fill="var(--in)" stroke="var(--line)" stroke-width="0.8"/><text class="sm" x="40" y="330">切成 4 个 2×2 窗口，每个展成一行</text><rect class="b in" x="60" y="340" width="220" height="28" rx="10"/><text class="sm" x="170.0" y="360.0" text-anchor="middle">[0.2, 0.2, 0.2, 0.2]</text><rect class="b in" x="60" y="372" width="220" height="28" rx="10"/><text class="sm" x="170.0" y="392.0" text-anchor="middle">[0.9, 0.9, 0.9, 0.9]</text><rect class="b in" x="60" y="404" width="220" height="28" rx="10"/><text class="sm" x="170.0" y="424.0" text-anchor="middle">[0.2, 0.9, 0.2, 0.9]</text><rect class="b in" x="60" y="436" width="220" height="28" rx="10"/><text class="sm" x="170.0" y="456.0" text-anchor="middle">[0.9, 0.9, 0.9, 0.9]</text><path class="win" d="M284,400 L296,400"/><rect class="b param" x="300" y="340" width="160" height="124" rx="10"/><text class="lb" x="380.0" y="388.0" text-anchor="middle">核 w</text><text class="sm" x="380.0" y="408.0" text-anchor="middle">2×2</text><text class="sm" x="380.0" y="428.0" text-anchor="middle">权重共享</text><path class="wp" d="M464,402 L500,402"/><rect class="b out" x="504" y="340" width="180" height="124" rx="10"/><text class="lb" x="594.0" y="398.0" text-anchor="middle">响应</text><text class="sm" x="594.0" y="418.0" text-anchor="middle">4 个值</text><rect x="720" y="170" width="340" height="60" rx="8" fill="var(--state)" opacity="0.7"/><text class="sm" x="732" y="194">同一组 4 个权重对 4 行各算一次</text><text class="sm" x="732" y="216">展平不改变值，只改变形状</text><rect x="60" y="492" width="700" height="60" rx="12" fill="var(--param)" stroke="var(--paramS)"/><text class="sm" x="76" y="516">每一行 patch 与 vec(w) 做点积，得到该位置的响应</text><text class="sm" x="76" y="538">这是 im2col 的视角：卷积 = 多次相同的点积</text><rect class="b in" x="30" y="572" width="196" height="34" rx="8"/><text class="sm" x="128.0" y="594" text-anchor="middle">切窗口</text><path class="wire" d="M228,589 L242,589"/><rect class="b param" x="244" y="572" width="196" height="34" rx="8"/><text class="sm" x="342.0" y="594" text-anchor="middle">展成行</text><path class="wire" d="M442,589 L456,589"/><rect class="b cur" x="458" y="572" width="196" height="34" rx="8"/><text class="sm" x="556.0" y="594" text-anchor="middle">与核点积</text><path class="wire" d="M656,589 L670,589"/><rect class="b out" x="672" y="572" width="196" height="34" rx="8"/><text class="sm" x="770.0" y="594" text-anchor="middle">响应</text></svg></div></div></body></html>
