<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" role="img" aria-labelledby="t-opt-momentum d-opt-momentum">
  <title id="t-opt-momentum">优化思路：动量法</title>
  <desc id="d-opt-momentum">同一损失、同一起点、同样 40 步下的下降轨迹。</desc>
