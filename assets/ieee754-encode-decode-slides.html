<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEEE 754 单精度编码与解码</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5f6b7d;
      --line: #cbd5e1;
      --sign: #e65a5a;
      --exp: #3478d4;
      --frac: #169b72;
      --soft-sign: #fff0f0;
      --soft-exp: #edf5ff;
      --soft-frac: #eafaf5;
      --accent: #7656c9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101722;
        --panel: #172131;
        --text: #eef4ff;
        --muted: #aab7ca;
        --line: #35445a;
        --sign: #ff8585;
        --exp: #70adff;
        --frac: #53d8ae;
        --soft-sign: #342229;
        --soft-exp: #1d3048;
        --soft-frac: #193b35;
        --accent: #b09aff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    main { width: min(100%, 1040px); margin: 0 auto; padding: 18px; }
    header { margin-bottom: 12px; }
    h1 { margin: 0 0 4px; font-size: clamp(22px, 3.5vw, 30px); }
    .subtitle { margin: 0; color: var(--muted); font-size: 15px; }
    .stage {
      min-height: 540px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 28px rgb(15 23 42 / 7%);
    }
    .step-title { margin: 0 0 8px; color: var(--accent); font-size: 22px; }
    .explain { margin: 0 0 16px; color: var(--muted); line-height: 1.65; }
    .formula {
      display: grid;
      place-items: center;
      min-height: 86px;
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel) 84%, var(--exp) 16%);
      font: 700 clamp(18px, 3vw, 26px)/1.45 Consolas, "Microsoft YaHei", monospace;
      text-align: center;
      white-space: pre-line;
    }
    .fields {
      display: grid;
      grid-template-columns: .7fr 1fr 1.45fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .field {
      min-width: 0;
      padding: 13px;
      border: 2px solid currentColor;
      border-radius: 10px;
    }
    .field strong { display: block; margin-bottom: 6px; font-size: 16px; }
    .field code {
      display: block;
      overflow-wrap: anywhere;
      color: var(--text);
      font: 700 clamp(15px, 2.5vw, 20px)/1.4 Consolas, monospace;
    }
    .sign { color: var(--sign); background: var(--soft-sign); }
    .exp { color: var(--exp); background: var(--soft-exp); }
    .frac { color: var(--frac); background: var(--soft-frac); }
    .bits {
      display: grid;
      grid-template-columns: repeat(32, minmax(0, 1fr));
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: 700 clamp(9px, 1.7vw, 15px)/30px Consolas, monospace;
      text-align: center;
    }
    .bit { border-right: 1px solid color-mix(in srgb, var(--line) 75%, transparent); }
    .bit:last-child { border-right: 0; }
    .bit-sign { color: var(--sign); background: var(--soft-sign); }
    .bit-exp { color: var(--exp); background: var(--soft-exp); }
    .bit-frac { color: var(--frac); background: var(--soft-frac); }
    .result {
      margin-top: 16px;
      padding: 12px 14px;
      border-left: 4px solid var(--accent);
      background: color-mix(in srgb, var(--panel) 86%, var(--accent) 14%);
      line-height: 1.6;
    }
    .controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 15px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
    button:disabled { opacity: .45; cursor: default; }
    .status { margin-left: auto; color: var(--muted); }
    @media (max-width: 620px) {
      main { padding: 12px; }
      .stage { min-height: 580px; padding: 14px; }
      .fields { grid-template-columns: 1fr; }
      .field { display: grid; grid-template-columns: 7em 1fr; align-items: center; }
      .field strong { margin: 0; }
      .bits { font-size: 8px; line-height: 26px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>IEEE 754 单精度：编码与解码</h1>
    <p class="subtitle">同一个例子双向复算：−13.25 ⇄ 0xC1540000</p>
  </header>

  <section class="stage" aria-live="polite">
    <h2 id="step-title" class="step-title"></h2>
    <p id="explain" class="explain"></p>
    <div id="formula" class="formula"></div>

    <div class="fields">
      <div class="field sign">
        <strong>符号位 S</strong>
        <code id="sign-value"></code>
      </div>
      <div class="field exp">
        <strong>阶码 E</strong>
        <code id="exp-value"></code>
      </div>
      <div class="field frac">
        <strong>尾数字段 F</strong>
        <code id="frac-value"></code>
      </div>
    </div>

    <div id="bits" class="bits" aria-label="32 位单精度机器数"></div>
    <div id="result" class="result"></div>
  </section>

  <nav class="controls" aria-label="幻灯片控制">
    <button id="prev" type="button">上一步</button>
    <button id="next" type="button">下一步</button>
    <span id="status" class="status"></span>
  </nav>
</main>

<script>
  const encoded = "11000001010101000000000000000000";
  const steps = [
    {
      title: "1. 从十进制真值开始",
      explain: "符号单独处理；先转换绝对值 13.25。",
      formula: "−13.25",
      sign: "1（负数）",
      exp: "待计算",
      frac: "待计算",
      result: "目标：得到单精度的 1 位符号、8 位阶码和 23 位尾数字段。"
    },
    {
      title: "2. 转成二进制并规格化",
      explain: "整数部分 13 = 1101₂，小数部分 0.25 = 0.01₂；移动小数点后读出指数真值。",
      formula: "13.25 = 1101.01₂\n= 1.10101₂ × 2³",
      sign: "1",
      exp: "e = 3",
      frac: "1.10101₂",
      result: "规格化尾数的最高位恒为 1，编码时不保存这个隐藏位。"
    },
    {
      title: "3. 计算三个字段",
      explain: "单精度偏置为 127。阶码字段保存 e + 127，尾数字段保存小数点后的部分并补 0。",
      formula: "E = 3 + 127 = 130 = 10000010₂",
      sign: "1",
      exp: "10000010",
      frac: "10101000000000000000000",
      result: "得到 S、E、F 后，按固定顺序直接拼接。"
    },
    {
      title: "4. 拼接并写成十六进制",
      explain: "从最高位开始每 4 bit 分为一组：1100 0001 0101 0100 0000 0000 0000 0000。",
      formula: "1 | 10000010 | 10101000000000000000000\n= 0xC1540000",
      sign: "1",
      exp: "10000010",
      frac: "10101000000000000000000",
      result: "−13.25 的 IEEE 754 单精度机器数为 0xC1540000。"
    },
    {
      title: "5. 反向拆分机器数",
      explain: "解码 0xC1540000 时，先展开为 32 bit，再按 1 + 8 + 23 拆分。",
      formula: "0xC1540000\n→ 1 | 10000010 | 10101000000000000000000",
      sign: "1 → 负数",
      exp: "130",
      frac: "10101000000000000000000",
      result: "阶码既不全 0、也不全 1，所以这是规格化数，可以补回隐藏位 1。"
    },
    {
      title: "6. 恢复指数、尾数和真值",
      explain: "指数真值 e = E − 127；规格化尾数 M = 1.F。",
      formula: "e = 130 − 127 = 3\nM = 1.10101₂\n(−1)¹ × M × 2³ = −13.25",
      sign: "1",
      exp: "e = 3",
      frac: "M = 1.10101₂",
      result: "编码与解码得到同一个真值。阶码全 0 或全 1 时，必须改用非规格化数或特殊值的解释规则。"
    }
  ];

  const bits = document.getElementById("bits");
  encoded.split("").forEach((value, index) => {
    const bit = document.createElement("span");
    bit.className = `bit ${index === 0 ? "bit-sign" : index <= 8 ? "bit-exp" : "bit-frac"}`;
    bit.textContent = value;
    bits.appendChild(bit);
  });

  let pos = 0;
  function render() {
    const step = steps[pos];
    document.getElementById("step-title").textContent = step.title;
    document.getElementById("explain").textContent = step.explain;
    document.getElementById("formula").textContent = step.formula;
    document.getElementById("sign-value").textContent = step.sign;
    document.getElementById("exp-value").textContent = step.exp;
    document.getElementById("frac-value").textContent = step.frac;
    document.getElementById("result").textContent = step.result;
    document.getElementById("status").textContent = `${pos + 1} / ${steps.length}`;
    document.getElementById("prev").disabled = pos === 0;
    document.getElementById("next").disabled = pos === steps.length - 1;
  }
  function move(delta) {
    pos = Math.max(0, Math.min(steps.length - 1, pos + delta));
    render();
  }
  document.getElementById("prev").addEventListener("click", () => move(-1));
  document.getElementById("next").addEventListener("click", () => move(1));
  document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft") move(-1);
    if (event.key === "ArrowRight") move(1);
  });
  render();
</script>
</body>
</html>
