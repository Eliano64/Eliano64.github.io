<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-Means 迭代：两个质心怎么走到团块中心</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --line: #cbd5e1; --text: #0f172a; --muted: #475569;
    --c1: #2563eb; --c2: #be123c; --grid: #e2e8f0; --accent: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020; --panel: #111827; --line: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --c1: #60a5fa; --c2: #fb7185; --grid: #24334a; --accent: #4ade80;
    }
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Arial, "Microsoft YaHei", sans-serif; }
  .wrap { padding: 12px 14px; box-sizing: border-box; }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .stage { display: flex; gap: 14px; flex-wrap: wrap; }
  svg { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    width: 100%; max-width: 560px; height: auto; box-sizing: border-box; }
  .side { min-width: 190px; flex: 1; font-size: 12px; color: var(--muted); }
  .side b { color: var(--text); font-weight: 600; }
  .readout { font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.7;
    color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button { font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .step { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>K-Means 迭代：两个质心怎么走到团块中心</h1>
  <p class="hint">方向键切换步骤，空格播放或暂停。质心每次移动都由簇内样本的均值算出。</p>
  <div class="stage">
    <svg id="plot" viewBox="0 0 560 380" width="560" height="380" role="img"
         aria-label="K-Means 迭代过程：点按最近质心着色，质心移动到各自簇的均值"></svg>
    <div class="side">
      <div class="readout" id="readout"></div>
      <div class="bar">
        <button id="prev" aria-label="上一步">上一步</button>
        <button id="next" aria-label="下一步">下一步</button>
        <button id="play" aria-label="播放或暂停">播放</button>
        <span class="step" id="step"></span>
      </div>
      <p class="hint" style="margin-top:10px">分配一步让每个样本走最近的路，更新一步把质心挪到簇内均值。两步交替，SSE 只减不增。</p>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("plot");
  const readout = document.getElementById("readout");
  const stepLabel = document.getElementById("step");

  // 12 个样本，两团，坐标在 0..1 之间（显示时映射到画布内边距）
  const points = [
    [0.22, 0.62], [0.28, 0.70], [0.34, 0.58], [0.40, 0.66], [0.26, 0.52], [0.38, 0.74],
    [0.70, 0.28], [0.76, 0.36], [0.66, 0.38], [0.80, 0.24], [0.72, 0.44], [0.84, 0.34]
  ];
  let centroids = [[0.40, 0.16], [0.78, 0.82]];

  const PAD = 34, W = 560, H = 380;
  const sx = v => PAD + v * (W - 2 * PAD);
  const sy = v => H - PAD - v * (H - 2 * PAD);

  function assign() {
    return points.map(p => {
      const d0 = Math.hypot(p[0] - centroids[0][0], p[1] - centroids[0][1]);
      const d1 = Math.hypot(p[0] - centroids[1][0], p[1] - centroids[1][1]);
      return d0 <= d1 ? 0 : 1;
    });
  }

  function update(labels) {
    return [0, 1].map(k => {
      const own = points.filter((_, i) => labels[i] === k);
      if (!own.length) return centroids[k];
      const mx = own.reduce((s, p) => s + p[0], 0) / own.length;
      const my = own.reduce((s, p) => s + p[1], 0) / own.length;
      return [mx, my];
    });
  }

  function sse(labels) {
    return points.reduce((s, p, i) => {
      const c = centroids[labels[i]];
      return s + (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2;
    }, 0);
  }

  // 预先算好状态序列：初始、分配、更新、分配、更新、分配
  const states = [];
  {
    let labels = assign();
    states.push({ kind: "初始", labels: labels.slice(), centroids: centroids.map(c => c.slice()) });
    for (let round = 1; round <= 3; round++) {
      centroids = update(labels);
      states.push({ kind: `第 ${round} 次更新`, labels: labels.slice(), centroids: centroids.map(c => c.slice()) });
      labels = assign();
      states.push({ kind: `第 ${round} 次分配`, labels: labels.slice(), centroids: centroids.map(c => c.slice()) });
    }
  }

  function el(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n);
    return n;
  }

  function render(idx) {
    const st = states[idx];
    svg.textContent = "";
    // 网格与坐标框
    for (let g = 0; g <= 4; g++) {
      const v = g / 4;
      el("line", { x1: sx(0), y1: sy(v), x2: sx(1), y2: sy(v), stroke: "var(--grid)", "stroke-width": 1 });
      el("line", { x1: sx(v), y1: sy(0), x2: sx(v), y2: sy(1), stroke: "var(--grid)", "stroke-width": 1 });
    }
    el("rect", { x: sx(0), y: sy(1), width: sx(1) - sx(0), height: sy(0) - sy(1),
                 fill: "none", stroke: "var(--line)", "stroke-width": 1.2 });
    el("text", { x: (sx(0) + sx(1)) / 2, y: H - 10, "text-anchor": "middle",
                 fill: "var(--muted)", "font-size": 11 }, "特征 x1");

    // 样本点，按当前标签着色
    points.forEach((p, i) => {
      const color = st.labels[i] === 0 ? "var(--c1)" : "var(--c2)";
      el("circle", { cx: sx(p[0]), cy: sy(p[1]), r: 5, fill: color, opacity: 0.92 });
    });

    // 质心叉号
    st.centroids.forEach((c, k) => {
      const color = k === 0 ? "var(--c1)" : "var(--c2)";
      const x = sx(c[0]), y = sy(c[1]);
      el("line", { x1: x - 7, y1: y - 7, x2: x + 7, y2: y + 7, stroke: color, "stroke-width": 2.4 });
      el("line", { x1: x - 7, y1: y + 7, x2: x + 7, y2: y - 7, stroke: color, "stroke-width": 2.4 });
      el("circle", { cx: x, cy: y, r: 10, fill: "none", stroke: color, "stroke-width": 1.2, "stroke-dasharray": "2 3" });
      el("text", { x: x + 15, y: y + 22, fill: color, "font-size": 11 },
         `μ${k + 1} (${c[0].toFixed(2)}, ${c[1].toFixed(2)})`);
    });

    const value = sse(st.labels);
    const counts = [0, 1].map(k => st.labels.filter(l => l === k).length);
    readout.textContent = "";
    readout.innerHTML =
      `<b>${st.kind}</b><br>` +
      `μ1 = (${st.centroids[0][0].toFixed(2)}, ${st.centroids[0][1].toFixed(2)})，簇内 ${counts[0]} 个<br>` +
      `μ2 = (${st.centroids[1][0].toFixed(2)}, ${st.centroids[1][1].toFixed(2)})，簇内 ${counts[1]} 个<br>` +
      `SSE = ${value.toFixed(3)}`;
    stepLabel.textContent = `${idx + 1} / ${states.length}`;
  }

  let idx = 0, timer = null;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    document.getElementById("play").textContent = "播放";
  }

  function go(delta) {
    idx = Math.max(0, Math.min(states.length - 1, idx + delta));
    render(idx);
  }

  document.getElementById("prev").addEventListener("click", () => { stop(); go(-1); });
  document.getElementById("next").addEventListener("click", () => { stop(); go(1); });
  document.getElementById("play").addEventListener("click", togglePlay);

  function togglePlay() {
    if (timer) { stop(); return; }
    // 减少动效时不自动播放，改为逐帧点击
    if (reduce.matches) { go(1); return; }
    if (idx >= states.length - 1) { idx = 0; render(idx); }
    document.getElementById("play").textContent = "暂停";
    timer = setInterval(() => {
      if (idx >= states.length - 1) { stop(); return; }
      go(1);
    }, 1400);
  }

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { stop(); go(1); e.preventDefault(); }
    if (e.key === "ArrowLeft") { stop(); go(-1); e.preventDefault(); }
    if (e.key === " " || e.key === "Spacebar") { togglePlay(); e.preventDefault(); }
  });

  // 离开视口暂停
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(entries => {
      entries.forEach(en => { if (!en.isIntersecting) stop(); });
    }, { threshold: 0.2 }).observe(svg);
  }

  render(idx);
})();
</script>
</body>
</html>
