<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注意力的缩放：d_k 决定分数方差</title>
<style>
:root{--bg:#ffffff;--fg:#1b2330;--muted:#5b6572;--line:#c8d0da;--panel:#f4f7fb;
--accent:#3b5bdb;--hi:#e8efff;--pos:#2f66b3;--neg:#b44a35}
@media (prefers-color-scheme:dark){:root{--bg:#171b23;--fg:#e6eaf2;--muted:#9aa4b2;--line:#3a4250;
--panel:#1e2430;--accent:#8fa6ff;--hi:#243052;--pos:#7fa8ee;--neg:#ef9a83}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{padding:12px;max-width:700px;font:13px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
h1{font-size:17px;line-height:1.35;margin:0 0 3px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
label{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
input[type=range]{width:150px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
button{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin:7px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:430px){.grid{grid-template-columns:1fr}}
.read{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:12px;color:var(--muted)}
.read b{color:var(--fg);font-weight:600}
svg{display:block;width:100%;height:auto}
.note{color:var(--muted);font-size:11.5px;margin:4px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<h1>缩放：d_k 决定分数方差</h1>
<p class="sub">分量独立、均值 0、方差 1 时，点积的方差等于 d_k。不缩放时 d_k 越大，softmax 越饱和；除以 √d_k 后方差回到 1。</p>
<p class="note" id="legend">左组：未缩放；右组：当前设置。两组共用同一组分数模式，只差是否除以 √d_k。</p>
<div class="controls">
  <label>d_k <input id="dk" type="range" min="4" max="256" step="4" value="16" aria-label="键的维数 d_k"><span class="mono" id="dkv">16</span></label>
  <label><input id="scale" type="checkbox" checked> 除以 √d_k</label>
</div>
<div class="panel">
  <svg id="chart" viewBox="0 0 660 190" role="img" aria-label="两组条形：未缩放与已缩放的注意力权重，随 d_k 变化"></svg>
  <div class="read">
    <span>点积方差 <b id="varTxt" class="mono">16</b></span>
    <span>未缩放最大权重 <b id="rawMax" class="mono"></b></span>
    <span>当前最大权重 <b id="curMax" class="mono"></b></span>
  </div>
  <p class="note">条形高度是 softmax 后的权重，共 8 个候选位置；分数由同一组固定模式乘以 √d_k 生成。</p>
</div>
<script>
(function(){
  const pat = [0.6,-0.2,0.9,-0.5,0.3,-0.8,0.1,0.4];
  const dk = document.getElementById('dk'), dkv = document.getElementById('dkv');
  const scale = document.getElementById('scale'), chart = document.getElementById('chart');
  const rawMax = document.getElementById('rawMax'), curMax = document.getElementById('curMax');
  const varTxt = document.getElementById('varTxt');
  function softmax(a){ const m = Math.max(...a); const e = a.map(v=>Math.exp(v-m)); const s = e.reduce((x,y)=>x+y,0); return e.map(v=>v/s); }
  function draw(){
    const d = +dk.value; dkv.textContent = d; varTxt.textContent = d;
    const raw = pat.map(p => p * Math.sqrt(d));
    const scaled = raw.map(v => v / Math.sqrt(d));
    const wRaw = softmax(raw), wCur = softmax(scale.checked ? scaled : raw);
    rawMax.textContent = Math.max(...wRaw).toFixed(3);
    curMax.textContent = Math.max(...wCur).toFixed(3);
    const W = 660, H = 190, pad = 26, bw = (W - pad*2) / 16;
    let s = '<line x1="'+pad+'" y1="'+(H-24)+'" x2="'+(W-pad)+'" y2="'+(H-24)+'" stroke="var(--line)"/>';
    function bars(vals, x0, cls){
      let out = '';
      vals.forEach((v,i)=>{
        const h = Math.max(2, v * 140);
        const x = x0 + i * bw;
        out += '<rect x="'+(x+2).toFixed(1)+'" y="'+(H-24-h).toFixed(1)+'" width="'+(bw-4).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="var(--'+cls+')" opacity="0.85"/>';
      });
      return out;
    }
    s += bars(wRaw, pad, 'neg');
    s += bars(wCur, pad + 8*bw + 8, 'pos');
    s += '<text x="'+pad+'" y="16" fill="var(--muted)" font-size="18">未缩放</text>';
    s += '<text x="'+(pad+8*bw+8)+'" y="16" fill="var(--muted)" font-size="18">当前（'+(scale.checked?'已缩放':'未缩放')+'）</text>';
    chart.innerHTML = s;
  }
  dk.addEventListener('input', draw); scale.addEventListener('change', draw);
  draw();
})();
</script>
</body></html>
