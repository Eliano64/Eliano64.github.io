  <text class="muted" x="30.0" y="472.0" font-size="10.5" text-anchor="start" font-weight="400">35 个普通样本落在 48.5 到 93.1 之间，箱体只覆盖 15.48 元；3 个最高票价把均值从 71.7 抬到 80.9，中位数 72.7 没动。</text>
  <text class="muted" x="30.0" y="494.0" font-size="10.5" text-anchor="start" font-weight="400">须必须停在上界以内的最远点上，所以它到 93.1 就断了：再往右的值越界，改由离群点单独呈现。</text>
