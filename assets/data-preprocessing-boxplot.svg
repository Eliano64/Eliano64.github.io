<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="tbox dbox">
  <title id="tbox">箱线图用五个数概括 40 个票价，并用 1.5 倍四分位距把 3 个离群点分出来</title>
  <desc id="dbox">40 个票价样本（固定随机种子）：最小值 48.5，Q1 65.4，中位数 72.7，Q3 80.9，最大值 205.0；IQR 15.48，上界 104.11，下界 42.21。须停在上界内最大的 93.1 与最小的 48.5，上须之外有 3 个离群点 186.0、192.5、205.0。</desc>
