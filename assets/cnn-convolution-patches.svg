<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700" role="img" aria-label="两个 3×3 窗口与竖边核逐项相乘再求和：窗口 A 得 532，窗口 B 得 29">
<style>
:root{--bg:#ffffff;--ink:#1b1f24;--muted:#4d5865;--grid:#b9c3ce;--cell:#f4f7fa;--pos:#0b6b64;--neg:#a3231c;}
@media (prefers-color-scheme: dark){:root{--bg:#14171c;--ink:#e8ebf0;--muted:#a7b1be;--grid:#3b434e;--cell:#1d222a;--pos:#2dd4bf;--neg:#f87171;}}
text{font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;}
.head{font-size:22px;fill:var(--ink);}
.label{font-size:20px;fill:var(--muted);}
.op{font-size:20px;fill:var(--ink);}
.big{font-size:42px;fill:var(--ink);}
</style>
<rect x="0" y="0" width="600" height="700" fill="var(--bg)"/>
<text x="24" y="38" class="head">同一组核，两个 3×3 窗口</text>
<text x="24" y="74" class="label">核 K</text>
<text x="24" y="100" class="label">每行 −1, 0, 1</text>
<rect x="20" y="112" width="150" height="150" fill="var(--cell)" stroke="var(--grid)" stroke-width="1.2"/>
<line x1="70" y1="112" x2="70" y2="262" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="162" x2="170" y2="162" stroke="var(--grid)" stroke-width="1"/>
<line x1="120" y1="112" x2="120" y2="262" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="212" x2="170" y2="212" stroke="var(--grid)" stroke-width="1"/>
<text x="45.0" y="144.2" text-anchor="middle" font-size="20" fill="var(--neg)">−1</text>
<text x="95.0" y="144.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="145.0" y="144.2" text-anchor="middle" font-size="20" fill="var(--pos)">1</text>
<text x="45.0" y="194.2" text-anchor="middle" font-size="20" fill="var(--neg)">−1</text>
<text x="95.0" y="194.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="145.0" y="194.2" text-anchor="middle" font-size="20" fill="var(--pos)">1</text>
<text x="45.0" y="244.2" text-anchor="middle" font-size="20" fill="var(--neg)">−1</text>
<text x="95.0" y="244.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="145.0" y="244.2" text-anchor="middle" font-size="20" fill="var(--pos)">1</text>
<text x="200" y="160" class="head">y = Σ w·x + b</text>
<text x="200" y="190" class="label">本例 b = 0</text>
<text x="20" y="288" class="head">窗口 A</text>
<rect x="20" y="300" width="150" height="150" fill="var(--cell)" stroke="var(--grid)" stroke-width="1.2"/>
<line x1="70" y1="300" x2="70" y2="450" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="350" x2="170" y2="350" stroke="var(--grid)" stroke-width="1"/>
<line x1="120" y1="300" x2="120" y2="450" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="400" x2="170" y2="400" stroke="var(--grid)" stroke-width="1"/>
<text x="45.0" y="332.2" text-anchor="middle" font-size="20" fill="var(--ink)">30</text>
<text x="95.0" y="332.2" text-anchor="middle" font-size="20" fill="var(--ink)">40</text>
<text x="145.0" y="332.2" text-anchor="middle" font-size="20" fill="var(--ink)">210</text>
<text x="45.0" y="382.2" text-anchor="middle" font-size="20" fill="var(--ink)">28</text>
<text x="95.0" y="382.2" text-anchor="middle" font-size="20" fill="var(--ink)">35</text>
<text x="145.0" y="382.2" text-anchor="middle" font-size="20" fill="var(--ink)">205</text>
<text x="45.0" y="432.2" text-anchor="middle" font-size="20" fill="var(--ink)">25</text>
<text x="95.0" y="432.2" text-anchor="middle" font-size="20" fill="var(--ink)">30</text>
<text x="145.0" y="432.2" text-anchor="middle" font-size="20" fill="var(--ink)">200</text>
<text x="218.0" y="358" text-anchor="middle" class="op">逐项</text>
<text x="218.0" y="386" text-anchor="middle" class="op">乘 K</text>
<rect x="266" y="300" width="150" height="150" fill="var(--cell)" stroke="var(--grid)" stroke-width="1.2"/>
<line x1="316" y1="300" x2="316" y2="450" stroke="var(--grid)" stroke-width="1"/>
<line x1="266" y1="350" x2="416" y2="350" stroke="var(--grid)" stroke-width="1"/>
<line x1="366" y1="300" x2="366" y2="450" stroke="var(--grid)" stroke-width="1"/>
<line x1="266" y1="400" x2="416" y2="400" stroke="var(--grid)" stroke-width="1"/>
<text x="291.0" y="332.2" text-anchor="middle" font-size="20" fill="var(--neg)">−30</text>
<text x="341.0" y="332.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="391.0" y="332.2" text-anchor="middle" font-size="20" fill="var(--pos)">210</text>
<text x="291.0" y="382.2" text-anchor="middle" font-size="20" fill="var(--neg)">−28</text>
<text x="341.0" y="382.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="391.0" y="382.2" text-anchor="middle" font-size="20" fill="var(--pos)">205</text>
<text x="291.0" y="432.2" text-anchor="middle" font-size="20" fill="var(--neg)">−25</text>
<text x="341.0" y="432.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="391.0" y="432.2" text-anchor="middle" font-size="20" fill="var(--pos)">200</text>
<text x="443.0" y="380" text-anchor="middle" class="op">求和</text>
<text x="470" y="389" class="big">532</text>
<text x="20" y="488" class="head">窗口 B</text>
<rect x="20" y="500" width="150" height="150" fill="var(--cell)" stroke="var(--grid)" stroke-width="1.2"/>
<line x1="70" y1="500" x2="70" y2="650" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="550" x2="170" y2="550" stroke="var(--grid)" stroke-width="1"/>
<line x1="120" y1="500" x2="120" y2="650" stroke="var(--grid)" stroke-width="1"/>
<line x1="20" y1="600" x2="170" y2="600" stroke="var(--grid)" stroke-width="1"/>
<text x="45.0" y="532.2" text-anchor="middle" font-size="20" fill="var(--ink)">120</text>
<text x="95.0" y="532.2" text-anchor="middle" font-size="20" fill="var(--ink)">125</text>
<text x="145.0" y="532.2" text-anchor="middle" font-size="20" fill="var(--ink)">130</text>
<text x="45.0" y="582.2" text-anchor="middle" font-size="20" fill="var(--ink)">118</text>
<text x="95.0" y="582.2" text-anchor="middle" font-size="20" fill="var(--ink)">122</text>
<text x="145.0" y="582.2" text-anchor="middle" font-size="20" fill="var(--ink)">128</text>
<text x="45.0" y="632.2" text-anchor="middle" font-size="20" fill="var(--ink)">115</text>
<text x="95.0" y="632.2" text-anchor="middle" font-size="20" fill="var(--ink)">120</text>
<text x="145.0" y="632.2" text-anchor="middle" font-size="20" fill="var(--ink)">124</text>
<text x="218.0" y="558" text-anchor="middle" class="op">逐项</text>
<text x="218.0" y="586" text-anchor="middle" class="op">乘 K</text>
<rect x="266" y="500" width="150" height="150" fill="var(--cell)" stroke="var(--grid)" stroke-width="1.2"/>
<line x1="316" y1="500" x2="316" y2="650" stroke="var(--grid)" stroke-width="1"/>
<line x1="266" y1="550" x2="416" y2="550" stroke="var(--grid)" stroke-width="1"/>
<line x1="366" y1="500" x2="366" y2="650" stroke="var(--grid)" stroke-width="1"/>
<line x1="266" y1="600" x2="416" y2="600" stroke="var(--grid)" stroke-width="1"/>
<text x="291.0" y="532.2" text-anchor="middle" font-size="20" fill="var(--neg)">−120</text>
<text x="341.0" y="532.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="391.0" y="532.2" text-anchor="middle" font-size="20" fill="var(--pos)">130</text>
<text x="291.0" y="582.2" text-anchor="middle" font-size="20" fill="var(--neg)">−118</text>
<text x="341.0" y="582.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="391.0" y="582.2" text-anchor="middle" font-size="20" fill="var(--pos)">128</text>
<text x="291.0" y="632.2" text-anchor="middle" font-size="20" fill="var(--neg)">−115</text>
<text x="341.0" y="632.2" text-anchor="middle" font-size="20" fill="var(--ink)">0</text>
<text x="391.0" y="632.2" text-anchor="middle" font-size="20" fill="var(--pos)">124</text>
<text x="443.0" y="580" text-anchor="middle" class="op">求和</text>
<text x="470" y="589" class="big">29</text>
</svg>