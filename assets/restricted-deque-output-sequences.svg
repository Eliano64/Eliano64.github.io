<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">输入受限与输出受限双端队列</title>
  <desc id="desc">上半部分表示只允许从队尾插入、允许从队首和队尾删除；下半部分表示允许从两端插入、只允许从队首删除。</desc>
  <defs>
    <marker id="in-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/>
    </marker>
    <marker id="out-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3b82f6"/>
    </marker>
    <style>
      svg{background:#f8fafc}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .title{font:700 27px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .head{font:700 22px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .label{font:600 16px "Microsoft YaHei",sans-serif;fill:#334155}
      .cell{fill:#eef2ff;stroke:#64748b;stroke-width:1.7}
      .num{font:700 20px "Microsoft YaHei",sans-serif;fill:#1e293b;text-anchor:middle}
      .end{font:500 15px "Microsoft YaHei",sans-serif;fill:#64748b;text-anchor:middle}
      .in{stroke:#10b981;stroke-width:4;fill:none;marker-end:url(#in-arrow)}
      .out{stroke:#3b82f6;stroke-width:4;fill:none;marker-end:url(#out-arrow)}
      .inText{font:700 16px "Microsoft YaHei",sans-serif;fill:#059669;text-anchor:middle}
      .outText{font:700 16px "Microsoft YaHei",sans-serif;fill:#2563eb;text-anchor:middle}
      @media(prefers-color-scheme:dark){
        svg{background:#0b1020}
        .panel{fill:#111827;stroke:#334155}
        .title,.head{fill:#f8fafc}
        .label,.end{fill:#cbd5e1}
        .cell{fill:#1e293b;stroke:#94a3b8}
        .num{fill:#f1f5f9}
        .inText{fill:#34d399}
        .outText{fill:#60a5fa}
      }
    </style>
  </defs>
  <rect class="panel" x="30" y="30" width="1060" height="205" rx="18"/>
  <rect class="panel" x="30" y="285" width="1060" height="205" rx="18"/>

  <text class="head" x="70" y="72">输入受限双端队列</text>
  <text class="label" x="70" y="100">一端插入，两端删除</text>
  <text class="end" x="339" y="145">队首</text>
  <text class="end" x="781" y="145">队尾</text>
  <g transform="translate(360 152)">
    <rect class="cell" x="0" y="0" width="100" height="58" rx="8"/><text class="num" x="50" y="37">1</text>
    <rect class="cell" x="100" y="0" width="100" height="58" rx="8"/><text class="num" x="150" y="37">2</text>
    <rect class="cell" x="200" y="0" width="100" height="58" rx="8"/><text class="num" x="250" y="37">3</text>
    <rect class="cell" x="300" y="0" width="100" height="58" rx="8"/><text class="num" x="350" y="37">4</text>
  </g>
  <path class="out" d="M350 170 H230"/><text class="outText" x="286" y="160">删除</text>
  <path class="out" d="M770 205 H900"/><text class="outText" x="836" y="195">删除</text>
  <path class="in" d="M980 158 H770"/><text class="inText" x="875" y="148">插入</text>

  <text class="head" x="70" y="327">输出受限双端队列</text>
  <text class="label" x="70" y="355">两端插入，一端删除</text>
  <text class="end" x="339" y="400">队首</text>
  <text class="end" x="781" y="400">队尾</text>
  <g transform="translate(360 407)">
    <rect class="cell" x="0" y="0" width="100" height="58" rx="8"/><text class="num" x="50" y="37">4</text>
    <rect class="cell" x="100" y="0" width="100" height="58" rx="8"/><text class="num" x="150" y="37">1</text>
    <rect class="cell" x="200" y="0" width="100" height="58" rx="8"/><text class="num" x="250" y="37">2</text>
    <rect class="cell" x="300" y="0" width="100" height="58" rx="8"/><text class="num" x="350" y="37">3</text>
  </g>
  <path class="out" d="M350 425 H230"/><text class="outText" x="286" y="415">删除</text>
  <path class="in" d="M230 460 H350"/><text class="inText" x="286" y="483">插入</text>
  <path class="in" d="M980 425 H770"/><text class="inText" x="875" y="415">插入</text>
</svg>
